  <style>
    .core-actions-menu-category {
      position: relative;
    }

    .core-actions-menu-trigger {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #d8c7aa;
      border-radius: 999px;
      background: #f1e4cf;
      color: var(--text);
      font-size: 15px;
      font-weight: 800;
      line-height: 1.35;
      cursor: default;
      outline: none;
      user-select: none;
    }

    .core-actions-menu-trigger:hover,
    .core-actions-menu-trigger:focus-visible,
    .core-actions-menu-category:focus-within > .core-actions-menu-trigger {
      background: #e7d6ba;
    }

    .core-actions-menu-arrow {
      color: var(--accent-strong);
      font-size: 18px;
      line-height: 1;
    }

    .core-actions-submenu {
      display: none;
      position: absolute;
      top: -8px;
      right: calc(100% - 6px);
      z-index: 31;
      min-width: 190px;
      padding: 8px;
      gap: 6px;
      border: 1px solid rgba(166, 143, 111, 0.22);
      border-radius: 16px;
      background: #fffdf8;
      box-shadow: 0 18px 34px rgba(72, 52, 31, 0.16);
    }

    .core-actions-menu-category.touch-open > .core-actions-submenu {
      display: grid;
    }

    @media (hover: hover) and (pointer: fine) {
      .core-actions-menu-category:hover > .core-actions-submenu,
      .core-actions-menu-category:focus-within > .core-actions-submenu {
        display: grid;
      }
    }

    .core-actions-submenu .ops-btn {
      width: 100%;
      white-space: nowrap;
      text-align: left;
    }

    @media (min-width: 981px) {
      #coreActionsMenu {
        width: 136px;
        min-width: 136px;
      }
    }

    @media (max-width: 980px) {
      .core-actions-menu-trigger {
        cursor: pointer;
        touch-action: manipulation;
      }

      .core-actions-submenu {
        position: static;
        width: 100%;
        min-width: 0;
        margin-top: 4px;
        padding: 4px 0 0 12px;
        border: 0;
        box-shadow: none;
        background: transparent;
      }

      .core-actions-submenu .ops-btn {
        min-height: 44px;
      }
    }

    @media (min-width: 981px) {
      .attendance-review-filters {
        grid-template-columns: repeat(6, minmax(0, 1fr));
      }

      .attendance-review-table .attendance-review-employee-col {
        width: 112px;
      }
    }

    .permission-settings-table th:nth-child(3),
    .permission-settings-table td:nth-child(3) {
      width: 12rem;
    }

    .permission-settings-table th:nth-child(4),
    .permission-settings-table td:nth-child(4) {
      width: auto;
    }

    .permission-group-summary-row {
      display: flex;
      align-items: flex-start;
      gap: 0.45rem;
      min-width: 0;
    }

    .permission-group-summary-row + .permission-group-summary-row {
      margin-top: 0.3rem;
    }

    .permission-group-summary-row > strong {
      flex: 0 0 auto;
      white-space: nowrap;
      line-height: 1.7;
    }

    .permission-group-summary-row > .permission-summary-tags {
      flex: 1 1 auto;
      min-width: 0;
    }
  </style>
</head>

  <script>
    (() => {
      let provider = null;
      const authMethodNames = new Set(["initializeAuth", "signIn", "signOut"]);

      const sanitizeAuthContext = (context) => {
        const source = context && typeof context === "object" ? context : {};
        const rawUser = source.user || source.session?.user || null;
        const user = rawUser && typeof rawUser === "object"
          ? Object.freeze({
              id: String(rawUser.id || ""),
              email: String(rawUser.email || "")
            })
          : null;
        const profile = source.profile && typeof source.profile === "object"
          ? Object.freeze({ ...source.profile })
          : null;
        const authenticated = Boolean(user?.id);
        return Object.freeze({
          authenticated,
          user: authenticated ? user : null,
          profile: authenticated ? profile : null
        });
      };

      const isRecoverableAuthError = (error) => {
        const message = String(error?.message || error || "");
        return /(?:\bHTTP 401\b|unauthorized|\bjwt\b.*\b(?:expired|invalid)\b|\b(?:expired|invalid)\b.*\bjwt\b|\btoken\b.*\bexpired\b)/i.test(message);
      };

      const createFacade = (value) => {
        if (!value || typeof value !== "object") return null;

        const authProvider = Object.freeze({
          initialize: (...args) => value.initializeAuth(...args),
          getCurrentContext: (...args) => value.getAuthContext(...args),
          login: (...args) => value.signIn(...args),
          logout: (...args) => value.signOut(...args),
          changePassword: (...args) => value.changePassword(...args)
        });

        const retryBackendOnce = async (member, args, originalError) => {
          if (!isRecoverableAuthError(originalError)) throw originalError;
          const auth = sanitizeAuthContext(await authProvider.initialize());
          if (!auth.authenticated) {
            throw new Error("登入已失效，請重新登入");
          }
          return member.apply(value, args);
        };

        const callBackendWithAuthRecovery = (member, args) => {
          try {
            const result = member.apply(value, args);
            if (result && typeof result.then === "function") {
              return result.catch((error) => retryBackendOnce(member, args, error));
            }
            return result;
          } catch (error) {
            if (!isRecoverableAuthError(error)) throw error;
            return retryBackendOnce(member, args, error);
          }
        };

        const facade = {};
        for (const [name, member] of Object.entries(value)) {
          if (typeof member !== "function") {
            facade[name] = member;
            continue;
          }
          if (name === "getAuthContext") {
            facade[name] = (...args) => sanitizeAuthContext(authProvider.getCurrentContext(...args));
            continue;
          }
          if (name === "initializeAuth") {
            facade[name] = async (...args) => sanitizeAuthContext(await authProvider.initialize(...args));
            continue;
          }
          if (name === "signIn") {
            facade[name] = async (...args) => sanitizeAuthContext(await authProvider.login(...args));
            continue;
          }
          if (name === "signOut") {
            facade[name] = async (...args) => sanitizeAuthContext(await authProvider.logout(...args));
            continue;
          }
          if (name === "getAppInfo") {
            facade[name] = async (...args) => {
              const info = await member.apply(value, args);
              return Object.freeze({
                databasePath: "福園號資料服務",
                backend: "fyh-api",
                updatedAt: info?.updatedAt || null
              });
            };
            continue;
          }
          if (name === "changePassword") {
            facade[name] = (...args) => callBackendWithAuthRecovery(authProvider.changePassword, args);
            continue;
          }
          facade[name] = (...args) => callBackendWithAuthRecovery(member, args);
        }
        Object.defineProperty(facade, "backendContractVersion", {
          value: 1,
          enumerable: false,
          configurable: false,
          writable: false
        });
        return Object.freeze(facade);
      };

      Object.defineProperty(window, "schedulerApi", {
        configurable: true,
        enumerable: true,
        get: () => provider,
        set: (value) => {
          provider = createFacade(value);
        }
      });
    })();
  </script>

  <script>
    (() => {
      const exporter = window.schedulerBrowserExporter;
      if (!exporter) return;

      if (typeof exporter.buildSapLeaveCsvContent === "function") {
        const originalBuildSapLeaveCsvContent = exporter.buildSapLeaveCsvContent.bind(exporter);
        exporter.buildSapLeaveCsvContent = (payload) => {
          const content = originalBuildSapLeaveCsvContent(payload);
          const body = content.startsWith("\uFEFF") ? content.slice(1) : content;
          return `\uFEFF人員,工號,日期,日期,代號\r\n${body}`;
        };
      }

      const parseDate = (value) => {
        const match = String(value || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (!match) return null;
        const date = new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
        return Number.isNaN(date.getTime()) ? null : date;
      };
      const formatDate = (date) => `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
      const compactDate = (value) => String(value || "").replaceAll("-", "");
      const isRestLeave = (leave) => {
        const code = String(leave?.code || "").trim();
        const name = String(leave?.name || "").trim();
        return ["0036", "0047"].includes(code) || ["休息日", "休假", "例假"].includes(name);
      };
      const getSelectedScheduleGroupId = () => String(
        state?.currentGroupId
        || (typeof groupFeatureState !== "undefined" ? groupFeatureState.currentGroupId : "")
        || ""
      );
      const getCurrentGroupExportMembers = () => {
        const groupId = getSelectedScheduleGroupId();
        return (state.members || []).filter((member) => !groupId || member.groupId === groupId);
      };
      const filterExportRowsToCurrentGroup = (rows) => {
        const memberIds = new Set(
          getCurrentGroupExportMembers()
            .map((member) => String(member.id || ""))
            .filter(Boolean)
        );
        return (Array.isArray(rows) ? rows : []).filter((row) => (
          memberIds.has(String(row?.member_id || row?.memberId || ""))
        ));
      };

      if (typeof window.runPeriodExport === "function") {
        window.runPeriodExport = async (type) => {
          const startDate = document.getElementById("exportPeriodStart")?.value || "";
          const endDate = document.getElementById("exportPeriodEnd")?.value || "";
          const start = parseDate(startDate);
          const end = parseDate(endDate);
          if (!start || !end) {
            reportValidationError("請選擇開始日期與結束日期");
            return;
          }
          if (start > end) {
            reportValidationError("開始日期必須早於或等於結束日期");
            return;
          }
          const method = type === "sap" ? "exportSapCsv" : type === "leave" ? "exportLeave" : "exportOvertime";
          const emptyMessage = type === "sap"
            ? "目前沒有可匯出的休例假資料"
            : type === "leave"
              ? "目前沒有可匯出的請假資料"
              : "目前沒有可匯出的加班資料";
          try {
            setSaveStatus("正在準備匯出資料...", true);
            const exportRows = filterExportRowsToCurrentGroup(
              await window.schedulerApi.loadScheduleExportRows(startDate, endDate)
            );
            const result = await window.schedulerApi[method]({
              state,
              startDate,
              endDate,
              exportRows
            });
            if (result?.empty) showInfoMessage(emptyMessage);
            closeModal();
            setSaveStatus("");
          } catch (error) {
            setSaveStatus(`匯出失敗：${error.message || error}`);
          }
        };
      }

      const buildScheduleRows = async (startDate, endDate) => {
        const currentGroupId = getSelectedScheduleGroupId();
        const members = getCurrentGroupExportMembers();
        const loaded = await window.schedulerApi.loadScheduleEntries({
          startDate,
          endDate,
          members
        });
        const schedule = loaded?.schedule || {};
        const shifts = new Map((state.shifts || [])
          .filter((item) => !currentGroupId || item.groupId === currentGroupId)
          .map((item) => [item.id, item]));
        const departments = new Map((state.departments || [])
          .filter((item) => !currentGroupId || item.groupId === currentGroupId)
          .map((item) => [item.id, item]));
        const leaves = new Map((state.leaves || []).map((item) => [item.id, item]));
        const rows = [];
        const start = parseDate(startDate);
        const end = parseDate(endDate);

        for (const member of members) {
          for (let cursor = new Date(start); cursor <= end; cursor.setDate(cursor.getDate() + 1)) {
            const date = formatDate(cursor);
            const key = `${member.id}_${cursor.getFullYear()}_${cursor.getMonth()}_${cursor.getDate()}`;
            const slot = schedule[key];
            if (!slot?.shift) continue;
            const shift = shifts.get(slot.shift);
            if (!shift) continue;
            const department = departments.get(shift.applicableDeptId || "");
            const leave = slot.leave ? leaves.get(slot.leave) : null;
            rows.push({
              values: [
                department?.name || "",
                member.name || "",
                member.code || "",
                compactDate(date)
              ],
              date,
              departmentName: department?.name || "",
              memberName: member.name || "",
              highlight: Boolean(slot.leave && isRestLeave(leave))
            });
          }
        }

        rows.sort((a, b) => (
          a.date.localeCompare(b.date)
          || a.departmentName.localeCompare(b.departmentName, "zh-Hant")
          || a.memberName.localeCompare(b.memberName, "zh-Hant")
        ));
        return rows;
      };

      const downloadBlob = (blob, fileName) => {
        const objectUrl = URL.createObjectURL(blob);
        const anchor = document.createElement("a");
        anchor.href = objectUrl;
        anchor.download = fileName;
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
      };

      const openScheduleExportDialog = () => {
        const defaults = getDefaultExportPeriod();
        openEntityListModal({
          title: "匯出上班日期間",
          modalClass: "modal modal-member-form",
          body: `<div class="form-grid">
            <div class="form-row"><label for="exportPeriodStart">開始日期</label><input id="exportPeriodStart" type="date" value="${defaults.startDate}"></div>
            <div class="form-row"><label for="exportPeriodEnd">結束日期</label><input id="exportPeriodEnd" type="date" value="${defaults.endDate}"></div>
          </div>`,
          footerButtons: `<button class="btn-cancel" type="button" data-close-button="true">取消</button><button class="btn-primary" type="button" data-run-schedule-export="true">匯出上班日</button>`,
          hideFooterClose: true
        });
      };

      const runScheduleExport = async () => {
        const startDate = document.getElementById("exportPeriodStart")?.value || "";
        const endDate = document.getElementById("exportPeriodEnd")?.value || "";
        const start = parseDate(startDate);
        const end = parseDate(endDate);
        if (!start || !end) {
          reportValidationError("請選擇開始日期與結束日期");
          return;
        }
        if (start > end) {
          reportValidationError("開始日期必須早於或等於結束日期");
          return;
        }

        try {
          setSaveStatus("正在準備匯出資料...", true);
          const rows = await buildScheduleRows(startDate, endDate);
          if (!rows.length) {
            showInfoMessage("目前沒有可匯出的上班日資料");
            closeModal();
            setSaveStatus("");
            return;
          }

          await exporter.ensureExcelJS();
          const workbook = new ExcelJS.Workbook();
          const sheet = workbook.addWorksheet("匯出上班日", { views: [{ state: "frozen", ySplit: 1 }] });
          const headers = ["上班地點(單位)", "姓名", "工號", "日期(YYYYMMDD)"];
          sheet.addRow(headers);
          rows.forEach((item) => {
            const row = sheet.addRow(item.values);
            if (item.highlight) {
              row.eachCell((cell) => {
                cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFFFFF00" } };
              });
            }
          });
          sheet.getRow(1).font = { bold: true };
          sheet.getRow(1).alignment = { horizontal: "center", vertical: "middle", wrapText: true };
          sheet.getRow(1).fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFF3EBD8" } };
          sheet.columns = [{ width: 20 }, { width: 16 }, { width: 16 }, { width: 18 }];
          sheet.getColumn(3).numFmt = "@";
          sheet.getColumn(4).numFmt = "@";
          sheet.autoFilter = { from: { row: 1, column: 1 }, to: { row: 1, column: 4 } };
          sheet.eachRow((row) => {
            row.eachCell((cell) => {
              cell.alignment = { horizontal: "center", vertical: "middle", wrapText: true };
              cell.border = {
                top: { style: "thin", color: { argb: "FFD8D2C7" } },
                left: { style: "thin", color: { argb: "FFD8D2C7" } },
                bottom: { style: "thin", color: { argb: "FFD8D2C7" } },
                right: { style: "thin", color: { argb: "FFD8D2C7" } }
              };
            });
          });
          const blob = await exporter.workbookToBlob(workbook);
          const fileName = `匯出上班日_${compactDate(startDate)}-${compactDate(endDate)}.xlsx`;
          downloadBlob(blob, fileName);
          closeModal();
          setSaveStatus("");
        } catch (error) {
          setSaveStatus(`匯出失敗：${error.message || error}`);
        }
      };

      document.getElementById("exportScheduleButton")?.addEventListener("click", () => {
        closeCoreActionsMenu();
        openScheduleExportDialog();
      });
      document.body.addEventListener("click", async (event) => {
        const button = event.target.closest("[data-run-schedule-export]");
        if (!button) return;
        button.disabled = true;
        try {
          await runScheduleExport();
        } finally {
          if (button.isConnected) button.disabled = false;
        }
      });
    })();
  </script>

</body>
</html>
