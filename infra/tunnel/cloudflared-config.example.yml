# Cloudflare Tunnel 範例
# 1. 建立 tunnel：cloudflared tunnel create workforce-api
# 2. 將 tunnel ID 填入下方
# 3. 在 Cloudflare DNS 建立 api.schedule.company.com -> tunnel

tunnel: YOUR_TUNNEL_ID
credentials-file: /etc/cloudflared/YOUR_TUNNEL_ID.json

ingress:
  - hostname: api.schedule.company.com
    service: http://127.0.0.1:8000
  - service: http_status:404
