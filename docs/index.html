<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>班表</title>
  <link rel="stylesheet" href="./app.css?v=a1ce2593228a">
  <style id="toolbarChipInteractionStyles">
    .toolbar-selected-preview {
      grid-column: 1;
      grid-row: 1;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      min-width: 44px;
      height: 44px;
      min-height: 44px;
      padding: 4px;
      overflow: hidden;
      border: 1px solid transparent;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 800;
      line-height: 1.08;
      text-align: center;
      user-select: none;
    }

    .toolbar-selected-preview-label {
      display: -webkit-box;
      max-width: 100%;
      overflow: hidden;
      overflow-wrap: anywhere;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
    }

    #shiftChips .chip,
    #leaveChips .chip {
      border-radius: 8px;
      user-select: none;
    }

    .toolbar-floating-card.toolbar-has-selection-preview {
      grid-template-rows: auto auto auto 1fr;
    }

    .toolbar-floating-card.toolbar-has-selection-preview > #toolbarCollapseToggle {
      grid-row: 2;
    }

    .toolbar-floating-card.toolbar-has-selection-preview > #scheduleUndoButton {
      grid-row: 3;
    }

    .toolbar-floating-card.toolbar-has-selection-preview > #scheduleRedoButton {
      grid-row: 4;
    }

    .toolbar-floating-card.toolbar-has-selection-preview > .toolbar-grid {
      grid-row: 1 / span 4;
    }

    .toolbar-floating-card.toolbar-floating-card-collapsed.toolbar-has-selection-preview {
      grid-template-rows: repeat(4, auto);
    }

    .attendance-review-table thead th {
      text-align: center !important;
    }

    .attendance-review-table .attendance-schedule-icon-col {
      box-sizing: border-box;
      width: 48px !important;
      min-width: 48px !important;
      max-width: 48px !important;
      padding-right: 2px !important;
      padding-left: 2px !important;
      text-align: center !important;
      white-space: nowrap !important;
      word-break: keep-all;
    }

    .attendance-review-table .attendance-schedule-icon-col .personal-record-schedule-cell {
      box-sizing: border-box;
      width: 44px !important;
      min-width: 44px !important;
      max-width: 44px !important;
      margin-right: auto;
      margin-left: auto;
    }

    .attendance-review-table .attendance-schedule-icon-col .personal-record-schedule-cell > .seg {
      width: 100%;
      min-width: 100%;
      max-width: 100%;
    }

    @media (max-width: 768px) {
      .toolbar-floating-card > #toolbarSelectedPreview {
        width: 42px;
        min-width: 42px;
        height: 42px;
        min-height: 42px;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <section class="toolbar-card toolbar-floating-card">
      <div class="toolbar-selected-preview" id="toolbarSelectedPreview" role="img" hidden aria-live="polite"></div>
      <button class="ghost-btn toolbar-collapse-toggle" id="toolbarCollapseToggle" type="button" aria-expanded="true" aria-label="收合工具列" title="收合工具列">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
      <button class="ghost-btn toolbar-history-btn" id="scheduleUndoButton" type="button" aria-label="上一步（Ctrl+Z）" title="上一步（Ctrl+Z）" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7l-5 5 5 5"></path><path d="M5 12h8a6 6 0 0 1 6 6"></path></svg>
      </button>
      <button class="ghost-btn toolbar-history-btn" id="scheduleRedoButton" type="button" aria-label="下一步（Ctrl+Y）" title="下一步（Ctrl+Y）" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 7l5 5-5 5"></path><path d="M19 12h-8a6 6 0 0 0-6 6"></path></svg>
      </button>
      <div class="toolbar-grid" id="toolbarGrid" style="display:none">
        <div class="toolbar-section toolbar-section-combined">
          <div class="toolbar-title-row toolbar-title-row-combined">
            <span class="toolbar-title">班別</span>
            <button class="settings-icon-btn toolbar-settings-btn" id="shiftSettingsButton" type="button" aria-label="班別設定" title="班別設定"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4l10-10a2 2 0 0 0-4-4L4 16v4z"></path><path d="M13.5 6.5l4 4"></path></svg></button>
            <select id="deptFilter"></select>
          </div>
          <div id="shiftChips" class="chips chips-shift"></div>
        </div>
        <div class="toolbar-section toolbar-section-leave">
          <div class="toolbar-title-row">
            <span class="toolbar-title">假別</span>
            <button class="settings-icon-btn toolbar-settings-btn" id="leaveSettingsButton" type="button" aria-label="假別設定" title="假別設定"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4l10-10a2 2 0 0 0-4-4L4 16v4z"></path><path d="M13.5 6.5l4 4"></path></svg></button>
            <button class="ghost-btn compact-btn toolbar-inline-action" id="restComplianceButton" type="button">例休檢查</button>
          </div>
          <div id="leaveChips" class="chips"></div>
        </div>
        <div class="toolbar-section toolbar-section-overtime" hidden>
          <div class="toolbar-title-row">
            <span class="toolbar-title">加班</span>
            <button class="settings-icon-btn toolbar-settings-btn" id="overtimeSettingsButton" type="button" aria-label="加班設定" title="加班設定"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4l10-10a2 2 0 0 0-4-4L4 16v4z"></path><path d="M13.5 6.5l4 4"></path></svg></button>
          </div>
          <div id="overtimeChips" class="chips"></div>
        </div>
      </div>
    </section>

    <section class="home-card" id="homeCard" hidden></section>
    <section class="meal-card" id="mealCard" hidden></section>
    <section class="records-card" id="recordsCard" hidden></section>

    <section class="calendar-card" id="scheduleCard" hidden>
      <div class="calendar-nav">
        <div class="calendar-nav-left">
          <select id="tableViewSelect" aria-label="班表檢視"><option value="member">人員檢視</option><option value="member-stats">人員檢視-統計欄</option><option value="shift">班別檢視</option></select>
          <select id="tableDeptScopeFilter" aria-label="班表顯示範圍"></select>
          <div class="toolbar-history-actions schedule-nav-history-actions" aria-label="班表操作歷程">
            <button class="ghost-btn toolbar-history-btn" id="scheduleUndoTopButton" type="button" aria-label="上一步（Ctrl+Z）" title="上一步（Ctrl+Z）" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7l-5 5 5 5"></path><path d="M5 12h8a6 6 0 0 1 6 6"></path></svg>
            </button>
            <button class="ghost-btn toolbar-history-btn" id="scheduleRedoTopButton" type="button" aria-label="下一步（Ctrl+Y）" title="下一步（Ctrl+Y）" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 7l5 5-5 5"></path><path d="M19 12h-8a6 6 0 0 0-6 6"></path></svg>
            </button>
          </div>
        </div>
        <div class="month-title-wrap"><h2 id="monthTitle"></h2></div>
        <div class="nav-actions">
          <button class="nav-btn" id="prevPeriodButton" type="button">前八週</button>
          <button class="nav-btn" id="prevWeekButton" type="button">前一週</button>
          <button class="nav-btn" id="nextWeekButton" type="button">後一週</button>
          <button class="nav-btn" id="nextPeriodButton" type="button">後八週</button>
          <div class="core-actions-shell" id="coreActionsShell">
            <button class="ghost-btn core-actions-toggle" id="coreActionsToggle" type="button" aria-expanded="false">登入</button>
            <div class="core-actions-menu" id="coreActionsMenu" aria-hidden="true">
              <button class="ghost-btn ops-btn manager-action" id="weekStartSettingsButton" type="button">週期設定</button>
              <button class="ghost-btn ops-btn manager-action" id="autoSchedulePreviewButton" type="button">自動排班預覽</button>
              <button class="ghost-btn ops-btn manager-action" id="autoFillSchedulePreviewButton" type="button">自動補班預覽</button>
              <button class="primary-btn ops-btn manager-action" id="autoScheduleApplyButton" type="button">套用預覽</button>
              <button class="ghost-btn ops-btn manager-action" id="autoScheduleCancelButton" type="button">取消預覽</button>
              <button class="primary-btn ops-btn manager-action" id="exportSapButton" type="button">匯出休例假</button>
              <button class="primary-btn ops-btn manager-action" id="exportLeaveButton" type="button">匯出請假</button>
              <button class="primary-btn ops-btn manager-action" id="exportOvertimeButton" type="button">匯出加班</button>
            </div>
          </div>
          <button class="ghost-btn compact-btn user-menu-auth" id="coreHomeButton" type="button" data-home-action="home" aria-label="返回首頁" title="返回首頁"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg></button>
        </div>
      </div>

      <div class="table-top-scrollbar" id="tableTopScrollbar" aria-hidden="true"><div class="table-top-scrollbar-content" id="tableTopScrollbarContent"></div></div>
      <div class="table-sticky-header" id="tableStickyHeader">
        <div class="table-sticky-header-left"><div class="table-sticky-cell table-sticky-cell-dept">單位</div><div class="table-sticky-cell table-sticky-cell-person">人員</div><div class="table-sticky-cell table-sticky-cell-stats">統計</div></div>
        <div class="table-sticky-header-scroll"><div class="table-sticky-header-days" id="tableStickyHeaderDays"></div></div>
        <button class="table-week-jump table-week-jump-prev" id="tablePrevWeekButton" type="button" hidden aria-label="前一週" title="前一週"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
        <button class="table-week-jump table-week-jump-next" id="tableNextWeekButton" type="button" hidden aria-label="後一週" title="後一週"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
      </div>
      <div class="table-wrap" id="tableWrap"><table id="mainTable"></table></div>
    </section>
  </div>

  <div id="modalRoot"></div>
  <div id="authRoot"></div>

  <script src="./app-config.js?v=20260807-permission-tags-loading"></script>
  <script src="./app.js?v=893e90e3a7f3"></script>
  <script id="toolbarChipInteractionScript">
    (() => {
      function getSelectedToolbarItem() {
        const type = state?.selected?.type || "";
        const id = state?.selected?.id || "";
        if (!id || (type !== "shift" && type !== "leave")) return null;
        const item = getItem(type, id);
        return item ? { type, item } : null;
      }

      function syncSelectedToolbarPreview() {
        const preview = document.getElementById("toolbarSelectedPreview");
        const toolbar = preview?.closest(".toolbar-floating-card");
        if (!preview || !toolbar) return;
        const selected = getSelectedToolbarItem();
        toolbar.classList.toggle("toolbar-has-selection-preview", Boolean(selected));
        if (!selected) {
          preview.hidden = true;
          preview.textContent = "";
          preview.removeAttribute("title");
          preview.removeAttribute("aria-label");
          preview.style.backgroundColor = "";
          preview.style.color = "";
          preview.style.borderColor = "";
          return;
        }
        const { type, item } = selected;
        const categoryLabel = type === "shift" ? "班別" : "假別";
        const color = item.color || "#888780";
        const name = item.name || categoryLabel;
        preview.hidden = false;
        preview.style.backgroundColor = color;
        preview.style.color = getItemTextColor(item, color);
        preview.style.borderColor = color;
        preview.title = `已選擇${categoryLabel}：${name}`;
        preview.setAttribute("aria-label", preview.title);
        preview.replaceChildren(Object.assign(document.createElement("span"), {
          className: "toolbar-selected-preview-label",
          textContent: name
        }));
      }

      function enhanceToolbarChips() {
        document.querySelectorAll('#shiftChips [data-chip-type="shift"][data-chip-id]').forEach((chip) => {
          chip.title = `雙擊修改班別：${chip.textContent.trim()}`;
        });
        document.querySelectorAll('#leaveChips [data-chip-type="leave"][data-chip-id]').forEach((chip) => {
          chip.title = `雙擊修改假別：${chip.textContent.trim()}`;
        });
      }

      function syncAttendanceReviewIconColumn() {
        const table = document.querySelector(".attendance-review-table");
        if (!table || table.querySelector('colgroup[data-attendance-review-fixed-columns="true"]')) return;
        const colgroup = document.createElement("colgroup");
        colgroup.dataset.attendanceReviewFixedColumns = "true";
        for (let index = 0; index < 12; index += 1) {
          const col = document.createElement("col");
          if (index === 3) col.style.width = "48px";
          colgroup.appendChild(col);
        }
        table.prepend(colgroup);
      }

      const baseRenderToolbar = renderToolbar;
      renderToolbar = function renderToolbarWithSelectedPreview(...args) {
        const result = baseRenderToolbar.apply(this, args);
        enhanceToolbarChips();
        syncSelectedToolbarPreview();
        return result;
      };

      document.body.addEventListener("dblclick", (event) => {
        const chip = event.target.closest('#shiftChips [data-chip-type="shift"][data-chip-id], #leaveChips [data-chip-type="leave"][data-chip-id]');
        if (!chip) return;
        const type = chip.dataset.chipType || "";
        const id = chip.dataset.chipId || "";
        if (!id || (type !== "shift" && type !== "leave")) return;
        event.preventDefault();
        event.stopPropagation();
        if (!canEditSchedule()) {
          promptManagerAccess(`修改${type === "shift" ? "班別" : "假別"}需先登入主管帳號`);
          return;
        }
        state.selected = { type, id };
        renderToolbar();
        renderTable();
        if (type === "shift") {
          openShiftFormModal("edit", id);
        } else {
          openNamedColorFormModal("leave", "edit", id);
        }
      });

      const recordsCard = document.getElementById("recordsCard");
      if (recordsCard) {
        new MutationObserver(syncAttendanceReviewIconColumn).observe(recordsCard, { childList: true, subtree: true });
      }

      enhanceToolbarChips();
      syncSelectedToolbarPreview();
      syncAttendanceReviewIconColumn();
    })();
  </script>
</body>
</html>
