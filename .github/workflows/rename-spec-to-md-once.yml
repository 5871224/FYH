name: Rename specification to Markdown once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-spec-to-md-once.yml'
      - 'scripts/rename_spec_to_md_once.py'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Rename specification and update references
        run: python scripts/rename_spec_to_md_once.py
      - name: Validate current project structure
        run: |
          node scripts/check-normalized-storage.js
          node scripts/check-expansion-acceptance.js
          npm run v2:check
      - name: Remove one-time files
        run: |
          rm -f scripts/rename_spec_to_md_once.py
          rm -f .github/workflows/rename-spec-to-md-once.yml
      - name: Commit rename
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "將規格書改為 Markdown 格式"
          git push
