name: Finalize specification once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-spec-once.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Finalize specification consistency
        run: python scripts/finalize_spec_once.py

      - name: Commit finalized specification
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '完成規格書整合與一致性修正'
          git push
