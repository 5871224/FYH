name: Finalize Week Scroll Navigation

on:
  push:
    branches:
      - fix/week-scroll-navigation-20260809

permissions:
  contents: write

concurrency:
  group: finalize-week-scroll-navigation
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/week-scroll-navigation-20260809
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Update canonical specification
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('規格書.md')
          text = path.read_text(encoding='utf-8')
          old = '5. 前一週、後一週不得跨出目前八週範圍。'
          new = '5. 前一週、後一週只水平捲動 7 個日期欄，不變更目前八週資料範圍；不得重新載入或切換整段八週資料。只有「前八週」、「後八週」切換完整八週期間。'
          if old not in text and new not in text:
              raise SystemExit('week navigation specification marker missing')
          if old in text:
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Rebuild web artifacts
        run: npm run web:publish
      - name: Run complete validation
        run: npm run ci:check
      - name: Remove temporary workflow
        run: rm -f .github/workflows/finalize-week-scroll-navigation.yml
      - name: Commit finalized change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "完成班表週捲動導覽修正"
          git push origin HEAD:fix/week-scroll-navigation-20260809
