name: Remove records page subtitle

on:
  push:
    paths:
      - '.github/workflows/remove-records-page-subtitle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove subtitle and refresh renderer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          subtitle = '        <p class="home-subtitle">個人記錄與管理作業。</p>\n'
          for path in [Path('src/renderer/renderer.js'), Path('docs/renderer.js')]:
              text = path.read_text(encoding='utf-8-sig')
              if subtitle not in text:
                  raise SystemExit(f'Records subtitle not found in {path}')
              text = text.replace(subtitle, '', 1)
              path.write_text(text, encoding='utf-8-sig')

          for path in [Path('src/renderer/index.html'), Path('docs/index.html')]:
              text = path.read_text(encoding='utf-8-sig')
              text, count = re.subn(r'\./renderer\.js\?v=[^"\s]+', './renderer.js?v=20260709v3', text, count=1)
              if count != 1:
                  raise SystemExit(f'Could not update renderer asset version in {path}')
              path.write_text(text, encoding='utf-8-sig')

          Path('.github/workflows/remove-records-page-subtitle.yml').unlink()
          PY

      - name: Validate files
        shell: bash
        run: |
          set -euo pipefail
          node --check src/renderer/renderer.js
          node --check docs/renderer.js
          python3 - <<'PY'
          from pathlib import Path
          for path in ['src/renderer/renderer.js', 'docs/renderer.js']:
              text = Path(path).read_text(encoding='utf-8-sig')
              if '個人記錄與管理作業。' in text:
                  raise SystemExit(f'Subtitle still exists in {path}')
          for path in ['src/renderer/index.html', 'docs/index.html']:
              if './renderer.js?v=20260709v3' not in Path(path).read_text(encoding='utf-8-sig'):
                  raise SystemExit(f'Renderer version not updated in {path}')
          PY

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove records page subtitle'
          git push
