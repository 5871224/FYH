name: temp reactivate leave

on:
  push:
    branches:
      - agent/reactivate-deleted-leave-code-20260810

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Remove temporary workflow from final tree
        run: rm -f .github/workflows/temp-reactivate-leave.yml
      - name: Apply leave reactivation change
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          renderer = Path('src/renderer/renderer-settings-catalog.js')
          text = renderer.read_text()
          old = '''async function persistNamedCatalogItem(category, mode, payload, returnTo) {
            const currentList = getItemList(category);
            const nextList = mode === "edit"
              ? currentList.map((item) => item.id === payload.id ? payload : item)
              : [...currentList, payload];
            const sortOrder = mode === "edit" ? currentList.findIndex((item) => item.id === payload.id) : currentList.length;
            try {
              await window.schedulerApi.saveCatalogItem(category, payload, Math.max(0, sortOrder));
            } catch (error) {
              setSaveStatus(`${category === "leave" ? "假別" : "加班"}儲存失敗：${error.message}`);
              return false;
            }
            if (category === "leave") state.leaves = nextList;
            if (category === "overtime") state.overtime = nextList;
            closeModal();
            renderAll();
            await reopenSettingsModalPreservingScroll(returnTo || { category: "list-settings", listCategory: category, scrollTop: 0 });
            return true;
          }
          '''
          new = '''async function persistNamedCatalogItem(category, mode, payload, returnTo) {
            const currentList = getItemList(category);
            const sortOrder = mode === "edit" ? currentList.findIndex((item) => item.id === payload.id) : currentList.length;
            let savedItem = payload;
            try {
              const result = await window.schedulerApi.saveCatalogItem(category, payload, Math.max(0, sortOrder));
              const persistedId = String(result?.id || "").trim();
              if (persistedId && persistedId !== payload.id) {
                savedItem = { ...payload, id: persistedId };
              }
            } catch (error) {
              setSaveStatus(`${category === "leave" ? "假別" : "加班"}儲存失敗：${error.message}`);
              return false;
            }
            const nextList = mode === "edit"
              ? currentList.map((item) => item.id === payload.id ? savedItem : item)
              : [...currentList, savedItem];
            if (category === "leave") state.leaves = nextList;
            if (category === "overtime") state.overtime = nextList;
            closeModal();
            renderAll();
            await reopenSettingsModalPreservingScroll(returnTo || { category: "list-settings", listCategory: category, scrollTop: 0 });
            return true;
          }
          '''
          if old not in text:
              raise SystemExit('persistNamedCatalogItem block not found')
          renderer.write_text(text.replace(old, new, 1))

          sql_path = Path('supabase/002_current_updates.sql')
          sql = sql_path.read_text()
          start = sql.index('create or replace function public.save_catalog_item_v3(p_category text,p_item jsonb)')
          end = sql.index('create or replace function public.delete_catalog_item_v3', start)
          replacement = '''create or replace function public.save_catalog_item_v3(p_category text,p_item jsonb)
          returns jsonb
          language plpgsql
          security definer
          set search_path=public,pg_catalog
          as $$
          declare
            v_id uuid;
            v_category text:=lower(btrim(coalesce(p_category,'')));
            v_code text;
            v_existing_id uuid;
            v_existing_deleted timestamptz;
            v_input_id_exists boolean:=false;
            v_restored boolean:=false;
          begin
            if not public.has_access_permission(auth.uid(),'leave_settings') then raise exception '沒有假別設定權限' using errcode='42501'; end if;
            begin v_id:=nullif(btrim(p_item->>'id'),'')::uuid; exception when invalid_text_representation then raise exception '設定識別碼格式錯誤'; end;
            if v_id is null then raise exception '缺少設定識別碼'; end if;
            if v_category='leave' then
              v_code:=btrim(coalesce(p_item->>'code',''));
              if v_code='' or btrim(coalesce(p_item->>'name',''))='' then raise exception '假別代碼與名稱不可空白'; end if;

              select exists(select 1 from public.set_leave where id=v_id) into v_input_id_exists;
              select id,deleted_at into v_existing_id,v_existing_deleted
              from public.set_leave
              where code=v_code
              for update;

              if found and v_existing_id is distinct from v_id then
                if v_existing_deleted is null or v_input_id_exists then
                  raise exception '假別代碼已存在';
                end if;
                v_id:=v_existing_id;
                v_restored:=true;
              elsif found and v_existing_id=v_id and v_existing_deleted is not null then
                v_restored:=true;
              end if;

              if v_restored then
                update public.set_leave
                set code=v_code,
                    name=btrim(p_item->>'name'),
                    color=nullif(p_item->>'color',''),
                    text_color=nullif(p_item->>'textColor',''),
                    auto_text_color=coalesce((p_item->>'autoTextColor')::boolean,true),
                    hidden_from_toolbar=coalesce((p_item->>'hiddenFromToolbar')::boolean,false),
                    requires_time=coalesce((p_item->>'requiresTime')::boolean,false),
                    requires_reason=coalesce((p_item->>'requiresReason')::boolean,false),
                    sort_order=greatest(0,coalesce((p_item->>'sortOrder')::integer,0)),
                    deleted_at=null,
                    updated_at=now()
                where id=v_id;
              else
                begin
                  insert into public.set_leave(id,code,name,color,text_color,auto_text_color,hidden_from_toolbar,requires_time,requires_reason,sort_order)
                  values(v_id,v_code,btrim(p_item->>'name'),nullif(p_item->>'color',''),nullif(p_item->>'textColor',''),coalesce((p_item->>'autoTextColor')::boolean,true),coalesce((p_item->>'hiddenFromToolbar')::boolean,false),coalesce((p_item->>'requiresTime')::boolean,false),coalesce((p_item->>'requiresReason')::boolean,false),greatest(0,coalesce((p_item->>'sortOrder')::integer,0)))
                  on conflict(id) do update set code=excluded.code,name=excluded.name,color=excluded.color,text_color=excluded.text_color,auto_text_color=excluded.auto_text_color,hidden_from_toolbar=excluded.hidden_from_toolbar,requires_time=excluded.requires_time,requires_reason=excluded.requires_reason,sort_order=excluded.sort_order,updated_at=now()
                  where public.set_leave.deleted_at is null;
                exception when unique_violation then
                  raise exception '假別代碼已存在';
                end;
              end if;
            elsif v_category='overtime' then
              if btrim(coalesce(p_item->>'name',''))='' then raise exception '加班名稱不可空白'; end if;
              insert into public.set_overtime(id,name,color,text_color,auto_text_color,hidden_from_toolbar,start_time,end_time,use_rest_1,rest_1_start_time,rest_1_end_time,use_rest_2,rest_2_start_time,rest_2_end_time,sort_order)
              values(v_id,btrim(p_item->>'name'),nullif(p_item->>'color',''),nullif(p_item->>'textColor',''),coalesce((p_item->>'autoTextColor')::boolean,true),coalesce((p_item->>'hiddenFromToolbar')::boolean,false),nullif(p_item->>'startTime','')::time,nullif(p_item->>'endTime','')::time,coalesce((p_item->>'useRest1')::boolean,false),nullif(p_item->>'rest1StartTime','')::time,nullif(p_item->>'rest1EndTime','')::time,coalesce((p_item->>'useRest2')::boolean,false),nullif(p_item->>'rest2StartTime','')::time,nullif(p_item->>'rest2EndTime','')::time,greatest(0,coalesce((p_item->>'sortOrder')::integer,0)))
              on conflict(id) do update set name=excluded.name,color=excluded.color,text_color=excluded.text_color,auto_text_color=excluded.auto_text_color,hidden_from_toolbar=excluded.hidden_from_toolbar,start_time=excluded.start_time,end_time=excluded.end_time,use_rest_1=excluded.use_rest_1,rest_1_start_time=excluded.rest_1_start_time,rest_1_end_time=excluded.rest_1_end_time,use_rest_2=excluded.use_rest_2,rest_2_start_time=excluded.rest_2_start_time,rest_2_end_time=excluded.rest_2_end_time,sort_order=excluded.sort_order,updated_at=now()
              where public.set_overtime.deleted_at is null;
            else raise exception '不支援的設定類型'; end if;
            return jsonb_build_object('ok',true,'id',v_id,'category',v_category,'restored',v_restored);
          end
          $$;

          '''
          sql_path.write_text(sql[:start] + replacement + sql[end:])

          test = Path('tests/leave-code-reactivation.test.js')
          test.write_text(r'''const test = require("node:test");
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const path = require("node:path");

          const root = path.join(__dirname, "..");
          const read = (file) => fs.readFileSync(path.join(root, file), "utf8");

          test("新增已停用假別代碼時由後端恢復原 ID 並覆寫新資料", () => {
            const sql = read("supabase/002_current_updates.sql");
            assert.match(sql, /where code=v_code\s+for update/);
            assert.match(sql, /v_existing_deleted is null or v_input_id_exists/);
            assert.match(sql, /v_id:=v_existing_id;\s+v_restored:=true/);
            assert.match(sql, /deleted_at=null/);
            assert.match(sql, /'restored',v_restored/);
          });

          test("啟用中的相同假別代碼仍然拒絕重複新增", () => {
            const sql = read("supabase/002_current_updates.sql");
            assert.match(sql, /raise exception '假別代碼已存在'/);
            const settings = read("src/renderer/renderer-settings-catalog.js");
            assert.match(settings, /!item\.deleted/);
            assert.match(settings, /假別代碼 \$\{selectedLeave\.code\} 已存在/);
          });

          test("恢復停用假別後前端必須採用後端回傳的原 ID", () => {
            const settings = read("src/renderer/renderer-settings-catalog.js");
            const published = read("docs/app.js");
            for (const source of [settings, published]) {
              assert.match(source, /const result = await window\.schedulerApi\.saveCatalogItem/);
              assert.match(source, /const persistedId = String\(result\?\.id \|\| ""\)\.trim\(\)/);
              assert.match(source, /savedItem = \{ \.\.\.payload, id: persistedId \}/);
              assert.match(source, /\[\.\.\.currentList, savedItem\]/);
            }
          });
          '''.replace('          ', ''))

          spec = Path('規格書.md')
          spec_text = spec.read_text()
          marker = '### 假別停用後同代碼重新新增（2026-08-10）'
          if marker not in spec_text:
              spec_text += '''\n\n### 假別停用後同代碼重新新增（2026-08-10）\n- 假別代碼為唯一識別語意；啟用中的相同代碼不得重複新增。\n- 新增假別時若代碼對應到已停用假別，系統須重新啟用原假別資料，不建立第二筆資料。\n- 重新啟用時保留原假別 ID，並以本次新增表單的名稱、顏色、文字顏色、是否需填時間、是否需填原因、不顯示與排序設定覆寫原設定。\n- 重新啟用後 `deleted_at` 清為 NULL；舊班表仍維持原假別 ID 關聯。\n'''
              spec.write_text(spec_text)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build static web
        run: npm run web:publish
      - name: Full checks
        run: npm run ci:check
      - name: Rebuild final static web
        run: npm run web:publish
      - name: Commit clean result
        shell: bash
        run: |
          git diff --check
          test ! -e .github/workflows/temp-reactivate-leave.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "支援停用假別同代碼自動恢復"
          git push origin HEAD:agent/reactivate-deleted-leave-code-20260810
