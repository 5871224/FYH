name: Temporary SAP leave export header patch

on:
  push:
    branches:
      - fix/sap-leave-export-headers-20260821

permissions:
  contents: write

jobs:
  patch-and-build:
    name: Patch and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Add leave export headers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/renderer/browser-exporter.js")
          text = path.read_text(encoding="utf-8")

          old = r'''  function buildSapLeaveCsvContent(payload) {
            const rows = getSapLeaveExportRows(payload);
            const csv = rows.map((row) => row.map(csvEscape).join(",")).join("\r\n");
            return rows.length ? `\uFEFF${csv}\r\n` : "\uFEFF";
          }'''
          new = r'''  function buildSapLeaveCsvContent(payload) {
            const rows = [
              ["人員", "工號", "日期", "日期", "代號"],
              ...getSapLeaveExportRows(payload)
            ];
            const csv = rows.map((row) => row.map(csvEscape).join(",")).join("\r\n");
            return `\uFEFF${csv}\r\n`;
          }'''

          if old not in text:
              raise SystemExit("Target buildSapLeaveCsvContent block not found")
          text = text.replace(old, new, 1)

          old_check = r'''    const csv = buildSapLeaveCsvContent(payload);
            if (!csv.includes("REST") || !csv.includes("OFF")) {'''
          new_check = r'''    const csv = buildSapLeaveCsvContent(payload);
            if (!csv.startsWith("\uFEFF人員,工號,日期,日期,代號\r\n")) {
              throw new Error("browser exporter SAP leave header self-check failed");
            }
            if (!csv.includes("REST") || !csv.includes("OFF")) {'''
          if old_check not in text:
              raise SystemExit("Target exporter self-check block not found")
          text = text.replace(old_check, new_check, 1)
          path.write_text(text, encoding="utf-8")

          spec_path = Path("規格書.md")
          spec = spec_path.read_text(encoding="utf-8")
          rule = '- 班表頁「匯出休例假」CSV 第一列欄標題固定為：`人員、工號、日期、日期、代號`。'
          if rule not in spec:
              marker = "- 排班條件。\n- 列印班表。"
              if marker in spec:
                  spec = spec.replace(marker, marker + "\n" + rule, 1)
              else:
                  spec = spec.rstrip() + "\n\n" + rule + "\n"
              spec_path.write_text(spec, encoding="utf-8")
          PY

      - name: Build static web
        run: npm run web:publish

      - name: Validate renderer
        run: npm run renderer:check

      - name: Run tests
        run: npm test

      - name: Commit generated changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/renderer/browser-exporter.js src/renderer/app.js src/renderer/index.html docs 規格書.md
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "Add headers to leave export CSV"
          git push origin "HEAD:${GITHUB_REF_NAME}"
