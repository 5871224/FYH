name: Temporary Attendance Review Update

on:
  push:
    branches:
      - agent/attendance-review-ui-location-history

permissions:
  contents: write

concurrency:
  group: temp-attendance-review-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: agent/attendance-review-ui-location-history
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Apply source changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly 1 match, got {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 表頭置中與審核切換按鈕顏色。
          replace_once(
              'src/renderer/css/pages.css',
              '.attendance-ledger-table thead th {\n  text-align: center;\n}',
              '.attendance-ledger-table thead th,\n.attendance-review-table thead th {\n  text-align: center;\n}'
          )
          replace_once(
              'src/renderer/css/pages.css',
              '''.attendance-review-status.is-unreviewed,\n.attendance-review-toggle.is-unreviewed {\n  background: #fff4d6;\n  color: #8a5a00;\n  border: 1px solid #efc66a;\n}\n\n.attendance-review-status.is-reviewed,\n.attendance-review-toggle.is-reviewed {\n  background: #e8f7ef;\n  color: #176b45;\n  border: 1px solid #8bc9aa;\n}\n\n.attendance-review-toggle {\n  padding: 0;\n  border-radius: 999px;\n  font-weight: 800;\n  cursor: pointer;\n}''',
              '''.attendance-review-status.is-unreviewed {\n  background: #fff4d6;\n  color: #8a5a00;\n  border: 1px solid #efc66a;\n}\n\n.attendance-review-status.is-reviewed {\n  background: #e8f7ef;\n  color: #176b45;\n  border: 1px solid #8bc9aa;\n}\n\n.attendance-review-toggle {\n  padding: 0;\n  border-radius: 999px;\n  font-weight: 800;\n  cursor: pointer;\n}\n\n.attendance-review-toggle.is-set-reviewed {\n  background: #e8f7ef;\n  color: #176b45;\n  border: 1px solid #8bc9aa;\n}\n\n.attendance-review-toggle.is-set-unreviewed {\n  background: #f2f3f5;\n  color: #73777f;\n  border: 1px solid #c7c9ce;\n}'''
          )

          # 操作欄：設為已審顯示綠色勾，設為未審顯示灰色三角形。
          replace_once(
              'src/renderer/renderer-records-views.js',
              'function renderAttendanceReviewPagination(review) {',
              '''function renderAttendanceReviewToggleIcon(reviewed) {\n  return reviewed\n    ? '<svg class="attendance-review-unreviewed-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4 3 20h18L12 4z"></path><path d="M12 9v5"></path><path d="M12 17h.01"></path></svg>'\n    : '<svg class="attendance-review-reviewed-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4 10-10"></path></svg>';\n}\n\nfunction renderAttendanceReviewPagination(review) {'''
          )
          replace_once(
              'src/renderer/renderer-records-views.js',
              '''<button class="settings-icon-btn attendance-review-action-btn attendance-review-toggle ${row.reviewed ? "is-reviewed" : "is-unreviewed"}" type="button" data-toggle-attendance-review="${escapeHtml(token)}" data-reviewed="${row.reviewed ? "true" : "false"}" aria-label="${row.reviewed ? "取消審核" : "審核"}" title="${row.reviewed ? "取消審核" : "審核"}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4h6l1 2h3v15H5V6h3l1-2z"></path><path d="m9 13 2 2 4-5"></path></svg></button>''',
              '''<button class="settings-icon-btn attendance-review-action-btn attendance-review-toggle ${row.reviewed ? "is-set-unreviewed" : "is-set-reviewed"}" type="button" data-toggle-attendance-review="${escapeHtml(token)}" data-reviewed="${row.reviewed ? "true" : "false"}" aria-label="${row.reviewed ? "設為未審" : "設為已審"}" title="${row.reviewed ? "設為未審" : "設為已審"}">${renderAttendanceReviewToggleIcon(row.reviewed)}</button>'''
          )

          # 審核狀態保存可用打卡單位，供編輯彈窗下拉選擇。
          replace_once(
              'src/renderer/renderer-foundation.js',
              '      members: [],\n      issueTypes: [],',
              '      members: [],\n      departments: [],\n      issueTypes: [],'
          )
          replace_once(
              'src/renderer/renderer-records-page.js',
              '    members: current.members || [],\n    issueTypes: current.issueTypes || [],',
              '    members: current.members || [],\n    departments: current.departments || [],\n    issueTypes: current.issueTypes || [],'
          )
          replace_once(
              'src/renderer/renderer-records-page.js',
              '        members: result.members || [],\n        issueTypes: result.issueTypes || [],',
              '        members: result.members || [],\n        departments: result.departments || [],\n        issueTypes: result.issueTypes || [],'
          )

          # 編輯簽到紀錄：上、下班地點下拉與保存；歷程操作中文化。
          replace_once(
              'src/renderer/renderer-records-actions.js',
              '''function openAttendanceReviewEditModal(token) {''',
              '''function attendanceReviewLocationOptions(row, location) {\n  const review = ensureAttendanceReviewState();\n  const groupId = String(row?.groupId || "");\n  const currentId = String(location?.departmentId || "");\n  const currentName = String(location?.name || "");\n  const departments = (review.departments || [])\n    .filter((department) => !groupId || String(department.group_id || department.groupId || "") === groupId)\n    .map((department) => ({\n      id: String(department.id || ""),\n      name: String(department.name || "")\n    }))\n    .filter((department) => department.id);\n  if (currentId && !departments.some((department) => department.id === currentId)) {\n    departments.unshift({ id: currentId, name: currentName || "目前打卡地點" });\n  }\n  const emptyLabel = currentName && !currentId ? `保留目前地點（${currentName}）` : "管理員補登";\n  return `<option value="" ${!currentId ? "selected" : ""}>${escapeHtml(emptyLabel)}</option>${departments\n    .map((department) => `<option value="${escapeHtml(department.id)}" ${department.id === currentId ? "selected" : ""}>${escapeHtml(department.name || department.id)}</option>`)\n    .join("")}`;\n}\n\nfunction openAttendanceReviewEditModal(token) {'''
          )
          replace_once(
              'src/renderer/renderer-records-actions.js',
              '''      <div class="form-row"><label>上班時間</label><input id="reviewClockInTime" type="time" value="${escapeHtml(timeValueFromIso(row.clock_in_at))}"></div>\n      <div class="form-row"><label>下班時間</label><input id="reviewClockOutTime" type="time" value="${escapeHtml(timeValueFromIso(row.clock_out_at))}"></div>\n      <div class="form-row"><label>上班時數</label>''',
              '''      <div class="form-row"><label>上班時間</label><input id="reviewClockInTime" type="time" value="${escapeHtml(timeValueFromIso(row.clock_in_at))}"></div>\n      <div class="form-row"><label>下班時間</label><input id="reviewClockOutTime" type="time" value="${escapeHtml(timeValueFromIso(row.clock_out_at))}"></div>\n      <div class="form-row"><label>上班地點</label><select id="reviewClockInLocation">${attendanceReviewLocationOptions(row, row.clock_in_location)}</select></div>\n      <div class="form-row"><label>下班地點</label><select id="reviewClockOutLocation">${attendanceReviewLocationOptions(row, row.clock_out_location)}</select></div>\n      <div class="form-row"><label>上班時數</label>'''
          )
          replace_once(
              'src/renderer/renderer-records-actions.js',
              '''      clockInTime: document.getElementById("reviewClockInTime")?.value || "",\n      clockOutTime: document.getElementById("reviewClockOutTime")?.value || "",\n      regularHours:''',
              '''      clockInTime: document.getElementById("reviewClockInTime")?.value || "",\n      clockOutTime: document.getElementById("reviewClockOutTime")?.value || "",\n      clockInLocationDepartmentId: document.getElementById("reviewClockInLocation")?.value || "",\n      clockOutLocationDepartmentId: document.getElementById("reviewClockOutLocation")?.value || "",\n      regularHours:'''
          )
          replace_once(
              'src/renderer/renderer-records-actions.js',
              'async function openAttendanceHistoryModal(recordId) {',
              '''function attendanceHistoryActionLabel(value) {\n  const action = String(value || "");\n  const labels = {\n    clock_in: "上班打卡",\n    clock_out: "下班打卡",\n    employee_regularHours: "修改上班時數",\n    employee_overtimeHours: "修改加班時數",\n    employee_note: "修改備註",\n    admin_edit: "管理員編輯",\n    reviewed: "設為已審",\n    returned: "設為未審",\n    unreviewed: "設為未審"\n  };\n  return labels[action] || action;\n}\n\nasync function openAttendanceHistoryModal(recordId) {'''
          )
          replace_once(
              'src/renderer/renderer-records-actions.js',
              '<td>${escapeHtml(log.action || "")}</td>',
              '<td>${escapeHtml(attendanceHistoryActionLabel(log.action))}</td>'
          )

          # 後端回傳可選打卡單位，並在保存時驗證群組與打卡啟用狀態。
          replace_once(
              'supabase/functions/attendance-review-groups/index.ts',
              'ctx.supabaseAdmin.from("set_departments").select("id,name,group_id").in("group_id", groupIds)',
              'ctx.supabaseAdmin.from("set_departments").select("id,name,address,group_id,attendance_enabled,deleted_at").in("group_id", groupIds).is("deleted_at", null)'
          )
          replace_once(
              'supabase/functions/attendance-review-groups/index.ts',
              '''    members: members.map((member: any) => ({ id: member.id, employee_code: member.employee_code, full_name: member.full_name, group_id: member.group_id })),\n    issueTypes: ISSUE_TYPES,''',
              '''    members: members.map((member: any) => ({ id: member.id, employee_code: member.employee_code, full_name: member.full_name, group_id: member.group_id })),\n    departments: (departmentResult.data || [])\n      .filter((department: any) => department.attendance_enabled === true)\n      .map((department: any) => ({ id: department.id, name: department.name || "", group_id: department.group_id })),\n    issueTypes: ISSUE_TYPES,'''
          )
          replace_once(
              'supabase/functions/attendance-review-groups/index.ts',
              'async function reviewSave(ctx: any, body: any, actor: any) {',
              '''async function resolveAdminClockLocation(ctx: any, target: any, departmentIdValue: unknown, oldLocation: any, clockAt: string | null) {\n  if (!clockAt) return null;\n  const departmentId = String(departmentIdValue || "").trim();\n  if (!departmentId) {\n    return oldLocation || { name: "管理員補登", source: "管理員補登" };\n  }\n  const result = await ctx.supabaseAdmin.from("set_departments")\n    .select("id,name,address,group_id,attendance_enabled,deleted_at")\n    .eq("id", departmentId).is("deleted_at", null).maybeSingle();\n  if (result.error) throw result.error;\n  if (!result.data) throw new Error("找不到指定的打卡地點");\n  if (String(result.data.group_id || "") !== String(target.group_id || "")) throw new Error("打卡地點不屬於該人員群組");\n  if (result.data.attendance_enabled !== true) throw new Error("此單位目前未開放打卡");\n  return {\n    departmentId: result.data.id,\n    name: result.data.name || "",\n    address: result.data.address || "",\n    source: "管理員修改",\n    accuracy: null,\n    distance: null\n  };\n}\n\nasync function reviewSave(ctx: any, body: any, actor: any) {'''
          )
          replace_once(
              'supabase/functions/attendance-review-groups/index.ts',
              '  await ensureTargetAllowed(ctx, actor, userId);\n  const old = await getOrCreateDay(ctx, userId, workDate);',
              '  const target = await ensureTargetAllowed(ctx, actor, userId);\n  const old = await getOrCreateDay(ctx, userId, workDate);'
          )
          replace_once(
              'supabase/functions/attendance-review-groups/index.ts',
              '''  update.clock_in_location = clockInAt ? (old.clock_in_location || { name: "管理員補登", source: "管理員補登" }) : null;\n  update.clock_out_location = clockOutAt ? (old.clock_out_location || { name: "管理員補登", source: "管理員補登" }) : null;''',
              '''  [update.clock_in_location, update.clock_out_location] = await Promise.all([\n    resolveAdminClockLocation(ctx, target, body?.clockInLocationDepartmentId, old.clock_in_location, clockInAt),\n    resolveAdminClockLocation(ctx, target, body?.clockOutLocationDepartmentId, old.clock_out_location, clockOutAt)\n  ]);'''
          )

          Path('tests/attendance-review-ui-location-history.test.js').write_text(r'''const test = require("node:test");
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const path = require("node:path");

          const root = path.resolve(__dirname, "..");
          const read = (file) => fs.readFileSync(path.join(root, file), "utf8");

          test("簽到審核表頭維持置中", () => {
            const css = read("src/renderer/css/pages.css");
            assert.match(css, /\.attendance-ledger-table thead th,\s*\.attendance-review-table thead th \{[\s\S]*?text-align: center/);
          });

          test("審核切換使用綠色勾與灰色三角形", () => {
            const views = read("src/renderer/renderer-records-views.js");
            const css = read("src/renderer/css/pages.css");
            assert.match(views, /attendance-review-reviewed-icon[\s\S]*?m5 12 4 4 10-10/);
            assert.match(views, /attendance-review-unreviewed-icon[\s\S]*?M12 4 3 20h18L12 4z/);
            assert.match(views, /row\.reviewed \? "is-set-unreviewed" : "is-set-reviewed"/);
            assert.match(views, /row\.reviewed \? "設為未審" : "設為已審"/);
            assert.match(css, /\.attendance-review-toggle\.is-set-reviewed[\s\S]*?color: #176b45/);
            assert.match(css, /\.attendance-review-toggle\.is-set-unreviewed[\s\S]*?color: #73777f/);
          });

          test("編輯簽到紀錄可修改上下班打卡地點並由後端驗證", () => {
            const actions = read("src/renderer/renderer-records-actions.js");
            const foundation = read("src/renderer/renderer-foundation.js");
            const page = read("src/renderer/renderer-records-page.js");
            const edge = read("supabase/functions/attendance-review-groups/index.ts");
            assert.match(actions, /id="reviewClockInLocation"/);
            assert.match(actions, /id="reviewClockOutLocation"/);
            assert.match(actions, /clockInLocationDepartmentId/);
            assert.match(actions, /clockOutLocationDepartmentId/);
            assert.match(foundation, /attendanceReview:[\s\S]*?departments: \[\]/);
            assert.match(page, /departments: result\.departments \|\| \[\]/);
            assert.match(edge, /departments: \(departmentResult\.data \|\| \[\]\)[\s\S]*?attendance_enabled === true/);
            assert.match(edge, /resolveAdminClockLocation[\s\S]*?打卡地點不屬於該人員群組[\s\S]*?此單位目前未開放打卡/);
            assert.match(edge, /source: "管理員修改"/);
          });

          test("簽到修改歷程操作欄顯示中文", () => {
            const actions = read("src/renderer/renderer-records-actions.js");
            assert.match(actions, /clock_in: "上班打卡"/);
            assert.match(actions, /clock_out: "下班打卡"/);
            assert.match(actions, /employee_regularHours: "修改上班時數"/);
            assert.match(actions, /employee_overtimeHours: "修改加班時數"/);
            assert.match(actions, /reviewed: "設為已審"/);
            assert.match(actions, /returned: "設為未審"/);
            assert.match(actions, /attendanceHistoryActionLabel\(log\.action\)/);
          });
          ''', encoding='utf-8')
          PY
      - name: Build static web
        run: npm run web:publish
      - name: Run tests without temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fyh-temp-workflow
          mv .github/workflows/temp-attendance-review-update.yml /tmp/fyh-temp-workflow/
          npm test
          deno check --node-modules-dir=auto supabase/functions/attendance-review-groups/index.ts
          mv /tmp/fyh-temp-workflow/temp-attendance-review-update.yml .github/workflows/
      - name: Commit generated and source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/css/pages.css src/renderer/renderer-records-views.js src/renderer/renderer-records-actions.js src/renderer/renderer-records-page.js src/renderer/renderer-foundation.js supabase/functions/attendance-review-groups/index.ts tests/attendance-review-ui-location-history.test.js src/renderer/app.js src/renderer/app.css src/renderer/index.html docs .github/workflows/temp-attendance-review-update.yml
          git commit -m "修正簽到審核介面與打卡地點編輯"
          git push origin HEAD:agent/attendance-review-ui-location-history
