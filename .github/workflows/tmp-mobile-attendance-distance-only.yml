name: Temporary Mobile Attendance Distance Only

on:
  push:
    branches:
      - fix/mobile-attendance-distance-only-20260901

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/mobile-attendance-distance-only-20260901

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply attendance rule
        shell: python
        run: |
          from pathlib import Path

          edge = Path('supabase/functions/attendance-clock/index.ts')
          text = edge.read_text(encoding='utf-8')
          text = text.replace('const MAX_GPS_DISTANCE_METERS = 300;\nconst MAX_GPS_ACCURACY_METERS = 300;\n', 'const MAX_GPS_DISTANCE_METERS = 300;\n')
          old = '''  if (allowGps && latitude !== null && longitude !== null && accuracy !== null && accuracy <= MAX_GPS_ACCURACY_METERS) {'''
          new = '''  if (allowGps && latitude !== null && longitude !== null) {'''
          if old not in text:
              raise SystemExit('GPS accuracy gate not found')
          text = text.replace(old, new, 1)
          old_else = '''  } else if (allowGps) {\n    if (body?.geolocationError) gpsFailure = String(body.geolocationError);\n    else if (latitude === null || longitude === null || accuracy === null) gpsFailure = "手機沒有提供 GPS 定位，請允許瀏覽器定位後再打卡";\n    else if (accuracy > MAX_GPS_ACCURACY_METERS) gpsFailure = `手機 GPS 精度約 ${Math.round(accuracy)} 公尺，需小於 ${MAX_GPS_ACCURACY_METERS} 公尺`;\n  }'''
          new_else = '''  } else if (allowGps) {\n    if (body?.geolocationError) gpsFailure = String(body.geolocationError);\n    else if (latitude === null || longitude === null) gpsFailure = "手機沒有提供 GPS 定位，請允許瀏覽器定位後再打卡";\n  }'''
          if old_else not in text:
              raise SystemExit('GPS failure branch not found')
          text = text.replace(old_else, new_else, 1)
          edge.write_text(text, encoding='utf-8')

          spec = Path('規格書.md')
          spec_text = spec.read_text(encoding='utf-8')
          old_spec = '6. 手機優先 GPS，距公司不超過 300 公尺且精準度不超過 300 公尺時通過；失敗時改驗證固定對外 IP。'
          new_spec = '6. 手機優先 GPS，只要定位座標距公司不超過 300 公尺即通過，不以 GPS 回報的定位精度數值作為阻擋條件；無法取得定位或距離超過 300 公尺時改驗證固定對外 IP。'
          if old_spec not in spec_text:
              raise SystemExit('attendance spec rule not found')
          spec.write_text(spec_text.replace(old_spec, new_spec, 1), encoding='utf-8')

          test = Path('tests/attendance-mobile-distance-only.test.js')
          test.write_text('''const test = require("node:test");\nconst assert = require("node:assert/strict");\nconst fs = require("node:fs");\nconst path = require("node:path");\n\nconst root = path.resolve(__dirname, "..");\nconst read = (file) => fs.readFileSync(path.join(root, file), "utf8");\n\ntest("手機打卡只以 300 公尺距離判斷，不因 GPS 精度數值阻擋", () => {\n  const source = read("supabase/functions/attendance-clock/index.ts");\n  const spec = read("規格書.md");\n\n  assert.match(source, /const MAX_GPS_DISTANCE_METERS = 300;/);\n  assert.doesNotMatch(source, /MAX_GPS_ACCURACY_METERS/);\n  assert.match(source, /if \(allowGps && latitude !== null && longitude !== null\)/);\n  assert.doesNotMatch(source, /accuracy <=/);\n  assert.doesNotMatch(source, /accuracy >/);\n  assert.match(source, /gpsMatch\.distance <= MAX_GPS_DISTANCE_METERS/);\n  assert.match(source, /accuracy,/);\n  assert.match(spec, /距公司不超過 300 公尺即通過，不以 GPS 回報的定位精度數值作為阻擋條件/);\n});\n''', encoding='utf-8')

      - name: Remove temporary workflow
        run: rm .github/workflows/tmp-mobile-attendance-distance-only.yml

      - name: Run validation
        run: |
          npm test
          node scripts/check-normalized-storage.js
          npm run renderer:check
          npm run css:architecture
          npm run js:architecture

      - name: Commit formal changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/attendance-clock/index.ts tests/attendance-mobile-distance-only.test.js 規格書.md .github/workflows/tmp-mobile-attendance-distance-only.yml
          git commit -m "手機打卡改為僅判斷 300 公尺距離"
          git push origin HEAD:fix/mobile-attendance-distance-only-20260901
