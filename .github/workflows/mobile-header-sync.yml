name: Temporary Mobile Header Sync

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Apply mobile today blue and shared header size
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(file, before, after) {
            let source = fs.readFileSync(file, 'utf8');
            if (!source.includes(before)) {
              if (source.includes(after)) return;
              throw new Error(`找不到預期區塊：${file}`);
            }
            fs.writeFileSync(file, source.replace(before, after), 'utf8');
          }

          const foundation = 'src/renderer/css/foundation.css';
          const responsive = 'src/renderer/css/responsive.css';
          const testFile = 'tests/renderer-week-stripe-boundary.test.js';

          replaceOnce(
            foundation,
            `.table-sticky-cell {\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  height: 40px;\n  min-height: 40px;\n  padding: 6px 2px;\n  border-right: 1px solid var(--schedule-grid-line);\n  box-shadow: inset 0 -1px 0 var(--schedule-grid-line);\n  font-size: 11px;\n  font-weight: 700;\n  text-align: center;\n}`,
            `.table-sticky-cell {\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  height: 40px;\n  min-height: 40px;\n  padding: 6px 2px;\n  border-right: 1px solid var(--schedule-grid-line);\n  box-shadow: inset 0 -1px 0 var(--schedule-grid-line);\n  font-size: 13px;\n  font-weight: 800;\n  text-align: center;\n}`
          );

          replaceOnce(
            foundation,
            `.table-sticky-cell-day span {\n  color: var(--muted);\n  font-size: 10px;\n  font-weight: 500;\n}`,
            `.table-sticky-cell-day span {\n  color: var(--muted);\n  font-size: 11px;\n  font-weight: 700;\n}`
          );

          replaceOnce(
            responsive,
            `  body.is-schedule-view .table-sticky-cell {\n    height: 38px;\n    min-height: 38px;\n    font-size: 13px !important;\n    font-weight: 800;\n  }`,
            `  body.is-schedule-view .table-sticky-cell {\n    height: 38px;\n    min-height: 38px;\n  }`
          );

          replaceOnce(
            responsive,
            `\n  body.is-schedule-view .table-sticky-cell-day span {\n    font-size: 11px !important;\n    font-weight: 700;\n  }\n`,
            `\n`
          );

          replaceOnce(
            responsive,
            `\n  /* 今天日期使用高對比深橘底、白字與內框，避免與一般日期或週交錯底色混淆。 */\n  body.is-schedule-view .table-sticky-cell-day.today {\n    background: linear-gradient(180deg, #c76618 0%, #99420d 100%) !important;\n    color: #fff !important;\n    box-shadow: inset 0 0 0 2px #6f2d08, 0 2px 5px rgba(111, 45, 8, 0.3) !important;\n    text-shadow: 0 1px 1px rgba(0, 0, 0, 0.25);\n    font-weight: 900;\n  }\n\n  body.is-schedule-view .table-sticky-cell-day.today span {\n    color: #fff !important;\n    font-weight: 800;\n  }\n`,
            `\n  /* 今天日期沿用全裝置共用的微亮藍色提示，避免手機版另行覆蓋。 */\n`
          );

          replaceOnce(
            testFile,
            `const scheduleCss = fs.readFileSync(path.join(root, "src/renderer/css/schedule.css"), "utf8");`,
            `const scheduleCss = fs.readFileSync(path.join(root, "src/renderer/css/schedule.css"), "utf8");\nconst responsiveCss = fs.readFileSync(path.join(root, "src/renderer/css/responsive.css"), "utf8");`
          );

          replaceOnce(
            testFile,
            `test("今天日期標題即使位於斑馬紋週也必須保持微亮藍色", () => {\n  assert.match(layout, /\\$\\{weekStripeClass\\}[^\\n]+\\$\\{dateString === today \\? "today" : ""\\}/);\n  assert.match(css, /--today:\\s*#eaf5ff;/);\n  assert.match(css, /--today-header:\\s*#cfe8ff;/);\n  assert.match(css, /--today-text:\\s*#204f73;/);\n  assert.match(css, /--today-border:\\s*#62a7d8;/);\n  assert.match(css, /\\.table-sticky-cell-day\\.today\\s*\\{[^}]*background:\\s*var\\(--today-header\\);[^}]*color:\\s*var\\(--today-text\\);[^}]*box-shadow:\\s*inset 0 0 0 2px var\\(--today-border\\);/s);\n  assert.match(css, /\\.table-sticky-cell-day\\.week-alt:not\\(\\.today\\)\\s*\\{/);\n  assert.doesNotMatch(scheduleCss, /\\.table-sticky-cell-day\\.today\\.week-alt/);\n});`,
            `test("今天日期標題在電腦與手機都必須保持微亮藍色", () => {\n  assert.match(layout, /\\$\\{weekStripeClass\\}[^\\n]+\\$\\{dateString === today \\? "today" : ""\\}/);\n  assert.match(css, /--today:\\s*#eaf5ff;/);\n  assert.match(css, /--today-header:\\s*#cfe8ff;/);\n  assert.match(css, /--today-text:\\s*#204f73;/);\n  assert.match(css, /--today-border:\\s*#62a7d8;/);\n  assert.match(css, /\\.table-sticky-cell-day\\.today\\s*\\{[^}]*background:\\s*var\\(--today-header\\);[^}]*color:\\s*var\\(--today-text\\);[^}]*box-shadow:\\s*inset 0 0 0 2px var\\(--today-border\\);/s);\n  assert.match(css, /\\.table-sticky-cell-day\\.week-alt:not\\(\\.today\\)\\s*\\{/);\n  assert.doesNotMatch(scheduleCss, /\\.table-sticky-cell-day\\.today\\.week-alt/);\n  assert.doesNotMatch(responsiveCss, /body\\.is-schedule-view \\.table-sticky-cell-day\\.today\\s*\\{/);\n});\n\ntest("電腦與手機班表標題應共用放大後字級", () => {\n  assert.match(css, /\\.table-sticky-cell\\s*\\{[^}]*font-size:\\s*13px;[^}]*font-weight:\\s*800;/s);\n  assert.match(css, /\\.table-sticky-cell-day span\\s*\\{[^}]*font-size:\\s*11px;[^}]*font-weight:\\s*700;/s);\n  assert.doesNotMatch(responsiveCss, /body\\.is-schedule-view \\.table-sticky-cell\\s*\\{[^}]*font-size:/s);\n  assert.doesNotMatch(responsiveCss, /body\\.is-schedule-view \\.table-sticky-cell-day span\\s*\\{/);\n});`
          );
          NODE
      - name: Build and validate without temporary workflow hygiene test
        shell: bash
        run: |
          npm run web:publish
          find tests -name '*.test.js' ! -name 'github-actions-hygiene.test.js' -print0 | xargs -0 node --test
          npm run css:architecture
      - name: Commit generated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/css/foundation.css src/renderer/css/responsive.css src/renderer/app.css src/renderer/index.html docs/app.css docs/index.html tests/renderer-week-stripe-boundary.test.js
          git commit -m "統一手機今天提示與班表表頭字級"
          git push origin HEAD:${{ github.head_ref }}
