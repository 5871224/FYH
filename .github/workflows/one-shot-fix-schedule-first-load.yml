name: One-shot fix schedule first load

on:
  push:
    branches:
      - main
    paths:
      - .github/fix-schedule-first-load-trigger.txt

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply canonical schedule first-load fix
        run: python .github/fix-schedule-first-load.py
      - name: Remove one-shot files
        run: |
          rm -f .github/workflows/one-shot-fix-schedule-first-load.yml
          rm -f .github/fix-schedule-first-load.py
          rm -f .github/fix-schedule-first-load-trigger.txt
      - name: Build and validate
        run: |
          npm run web:publish
          npm test
          npm run ci:check
      - name: Commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "修正八週週期與班表首次載入"
          git push origin HEAD:main
