name: Remove Employee Is Active

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refactor-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          show-progress: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply refactor
        run: |
          set +e
          python3 scripts/remove-employee-is-active-once.py > remove-employee-is-active.log 2>&1
          status=$?
          cat remove-employee-is-active.log
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add remove-employee-is-active.log
            git commit -m "保存移除人員 is_active 錯誤"
            git push origin HEAD:${{ github.head_ref }}
            exit "$status"
          fi
          rm -f remove-employee-is-active.log
          rm -f scripts/remove-employee-is-active-once.py
          rm -f .github/workflows/remove-employee-is-active-once.yml

      - name: Build published frontend
        run: npm run web:publish

      - name: Check JavaScript syntax
        run: |
          node --check src/renderer/web-api.js
          node --check src/renderer/renderer.js

      - name: Validate
        run: |
          node scripts/check-normalized-storage.js
          node scripts/check-expansion-acceptance.js
          node scripts/check-settings-lists.js
          npm run v2:check

      - name: Confirm employee status field is gone
        run: |
          if grep -RIn --exclude='app.js' --exclude-dir='docs' --exclude-dir='.git' \
            -E 'profile\?\.is_active|profile\.data\.is_active|set_employee[^\n]*is_active|is_active[^\n]*set_employee' \
            src supabase/functions scripts; then
            echo '仍有人員 is_active 相依' >&2
            exit 1
          fi

      - name: Commit refactor to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "移除人員 is_active 欄位"
          git push origin HEAD:${{ github.head_ref }}
