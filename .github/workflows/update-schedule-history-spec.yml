name: Update schedule history specification

on:
  push:
    paths:
      - '.github/workflows/update-schedule-history-spec.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update specification and validate assets
        shell: bash
        run: |
          set -euo pipefail
          node --check src/renderer/v2-schedule-history-controls.js
          cmp src/renderer/v2-schedule-history-controls.js docs/v2-schedule-history-controls.js
          cmp src/renderer/v2-schedule-nav.css docs/v2-schedule-nav.css
          python3 - <<'PY'
          from pathlib import Path

          path = Path('規格書.txt')
          text = path.read_text(encoding='utf-8')
          old = '''1. 班別、假別、加班項目以彩色按鈕顯示。
          2. 可依單位篩選班別。
          3. 工具列可收合。
          4. 隱藏於工具列的設定項目仍保留歷史班表顯示。
          5. 按 `Esc` 可取消目前選取的排班工具。
          6. 「匯出休例假」、「匯出請假」及「匯出加班」按下後，先顯示日期範圍選擇視窗，再依選定期間匯出。
          7. 日期範圍視窗包含開始日期、結束日期、取消與對應的匯出按鈕。
          8. 日期範圍視窗的左右寬度與「自動排班期間」視窗相同。
          9. 日期範圍視窗不顯示預設期間說明框。
          10. 匯出前會重新載入選定期間的正式班表資料，不受目前班表畫面顯示的八週範圍限制。
          11. 匯出檔名包含選定的開始日期與結束日期。'''.replace('          ', '')
          new = '''1. 班別、假別、加班項目以彩色按鈕顯示。
          2. 可依單位篩選班別。
          3. 工具列可收合。
          4. 浮動工具列右上角顯示「上一步」與「下一步」SVG 圖示按鈕。
          5. 「上一步」對應 `Ctrl+Z`，「下一步」對應 `Ctrl+Y`，使用相同的班表操作歷程。
          6. 沒有可復原或重做的操作時，對應按鈕停用。
          7. 最多保留最近 20 次班表操作歷程；執行新的班表修改後清除下一步歷程。
          8. 復原或重做後，立即更新畫面並同步保存變更的班表格。
          9. 隱藏於工具列的設定項目仍保留歷史班表顯示。
          10. 按 `Esc` 可取消目前選取的排班工具。
          11. 「匯出休例假」、「匯出請假」及「匯出加班」按下後，先顯示日期範圍選擇視窗，再依選定期間匯出。
          12. 日期範圍視窗包含開始日期、結束日期、取消與對應的匯出按鈕。
          13. 日期範圍視窗的左右寬度與「自動排班期間」視窗相同。
          14. 日期範圍視窗不顯示預設期間說明框。
          15. 匯出前會重新載入選定期間的正式班表資料，不受目前班表畫面顯示的八週範圍限制。
          16. 匯出檔名包含選定的開始日期與結束日期。'''.replace('          ', '')
          if old not in text:
              raise SystemExit('schedule toolbar specification target not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/update-schedule-history-spec.yml').unlink()
          PY
      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '規格書.txt' '.github/workflows/update-schedule-history-spec.yml'
          git commit -m 'Document schedule undo and redo controls'
          git push
