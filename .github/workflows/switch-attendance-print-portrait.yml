name: switch attendance review print portrait

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/switch-attendance-print-portrait.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply portrait layout
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/renderer/renderer-records-actions.js')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'A4 橫式每頁 40 筆': 'A4 直式每頁 40 筆',
              'width:297mm;height:210mm': 'width:210mm;height:297mm',
              'col.ar-print-date{width:18mm}': 'col.ar-print-date{width:17mm}',
              'col.ar-print-employee{width:18mm}': 'col.ar-print-employee{width:16mm}',
              'col.ar-print-icon{width:14mm}': 'col.ar-print-icon{width:11mm}',
              'col.ar-print-shift{width:21mm}': 'col.ar-print-shift{width:18mm}',
              'col.ar-print-clock{width:50mm}': 'col.ar-print-clock{width:38mm}',
              'col.ar-print-hours{width:13mm}': 'col.ar-print-hours{width:11mm}',
              'col.ar-print-note{width:62mm}': 'col.ar-print-note{width:27mm}',
              'col.ar-print-issue{width:45mm}': 'col.ar-print-issue{width:28mm}',
              'col.ar-print-status{width:13mm}': 'col.ar-print-status{width:10mm}',
              'tbody tr,.attendance-review-print-table tbody td{height:4.7mm;max-height:4.7mm}': 'tbody tr,.attendance-review-print-table tbody td{height:6.6mm;max-height:6.6mm}',
              'th,.attendance-review-print-table td{height:4.7mm;max-height:4.7mm;padding:.15mm .55mm': 'th,.attendance-review-print-table td{height:6.6mm;max-height:6.6mm;padding:.25mm .5mm',
              'attendance-review-print-cell{max-height:4.05mm;line-height:1.08}': 'attendance-review-print-cell{max-height:5.8mm;line-height:1.12}',
              'max-height:4.15mm;overflow:hidden;line-height:1.02': 'max-height:5.8mm;overflow:hidden;line-height:1.08',
              'font-size:8px;line-height:1.08;background:transparent': 'font-size:8.3px;line-height:1.12;background:transparent',
              'vertical-align:middle;font-size:8px}': 'vertical-align:middle;font-size:8.3px}',
              'A4 橫式</span>': 'A4 直式</span>',
              '@page{size:A4 landscape;margin:0}': '@page{size:A4 portrait;margin:0}'
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing source text: {old}')
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

          p = Path('規格書.md')
          spec = p.read_text(encoding='utf-8')
          old = '固定使用 A4 橫式且不增加額外頁首頁尾。'
          new = '固定使用 A4 直式且不增加額外頁首頁尾。'
          if old not in spec:
              raise SystemExit('missing spec orientation rule')
          p.write_text(spec.replace(old, new, 1), encoding='utf-8')

          p = Path('tests/attendance-review-print.test.js')
          test = p.read_text(encoding='utf-8')
          test = test.replace('簽到審核列印 A4 橫式且每頁 40 筆', '簽到審核列印 A4 直式且每頁 40 筆')
          old = 'assert.match(actions, /@page\\{size:A4 landscape;margin:0\\}/);'
          new = 'assert.match(actions, /@page\\{size:A4 portrait;margin:0\\}/);'
          if old not in test:
              raise SystemExit('missing print orientation test')
          test = test.replace(old, new, 1)
          p.write_text(test, encoding='utf-8')
      - name: Remove temporary workflow
        run: git rm .github/workflows/switch-attendance-print-portrait.yml
      - name: Build and test
        run: |
          node --check src/renderer/renderer-records-actions.js
          node --test tests/attendance-review-print.test.js
          npm run web:publish
          npm run ci:check
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/renderer-records-actions.js tests/attendance-review-print.test.js 規格書.md src/renderer/app.js src/renderer/index.html src/renderer/app.css docs
          git commit -m "fix: use portrait A4 for attendance review print"
          git push origin HEAD:main
