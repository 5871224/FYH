name: Temp records table center

on:
  push:
    branches:
      - agent/records-table-center-20260810

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Apply centered table values
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/renderer/css/pages.css')
          text = path.read_text(encoding='utf-8')
          marker = '''.attendance-ledger-table .is-today-row {
            background: rgba(55, 138, 221, 0.06);
          }
          '''
          insert = '''.attendance-ledger-table .is-today-row {
            background: rgba(55, 138, 221, 0.06);
          }

          .attendance-ledger-table tbody td,
          .attendance-review-table tbody td {
            text-align: center;
          }

          .attendance-ledger-table .attendance-clock-stack {
            align-items: center;
          }

          .attendance-review-table .attendance-punch-line {
            justify-content: center;
          }

          .attendance-ledger-table .attendance-note-input {
            text-align: center;
          }
          '''
          if marker not in text:
              raise SystemExit('center alignment insertion marker not found')
          if '.attendance-ledger-table tbody td,' in text:
              raise SystemExit('center alignment rules already exist')
          path.write_text(text.replace(marker, insert, 1), encoding='utf-8')
          PY

          cat > tests/records-table-centered-values.test.js <<'EOF'
          const test = require('node:test');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');

          test('個人記錄與簽到審核表格資料置中', () => {
            const source = fs.readFileSync('src/renderer/css/pages.css', 'utf8');
            assert.match(source, /\.attendance-ledger-table tbody td,\s*\n\.attendance-review-table tbody td \{\s*\n\s*text-align: center;/);
            assert.match(source, /\.attendance-ledger-table \.attendance-clock-stack \{\s*\n\s*align-items: center;/);
            assert.match(source, /\.attendance-review-table \.attendance-punch-line \{\s*\n\s*justify-content: center;/);
            assert.match(source, /\.attendance-ledger-table \.attendance-note-input \{\s*\n\s*text-align: center;/);
          });

          test('發布版 CSS 保留簽到簿表格置中規則', () => {
            for (const file of ['src/renderer/app.css', 'docs/app.css']) {
              const css = fs.readFileSync(file, 'utf8');
              assert.match(css, /\.attendance-ledger-table tbody td,\s*\n\.attendance-review-table tbody td/);
              assert.match(css, /\.attendance-review-table \.attendance-punch-line/);
            }
          });
          EOF

          rm .github/workflows/temp-records-table-center.yml
      - name: Install
        run: npm ci
      - name: Publish static web
        run: npm run web:publish
      - name: Full checks
        run: npm run ci:check
      - name: Re-publish final static web
        run: npm run web:publish
      - name: Commit clean result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "5871224"
          git config user.email "110716199+5871224@users.noreply.github.com"
          git add -A
          git commit -m "置中簽到簿表格資料"
          git push origin HEAD:agent/records-table-center-20260810
