name: Diagnose V2 check

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Capture final check result
        run: node scripts/check-v2-final.js > v2-check-diagnostic.txt 2>&1 || true
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2-check-diagnostic.txt
          git commit -m "Capture V2 check diagnostic"
          git push origin HEAD:${{ github.head_ref }}
