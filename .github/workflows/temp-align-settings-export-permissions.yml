name: Temp align settings export permissions

on:
  push:
    paths:
      - '.github/workflows/temp-align-settings-export-permissions.yml'
      - 'scripts/temp-align-settings-export.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Apply permission and export fix
        run: python scripts/temp-align-settings-export.py
      - name: Remove temporary files before repo guards
        run: rm -f .github/workflows/temp-align-settings-export-permissions.yml scripts/temp-align-settings-export.py
      - name: Build and verify
        run: |
          npm run web:publish
          npm test
          npm run web:check
          npm run renderer:check
          npm run css:architecture
          npm run js:architecture
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '修正設定與匯出選單權限對應'
          git pull --rebase origin main
          git push origin main
