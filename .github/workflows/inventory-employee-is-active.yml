name: Inventory Employee Is Active

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          show-progress: false
      - name: Inventory references
        run: |
          {
            echo '=== all is_active references outside generated bundles/docs ==='
            grep -RIn --exclude='app.js' --exclude-dir='docs' --exclude-dir='.git' 'is_active' . || true
            echo '=== all isActive references outside generated bundles/docs ==='
            grep -RIn --exclude='app.js' --exclude-dir='docs' --exclude-dir='.git' 'isActive' . || true
          } > inventory-employee-is-active.txt
      - name: Commit inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inventory-employee-is-active.txt
          git commit -m "保存人員 is_active 相依盤點"
          git push origin HEAD:${{ github.head_ref }}
