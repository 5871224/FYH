正式權限拆成「共用權限」與「群組權限」兩層；前端、RPC、RLS、Trigger 與 Edge Function 必須使用相同鍵值，不得再使用 `member_settings`、`permission_settings`、`access_roles.permissions` 或文字 `admin/manager` 作為授權來源。

### 2.4.1 共用權限

共用權限保存於 `access_roles.common_permissions`，不綁定單一群組：

| 權限鍵 | 畫面名稱 | 正式規則 |
|---|---|---|
| `settings` | 設定 | 管理群組設定、角色、共用／群組權限矩陣及其他明確歸入設定管理的功能；`access-control` 的角色新增、修改、刪除與排序均要求此權限 |
