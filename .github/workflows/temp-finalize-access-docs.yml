          spec = replace_section(spec, "## 9.3 頁面與資料權限矩陣", "## 9.4 正式 SQL", r'''## 9.3 頁面與資料權限矩陣

頁面入口、API、RPC、RLS、Trigger 與 Edge Function 必須套用同一份正式權限定義：

| 頁面／資料 | 正式權限 | 群組範圍 |
|---|---|---|
| 首頁與個人記錄 | 所有有效登入者查看本人資料 | 本人資料 |
| 班表與共用排班人員目錄 | `schedule_view` | 權限所在群組 |
| 班表編輯、班別、排班條件、人員設定／帳號管理 | `schedule_manage` | 權限所在群組 |
