          from pathlib import Path

          def replace_section(text, start, end, replacement):
              i = text.index(start)
              j = text.index(end, i)
              return text[:i] + replacement.rstrip() + "\n\n" + text[j:]

          def must_replace(text, old, new):
              if old not in text:
                  raise SystemExit(f"missing expected text: {old[:80]!r}")
              return text.replace(old, new)

          spec_path = Path("規格書.md")
          spec = spec_path.read_text(encoding="utf-8")
          spec = must_replace(spec, "**文件版本：** 2026-08-19", "**文件版本：** 2026-09-02")

          spec = replace_section(spec, "## 2.3 角色管理", "## 2.4 權限項目", r'''## 2.3 角色管理

系統先建立三個角色：

- 管理員。
- 主管。
- 員工。

可新增自訂角色。角色本身只保存角色名稱、排序及「共用權限」；逐群組權限另存於角色＋群組的權限矩陣，不再保存單獨的「適用群組」清單。

角色列表欄位為：

| 欄位 | 規則 |
|---|---|
| 拖曳排序 | 每列最前方，只有「≡」把手可拖曳；拖曳完成後立即持久化儲存 |
| 角色名稱 | 不可空白或重複 |
| 共用權限 | 顯示 `settings`、`export`、`leave_settings` 中已勾選項目，各權限使用獨立膠囊標籤 |
| 群組權限／權限項目 | 主要寬欄；依群組顯示已勾選權限，每個權限使用獨立膠囊標籤顯示，空間不足時自動換行 |
| 操作 | 編輯、刪除 |

角色排序為公司共用排序；人員新增／修改表單的「權限」下拉選單必須依相同角色順序顯示。重新整理、重新登入或換裝置後仍依資料庫排序顯示。

角色不設狀態。若角色仍有人員使用，刪除前必須先更換角色。系統至少保留一個具有共用 `settings` 權限的角色，且至少保留一名有效、未刪除、使用該角色的人員；不得藉由修改、刪除角色或人員移除最後一個設定管理帳號。

