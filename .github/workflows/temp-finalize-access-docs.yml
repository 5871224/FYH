| `leave_settings` | 假別設定 | 管理公司共用假別；目前隱藏的加班設定能力一併歸入此權限 |

### 2.4.2 群組權限

群組權限保存於 `access_role_group_permissions`，每筆以 `role_id + group_id` 對應該群組的權限陣列：

| 權限鍵 | 畫面名稱 | 正式規則 |
|---|---|---|
| `schedule_view` | 班表查看 | 可看到該群組並查看班表、封存班表及班表所需共用人員目錄 |
| `schedule_manage` | 班表管理 | 包含該群組班表編輯、班別、排班條件、人員設定／帳號管理、排序、自動排班及其他班表管理操作；勾選時必須同時具有 `schedule_view` |
| `department_settings` | 單位設定 | 管理該群組單位及其排序、打卡位置等單位設定 |
| `attendance_review` | 簽到審核 | 查詢、編輯、審核、退回、歷程及匯出該群組簽到審核資料 |
| `meal_admin` | 訂餐管理 | 查看及管理該群組訂餐統計與訂餐設定 |

班表權限連動規則：

1. 勾選 `schedule_manage` 時自動勾選 `schedule_view`。
2. 取消 `schedule_view` 時自動取消 `schedule_manage`。
3. 只有 `schedule_view` 時只能查看班表與封存資料，不得修改班表、人員或班別。
4. 班表匯出另受共用 `export` 控制；不得用 `schedule_manage` 取代共用匯出權限。
5. 沒有任何群組權限的群組，不因角色存在而自動成為可操作群組。
''')

