| 簽到審核 | `attendance_review` | 權限所在群組 |
| 今日訂餐 | 本人群組訂餐開關及今日打卡資格 | 本人群組 |
| 訂餐統計與設定 | `meal_admin` | 權限所在群組 |
| 封存班表查看 | `schedule_view` | 權限所在群組／正式封存授權 |
| 封存、解除封存與班表管理 | `schedule_manage` | 權限所在群組 |

共用權限不等於全資料存取權；群組權限也不互相包含，只有 `schedule_manage` 必須連動 `schedule_view`。
''')

          spec = replace_section(spec, "## 9.5 權限與資料存取架構", "## 9.6 交易與冪等", r'''## 9.5 權限與資料存取架構

正式系統只保留最新版權限模型與單一路徑：

1. 瀏覽器不得直接對核心資料表執行 `SELECT / INSERT / UPDATE / DELETE`；正式讀寫走具名 RPC 或對應 Edge Function。
2. 人員角色只以 `set_employee.access_role_id` 指向 `access_roles`。
3. 共用權限唯一保存於 `access_roles.common_permissions text[]`；正式鍵值為 `settings`、`export`、`leave_settings`。
4. 群組權限唯一保存於 `access_role_group_permissions(role_id, group_id, permissions)`；正式鍵值為 `schedule_view`、`schedule_manage`、`department_settings`、`attendance_review`、`meal_admin`。
5. `schedule_manage` 必須包含 `schedule_view`；其他群組權限彼此獨立。
6. 舊 `access_roles.permissions`、`access_role_groups`、`role.groupIds`、`applicableGroupIds`、`member_settings`、`permission_settings`、`set_employee.role` 與 `access_roles.legacy_role` 均不得作為正式授權來源；已淘汰的資料表／欄位／RPC 必須從正式 SQL 移除。
7. 資料庫權限 helper 使用 `has_common_permission`、`has_group_permission`、`has_any_group_permission` 與必要的集合式群組判斷；不得退回 `is_manager()`、`is_admin()`、`has_access_permission`、`can_access_group` 或舊角色字串判斷。
8. 高頻 RPC 必須先一次解析 actor 的 `access_role_id` 與群組權限，再以 JOIN／EXISTS 集合式篩選，不得對每一列資料重複查角色。
9. `anon` 與 `authenticated` 不取得核心資料表直接 CRUD GRANT；RLS 保留為第二層防護，正式寫入仍走具名 RPC／Edge Function。
10. `access-control` 是瀏覽器權限 bundle 與角色權限管理的唯一 Edge Function。正式 action 為 `bundle`、`saveRole`、`deleteRole`、`reorderRoles`；`saveRole`／`deleteRole`／`reorderRoles` 均要求共用 `settings`。
11. `access-control bundle` 回傳 actor 的 `commonPermissions`、逐群組 `groupPermissions`、可見群組與可見角色；具有共用 `settings` 時可取得全部群組／角色供設定管理，否則只回傳實際有群組權限的群組及必要角色資料。
12. 舊瀏覽器權限 RPC，例如 `get_group_access_bundle_v1`、`save_access_role_v1`、`delete_access_role_v1`，不得與 `access-control` 並存為第二套權限寫入路徑。
13. 人員登入帳號新增、修改、重設密碼與刪除統一由 `member-auth-admin` 處理；人員設定以目標人員所屬群組的 `schedule_manage` 驗證。
14. 單位設定使用該群組的 `department_settings`；班表、班別、排班條件使用該群組的 `schedule_manage`；假別使用共用 `leave_settings`；正式匯出使用共用 `export`；簽到與訂餐管理分別使用 `attendance_review` 與 `meal_admin`。
15. 本人 Edge Function 必須同時驗證任職期間及 `deleted_at`；涉及單位、群組的操作必須先把候選資料限制在本人所屬群組或已授權群組內，再做 GPS、IP、日期或其他業務判斷。
16. 同一資料完整性規則只保留一個正式 Trigger；不得同時保留舊版與新版最後管理者保護或重複 `updated_at` Trigger。
17. 「最後一位最高管理者」以有效、未刪除且角色具有共用 `settings` 的人員判定，不以 `admin` 角色名稱判定。

目前唯一正式 Edge Functions：

- `access-control`：權限 bundle、角色共用權限／逐群組權限儲存、角色刪除與排序。
- `member-auth-admin`：人員登入帳號新增、修改、密碼重設與刪除。
- `attendance-clock`：本人打卡。
- `attendance-ledger`：本人簽到簿資料。
- `attendance-review-groups`：逐群組簽到審核、編輯、批次操作與歷程。
- `attendance-ledger-export`：依 `attendance_review` 群組權限匯出已審簽到資料。
- `meal-order`：本人訂餐與具 `meal_admin` 群組管理操作。
- `meal-report-v2`：具 `meal_admin` 群組權限的訂餐統計報表。
- `meal-cancel-v2`：本人訂餐取消。

