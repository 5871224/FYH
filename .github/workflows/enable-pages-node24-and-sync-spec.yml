name: Update Pages Actions and current specification

on:
  push:
    paths:
      - '.github/workflows/enable-pages-node24-and-sync-spec.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Enable current Pages workflow and refresh specification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          pages_workflow = '''name: Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
'''

          Path('.github/workflows/deploy-pages.yml').write_text(pages_workflow, encoding='utf-8')
          disabled = Path('.github/workflows/deploy-pages.yml.disabled')
          if disabled.exists():
              disabled.unlink()

          spec_path = Path('規格書.txt')
          text = spec_path.read_text(encoding='utf-8-sig')

          publish_section = '''### 5.8.3 發佈

1. 前端原始碼位於 `src/renderer/`，GitHub Pages 發佈內容位於 `docs/`。
2. 修改前端後，以 `npm run web:publish` 或同等同步程序更新 `docs/`。
3. `src/renderer/` 與 `docs/` 的正式前端檔案必須一致。
4. CSS 或 JavaScript 內容變更時更新靜態資源版本參數，避免瀏覽器使用舊快取。
5. Edge Function 修改後部署到同一個 Supabase 專案。
6. 資料庫結構修改使用 migration，正式 SQL 順序依部署文件執行。
7. GitHub Pages 由 `.github/workflows/deploy-pages.yml` 自動部署 `docs/`。
8. Pages 工作流程使用 `ubuntu-latest`，目前 Action 版本如下：
   - `actions/checkout@v7`
   - `actions/configure-pages@v5`
   - `actions/upload-pages-artifact@v5`
   - `actions/deploy-pages@v5`
9. 本專案為靜態網站部署，Pages 工作流程不需要 `actions/setup-node` 或 npm 建置步驟。
10. 發佈前執行 JavaScript 語法檢查、V2 對齊檢查與主要驗收案例。

'''
          text, count = re.subn(
              r'### 5\.8\.3 發佈\n.*?(?=## 5\.9 本版本不包含項目)',
              publish_section,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('Could not replace section 5.8.3')

          chapter_six = r'''# 第六章　介面樣式統一規格

## 6.1 適用範圍

本章定義目前前端介面的統一樣式，適用於登入、首頁、打卡、訂餐、班表、紀錄、設定視窗、管理視窗及共用彈出視窗。

介面採手機優先，同一類型元件在不同頁面使用相同高度、圓角、配色、間距、聚焦狀態與停用狀態。

## 6.2 CSS 架構與載入順序

目前 CSS 分工如下：

1. **`styles.css`**
   - 網站基礎版面。
   - 班表主表格、凍結欄、排班格線及原始頁面結構。

2. **`v2-schedule-nav.css`**
   - 班表導覽列。
   - 首頁按鈕、復原／重做按鈕及班表捲動框架。

3. **`ui-system.css`**
   - 共用設計變數。
   - 表單控制項、按鈕、頁籤、一般表格、卡片、區塊、彈窗及手機響應式樣式。
   - 各設定視窗、訂餐表格及紀錄表格的共用版面。

正式載入順序：

```text
styles.css
v2-schedule-nav.css
ui-system.css
```

`src/renderer/` 與 `docs/` 使用相同 CSS 內容。固定介面樣式寫在 CSS；JavaScript 只設定資料產生的動態內容與業務顏色。

## 6.3 共用尺寸與間距

### 6.3.1 一般尺寸

| 項目 | 變數 | 目前值 |
|---|---|---:|
| 一般控制項高度 | `--ui-control-height` | 40px |
| 精簡控制項高度 | `--ui-control-height-compact` | 34px |
| 一般控制項圓角 | `--ui-control-radius` | 12px |
| 圖示按鈕圓角 | `--ui-icon-radius` | 10px |
| 表格外框圓角 | `--ui-table-radius` | 14px |
| 內容區塊圓角 | `--ui-section-radius` | 18px |
| 主卡片與彈窗圓角 | `--ui-page-radius` | 24px |

### 6.3.2 手機尺寸

手機寬度不超過 640px 時使用：

| 項目 | 變數 | 目前值 |
|---|---|---:|
| 頁面外距 | `--ui-mobile-page-gutter` | 4px |
| 主卡片內距 | `--ui-mobile-card-padding` | 10px |
| 次級區塊內距 | `--ui-mobile-section-padding` | 9px |
| 一般元件間距 | `--ui-mobile-gap` | 6px |
| 緊密元件間距 | `--ui-mobile-gap-tight` | 4px |
| 一般控制項高度 | `--ui-control-height` | 42px |

手機版縮減視覺留白，但不縮小輸入框、下拉選單及主要按鈕的觸控高度。

## 6.4 配色與狀態

1. 介面使用暖色系表面色、棕色主操作色及中性文字色。
2. 共用語意變數包含：
   - `--ui-surface`
   - `--ui-surface-raised`
   - `--ui-surface-muted`
   - `--ui-surface-hover`
   - `--ui-border`
   - `--ui-text`
   - `--ui-muted`
   - `--ui-accent`
   - `--ui-accent-strong`
   - `--ui-danger`
   - `--ui-focus-ring`
   - `--ui-row-hover`
3. 班別、假別與加班顏色由設定資料決定。
4. 聚焦元件顯示主色邊框與清楚的 focus ring。
5. 停用與唯讀元件使用淡色背景、較淡文字及不可操作游標。
6. 錯誤欄位使用危險色邊框並顯示文字訊息。

## 6.5 表單控制項

1. 文字、數字、密碼、日期、時間及下拉選單使用相同高度與 12px 圓角。
2. 一般左右內距為 12px；手機版為 8px。
3. 同一表單列中的輸入框、日期、時間與下拉選單等高。
4. `.form-row` 內控制項預設使用可用寬度。
5. 多行文字框最小高度為 88px；編輯打卡備註最小高度為 96px。
6. 核取方塊與單選按鈕為 18px，使用系統主色。
7. 日期與時間欄保留瀏覽器原生選擇器。
8. 表單標籤與控制項之間使用緊密間距，手機版原則上為 3px 至 4px。

## 6.6 按鈕與頁籤

### 6.6.1 按鈕

1. 主要操作使用 `.primary-btn` 或 `.btn-primary`。
2. 次要操作使用 `.ghost-btn`、`.nav-btn` 或 `.btn-cancel`。
3. 一般按鈕高度為 40px、圓角為 12px、字級為 14px。
4. `.compact-btn` 高度為 34px，適用於表格與密集工具列。
5. 手機版按鈕左右內距為 8px；精簡按鈕為 6px。
6. 圖示按鈕使用 10px 圓角；首頁返回按鈕及明確圓形功能可使用圓形。
7. 圖示按鈕提供 `title` 或 `aria-label`。
8. 停用按鈕不顯示位移效果及操作陰影。

### 6.6.2 頁籤

1. 訂餐與紀錄頁使用相同頁籤結構。
2. 選取頁籤使用主操作色背景與白色文字。
3. 手機版頁籤外距與內距使用 4px 至 8px 的緊密規格。
4. 頁籤切換不得改變整列高度。

## 6.7 表格

### 6.7.1 一般資料表格

1. 表格外框圓角為 14px。
2. 表頭使用不透明的 `--ui-surface-muted` 背景。
3. 表頭最小高度為 42px，資料列最小高度為 44px。
4. 電腦版儲存格水平內距原則上為 12px。
5. 手機版一般表頭內距為 6px，資料儲存格為 5px 6px。
6. 表格寬度超過容器時，只在表格容器內水平捲動。
7. 空資料狀態在表格內顯示文字。

### 6.7.2 設定表格

1. 人員、單位、班別、假別及加班設定的上方操作列使用相同排列。
2. 手機版第一列顯示標題與關閉按鈕；第二列顯示匯出、匯入與新增按鈕，三個按鈕平均分配寬度。
3. 設定表格使用內部橫向捲動與不透明黏性表頭。
4. 目前最小表格寬度：
   - 單位設定：720px。
   - 班別設定：1040px。
   - 假別設定：880px。
   - 加班設定：1060px。
5. 單位設定欄位順序固定為拖曳、單位、所屬人員、操作。
6. 捲動容器本身提供外框，不使用會跟著內容移動的重複偽元素外框。

### 6.7.3 訂餐表格

1. 今日訂餐欄位為商品、價格、數量、備註。
2. 商品欄電腦版寬度為 150px 至 220px，使用約 22% 表格寬度。
3. 商品欄手機版寬度為 150px。
4. 商品欄左內距電腦版為 14px，手機版為 10px。
5. 價格與數量欄使用固定窄欄，備註欄使用剩餘寬度。
6. 手機版訂餐列間距為 4px，儲存格內距為 4px。

### 6.7.4 班表表格

1. 班表主表格保留專用格線、凍結欄、八週日期欄與拖曳選取樣式。
2. 電腦版日期標題上方的同步水平捲軸不顯示外框、圓角或陰影。
3. 手機版隱藏日期標題上方的同步水平捲軸，使用班表內容本身左右滑動。
4. 日期標題框線與班表左右、下方框線畫在固定容器上，不跟著水平內容移動。

## 6.8 卡片、區塊與彈出視窗

1. 首頁、打卡、訂餐、紀錄、班表與登入主卡片使用 24px 圓角。
2. 次級內容區塊使用 18px 圓角。
3. 手機版主卡片內距為 10px；次級區塊內距為 9px。
4. 一般彈窗使用 24px 圓角，標題、內容與底部操作區使用一致分隔線及間距。
5. 手機版彈窗外距為 4px，最大高度為 `100dvh - 8px`。
6. 內容過高時由彈窗內容區捲動。
7. 編輯打卡視窗電腦版最大寬度約 560px，時間與單位欄位使用兩欄；手機版使用單欄。
8. 彈窗底部取消按鈕位於主要按鈕之前。

## 6.9 手機版頁面配置

1. 頁面左右及上方外距為 4px。
2. 主卡片使用 10px 內距。
3. 首頁、打卡、訂餐與紀錄主卡片最小高度為 `100dvh - 8px`。
4. 一般區塊間距為 6px，緊密操作列間距為 4px。
5. 篩選列、按鈕列及導覽列可以換行，不得造成整頁水平溢出。
6. 班表浮動工具列距螢幕邊緣為 4px，工具列內距為 6px。
7. 手機版兩欄表單改為單欄。
8. 表格過寬時由表格容器滑動，不壓縮所有欄位到同一畫面。

## 6.10 無障礙與實作規則

1. 所有可操作元件可使用鍵盤取得焦點。
2. 聚焦狀態清楚可見。
3. 狀態不得只靠顏色表示，需搭配文字、圖示、邊框或形狀差異。
4. 主要文字與背景保持足夠對比。
5. 固定外觀不得使用大量行內 `style`。
6. 固定 CSS 不得由 JavaScript 動態建立 `<style>` 標籤。
7. 動態業務顏色及資料產生的尺寸可由 JavaScript 或行內變數設定。
8. 新元件優先使用現有共用類別與設計變數。
9. 功能專屬類別只設定該功能必要的欄寬、排列及特殊限制。
10. 靜態樣式修改時同步更新 `src/renderer/`、`docs/` 與資源版本參數。

## 6.11 驗收標準

1. 同類型輸入框、下拉選單、日期、時間與按鈕在不同頁面外觀一致。
2. 手機版頁面外距為 4px，主卡片內距為 10px，次級區塊內距為 9px。
3. 手機版主要控制項高度至少 42px。
4. 人員、單位、班別、假別及加班設定的標題列與操作按鈕排列一致。
5. 設定表格左右滑動後，表頭底色、欄位對齊與外框保持正確。
6. 訂餐商品欄不占用過多寬度，備註欄使用主要剩餘空間。
7. 班表水平滑動時，固定外框不消失；手機版不顯示日期標題上方的額外捲軸。
8. 編輯打卡視窗的欄位與按鈕使用共用圓角、高度及手機單欄配置。
9. 鍵盤操作時所有互動元件都有可見焦點。
10. `src/renderer/` 與 `docs/` 的前端檔案保持一致。
'''

          chapter_marker = '# 第六章　介面樣式統一規格'
          marker_index = text.find(chapter_marker)
          if marker_index < 0:
              raise SystemExit('Chapter 6 marker not found')
          text = text[:marker_index] + chapter_six.rstrip() + '\n'
          spec_path.write_text(text, encoding='utf-8-sig')

          Path('.github/workflows/enable-pages-node24-and-sync-spec.yml').unlink()
          PY

      - name: Validate updated files
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/deploy-pages.yml
          test ! -f .github/workflows/deploy-pages.yml.disabled
          grep -q 'actions/checkout@v7' .github/workflows/deploy-pages.yml
          grep -q 'actions/upload-pages-artifact@v5' .github/workflows/deploy-pages.yml
          grep -q 'actions/deploy-pages@v5' .github/workflows/deploy-pages.yml
          python3 - <<'PY'
          from pathlib import Path
          text = Path('規格書.txt').read_text(encoding='utf-8-sig')
          required = [
              '`actions/checkout@v7`',
              '`actions/upload-pages-artifact@v5`',
              '--ui-mobile-page-gutter` | 4px',
              '商品欄電腦版寬度為 150px 至 220px',
              '手機版隱藏日期標題上方的同步水平捲軸',
          ]
          missing = [value for value in required if value not in text]
          if missing:
              raise SystemExit(f'Missing current specification content: {missing}')
          if text.count('# 第六章　介面樣式統一規格') != 1:
              raise SystemExit('Unexpected chapter 6 count')
          historical = [
              '逐步移除被',
              '已整併模組',
              '後續重構舊',
              '收斂舊樣式差異',
          ]
          found = [value for value in historical if value in text[text.index('# 第六章　介面樣式統一規格'):]]
          if found:
              raise SystemExit(f'Historical wording remains: {found}')
          PY

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Enable Node 24 Pages Actions and sync current UI specification'
          git push
