name: Prepare Modal Ordering Split

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/split-modal-schedule-ordering'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: agent/split-modal-schedule-ordering

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Split modal and schedule ordering
        run: node scripts/split-modal-schedule-ordering.js

      - name: Build published web files
        run: npm run web:publish

      - name: Run complete checks without temporary workflow
        run: |
          set -o pipefail
          cp .github/workflows/prepare-modal-ordering-split.yml /tmp/prepare-modal-ordering-split.yml
          rm .github/workflows/prepare-modal-ordering-split.yml
          npm run ci:check 2>&1 | tee modal-ordering-split-ci.log
          cp /tmp/prepare-modal-ordering-split.yml .github/workflows/prepare-modal-ordering-split.yml

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: modal-ordering-split-ci-log
          path: modal-ordering-split-ci.log
          if-no-files-found: ignore

      - name: Commit split modules
        run: |
          rm -f scripts/split-modal-schedule-ordering.js
          rm -f modal-ordering-split-ci.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "拆分彈窗導覽與班表排序"
          git push origin HEAD:agent/split-modal-schedule-ordering
