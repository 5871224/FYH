name: Prepare Records Admin Consolidation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/consolidate-records-admin'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: agent/consolidate-records-admin

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Fix consolidator parser
        run: node scripts/fix-records-consolidator-parser.js

      - name: Consolidate record and admin patches
        run: node scripts/consolidate-records-admin.js

      - name: Update legacy tests for formal record modules
        run: node scripts/update-records-admin-tests.js

      - name: Build published web files
        run: npm run web:publish

      - name: Check bundle syntax with context
        run: |
          if ! node --check src/renderer/app.js 2> syntax-error.log; then
            line=$(sed -n 's/.*app.js:\([0-9][0-9]*\).*/\1/p' syntax-error.log | head -n 1)
            start=$((line > 15 ? line - 15 : 1))
            end=$((line + 15))
            nl -ba src/renderer/app.js | sed -n "${start},${end}p" > syntax-context.txt
            cat syntax-error.log
            cat syntax-context.txt
            exit 1
          fi

      - name: Run complete checks without temporary workflow
        run: |
          set -o pipefail
          cp .github/workflows/prepare-records-admin-consolidation.yml /tmp/prepare-records-admin-consolidation.yml
          rm .github/workflows/prepare-records-admin-consolidation.yml
          npm run ci:check 2>&1 | tee records-admin-consolidation-ci.log
          cp /tmp/prepare-records-admin-consolidation.yml .github/workflows/prepare-records-admin-consolidation.yml

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: records-admin-consolidation-ci-log
          path: |
            records-admin-consolidation-ci.log
            syntax-error.log
            syntax-context.txt
          if-no-files-found: ignore

      - name: Commit verified consolidation
        run: |
          rm -f scripts/consolidate-records-admin.js
          rm -f scripts/update-records-admin-tests.js
          rm -f scripts/fix-records-consolidator-parser.js
          rm -f records-admin-consolidation-ci.log syntax-error.log syntax-context.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "整合記錄與管理補丁至正式模組"
          git push origin HEAD:agent/consolidate-records-admin
