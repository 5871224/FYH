name: Prepare Records Admin Consolidation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/consolidate-records-admin'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: agent/consolidate-records-admin

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Consolidate record and admin patches
        run: node scripts/consolidate-records-admin.js

      - name: Build published web files
        run: npm run web:publish

      - name: Run complete checks without temporary workflow
        run: |
          set -o pipefail
          cp .github/workflows/prepare-records-admin-consolidation.yml /tmp/prepare-records-admin-consolidation.yml
          rm .github/workflows/prepare-records-admin-consolidation.yml
          npm run ci:check 2>&1 | tee records-admin-consolidation-ci.log
          cp /tmp/prepare-records-admin-consolidation.yml .github/workflows/prepare-records-admin-consolidation.yml

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: records-admin-consolidation-ci-log
          path: records-admin-consolidation-ci.log
          if-no-files-found: ignore

      - name: Commit verified consolidation
        run: |
          rm -f scripts/consolidate-records-admin.js
          rm -f records-admin-consolidation-ci.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "整合記錄與管理補丁至正式模組"
          git push origin HEAD:agent/consolidate-records-admin
