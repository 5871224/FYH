name: Prepare Records Admin Consolidation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/consolidate-records-admin'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: agent/consolidate-records-admin

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Consolidate record and admin patches
        run: node scripts/consolidate-records-admin.js

      - name: Update legacy tests for formal record modules
        run: |
          python - <<'PY'
          from pathlib import Path

          records = Path('tests/renderer-phase13-records-views.test.js')
          text = records.read_text(encoding='utf-8')
          text = text.replace(
              'test("訂餐統計與訂餐設定畫面應保留查詢、匯出、拖曳與儲存控制", () => {\n  ["data-load-meal-report", "data-export-meal-report", "data-add-meal-product", "data-save-meal-settings", "data-meal-product-row", "meal-drag-handle"].forEach((marker) => assert.equal(views.includes(marker), true, "缺少：" + marker));\n});',
              'test("訂餐統計與訂餐設定畫面應保留即時篩選、匯出、拖曳與儲存控制", () => {\n  ["data-meal-report-filter", "data-export-meal-report", "data-add-meal-product", "data-save-meal-settings", "data-meal-product-row", "meal-drag-handle"].forEach((marker) => assert.equal(views.includes(marker), true, "缺少：" + marker));\n  assert.equal(read("src/renderer/renderer-records-events.js").includes("scheduleRecordsReload"), true, "訂餐統計未保留即時查詢");\n});'
          )
          records.write_text(text, encoding='utf-8')

          api_test = Path('tests/renderer-phase7-v2-api-data.test.js')
          text = api_test.read_text(encoding='utf-8')
          old = '''function extractFunctions(source, startName, endName) {
  const start = source.indexOf(`async function ${startName}`);
  const end = source.indexOf(`async function ${endName}`, start + 1);
  if (start < 0 || end <= start) throw new Error(`找不到測試函式區段：${startName} -> ${endName}`);
  return source.slice(start, end);
}'''
          new = '''function extractFunction(source, name) {
  const start = source.indexOf(`async function ${name}`);
  if (start < 0) throw new Error(`找不到測試函式：${name}`);
  const braceStart = source.indexOf("{", start);
  let depth = 0;
  for (let index = braceStart; index < source.length; index += 1) {
    if (source[index] === "{") depth += 1;
    if (source[index] === "}" && --depth === 0) return source.slice(start, index + 1);
  }
  throw new Error(`測試函式未完整結束：${name}`);
}'''
          if old not in text:
              raise SystemExit('找不到舊 API 測試擷取工具')
          text = text.replace(old, new, 1)
          old_call = '  const functionSource = extractFunctions(source, "getEmployeeOvertimeDates", "getTodayMealOrder");'
          new_call = '  const functionSource = ["getEmployeeOvertimeDates", "getAttendanceOvertimeForDate", "getTodayAttendanceOvertime", "submitAttendanceOvertime", "deleteAttendanceOvertime", "getMemberOrder", "saveMemberOrder"].map((name) => extractFunction(source, name)).join("\\n");'
          if old_call not in text:
              raise SystemExit('找不到舊 API 測試區段')
          api_test.write_text(text.replace(old_call, new_call, 1), encoding='utf-8')
          PY

      - name: Build published web files
        run: npm run web:publish

      - name: Run complete checks without temporary workflow
        run: |
          set -o pipefail
          cp .github/workflows/prepare-records-admin-consolidation.yml /tmp/prepare-records-admin-consolidation.yml
          rm .github/workflows/prepare-records-admin-consolidation.yml
          npm run ci:check 2>&1 | tee records-admin-consolidation-ci.log
          cp /tmp/prepare-records-admin-consolidation.yml .github/workflows/prepare-records-admin-consolidation.yml

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: records-admin-consolidation-ci-log
          path: records-admin-consolidation-ci.log
          if-no-files-found: ignore

      - name: Commit verified consolidation
        run: |
          rm -f scripts/consolidate-records-admin.js
          rm -f records-admin-consolidation-ci.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "整合記錄與管理補丁至正式模組"
          git push origin HEAD:agent/consolidate-records-admin
