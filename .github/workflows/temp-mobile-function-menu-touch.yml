name: Temporary mobile function menu touch fix

on:
  push:
    branches:
      - fix/mobile-function-menu-touch
    paths:
      - .github/workflows/temp-mobile-function-menu-touch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-function-menu-touch
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch mobile menu and export wording
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          paths = [Path('src/renderer/index.html'), Path('docs/index.html')]
          touch_css_anchor = "    @media (min-width: 981px) {\n      .attendance-review-filters {"
          touch_css = "\n".join([
              "    @media (hover: none), (pointer: coarse) {",
              "      .core-actions-menu-trigger {",
              "        touch-action: manipulation;",
              "      }",
              "",
              "      .core-actions-menu-category:hover > .core-actions-submenu {",
              "        display: none;",
              "      }",
              "",
              "      .core-actions-menu-category:focus-within > .core-actions-submenu {",
              "        display: grid;",
              "      }",
              "    }",
              "",
              ""
          ])
          old_pointer = 'category.addEventListener("pointerenter", () => {\n          const active = document.activeElement;'
          new_pointer = 'category.addEventListener("pointerenter", (event) => {\n          if (event.pointerType && event.pointerType !== "mouse") return;\n          const active = document.activeElement;'

          for path in paths:
              text = path.read_text(encoding='utf-8')
              if '匯出排班' in text:
                  text = text.replace('匯出排班', '匯出上班日')
              if old_pointer in text:
                  text = text.replace(old_pointer, new_pointer, 1)
              elif new_pointer not in text:
                  raise SystemExit(f'{path}: pointerenter block not found')
              if touch_css not in text:
                  if text.count(touch_css_anchor) != 1:
                      raise SystemExit(f'{path}: CSS anchor count = {text.count(touch_css_anchor)}')
                  text = text.replace(touch_css_anchor, touch_css + touch_css_anchor, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Validate and capture output
        shell: bash
        run: |
          set +e
          npm run ci:check 2>&1 | tee .ci-mobile-menu-failure.txt
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/renderer/index.html docs/index.html .ci-mobile-menu-failure.txt
            git diff --cached --quiet || git commit -m "chore: capture mobile menu CI failure"
            git push origin HEAD:fix/mobile-function-menu-touch
            exit "$status"
          fi
          rm -f .ci-mobile-menu-failure.txt

      - name: Remove temporary workflow
        run: rm .github/workflows/temp-mobile-function-menu-touch.yml

      - name: Commit result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "修正手機功能選單觸控與匯出名稱"
          git push origin HEAD:fix/mobile-function-menu-touch
