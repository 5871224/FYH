name: Finalize Helper Grants

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Restrict internal member group helper
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/002_current_updates.sql')
          text = path.read_text(encoding='utf-8')
          block = '''
-- 內部群組異動驗證只由 Trigger / 後端呼叫，不作為瀏覽器公開 RPC。
revoke all on function public.validate_member_group_change_v1(text,uuid) from public,anon,authenticated;
grant execute on function public.validate_member_group_change_v1(text,uuid) to service_role;
'''
          if 'revoke all on function public.validate_member_group_change_v1(text,uuid) from public,anon,authenticated;' not in text:
              text = text.rstrip() + '\n' + block
          path.write_text(text, encoding='utf-8')
          PY
      - name: Remove temporary workflow
        run: rm -f .github/workflows/finalize-helper-grants.yml
      - name: Install dependencies
        run: npm ci
      - name: Validate
        run: npm run ci:check
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "限制人員群組內部驗證 RPC"
          git push origin HEAD:main
