name: Use Member Delete V2 Once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  update-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          show-progress: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Switch endpoint
        run: |
          python3 scripts/use-member-delete-v2-once.py
          rm -f scripts/use-member-delete-v2-once.py
          rm -f .github/workflows/use-member-delete-v2-once.yml

      - name: Build published frontend
        run: npm run web:publish

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "改用人員刪除專用端點"
          git push origin HEAD:${{ github.head_ref }}

      - name: Validate
        run: |
          node scripts/check-normalized-storage.js
          node scripts/check-expansion-acceptance.js
          node scripts/check-settings-lists.js
          npm run v2:check
