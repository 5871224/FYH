name: Prepare Final Codebase Optimization

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/final-codebase-optimization'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: agent/final-codebase-optimization

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Finalize codebase architecture
        run: |
          set -o pipefail
          node scripts/finalize-codebase-architecture.js 2>&1 | tee final-codebase-migration.log

      - name: Build published web files
        run: npm run web:publish

      - name: Check JavaScript syntax
        run: node --check src/renderer/app.js

      - name: Run complete checks without temporary workflow
        run: |
          set -o pipefail
          cp .github/workflows/prepare-final-codebase-optimization.yml /tmp/prepare-final-codebase-optimization.yml
          rm .github/workflows/prepare-final-codebase-optimization.yml
          npm run ci:check 2>&1 | tee final-codebase-ci.log
          cp /tmp/prepare-final-codebase-optimization.yml .github/workflows/prepare-final-codebase-optimization.yml

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: final-codebase-optimization-log
          path: |
            final-codebase-migration.log
            final-codebase-ci.log
          if-no-files-found: ignore

      - name: Commit verified optimization
        run: |
          rm -f scripts/finalize-codebase-architecture.js final-codebase-migration.log final-codebase-ci.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "完成程式庫正式命名與架構清理"
          git push origin HEAD:agent/final-codebase-optimization
