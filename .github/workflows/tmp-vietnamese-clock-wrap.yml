name: Temporary Vietnamese Clock Wrap

on:
  push:
    branches:
      - fix/vietnamese-clock-button-wrap-20260901

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/vietnamese-clock-button-wrap-20260901
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply clock button wrap
        run: node scripts/tmp-vietnamese-clock-wrap.js
      - name: Remove temporary tooling
        run: rm -f scripts/tmp-vietnamese-clock-wrap.js .github/workflows/tmp-vietnamese-clock-wrap.yml
      - name: Build published web files
        run: npm run web:publish
      - name: Run full validation
        run: npm run ci:check
      - name: Commit formal changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "調整越文打卡按鈕換行"
          git push origin HEAD:fix/vietnamese-clock-button-wrap-20260901
