name: Finalize Meal Order Inputs

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/finalize-meal-order-inputs' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Apply source, test, specification, and workflow cleanup
        shell: bash
        run: |
          git show origin/main:scripts/finalize-meal-order-inputs.js > /tmp/finalize-meal-order-inputs.js
          node /tmp/finalize-meal-order-inputs.js

      - name: Build static web
        run: npm run web:publish

      - name: Run validation
        shell: bash
        run: |
          npm test
          npm run web:check
          node scripts/check-normalized-storage.js
          node scripts/check-expansion-acceptance.js
          node scripts/check-settings-lists.js
          npm run renderer:check
          npm run css:architecture
          npm run js:architecture

      - name: Commit synchronized changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .github/workflows src/renderer docs tests/renderer-meal-consolidation.test.js '規格書.md'
          git commit -m "完成訂餐儲存欄位保留修正"
          git push origin HEAD:${{ github.head_ref }}
