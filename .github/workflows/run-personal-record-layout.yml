name: Run personal record table layout

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply-layout:
    if: github.event.pull_request.head.ref == 'personal-record-table-layout'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: personal-record-table-layout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply table layout changes
        run: |
          if [ ! -f scripts/one-shot-personal-record-layout.py ]; then
            echo 'One-shot script already applied.'
            exit 0
          fi
          python scripts/one-shot-personal-record-layout.py
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/personal-record-table-layout.test.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace('assert.equal(source.includes("attendance-empty-value">-"), false);', 'assert.equal(source.includes("attendance-empty-value"), false);')
          path.write_text(text, encoding='utf-8')
          PY
          npm run web:publish
          npm test
          npm run ci:check
      - name: Commit generated changes
        run: |
          if [ ! -f scripts/one-shot-personal-record-layout.py ]; then
            exit 0
          fi
          rm -f scripts/one-shot-personal-record-layout.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "調整個人記錄表格欄位顯示"
          git push origin HEAD:personal-record-table-layout
