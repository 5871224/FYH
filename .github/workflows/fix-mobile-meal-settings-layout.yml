name: Fix mobile meal settings layout

on:
  push:
    paths:
      - '.github/workflows/fix-mobile-meal-settings-layout.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add responsive meal product cards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          css = r'''

          /* Mobile meal settings: keep the product name visible instead of compressing it to zero width. */
          @media (max-width: 640px) {
            .meal-settings-table-wrap {
              overflow: visible;
              border: 0;
              border-radius: 0;
              background: transparent;
            }

            .meal-settings-table {
              display: block;
              width: 100%;
              min-width: 0;
              table-layout: auto;
            }

            .meal-settings-table thead {
              display: none;
            }

            .meal-settings-table tbody {
              display: grid;
              gap: 10px;
              width: 100%;
            }

            .meal-settings-table tbody tr {
              display: grid;
              grid-template-columns: 30px minmax(0, 1fr) 72px;
              grid-template-areas:
                "drag name operation"
                "drag price active";
              gap: 8px;
              align-items: end;
              width: 100%;
              padding: 10px;
              border: 1px solid var(--ui-border);
              border-radius: var(--ui-table-radius);
              background: var(--ui-surface-raised);
              box-shadow: var(--ui-control-shadow);
            }

            .meal-settings-table tbody td {
              display: block;
              width: auto;
              min-width: 0;
              padding: 0;
              border: 0;
              background: transparent;
            }

            .meal-settings-table tbody tr:hover td {
              background: transparent;
            }

            .meal-settings-drag-col {
              grid-area: drag;
              align-self: stretch;
              display: flex !important;
              align-items: center;
              justify-content: center;
            }

            .meal-settings-name-col {
              grid-area: name;
            }

            .meal-settings-price-col {
              grid-area: price;
            }

            .meal-settings-active-col {
              grid-area: active;
              display: flex !important;
              flex-direction: column;
              align-items: center;
              justify-content: flex-end;
              min-height: var(--ui-control-height);
            }

            .meal-settings-operation-col {
              grid-area: operation;
              display: flex !important;
              align-items: flex-end;
              justify-content: flex-end;
            }

            .meal-settings-name-col::before,
            .meal-settings-price-col::before,
            .meal-settings-active-col::before {
              display: block;
              margin-bottom: 4px;
              color: var(--ui-muted);
              font-size: 12px;
              font-weight: 700;
              line-height: 1.2;
            }

            .meal-settings-name-col::before {
              content: "品項";
            }

            .meal-settings-price-col::before {
              content: "價格";
            }

            .meal-settings-active-col::before {
              content: "啟用";
            }

            .meal-settings-name-col input,
            .meal-settings-price-col input {
              display: block;
              width: 100%;
              min-width: 0;
            }

            .meal-settings-operation-col .ghost-btn {
              width: 100%;
              min-width: 0;
              padding-left: 8px !important;
              padding-right: 8px !important;
            }
          }
          '''

          for path in [Path('src/renderer/ui-system.css'), Path('docs/ui-system.css')]:
              text = path.read_text(encoding='utf-8-sig')
              marker = '/* Mobile meal settings: keep the product name visible instead of compressing it to zero width. */'
              if marker in text:
                  raise SystemExit(f'Mobile meal layout already exists in {path}')
              path.write_text(text.rstrip() + css + '\n', encoding='utf-8-sig')

          for path in [Path('src/renderer/index.html'), Path('docs/index.html')]:
              text = path.read_text(encoding='utf-8-sig')
              old = './ui-system.css?v=20260709v2'
              new = './ui-system.css?v=20260709v3'
              if old not in text:
                  raise SystemExit(f'Expected UI stylesheet version not found in {path}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8-sig')

          Path('.github/workflows/fix-mobile-meal-settings-layout.yml').unlink()
          PY

      - name: Validate CSS and files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('src/renderer/ui-system.css').read_text(encoding='utf-8-sig')
          public = Path('docs/ui-system.css').read_text(encoding='utf-8-sig')
          if source != public:
              raise SystemExit('Source and public UI styles differ')
          if source.count('{') != source.count('}'):
              raise SystemExit('Unbalanced CSS braces')
          required = [
              'grid-template-areas:',
              '"drag name operation"',
              '.meal-settings-name-col::before',
              'content: "品項";',
          ]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit(f'Missing mobile meal rules: {missing}')
          for name in ['src/renderer/index.html', 'docs/index.html']:
              if './ui-system.css?v=20260709v3' not in Path(name).read_text(encoding='utf-8-sig'):
                  raise SystemExit(f'New stylesheet version missing in {name}')
          PY

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix mobile meal settings product layout'
          git push
