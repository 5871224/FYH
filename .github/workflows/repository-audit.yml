name: Repository File Audit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate repository audit
        shell: python
        run: |
          import hashlib
          import json
          import os
          import re
          import subprocess
          from collections import defaultdict
          from pathlib import Path

          root = Path('.')
          excluded_dirs = {'.git', 'node_modules'}
          files = []
          for path in root.rglob('*'):
              if not path.is_file() or any(part in excluded_dirs for part in path.parts):
                  continue
              files.append(path)
          files.sort(key=lambda p: p.as_posix())

          def read_text(path):
              try:
                  return path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  return None

          def sha256(path):
              h = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          by_top = defaultdict(list)
          for path in files:
              key = path.parts[0] if len(path.parts) > 1 else '(root)'
              by_top[key].append(path)

          duplicate_groups = defaultdict(list)
          for path in files:
              if path.stat().st_size:
                  duplicate_groups[(path.stat().st_size, sha256(path))].append(path.as_posix())
          duplicates = [group for group in duplicate_groups.values() if len(group) > 1]

          zero_files = [p.as_posix() for p in files if p.stat().st_size == 0]
          large_files = sorted(
              [(p.stat().st_size, p.as_posix()) for p in files if p.stat().st_size >= 250_000],
              reverse=True,
          )

          suspicious_terms = re.compile(r'(?:^|[-_.])(old|legacy|backup|bak|copy|temp|tmp|phase\d*|patch|final)(?:[-_.]|$)', re.I)
          suspicious_names = [p.as_posix() for p in files if suspicious_terms.search(p.name)]

          package = json.loads(Path('package.json').read_text(encoding='utf-8'))
          command_text = '\n'.join(package.get('scripts', {}).values())
          workflow_text = '\n'.join(
              read_text(p) or '' for p in files if p.parts[:2] == ('.github', 'workflows')
          )
          docs_text = '\n'.join(
              read_text(Path(name)) or ''
              for name in ['README.md', 'AGENTS.md', '規格書.md']
              if Path(name).exists()
          )
          reference_text = '\n'.join([command_text, workflow_text, docs_text])

          script_files = [p for p in files if p.parts and p.parts[0] == 'scripts' and p.suffix.lower() in {'.js', '.ps1', '.py', '.sh'}]
          script_review = []
          for path in script_files:
              rel = path.as_posix()
              if rel not in reference_text and path.name not in reference_text:
                  script_review.append(rel)

          build_js = read_text(Path('scripts/build-js.js')) or ''
          renderer_js = [p for p in files if p.parent == Path('src/renderer') and p.suffix == '.js']
          generated_js = {'src/renderer/app.js'}
          js_not_manifested = [p.as_posix() for p in renderer_js if p.as_posix() not in generated_js and p.as_posix() not in build_js]

          build_css = read_text(Path('scripts/build-css.js')) or ''
          css_files = [p for p in files if p.parent == Path('src/renderer/css') and p.suffix == '.css']
          generated_css = {'src/renderer/css/app.css'}
          css_not_manifested = [p.as_posix() for p in css_files if p.as_posix() not in generated_css and p.as_posix() not in build_css]

          deploy_candidates = [Path('scripts/deploy-edge-functions.ps1'), Path('scripts/deploy-v2-final.ps1')]
          deploy_script = next((p for p in deploy_candidates if p.exists()), None)
          deploy_text = read_text(deploy_script) if deploy_script else ''
          deployed = set(re.findall(r'^\s*"([a-z0-9-]+)"\s*,?\s*$', deploy_text or '', re.M))
          functions_root = Path('supabase/functions')
          function_dirs = sorted(p.name for p in functions_root.iterdir() if p.is_dir()) if functions_root.exists() else []
          unlisted_functions = [name for name in function_dirs if name not in deployed]
          missing_function_dirs = sorted(name for name in deployed if name not in function_dirs)

          sql_files = sorted(p.as_posix() for p in Path('supabase').glob('*.sql')) if Path('supabase').exists() else []
          extra_sql = [p for p in sql_files if p not in {'supabase/001_current_schema.sql', 'supabase/002_current_updates.sql'}]

          test_files = [p.as_posix() for p in files if p.parts and p.parts[0] == 'tests' and p.name.endswith('.test.js')]
          historical_test_names = [p for p in test_files if re.search(r'(phase|v2|patch|legacy|override|data-fix)', p, re.I)]

          stale_markers = []
          marker_patterns = {
              '舊部署腳本名稱': 'deploy-v2-final.ps1',
              '舊 renderer 檢查名稱': 'check-v2-',
              '一般性 V2 說明': 'V2',
              'TODO/FIXME': None,
          }
          for path in files:
              text = read_text(path)
              if text is None:
                  continue
              if 'deploy-v2-final.ps1' in text:
                  stale_markers.append((path.as_posix(), 'deploy-v2-final.ps1'))
              if 'check-v2-' in text:
                  stale_markers.append((path.as_posix(), 'check-v2-'))
              if re.search(r'\b(?:TODO|FIXME)\b', text):
                  stale_markers.append((path.as_posix(), 'TODO/FIXME'))

          before = subprocess.run(['git', 'status', '--porcelain'], text=True, capture_output=True, check=True).stdout
          publish = subprocess.run(['npm', 'run', 'web:publish'], text=True, capture_output=True)
          publish_diff = subprocess.run(['git', 'status', '--porcelain'], text=True, capture_output=True, check=True).stdout
          publish_changed = sorted({line[3:] for line in publish_diff.splitlines() if line and line[3:] != '.github/workflows/repository-audit.yml'})

          report = []
          report.append('# FYH 程式庫檔案稽核')
          report.append('')
          report.append(f'- 稽核提交：`{os.environ.get("GITHUB_SHA", "")}`')
          report.append(f'- 檔案總數：{len(files)}')
          report.append(f'- 頂層區域：{len(by_top)}')
          report.append(f'- `npm run web:publish`：{"成功" if publish.returncode == 0 else "失敗"}')
          report.append('')
          report.append('## 目錄統計')
          report.append('')
          report.append('| 區域 | 檔案數 | 大小（KB） |')
          report.append('|---|---:|---:|')
          for key in sorted(by_top):
              total = sum(p.stat().st_size for p in by_top[key])
              report.append(f'| `{key}` | {len(by_top[key])} | {total / 1024:.1f} |')

          def section(title, values, empty='未發現'):
              report.append('')
              report.append(f'## {title}')
              report.append('')
              if not values:
                  report.append(empty)
              else:
                  for value in values:
                      report.append(f'- `{value}`')

          section('空白檔案', zero_files)
          section('大型檔案（至少 250 KB）', [f'{path}`：{size / 1024:.1f} KB' for size, path in large_files])
          section('可疑歷史／暫存命名', suspicious_names)
          section('可能未由正式命令或文件引用的 scripts', script_review, '未發現明顯孤立 scripts')
          section('未納入 JavaScript 建置清單的 renderer 檔案', js_not_manifested)
          section('未納入 CSS 建置清單的樣式檔', css_not_manifested)
          section('存在但未列入正式部署腳本的 Edge Functions', unlisted_functions)
          section('部署腳本列出但資料夾不存在的 Edge Functions', missing_function_dirs)
          section('正式兩份 SQL 以外的根層 SQL', extra_sql)
          section('仍帶歷史階段命名的測試檔', historical_test_names)
          section('過時路徑或待辦標記', [f'{path}：{marker}' for path, marker in stale_markers])
          section('重新發布後產生差異的檔案', publish_changed, '發布檔與來源一致')

          report.append('')
          report.append('## 完全相同內容的檔案群組')
          report.append('')
          if not duplicates:
              report.append('未發現')
          else:
              for group in sorted(duplicates, key=lambda g: (len(g), g)):
                  report.append('- ' + '、'.join(f'`{item}`' for item in group))

          report.append('')
          report.append('## 完整檔案清單')
          report.append('')
          for key in sorted(by_top):
              report.append(f'### {key}')
              report.append('')
              for path in by_top[key]:
                  report.append(f'- `{path.as_posix()}` ({path.stat().st_size} bytes)')
              report.append('')

          Path('repository-audit.md').write_text('\n'.join(report), encoding='utf-8')
          Path('repository-tree.txt').write_text('\n'.join(p.as_posix() for p in files), encoding='utf-8')
          Path('publish-output.txt').write_text((publish.stdout or '') + '\n' + (publish.stderr or ''), encoding='utf-8')

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: repository-audit
          path: |
            repository-audit.md
            repository-tree.txt
            publish-output.txt
          if-no-files-found: error
