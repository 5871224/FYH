name: Fix Settings Width and Catalog Delete

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/fix-settings-width-and-catalog-delete'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Apply width and delete fixes
        run: |
          set -o pipefail
          node scripts/fix-settings-width-and-catalog-delete.js 2>&1 | tee settings-fix.log

      - name: Build static web
        run: |
          set -o pipefail
          npm run web:publish 2>&1 | tee settings-build.log

      - name: Run complete checks
        run: |
          set -o pipefail
          npm run ci:check 2>&1 | tee settings-ci.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: settings-width-delete-diagnostics
          path: |
            settings-fix.log
            settings-build.log
            settings-ci.log
          if-no-files-found: ignore

      - name: Commit verified fix
        run: |
          rm -f scripts/fix-settings-width-and-catalog-delete.js
          rm -f .github/workflows/fix-settings-width-and-catalog-delete.yml
          rm -f settings-fix.log settings-build.log settings-ci.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "修正設定欄寬與目錄刪除"
          git push origin HEAD:agent/fix-settings-width-and-catalog-delete
