name: Fix specification section once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-spec-section-once.yml'

permissions:
  contents: write

jobs:
  fix-section:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Move auto-fill section
        run: python scripts/fix_spec_section_once.py

      - name: Commit corrected specification
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '修正自動補班規格章節位置'
          git push
