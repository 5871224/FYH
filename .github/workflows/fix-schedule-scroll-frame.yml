name: Fix schedule scroll frame

on:
  push:
    paths:
      - '.github/workflows/fix-schedule-scroll-frame.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix fixed schedule borders and top scrollbar
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          patch = r'''

          /* Keep the schedule frame fixed while the synchronized horizontal scrollers move. */
          .table-top-scrollbar {
            border: 0;
            border-radius: 0;
            box-shadow: none;
          }

          .table-sticky-header {
            border: 1px solid var(--line);
            border-bottom: 0;
          }

          .table-sticky-header::after,
          .table-sticky-header-left::after {
            content: none;
            display: none;
          }

          .table-wrap {
            border: 0;
            border-left: 1px solid var(--line);
            border-right: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
          }

          .table-wrap::after {
            content: none;
            display: none;
          }
          '''

          marker = '/* Keep the schedule frame fixed while the synchronized horizontal scrollers move. */'
          for css_path in [Path('src/renderer/ui-system.css'), Path('docs/ui-system.css')]:
              text = css_path.read_text(encoding='utf-8-sig')
              if marker not in text:
                  text = text.rstrip() + patch + '\n'
              css_path.write_text(text, encoding='utf-8-sig')

          for html_path in [Path('src/renderer/index.html'), Path('docs/index.html')]:
              text = html_path.read_text(encoding='utf-8-sig')
              text, count = re.subn(r'\./ui-system\.css\?v=[^"\s]+', './ui-system.css?v=20260709v9', text, count=1)
              if count != 1:
                  raise SystemExit(f'Could not update UI CSS asset version in {html_path}')
              html_path.write_text(text, encoding='utf-8-sig')

          Path('.github/workflows/fix-schedule-scroll-frame.yml').unlink()
          PY

      - name: Validate styles
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in ['src/renderer/ui-system.css', 'docs/ui-system.css']:
              text = Path(name).read_text(encoding='utf-8-sig')
              if text.count('{') != text.count('}'):
                  raise SystemExit(f'Unbalanced CSS braces: {name}')
              required = [
                  '/* Keep the schedule frame fixed while the synchronized horizontal scrollers move. */',
                  '.table-top-scrollbar',
                  'border-radius: 0;',
                  '.table-sticky-header::after,',
                  '.table-sticky-header-left::after',
                  '.table-wrap::after',
                  'border-left: 1px solid var(--line);',
                  'border-right: 1px solid var(--line);',
                  'border-bottom: 1px solid var(--line);',
              ]
              missing = [value for value in required if value not in text]
              if missing:
                  raise SystemExit(f'Missing schedule frame rules in {name}: {missing}')
          PY

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix schedule borders during horizontal scrolling'
          git push
