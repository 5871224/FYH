name: Finalize Schedule Empty Cell Persistence

on:
  push:
    branches:
      - fix/schedule-empty-cell-persistence-20260809

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/schedule-empty-cell-persistence-20260809
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Align patch with current SQL
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/tmp-fix-schedule-empty-cell.py")
          text = path.read_text(encoding="utf-8")
          old = 'old_deleted_member = "or (member.deleted_at is not null and not (coalesce(item.delete_entry,false) or (item.shift_type_id is null and item.leave_type_id is null and item.overtime_type_id is null)))"'
          new = '''old_deleted_member = """       or (member.deleted_at is not null and not (
                   coalesce(item.delete_entry,false)
                   or (item.shift_type_id is null and item.leave_type_id is null and item.overtime_type_id is null)
                 ))"""'''
          if text.count(old) != 1:
              raise SystemExit(f"patch source marker count={text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Apply persistence fix
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python scripts/tmp-fix-schedule-empty-cell.py 2>&1 | tee patch-output.txt
      - name: Upload patch output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schedule-persistence-patch-output
          path: patch-output.txt
      - name: Stop when patch failed
        if: steps.patch.outcome != 'success'
        run: exit 1
      - name: Rebuild generated web
        run: npm run web:publish
      - name: Remove temporary tools before validation
        run: |
          rm .github/workflows/finalize-schedule-empty-cell-persistence.yml
          rm scripts/tmp-fix-schedule-empty-cell.py
      - name: Run complete validation
        run: npm run ci:check
      - name: Check diff
        run: git diff --check
      - name: Commit finalized fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "修正空白班表格新增資料未持久化"
          git push origin HEAD:fix/schedule-empty-cell-persistence-20260809
