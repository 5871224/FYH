name: Temp permission layout update

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temp-permission-layout.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Update layout and publish
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('src/renderer/index.html'); s=p.read_text(encoding='utf-8'); marker='    @media (min-width: 981px) {\n      .attendance-review-filters {\n        grid-template-columns: repeat(6, minmax(0, 1fr));\n      }\n\n      .attendance-review-table .attendance-review-employee-col {\n        width: 112px;\n      }\n    }\n'; add='\n    .permission-settings-table th:nth-child(3),\n    .permission-settings-table td:nth-child(3) {\n      width: 12rem;\n    }\n\n    .permission-settings-table th:nth-child(4),\n    .permission-settings-table td:nth-child(4) {\n      width: auto;\n    }\n\n    .permission-group-summary-row {\n      display: flex;\n      align-items: flex-start;\n      gap: 0.45rem;\n      min-width: 0;\n    }\n\n    .permission-group-summary-row + .permission-group-summary-row {\n      margin-top: 0.3rem;\n    }\n\n    .permission-group-summary-row > strong {\n      flex: 0 0 auto;\n      white-space: nowrap;\n      line-height: 1.7;\n    }\n\n    .permission-group-summary-row > .permission-summary-tags {\n      flex: 1 1 auto;\n      min-width: 0;\n    }\n'; assert s.count(marker)==1, 'target style block mismatch'; p.write_text(s.replace(marker, marker+add, 1), encoding='utf-8')"
          npm run web:publish
          rm .github/workflows/temp-permission-layout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "調整權限設定欄位與群組權限排列"
          git push origin HEAD:main
