name: Temp permission layout update

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-permission-layout.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Update permission settings layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/renderer/index.html')
          text = path.read_text(encoding='utf-8')
          needle = '''    @media (min-width: 981px) {
      .attendance-review-filters {
        grid-template-columns: repeat(6, minmax(0, 1fr));
      }

      .attendance-review-table .attendance-review-employee-col {
        width: 112px;
      }
    }
'''
          replacement = needle + '''
    .permission-settings-table th:nth-child(3),
    .permission-settings-table td:nth-child(3) {
      width: 12rem;
    }

    .permission-settings-table th:nth-child(4),
    .permission-settings-table td:nth-child(4) {
      width: auto;
    }

    .permission-group-summary-row {
      display: flex;
      align-items: flex-start;
      gap: 0.45rem;
      min-width: 0;
    }

    .permission-group-summary-row + .permission-group-summary-row {
      margin-top: 0.3rem;
    }

    .permission-group-summary-row > strong {
      flex: 0 0 auto;
      white-space: nowrap;
      line-height: 1.7;
    }

    .permission-group-summary-row > .permission-summary-tags {
      flex: 1 1 auto;
      min-width: 0;
    }
'''
          if text.count(needle) != 1:
              raise SystemExit('Target style block not found exactly once')
          path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          PY
          npm run web:publish
          rm .github/workflows/temp-permission-layout.yml
      - name: Commit generated web output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "調整權限設定欄位與群組權限排列"
          git push origin HEAD:main
