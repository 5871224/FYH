name: One-shot Pages and specification update

on:
  push:
    paths:
      - '.github/pages-spec-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply current Pages and specification state
        run: python3 scripts/one-shot-update-pages-spec.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/deploy-pages.yml
          test ! -f .github/workflows/deploy-pages.yml.disabled
          grep -q 'actions/checkout@v5' .github/workflows/deploy-pages.yml
          grep -q 'actions/upload-pages-artifact@v5' .github/workflows/deploy-pages.yml
          grep -q 'actions/deploy-pages@v5' .github/workflows/deploy-pages.yml
          python3 - <<'PY'
          from pathlib import Path
          text = Path('規格書.txt').read_text(encoding='utf-8-sig')
          required = [
              '`actions/checkout@v5`',
              '`actions/upload-pages-artifact@v5`',
              '`--ui-mobile-page-gutter` | 4px',
              '商品欄電腦版寬度為 150px 至 220px',
              '手機版隱藏日期標題上方的同步水平捲軸',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'Missing current specification content: {missing}')
          if text.count('# 第六章　介面樣式統一規格') != 1:
              raise SystemExit('Unexpected chapter 6 count')
          PY

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Enable Node 24 Pages Actions and sync current UI specification'
          git push
