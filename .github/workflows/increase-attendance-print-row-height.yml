name: increase attendance review print row height

on:
  push:
    branches: [main]
    paths: ['.github/workflows/increase-attendance-print-row-height.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply taller rows
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/renderer/renderer-records-actions.js')
          s = path.read_text(encoding='utf-8')
          assert s.count('6.6mm') == 4, f'unexpected 6.6mm count: {s.count("6.6mm")}'
          s = s.replace('6.6mm', '7mm')
          assert s.count('5.8mm') == 2, f'unexpected 5.8mm count: {s.count("5.8mm")}'
          s = s.replace('5.8mm', '6.2mm')
          path.write_text(s, encoding='utf-8')

          test_path = Path('tests/attendance-review-print.test.js')
          test = test_path.read_text(encoding='utf-8')
          marker = '  assert.match(actions, /@page\\{size:A4 portrait;margin:0\\}/);\n'
          extra = '  assert.match(actions, /height:7mm;max-height:7mm/);\n'
          if extra not in test:
              assert marker in test, 'portrait assertion not found'
              test = test.replace(marker, marker + extra, 1)
              test_path.write_text(test, encoding='utf-8')
      - name: Remove temporary workflow
        run: git rm .github/workflows/increase-attendance-print-row-height.yml
      - name: Build and test
        run: |
          node --check src/renderer/renderer-records-actions.js
          node --test tests/attendance-review-print.test.js
          npm run web:publish
          npm run ci:check
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/renderer/renderer-records-actions.js tests/attendance-review-print.test.js src/renderer/app.js src/renderer/index.html src/renderer/app.css docs .github/workflows
          git commit -m "fix: increase attendance review print row height"
          git push origin HEAD:main
