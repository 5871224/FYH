name: Canonical Residual Diagnose

on:
  push:
    branches:
      - canonical-cleanup-20260808

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: canonical-cleanup-20260808
      - name: Patch cleanup transformer
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/canonical-cleanup.py')
          text = path.read_text(encoding='utf-8')
          marker = 'def replace_once(text, old, new, label):\n'
          replacement = marker + '    if label == "unarchive archive range refresh":\n        return text.replace(old, new)\n'
          if replacement not in text:
              text = text.replace(marker, replacement, 1)
          group_write = 'write("src/renderer/renderer-groups-permissions-archive.js", groups)'
          group_cleanup = '''groups = re.sub(r"\\nfunction refreshGroupEntityMap\\(entityMap\\) \\{[\\s\\S]*?\\n\\}\\n?", "\\n", groups, count=1)\n''' + group_write
          if group_cleanup not in text:
              text = text.replace(group_write, group_cleanup, 1)
          append_marker = 'updates = updates.rstrip() + canonical_sql\n'
          canonical_strip = append_marker + '''for _legacy_line in [\n    "drop function if exists public.get_my_profile_v2();\\n",\n    "drop function if exists public.get_group_entity_map_v1();\\n",\n    "drop function if exists public.access_role_legacy_role(text[]);\\n",\n    "drop function if exists public.is_admin(uuid);\\n",\n    "drop function if exists public.is_manager(uuid);\\n",\n    "alter table public.set_employee drop column if exists role;\\n",\n    "alter table public.access_roles drop column if exists legacy_role;\\n",\n]:\n    updates = updates.replace(_legacy_line, "")\n'''
          if canonical_strip not in text:
              text = text.replace(append_marker, canonical_strip, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Apply cleanup transformer
        run: python .github/canonical-cleanup.py
      - name: Report forbidden SQL residues
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          schema = Path('supabase/001_current_schema.sql').read_text(encoding='utf-8')
          updates = Path('supabase/002_current_updates.sql').read_text(encoding='utf-8')
          combined = schema + '\n' + updates
          checks = [
            ('legacy/text-role token', combined, r'legacy_role|access_role_legacy_role|employee\.role|new\.role|ROLE_OPTIONS'),
            ('base role column', schema, r"\brole text not null default 'employee'"),
            ('dynamic RLS advisor block', updates, r'Performance Advisor: remaining public RLS auth context uses init-plan evaluation'),
            ('old group entity map RPC', updates, r'get_group_entity_map_v1\s*\(\)'),
          ]
          failed = False
          for label, text, pattern in checks:
            match = re.search(pattern, text, re.I)
            if match:
              line = text.count('\n', 0, match.start()) + 1
              snippet = text[max(0, match.start()-120):match.end()+180].replace('\n', ' ')
              print(f'::error title=Canonical residual::{label}; line={line}; {snippet}')
              failed = True
          raise SystemExit(1 if failed else 0)
          PY
      - name: Diagnose expansion acceptance
        run: |
          if ! node scripts/check-expansion-acceptance.js >/tmp/expansion.txt 2>&1; then
            msg=$(tail -n 30 /tmp/expansion.txt | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Expansion acceptance::$msg"
            exit 1
          fi
      - name: Diagnose settings lists
        run: |
          if ! node scripts/check-settings-lists.js >/tmp/settings.txt 2>&1; then
            msg=$(tail -n 30 /tmp/settings.txt | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Settings lists::$msg"
            exit 1
          fi
      - name: Diagnose renderer checks
        run: |
          failed=0
          for cmd in \
            "node scripts/build-css.js --check" \
            "node scripts/build-js.js --check" \
            "node --check src/renderer/app.js" \
            "node scripts/check-renderer-alignment.js" \
            "node scripts/check-renderer-contracts.js"; do
            if ! bash -lc "$cmd" >/tmp/renderer.txt 2>&1; then
              msg=$(tail -n 40 /tmp/renderer.txt | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
              echo "::error title=Renderer check failed::$cmd :: $msg"
              failed=1
            fi
          done
          exit "$failed"
