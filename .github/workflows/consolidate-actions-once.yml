name: Consolidate GitHub Actions

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  consolidate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          show-progress: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Apply workflow consolidation
        run: |
          node scripts/consolidate-actions-once.js
          rm -f scripts/consolidate-actions-once.js
          rm -f .github/workflows/consolidate-actions-once.yml

      - name: Validate consolidated workflow
        run: npm run ci:check

      - name: Commit consolidated workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "整併 GitHub Actions 驗證與部署流程"
          git push origin HEAD:${{ github.head_ref }}
