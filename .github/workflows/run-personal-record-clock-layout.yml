name: Run personal record clock layout

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply-layout:
    if: github.event.pull_request.head.ref == 'personal-record-clock-layout-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: personal-record-clock-layout-v2
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply personal record clock layout
        run: |
          python scripts/one-shot-personal-record-clock-layout.py
          rm -f scripts/one-shot-personal-record-clock-layout.py
          rm -f .github/workflows/run-personal-record-clock-layout.yml
          npm run web:publish
          npm test
          npm run ci:check
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "縮窄打卡欄並區分打卡按鈕顏色"
          git push origin HEAD:personal-record-clock-layout-v2
