name: Apply Browser Page Tabs

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/browser-style-page-tabs' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Apply browser-style tabs and remove temporary files
        shell: bash
        run: |
          git show origin/main:scripts/apply-browser-page-tabs.js > /tmp/apply-browser-page-tabs.js
          node /tmp/apply-browser-page-tabs.js

      - name: Build static web
        run: npm run web:publish

      - name: Run tests without temporary workflow hygiene check
        shell: bash
        run: find tests -name '*.test.js' ! -name 'github-actions-hygiene.test.js' -print0 | xargs -0 node --test

      - name: Check public Supabase settings
        run: npm run web:check

      - name: Check normalized storage
        run: node scripts/check-normalized-storage.js

      - name: Check expansion acceptance
        run: node scripts/check-expansion-acceptance.js

      - name: Check settings lists
        run: node scripts/check-settings-lists.js

      - name: Check CSS bundle
        run: node scripts/build-css.js --check

      - name: Check JavaScript bundle
        run: node scripts/build-js.js --check

      - name: Check JavaScript syntax
        run: node --check src/renderer/app.js

      - name: Check renderer alignment
        run: node scripts/check-renderer-alignment.js

      - name: Check renderer contracts
        run: node scripts/check-renderer-contracts.js

      - name: Check CSS architecture
        run: npm run css:architecture

      - name: Check JavaScript architecture
        run: npm run js:architecture

      - name: Commit synchronized changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .github scripts/apply-browser-page-tabs.js src/renderer/renderer-main-pages.js src/renderer/renderer-records-views.js src/renderer/css/foundation.css src/renderer/css/components.css src/renderer/css/responsive.css src/renderer/app.css src/renderer/app.js src/renderer/index.html docs/app.css docs/app.js docs/index.html tests/css-consolidation.test.js '規格書.md'
          git commit -m "改用 Chrome 式頁籤"
          git push origin HEAD:${{ github.head_ref }}
