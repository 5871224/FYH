name: Audit CSS Duplicates

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    if: github.head_ref == 'agent/consolidate-css-rules'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: agent/consolidate-css-rules

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Audit CSS rules
        run: node scripts/audit-css-duplicates.js

      - name: Upload CSS audit
        uses: actions/upload-artifact@v5
        with:
          name: css-duplicate-report
          path: css-duplicate-report.md
