name: Prepare CSS Consolidation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/consolidate-css-rules'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: agent/consolidate-css-rules

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Fix CSS consolidator template
        run: node scripts/fix-css-consolidator.js

      - name: Consolidate CSS rules
        run: node scripts/consolidate-css-rules.js

      - name: Build published web files
        run: npm run web:publish

      - name: Check CSS architecture
        run: npm run css:architecture

      - name: Run complete checks without temporary workflow
        run: |
          set -o pipefail
          cp .github/workflows/audit-css-duplicates.yml /tmp/audit-css-duplicates.yml
          rm .github/workflows/audit-css-duplicates.yml
          npm run ci:check 2>&1 | tee css-consolidation-ci.log
          cp /tmp/audit-css-duplicates.yml .github/workflows/audit-css-duplicates.yml

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: css-consolidation-report
          path: |
            css-duplicate-report.md
            css-consolidation-ci.log
          if-no-files-found: ignore

      - name: Commit verified consolidation
        run: |
          rm -f scripts/consolidate-css-rules.js scripts/fix-css-consolidator.js css-duplicate-report.md css-consolidation-ci.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "整合 CSS 重複規則與後載入覆蓋"
          git push origin HEAD:agent/consolidate-css-rules
