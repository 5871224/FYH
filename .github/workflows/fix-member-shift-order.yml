name: fix member shift ordering

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-member-shift-order.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Apply member shift ordering fix
        shell: python
        run: |
          from pathlib import Path
          import re
          import textwrap

          group_path = Path('src/renderer/renderer-groups-permissions-archive.js')
          group_source = group_path.read_text(encoding='utf-8')
          group_replacement = textwrap.dedent('''
          function getOrderedMemberGroupShifts(groupId, selectedIds = []) {
            const shifts = getShiftsForGroup(groupId).filter((shift) => !shift.hiddenFromToolbar);
            const shiftById = new Map(shifts.map((shift) => [shift.id, shift]));
            const orderedSelectedIds = (Array.isArray(selectedIds) ? selectedIds : [])
              .filter((shiftId, index, list) => shiftById.has(shiftId) && list.indexOf(shiftId) === index);
            const selectedIdSet = new Set(orderedSelectedIds);
            return {
              orderedSelectedIds,
              shifts: [
                ...orderedSelectedIds.map((shiftId) => shiftById.get(shiftId)).filter(Boolean),
                ...shifts.filter((shift) => !selectedIdSet.has(shift.id))
              ]
            };
          }

          function renderMemberGroupShiftSelector(groupId, selectedIds = []) {
            const ordered = getOrderedMemberGroupShifts(groupId, selectedIds);
            const selectedRankById = new Map(ordered.orderedSelectedIds.map((shiftId, index) => [shiftId, index + 1]));
            return `<div class="schedule-dept-list" id="memberScheduleShiftList" hidden>${ordered.shifts.map((shift) => { const rank = selectedRankById.get(shift.id) || 0; const checked = rank > 0; return `<label class="schedule-dept-option" draggable="true" data-schedule-shift-option="${escapeHtml(shift.id)}"><input type="checkbox" value="${escapeHtml(shift.id)}" ${checked ? "checked" : ""}><span class="schedule-dept-rank">${checked ? rank : "-"}</span><span>${escapeHtml(shift.name)}</span></label>`; }).join("")}</div>`;
          }
          ''').strip()
          group_pattern = re.compile(r'function renderMemberGroupShiftSelector\(groupId, selectedIds = \[\]\) \{.*?\n\}\n(?=function memberShiftNamesForGroup)', re.S)
          group_source, group_count = group_pattern.subn(group_replacement + '\n', group_source, count=1)
          assert group_count == 1, f'member group selector replacement count: {group_count}'
          group_path.write_text(group_source, encoding='utf-8')

          member_path = Path('src/renderer/renderer-settings-member.js')
          member_source = member_path.read_text(encoding='utf-8')
          member_helper = textwrap.dedent('''
          function moveChangedScheduleShiftOptionToSelectionOrder(input) {
            if (!(input instanceof HTMLInputElement)) {
              return;
            }
            const row = input.closest("[data-schedule-shift-option]");
            const list = row?.parentElement;
            if (!(row instanceof HTMLElement) || !(list instanceof HTMLElement) || list.id !== "memberScheduleShiftList") {
              return;
            }
            const rows = Array.from(list.querySelectorAll("[data-schedule-shift-option]"))
              .filter((item) => item instanceof HTMLElement);
            if (input.checked) {
              const checkedRows = rows.filter((item) => item !== row && item.querySelector("input")?.checked);
              const lastChecked = checkedRows[checkedRows.length - 1] || null;
              if (lastChecked) {
                lastChecked.after(row);
              } else {
                list.prepend(row);
              }
              return;
            }
            const firstUnchecked = rows.find((item) => item !== row && !item.querySelector("input")?.checked) || null;
            if (firstUnchecked) {
              firstUnchecked.before(row);
            } else {
              list.append(row);
            }
          }
          ''').strip()
          marker = 'function syncScheduleShiftSelectorRanks() {'
          assert member_source.count(marker) == 1, f'rank marker count: {member_source.count(marker)}'
          member_source = member_source.replace(marker, member_helper + '\n\n' + marker, 1)
          member_path.write_text(member_source, encoding='utf-8')

          events_path = Path('src/renderer/renderer-events-form.js')
          events_source = events_path.read_text(encoding='utf-8')
          events_pattern = re.compile(r'(    if \(target\.closest\("#memberScheduleShiftList"\)\) \{\n)(      syncScheduleShiftSelectorRanks\(\);)')
          events_source, events_count = events_pattern.subn(r'\1      moveChangedScheduleShiftOptionToSelectionOrder(target);\n\2', events_source, count=1)
          assert events_count == 1, f'member shift event replacement count: {events_count}'
          events_path.write_text(events_source, encoding='utf-8')

          test_path = Path('tests/member-shift-selection-order.test.js')
          test_path.write_text(textwrap.dedent('''
          const test = require("node:test");
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const path = require("node:path");

          const groupSource = fs.readFileSync(path.join(__dirname, "../src/renderer/renderer-groups-permissions-archive.js"), "utf8");
          const memberSource = fs.readFileSync(path.join(__dirname, "../src/renderer/renderer-settings-member.js"), "utf8");
          const formEventsSource = fs.readFileSync(path.join(__dirname, "../src/renderer/renderer-events-form.js"), "utf8");

          test("修改人員頁班別依勾選順序顯示並從 1 連號", () => {
            assert.ok(groupSource.includes('...orderedSelectedIds.map((shiftId) => shiftById.get(shiftId)).filter(Boolean)'));
            assert.ok(groupSource.includes('[shiftId, index + 1]'));
            assert.ok(groupSource.includes('${checked ? rank : "-"}'));
          });

          test("新勾選班別接在目前已勾選班別最後", () => {
            assert.ok(memberSource.includes('function moveChangedScheduleShiftOptionToSelectionOrder(input)'));
            assert.ok(memberSource.includes('lastChecked.after(row)'));
            assert.ok(memberSource.includes('let rank = 1;'));
            assert.ok(formEventsSource.includes('moveChangedScheduleShiftOptionToSelectionOrder(target);'));
          });
          ''').lstrip(), encoding='utf-8')

      - name: Remove temporary workflow
        run: git rm .github/workflows/fix-member-shift-order.yml

      - name: Build and verify
        run: |
          node --test tests/member-shift-selection-order.test.js
          npm run web:publish
          npm run web:check
          npm run renderer:check

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve member shift selection order"
          git push origin HEAD:main
