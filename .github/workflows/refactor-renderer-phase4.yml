name: Renderer Phase 4 Refactor

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refactor:
    if: github.head_ref == 'agent/split-renderer-phase4'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Apply renderer phase 4 refactor
        run: |
          set -o pipefail
          node scripts/refactor-renderer-phase4-v2.js 2>&1 | tee renderer-phase4-refactor.log

      - name: Upload refactor diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: renderer-phase4-refactor-log
          path: renderer-phase4-refactor.log
          if-no-files-found: ignore

      - name: Build static web
        run: npm run web:publish

      - name: Run complete checks
        run: npm run ci:check

      - name: Commit renderer phase 4 refactor
        run: |
          rm -f scripts/refactor-renderer-phase4.js
          rm -f scripts/refactor-renderer-phase4-v2.js
          rm -f .github/workflows/refactor-renderer-phase4.yml
          rm -f renderer-phase4-refactor.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "拆分 renderer 自動排班模組"
          git push origin HEAD:agent/split-renderer-phase4
