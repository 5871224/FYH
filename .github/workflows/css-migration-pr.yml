name: CSS Architecture Migration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          show-progress: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Normalize nested template escapes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/migrate-css-architecture-once.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace('\\\\${', '\\${')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Run migration
        id: migration
        shell: bash
        continue-on-error: true
        run: |
          set +e
          node scripts/migrate-css-architecture-once.js > css-migration.log 2>&1
          status=$?
          cat css-migration.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 0 ]; then
            rm -f scripts/migrate-css-architecture-once.js
            rm -f scripts/css-migration-trigger.txt
            rm -f .github/workflows/css-migration-pr.yml
            rm -f css-migration.log
          fi
          exit 0

      - name: Upload migration error log
        if: steps.migration.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: css-migration-error
          path: css-migration.log

      - name: Stop after migration failure
        if: steps.migration.outputs.status != '0'
        run: exit 1

      - name: Build and validate
        run: |
          npm run web:publish
          npm run web:check
          node scripts/check-normalized-storage.js
          node scripts/check-expansion-acceptance.js
          npm run v2:check

      - name: Commit migration to PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "重整 CSS 架構並產生單一 bundle"
          git push origin HEAD:${{ github.head_ref }}
