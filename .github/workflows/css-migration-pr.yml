name: CSS Bundle Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          show-progress: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build static web
        run: npm run web:publish

      - name: Validate project
        run: |
          npm run web:check
          node scripts/check-normalized-storage.js
          node scripts/check-expansion-acceptance.js
          npm run v2:check

      - name: Commit generated files to PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "同步 CSS bundle 與發布內容"
          git push origin HEAD:${{ github.head_ref }}
