name: Temp personal record header center

on:
  push:
    branches:
      - agent/personal-record-header-center-20260810

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Center personal record headers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/renderer/css/pages.css')
          text = path.read_text(encoding='utf-8')
          marker = '''.attendance-ledger-table tbody td,
          .attendance-review-table tbody td {
            text-align: center;
          }
          '''
          insert = '''.attendance-ledger-table thead th {
            text-align: center;
          }

          .attendance-ledger-table tbody td,
          .attendance-review-table tbody td {
            text-align: center;
          }
          '''
          if marker not in text:
              raise SystemExit('personal record header insertion marker not found')
          if '.attendance-ledger-table thead th {' in text:
              raise SystemExit('personal record header center rule already exists')
          path.write_text(text.replace(marker, insert, 1), encoding='utf-8')
          PY

          cat > tests/personal-record-header-centered.test.js <<'EOF'
          const test = require('node:test');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');

          test('個人記錄表格欄標題置中', () => {
            const source = fs.readFileSync('src/renderer/css/pages.css', 'utf8');
            assert.match(source, /\.attendance-ledger-table thead th \{\s*\n\s*text-align: center;/);
          });

          test('發布版 CSS 保留個人記錄表頭置中規則', () => {
            for (const file of ['src/renderer/app.css', 'docs/app.css']) {
              const css = fs.readFileSync(file, 'utf8');
              assert.match(css, /\.attendance-ledger-table thead th \{\s*\n\s*text-align: center;/);
            }
          });
          EOF

          rm .github/workflows/temp-personal-record-header-center.yml
      - name: Install
        run: npm ci
      - name: Publish static web
        run: npm run web:publish
      - name: Full checks
        run: npm run ci:check
      - name: Re-publish final static web
        run: npm run web:publish
      - name: Commit clean result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "5871224"
          git config user.email "110716199+5871224@users.noreply.github.com"
          git add -A
          git commit -m "置中個人記錄表格欄標題"
          git push origin HEAD:agent/personal-record-header-center-20260810
