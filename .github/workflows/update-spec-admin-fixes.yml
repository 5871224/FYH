# trigger
name: Update specification for admin data fixes

on:
  push:
    paths:
      - '.github/workflows/update-spec-admin-fixes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update specification
        shell: python
        run: |
          from pathlib import Path

          path = Path('規格書.txt')
          text = path.read_text(encoding='utf-8')

          old_fields = '- 工號。\n- 姓名。'
          new_fields = '- 工號；全系統唯一，去除前後空白後比對，英文字母大小寫視為相同工號。\n- 姓名。'
          if old_fields not in text:
              raise SystemExit('employee fields target not found')
          text = text.replace(old_fields, new_fields, 1)

          old_rules = '''帳號刪除規則：

1. 有班表、打卡、打卡異動、加班、審核或訂餐歷史時保留人員歷史，後端拒絕刪除。
2. 可刪除時，Supabase Auth 與 `set_employee` 必須在同一交易一致完成。
3. 系統永遠保留至少一位有效管理員。
4. 主管或管理員刪除自己時需再次驗證目前密碼，完成後立即登出。'''
          new_rules = '''帳號與工號規則：

1. 新增與修改人員時，前端、後端及資料庫都必須檢查工號不得重複；去除前後空白後比對，英文字母大小寫視為相同。
2. 沒有班表、打卡、加班或訂餐歷史的人員，刪除時同步移除 Supabase Auth 與 `set_employee`。
3. 已有班表、打卡、加班或訂餐歷史的人員，刪除操作改為將 `is_active` 設為 `false`，從目前人員清單移除並保留歷史紀錄。
4. 刪除失敗時保留畫面原資料，並顯示後端回傳的失敗原因。
5. 系統永遠保留至少一位有效管理員。
6. 刪除目前登入帳號後立即登出；有歷史資料時同樣改為停用帳號。'''
          if old_rules not in text:
              raise SystemExit('member delete rules target not found')
          text = text.replace(old_rules, new_rules, 1)

          marker = '''- 訂餐商品依其表格版面使用較大的操作區。

---'''
          replacement = '''- 訂餐商品依其表格版面使用較大的操作區。

### 3.3.10 班別、假別與加班刪除規格

1. 刪除班別、假別或加班時，前端先呼叫後端依識別碼刪除正式資料。
2. 後端確認刪除成功後，前端才移除畫面項目；重新整理後不得再次出現。
3. 刪除失敗時保留畫面原資料，並顯示明確失敗訊息。
4. 刪除班別時，同步從所有人員的可排班班別清單移除該班別。
5. 班表中引用已刪除班別、假別或加班的欄位，由資料庫外鍵設為空值；同一列其他班表內容繼續保留。

---'''
          if marker not in text:
              raise SystemExit('catalog deletion marker not found')
          text = text.replace(marker, replacement, 1)

          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/update-spec-admin-fixes.yml').unlink()
      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '規格書.txt' '.github/workflows/update-spec-admin-fixes.yml'
          git commit -m 'Update specification for member and catalog fixes'
          git push
