name: 暫存浮動工具列建置

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: tmp-toolbar-compact
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/trigger-toolbar-compact-20260730'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Apply toolbar changes
        run: python .tmp/apply_toolbar_compact.py

      - name: Install dependencies
        run: npm ci

      - name: Build and publish static web
        run: npm run web:publish

      - name: Run complete checks
        run: npm run ci:check

      - name: Create one formal main commit
        env:
          FORMAL_BASE: 69f441346ae3bf3a418afb0b7215a0ce089a4ad0
        run: |
          rm -f .tmp/apply_toolbar_compact.py
          rm -f .github/workflows/tmp-toolbar-compact.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset --soft "$FORMAL_BASE"
          git add -A
          git commit -m "優化班表浮動工具列顯示"
          git push --force-with-lease origin HEAD:main
