name: Repair UI style specification chapter

on:
  push:
    paths:
      - '.github/workflows/repair-add-ui-style-spec-chapter.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update specification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          spec_path = Path('規格書.txt')
          source_path = Path('.github/workflows/add-ui-style-spec-chapter.yml')
          text = spec_path.read_text(encoding='utf-8-sig')
          source = source_path.read_text(encoding='utf-8-sig')

          start_marker = "          chapter = r'''"
          end_marker = "\n'''\n\n          path.write_text"
          start = source.find(start_marker)
          if start < 0:
              raise SystemExit('Chapter source start marker not found')
          start += len(start_marker)
          end = source.find(end_marker, start)
          if end < 0:
              raise SystemExit('Chapter source end marker not found')
          chapter = source[start:end]

          text = text.replace('**文件版本：** 2026-07-08', '**文件版本：** 2026-07-09', 1)

          tree_lines = [
              '# 文件樹狀目錄',
              '',
              '規格書  ',
              '├─ 第一章　打卡頁  ',
              '│  ├─ 1.1 頁面目的  ',
              '│  ├─ 1.2 分頁與功能區  ',
              '│  │  ├─ 1.2.1 今日打卡  ',
              '│  │  └─ 1.2.2 加班申請  ',
              '│  └─ 1.3 其他相關規則  ',
              '├─ 第二章　訂餐頁  ',
              '│  ├─ 2.1 頁面目的  ',
              '│  ├─ 2.2 分頁  ',
              '│  │  ├─ 2.2.1 今日訂餐  ',
              '│  │  ├─ 2.2.2 訂餐統計  ',
              '│  │  └─ 2.2.3 訂餐設定  ',
              '│  └─ 2.3 其他相關規則  ',
              '├─ 第三章　班表頁  ',
              '│  ├─ 3.1 頁面目的  ',
              '│  ├─ 3.2 檢視分頁  ',
              '│  │  ├─ 3.2.1 人員檢視  ',
              '│  │  ├─ 3.2.2 人員檢視－統計欄  ',
              '│  │  └─ 3.2.3 班別檢視  ',
              '│  └─ 3.3 設定、工具與其他規則  ',
              '├─ 第四章　紀錄頁  ',
              '│  ├─ 4.1 頁面目的  ',
              '│  ├─ 4.2 分頁  ',
              '│  │  ├─ 4.2.1 個人記錄  ',
              '│  │  ├─ 4.2.2 加班審核  ',
              '│  │  └─ 4.2.3 打卡管理  ',
              '│  └─ 4.3 其他相關規則  ',
              '├─ 第五章　系統環境、資料庫與其他規格  ',
              '│  ├─ 5.1 章節目的  ',
              '│  ├─ 5.2 執行環境與使用技術  ',
              '│  ├─ 5.3 登入、首頁與帳號規則  ',
              '│  ├─ 5.4 共用時間、權限與安全規則  ',
              '│  ├─ 5.5 後端服務、RPC 與交易  ',
              '│  ├─ 5.6 資料庫共通規格  ',
              '│  ├─ 5.7 資料表與欄位中文說明  ',
              '│  ├─ 5.8 稽核、驗收與發佈  ',
              '│  └─ 5.9 本版本不包含項目  ',
              '└─ 第六章　介面樣式統一規格  ',
              '   ├─ 6.1 章節目的與適用範圍  ',
              '   ├─ 6.2 CSS 檔案分工與載入順序  ',
              '   ├─ 6.3 共用設計變數  ',
              '   ├─ 6.4 表單控制項  ',
              '   ├─ 6.5 按鈕與操作元件  ',
              '   ├─ 6.6 表格  ',
              '   ├─ 6.7 頁籤、卡片、區塊與彈出視窗  ',
              '   ├─ 6.8 響應式與無障礙規格  ',
              '   ├─ 6.9 開發與命名規則  ',
              '   ├─ 6.10 特殊元件與例外  ',
              '   └─ 6.11 驗收標準',
          ]
          new_tree = '\n'.join(tree_lines)
          pattern = r'# 文件樹狀目錄\n\n.*?\n\n---\n\n# 第一章　打卡頁'
          replacement = new_tree + '\n\n---\n\n# 第一章　打卡頁'
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not replace document tree')

          if '# 第六章　介面樣式統一規格' not in text:
              text = text.rstrip() + chapter + '\n'

          spec_path.write_text(text, encoding='utf-8-sig')
          source_path.unlink()
          Path('.github/workflows/repair-add-ui-style-spec-chapter.yml').unlink()
          PY

      - name: Validate specification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('規格書.txt').read_text(encoding='utf-8-sig')
          required = [
              '**文件版本：** 2026-07-09',
              '# 第六章　介面樣式統一規格',
              '## 6.3 共用設計變數',
              '## 6.11 驗收標準',
              '`ui-system.css`',
              '.attendance-edit-modal',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'Missing specification content: {missing}')
          if text.count('# 第六章　介面樣式統一規格') != 1:
              raise SystemExit('Unexpected UI chapter count')
          PY

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add unified interface style specification chapter'
          git push
