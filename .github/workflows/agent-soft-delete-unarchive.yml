name: Agent soft delete unarchive

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/agent-soft-delete-unarchive.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply source changes
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          payload = "".join(
              Path(f".github/agent-soft-delete-unarchive/part{i}.txt").read_text(encoding="utf-8").strip()
              for i in range(1, 5)
          )
          code = gzip.decompress(base64.b64decode(payload)).decode("utf-8")
          exec(compile(code, "<agent-patch>", "exec"))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build published web
        run: npm run web:publish

      - name: Run CI checks
        run: npm run ci:check

      - name: Commit implementation
        run: |
          rm -rf .github/agent-soft-delete-unarchive
          rm .github/workflows/agent-soft-delete-unarchive.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "實作班表解除封存與軟刪除"
          git push origin main
