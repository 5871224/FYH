name: Add unified UI system

on:
  push:
    paths:
      - '.github/workflows/add-unified-ui-system.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create shared UI stylesheet and update pages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          css = r''':root {
            --ui-control-height: 40px;
            --ui-control-height-compact: 34px;
            --ui-control-radius: 12px;
            --ui-icon-radius: 10px;
            --ui-table-radius: 14px;
            --ui-section-radius: 18px;
            --ui-page-radius: 24px;
            --ui-surface: #fffdf8;
            --ui-surface-raised: #ffffff;
            --ui-surface-muted: #fbf8f1;
            --ui-surface-hover: #f8f1e5;
            --ui-border: var(--line, #ddd4c6);
            --ui-text: var(--text, #2b241c);
            --ui-muted: var(--muted, #76695b);
            --ui-accent: var(--accent, #9c6b2f);
            --ui-accent-strong: var(--accent-strong, #7f5422);
            --ui-danger: var(--danger, #ae3c33);
            --ui-focus-ring: 0 0 0 3px rgba(156, 107, 47, 0.16);
            --ui-control-shadow: 0 1px 2px rgba(72, 52, 31, 0.05);
            --ui-row-hover: #fdf8ef;
            --schedule-nav-control-height: var(--ui-control-height);
          }

          /* Shared typography and interaction foundation. */
          button,
          input,
          select,
          textarea {
            font: inherit;
          }

          input:not([type="checkbox"]):not([type="radio"]):not([type="hidden"]):not([type="color"]):not([type="range"]):not([type="file"]),
          select,
          textarea {
            min-height: var(--ui-control-height);
            border: 1px solid var(--ui-border);
            border-radius: var(--ui-control-radius);
            padding: 8px 12px;
            background: var(--ui-surface-raised);
            color: var(--ui-text);
            box-shadow: var(--ui-control-shadow);
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
          }

          textarea {
            min-height: 88px;
            line-height: 1.5;
            resize: vertical;
          }

          input:not([type="checkbox"]):not([type="radio"]):not([type="hidden"]):not([type="color"]):not([type="range"]):not([type="file"]):hover,
          select:hover,
          textarea:hover {
            border-color: #cbbba5;
          }

          input:not([type="checkbox"]):not([type="radio"]):not([type="hidden"]):not([type="color"]):not([type="range"]):not([type="file"]):focus,
          select:focus,
          textarea:focus {
            border-color: var(--ui-accent);
            box-shadow: var(--ui-focus-ring);
          }

          input:disabled,
          select:disabled,
          textarea:disabled,
          input[readonly],
          textarea[readonly] {
            cursor: not-allowed;
            background: #f2eee7;
            color: #8a8177;
            box-shadow: none;
          }

          input:invalid:not(:placeholder-shown),
          textarea:invalid:not(:placeholder-shown) {
            border-color: var(--ui-danger);
          }

          input[type="checkbox"],
          input[type="radio"] {
            width: 18px;
            height: 18px;
            min-height: 18px;
            accent-color: var(--ui-accent);
          }

          input[type="date"],
          input[type="time"] {
            color-scheme: light;
          }

          .form-row > input:not([type="checkbox"]):not([type="radio"]):not([type="hidden"]):not([type="color"]):not([type="range"]):not([type="file"]),
          .form-row > select,
          .form-row > textarea {
            width: 100%;
          }

          .time-picker select,
          .records-filter-row input,
          .records-filter-row select,
          .member-settings-filters input,
          .member-settings-filters select,
          .meal-order-table input,
          .meal-settings-table input[type="text"],
          .meal-settings-table input[type="number"] {
            min-height: var(--ui-control-height);
            border-radius: var(--ui-control-radius);
            padding: 8px 12px;
          }

          /* Standard text buttons use one height, radius and weight. */
          :where(.primary-btn, .ghost-btn, .nav-btn, .btn-primary, .btn-cancel):not(.toolbar-history-btn):not(.toolbar-collapse-toggle) {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: var(--ui-control-height);
            padding: 0 14px;
            border-radius: var(--ui-control-radius);
            font-size: 14px;
            font-weight: 700;
            line-height: 1.2;
            white-space: nowrap;
            box-shadow: var(--ui-control-shadow);
          }

          :where(.primary-btn, .btn-primary) {
            border: 1px solid transparent;
            background: linear-gradient(135deg, var(--ui-accent) 0%, var(--ui-accent-strong) 100%);
            color: #fff;
          }

          :where(.ghost-btn, .nav-btn, .btn-cancel):not(.toolbar-history-btn):not(.toolbar-collapse-toggle) {
            border: 1px solid var(--ui-border);
            background: var(--ui-surface-raised);
            color: var(--ui-text);
          }

          :where(.primary-btn, .ghost-btn, .nav-btn, .btn-primary, .btn-cancel):not(:disabled):hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(72, 52, 31, 0.12);
          }

          :where(.ghost-btn, .nav-btn, .btn-cancel):not(:disabled):hover {
            background: var(--ui-surface-hover);
          }

          :where(.primary-btn, .ghost-btn, .nav-btn, .btn-primary, .btn-cancel, .settings-icon-btn):focus-visible {
            outline: none;
            box-shadow: var(--ui-focus-ring);
          }

          :where(.primary-btn, .ghost-btn, .nav-btn, .btn-primary, .btn-cancel):disabled {
            cursor: not-allowed;
            opacity: 0.52;
            transform: none;
            box-shadow: none;
          }

          .compact-btn {
            min-height: var(--ui-control-height-compact) !important;
            padding: 0 11px !important;
            border-radius: 10px !important;
            font-size: 13px !important;
          }

          .settings-icon-btn,
          .toolbar-history-btn,
          .toolbar-collapse-toggle {
            border-radius: var(--ui-icon-radius);
          }

          .settings-icon-btn {
            width: 34px;
            height: 34px;
          }

          /* Tabs share the same active and hover treatment. */
          .meal-tabs,
          .record-tabs {
            padding: 4px;
            border: 1px solid rgba(156, 107, 47, 0.14);
            border-radius: var(--ui-control-radius);
            background: rgba(255, 255, 255, 0.5);
          }

          .meal-tabs .ghost-btn,
          .record-tabs .ghost-btn {
            border-color: transparent;
            background: transparent;
            box-shadow: none;
          }

          .meal-tabs .active,
          .record-tabs .active,
          .settings-view-option.active {
            background: var(--ui-accent);
            color: #fff;
            border-color: var(--ui-accent);
          }

          /* Page cards and sections use a consistent radius scale. */
          .home-card,
          .clock-card,
          .meal-card,
          .records-card,
          .toolbar-card,
          .calendar-card,
          .modal,
          .auth-card {
            border-radius: var(--ui-page-radius);
          }

          .records-section,
          .overtime-request-panel,
          .form-section {
            border-radius: var(--ui-section-radius);
            border-color: rgba(156, 107, 47, 0.16);
            background: rgba(255, 253, 248, 0.86);
          }

          /* Modal layout and attendance editor. */
          .modal {
            overflow: hidden;
          }

          .modal-header {
            min-height: 42px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(156, 107, 47, 0.12);
          }

          .modal-body {
            padding: 2px;
          }

          .modal-footer {
            padding-top: 14px;
            border-top: 1px solid rgba(156, 107, 47, 0.12);
          }

          .attendance-edit-modal {
            width: min(560px, 100%);
          }

          .attendance-edit-modal .form-grid {
            gap: 14px;
          }

          .attendance-edit-modal .form-row label {
            font-size: 13px;
            font-weight: 700;
          }

          .attendance-edit-modal textarea {
            min-height: 96px;
          }

          /* Shared table shell, header, row and cell rhythm. */
          .records-table-wrap,
          .meal-settings-table-wrap {
            border: 1px solid var(--ui-border);
            border-radius: var(--ui-table-radius);
            background: var(--ui-surface-raised);
            overflow: auto;
          }

          .records-table,
          .meal-settings-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
          }

          .records-table th,
          .meal-settings-table th {
            min-height: 42px;
            padding: 11px 12px;
            background: var(--ui-surface-muted);
            color: var(--ui-muted);
            border-bottom: 1px solid var(--ui-border);
            font-size: 13px;
            font-weight: 800;
            vertical-align: middle;
          }

          .records-table td,
          .meal-settings-table td {
            min-height: 44px;
            padding: 10px 12px;
            background: var(--ui-surface-raised);
            border-bottom: 1px solid #ece5da;
            vertical-align: middle;
          }

          .records-table tbody tr:last-child td,
          .meal-settings-table tbody tr:last-child td {
            border-bottom: 0;
          }

          .records-table tbody tr:hover td,
          .meal-settings-table tbody tr:hover td {
            background: var(--ui-row-hover);
          }

          .records-table th:first-child,
          .meal-settings-table th:first-child {
            border-top-left-radius: calc(var(--ui-table-radius) - 1px);
          }

          .records-table th:last-child,
          .meal-settings-table th:last-child {
            border-top-right-radius: calc(var(--ui-table-radius) - 1px);
          }

          .meal-order-table {
            border-spacing: 0 8px;
          }

          .meal-order-table td {
            min-height: 48px;
            background: var(--ui-surface-raised);
          }

          .meal-order-table td:first-child {
            border-radius: var(--ui-control-radius) 0 0 var(--ui-control-radius);
          }

          .meal-order-table td:last-child {
            border-radius: 0 var(--ui-control-radius) var(--ui-control-radius) 0;
          }

          .settings-table-head,
          .member-table-head,
          .department-settings-head {
            border-radius: var(--ui-table-radius) var(--ui-table-radius) 0 0;
            background: var(--ui-surface-muted);
          }

          .member-table-wrap,
          .settings-table-wrap,
          .department-settings-table-wrap {
            border-radius: var(--ui-table-radius);
          }

          .member-table-scroll,
          .settings-table-scroll {
            border-radius: calc(var(--ui-table-radius) - 1px);
          }

          .readonly-pill,
          .schedule-dept-option,
          .requirement-row,
          .settings-item,
          .member-item {
            border-radius: var(--ui-control-radius);
          }

          @media (max-width: 640px) {
            :root {
              --ui-control-height: 42px;
            }

            .form-grid,
            .two-col,
            .attendance-edit-modal .form-grid {
              grid-template-columns: 1fr;
            }

            .attendance-edit-modal {
              width: 100%;
            }

            .modal-overlay,
            .auth-overlay {
              padding: 12px;
            }

            .modal {
              max-height: calc(100vh - 24px);
              padding: 16px;
            }
          }
          '''

          for path in [Path('src/renderer/ui-system.css'), Path('docs/ui-system.css')]:
              path.write_text(css, encoding='utf-8-sig')

          old_links = '  <link rel="stylesheet" href="./styles.css?v=20260707v6">\n  <link rel="stylesheet" href="./v2-schedule-nav.css?v=20260708v5">'
          new_links = old_links + '\n  <link rel="stylesheet" href="./ui-system.css?v=20260709v1">'
          for path in [Path('src/renderer/index.html'), Path('docs/index.html')]:
              text = path.read_text(encoding='utf-8-sig')
              if old_links not in text:
                  raise SystemExit(f'Expected stylesheet links not found in {path}')
              path.write_text(text.replace(old_links, new_links, 1), encoding='utf-8-sig')

          old_modal = '''  openEntityListModal({
              title: "編輯打卡",
              hideFooterClose: true,'''
          new_modal = '''  openEntityListModal({
              title: "編輯打卡",
              modalClass: "modal modal-form-compact attendance-edit-modal",
              hideFooterClose: true,'''
          for path in [Path('src/renderer/renderer.js'), Path('docs/renderer.js')]:
              text = path.read_text(encoding='utf-8-sig')
              if old_modal not in text:
                  raise SystemExit(f'Expected attendance edit modal not found in {path}')
              path.write_text(text.replace(old_modal, new_modal, 1), encoding='utf-8-sig')

          for path in [Path('src/renderer/index.html'), Path('docs/index.html')]:
              text = path.read_text(encoding='utf-8-sig')
              text = text.replace('./renderer.js?v=20260708v2', './renderer.js?v=20260709v1', 1)
              path.write_text(text, encoding='utf-8-sig')

          Path('.github/workflows/add-unified-ui-system.yml').unlink()
          PY

      - name: Validate assets
        shell: bash
        run: |
          set -euo pipefail
          node --check src/renderer/renderer.js
          node --check docs/renderer.js
          python3 - <<'PY'
          from pathlib import Path
          for name in ['src/renderer/ui-system.css', 'docs/ui-system.css']:
              text = Path(name).read_text(encoding='utf-8-sig')
              if text.count('{') != text.count('}'):
                  raise SystemExit(f'Unbalanced CSS braces: {name}')
              required = ['--ui-control-height', '.attendance-edit-modal', '.records-table-wrap']
              missing = [value for value in required if value not in text]
              if missing:
                  raise SystemExit(f'Missing CSS rules in {name}: {missing}')
          PY

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Unify form table button and modal styles'
          git push
