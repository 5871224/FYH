name: Audit README merge once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-readme-merge-once.yml'
      - 'scripts/audit_readme_merge_once.py'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Generate audit
        run: python scripts/audit_readme_merge_once.py
      - name: Commit audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add readme_merge_audit.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "產生 README 整併盤點"
          git push
