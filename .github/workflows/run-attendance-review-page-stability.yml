name: Run attendance review and page stability update

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply-update:
    if: github.event.pull_request.head.ref == 'attendance-review-page-stability'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: attendance-review-page-stability
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply attendance review and stability changes
        run: |
          base64 -d scripts/attendance-review-page-stability.py.gz.b64 | gzip -d | python -
          rm -f scripts/attendance-review-page-stability.py.gz.b64
          rm -f .github/workflows/run-attendance-review-page-stability.yml
          npm run web:publish
          npm test
          npm run ci:check
          npm run web:check
          node scripts/check-normalized-storage.js
          node scripts/check-expansion-acceptance.js
          node scripts/check-settings-lists.js
          npm run renderer:check
          npm run css:architecture
          npm run js:architecture
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "優化簽到審核並修正頁面狀態穩定性"
          git push origin HEAD:attendance-review-page-stability
