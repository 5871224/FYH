name: Temp update spec v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-spec:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Update specification
        shell: bash
        run: python3 scripts/temp-update-spec.py
      - name: Remove temporary files before verification
        shell: bash
        run: rm -f scripts/temp-update-spec.py .github/workflows/temp-update-spec-v2.yml .github/workflows/temp-update-spec-permission-menu.yml
      - name: Verify repository
        shell: bash
        run: npm run ci:check
      - name: Commit specification update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "更新功能選單與匯出權限規格"
          git push origin HEAD:main
