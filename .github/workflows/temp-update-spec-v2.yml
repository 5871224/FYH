name: Temp update spec v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-spec:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Update specification
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('規格書.md')
          text = p.read_text(encoding='utf-8')

          def one(old, new, label):
              global text
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, got {n}')
              text = text.replace(old, new, 1)

          one('''   ├─ 班表
             │  ├─ 群組設定
             │  ├─ 權限設定
             │  ├─ 班表封存
             │  └─ 列印班表
          ''','''   ├─ 班表
             │  ├─ 功能 → 設定
             │  │  ├─ 權限設定
             │  │  ├─ 群組設定
             │  │  ├─ 週期設定
             │  │  └─ 班表封存
             │  ├─ 功能 → 排班
             │  │  ├─ 排班條件
             │  │  ├─ 自動排班預覽
             │  │  ├─ 自動補班預覽
             │  │  ├─ 套用預覽
             │  │  └─ 取消預覽
             │  └─ 功能 → 匯出
             │     ├─ 列印班表
             │     ├─ 匯出上班日
             │     ├─ 匯出休例假
             │     ├─ 匯出請假
             │     └─ 匯出加班
          ''','main navigation')

          one('| `export` | 匯出 | 使用正式匯出功能；匯出資料列仍須受後端可存取群組與領域規則限制，不因具有 `export` 而取得全公司所有群組資料 |',
              '| `export` | 匯出 | 控制班表頁「功能 → 匯出」整個分類，包括列印班表、匯出上班日、匯出休例假、匯出請假與匯出加班；匯出資料列仍須受後端可存取群組與領域規則限制，不因具有 `export` 而取得全公司所有群組資料 |',
              'export definition')

          one('4. 共用 `export` 只打開匯出能力；實際匯出資料仍由後端依可存取群組與領域條件篩選。',
              '4. 共用 `export` 只打開班表頁「功能 → 匯出」分類（含列印班表及四項正式匯出）；不得因 `schedule_manage`、`settings`、`attendance_review` 或其他權限自動取得此分類。實際匯出資料仍由後端依可存取群組與領域條件篩選。',
              'export scope')

          s = text.index('## 6.3 功能選單')
          e = text.index('### 6.3.1 排班條件', s)
          section = '''## 6.3 功能選單

班表頁「功能」選單必須直接由正式權限模型產生分類與項目，不得先建立完整選單後再以 `display:none`、`hidden` 或其他補丁式方式修正可見性，也不得以 `prepend`、`appendChild`、`MutationObserver`、載入後掃描 DOM 或相容層 fallback 動態補上、搬移或隱藏權限項目。

正式分類與權限對應如下：

| 分類 | 建立條件 | 固定項目 |
|---|---|---|
| 設定 | 共用 `settings` | 權限設定、群組設定、週期設定、班表封存 |
| 排班 | 目前群組 `schedule_manage` | 排班條件、自動排班預覽、自動補班預覽、套用預覽、取消預覽 |
| 匯出 | 共用 `export` | 列印班表、匯出上班日、匯出休例假、匯出請假、匯出加班 |

權限與選單規則：

1. 沒有該分類所需權限時，該分類與其項目不得建立；不得先建立再隱藏。
2. `schedule_manage` 只建立「排班」分類，不得因此出現「匯出」或「設定」。
3. 共用 `export` 只建立「匯出」分類，不得因此出現「設定」或「排班」。
4. 共用 `settings` 只建立「設定」分類，不得因此取得班表管理或匯出能力。
5. `attendance_review`、`meal_admin`、`department_settings` 不建立班表頁「功能」選單分類；它們只控制各自正式頁面／入口。
6. 權限變更、重新登入、切換群組或重新整理後，選單必須由同一份 canonical 權限狀態重新渲染，不能依賴上一次 DOM 狀態。
7. 新增功能若歸入「設定」、「排班」或「匯出」，必須直接加入對應 canonical 選單模型並接受該分類權限控制；禁止另寫相容程式在渲染完成後插入按鈕。

「列印班表」規則：

1. 「列印班表」固定位於「功能 → 匯出」子選單，使用共用 `export` 權限；不要求 `schedule_manage`，也不得因只有 `schedule_manage` 而顯示。使用者仍須能以 `schedule_view` 進入目前群組班表，列印範圍只限目前可查看群組。
2. 點擊「列印班表」後先開啟日期區間視窗，欄位為開始日期、結束日期；預設帶入目前班表顯示的八週起訖日期。
3. 日期確認後才進入列印預覽；選定範圍若超出目前已載入八週，前端必須透過正式班表讀取 API 按需載入該日期區間，不得只列印目前記憶體已有格子。
4. 預覽與實際列印沿用目前班表「人員檢視」的表格結構與格內容；左側欄位固定依序為「單位、姓名」，同單位人員以單位欄合併顯示；班別、假別、加班文字與顏色以及單位、人員排序均沿用班表既有規則。
5. 預覽與實際列印紙張尺寸固定為 A4（直式 210×297mm、橫式 297×210mm），提供「自動、直式、橫式」；自動模式 14 日以內採直式，超過 14 日採橫式。直式每頁最多 14 個日期欄，橫式每頁最多 31 個日期欄；列印版面採緊湊邊界與列高，在維持班表格內容可辨識的前提下提高每頁可列印人數；日期或人員超出可列印範圍時由程式拆頁。
6. 人員跨頁時每頁都重新顯示「單位、姓名」與日期表頭；同一單位被切到下一頁時，下一頁必須再次顯示單位名稱。
7. 列印預覽不顯示班表的新增、編輯、拖曳、復原、篩選或其他操作元件；實際列印保留班別等背景顏色。列印紙張本體不額外顯示系統頁首、頁尾、群組標題、日期區間或頁碼，以保留最大班表空間。
8. 列印範圍只使用目前群組、選定日期區間內有效的人員與單位，並沿用目前班表的單位篩選範圍。

'''
          text = text[:s] + section + text[e:]

          one('| 班表等正式匯出 | 共用 `export` | 資料列仍依後端可存取群組與領域條件限制 |',
              '| 班表正式匯出（含列印班表） | 共用 `export` | 「功能 → 匯出」整個分類；資料列仍依後端可存取群組與領域條件限制 |',
              'permission matrix')

          one('- 班表頁「功能 → 列印班表」必須先顯示日期區間，預設帶入目前八週；只有目前群組 `schedule_manage` 可使用。',
              '- 班表頁「功能 → 匯出 → 列印班表」必須先顯示日期區間，預設帶入目前八週；使用共用 `export` 權限，不得由 `schedule_manage` 自動取得。',
              'acceptance print rule')

          marker = '6. Chrome 式頁籤固定單行，不足寬度時只讓頁籤列水平捲動。'
          one(marker,
              marker + '\n7. 權限驅動的選單與按鈕必須由 canonical 權限模型直接渲染；不得以 DOM 掃描、載入後插入／搬移、`MutationObserver`、CSS 可見性補丁或相容層覆寫來修正權限介面。',
              'no patch UI rule')

          p.write_text(text, encoding='utf-8')
          PY
      - name: Remove temporary workflows before verification
        run: rm -f .github/workflows/temp-update-spec-v2.yml .github/workflows/temp-update-spec-permission-menu.yml
      - name: Verify repository
        run: npm run ci:check
      - name: Commit specification update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "更新功能選單與匯出權限規格"
          git push origin HEAD:main
