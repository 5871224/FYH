name: Run personal record scroll preservation update

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply-update:
    if: github.event.pull_request.head.ref == 'personal-record-scroll-preservation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: personal-record-scroll-preservation
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply personal record scroll preservation
        run: |
          base64 -d scripts/personal-record-scroll-preservation.py.gz.b64 | gzip -d | python -
          rm -f scripts/personal-record-scroll-preservation.py.gz.b64
          rm -f .github/workflows/run-personal-record-scroll-preservation.yml
          npm run web:publish
          npm test
          npm run ci:check
          npm run web:check
          node scripts/check-normalized-storage.js
          node scripts/check-expansion-acceptance.js
          node scripts/check-settings-lists.js
          npm run renderer:check
          npm run css:architecture
          npm run js:architecture
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "保留個人記錄輸入後的捲動位置並更新規格"
          git push origin HEAD:personal-record-scroll-preservation
