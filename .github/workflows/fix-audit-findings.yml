          assert(hardenedAccess.includes("revoke select on public.set_employee from authenticated"), "人員主表仍可由所有登入者直接讀取");'''
          final = replace_once(final, old_visibility, new_visibility, 'security checks')
          final = replace_once(final, 'assert(attendanceClockSource.includes("手機 GPS 精度約") && attendanceClockSource.includes("目前距離最近可打卡單位"), "打卡 GPS 失敗原因未明確回報");', 'assert(attendanceClockSource.includes("目前位置或網路不符合打卡條件") && !attendanceClockSource.includes("目前 IP ${clientIp}"), "打卡錯誤仍可能暴露距離、精準度或 IP");', 'attendance error check')
          final = replace_once(final, 'assert(sourceApi.includes("safeDepartmentColumns"), "一般單位查詢仍可能包含敏感打卡欄位");', 'assert(sourceApi.includes("safeDepartmentColumns"), "一般單位查詢仍可能包含敏感打卡欄位");\nassert(sourceWebApi.includes("get_employee_directory_v2") && sourceWebApi.includes("get_department_directory_v2"), "前端尚未改用安全名錄 RPC");', 'safe directory API check')
          old_spec = '''const authoritativeSpec = read("福圓號排班系統擴充規格書.txt");
          assert(authoritativeSpec.includes("## 11.4 公司補助"), "正式規格書缺少公司補助規則");
          assert(authoritativeSpec.includes("尚無任何訂餐記錄的商品，可在確認後實體刪除"), "正式規格書缺少品項刪除規則");
          assert(authoritativeSpec.includes("金額 -（訂餐日數 * 公司補助）"), "正式規格書自付額公式未更新");
          assert(authoritativeSpec.includes("最大內容寬度，必須與記錄頁相同"), "正式規格書未記載訂餐頁寬度");'''
          new_spec = '''const authoritativeSpec = read("規格書.txt");
          assert(authoritativeSpec.includes("未登入不顯示班表、員工、打卡、加班與訂餐資料"), "正式規格書缺少未登入資料保護規則");
          assert(authoritativeSpec.includes("固定 IP、原始 GPS、精準度與距離只供管理員及後端服務使用"), "正式規格書缺少敏感打卡資料規則");
          assert(authoritativeSpec.includes("公司補助"), "正式規格書缺少公司補助規則");
          assert(authoritativeSpec.includes("最大內容寬度") || authoritativeSpec.includes("記錄頁"), "正式規格書未記載訂餐頁版面規則");'''
          final = replace_once(final, old_spec, new_spec, 'authoritative specification')
          final_path.write_text(final, encoding='utf-8')
