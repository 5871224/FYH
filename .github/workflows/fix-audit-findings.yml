          drop policy if exists managers_can_manage_departments on public.set_departments;
          drop policy if exists managers_can_manage_set_departments on public.set_departments;
          drop policy if exists managers_can_manage_profiles on public.set_employee;
          drop policy if exists managers_can_manage_set_employee on public.set_employee;
          drop policy if exists managers_can_manage_shift_types on public.set_shift;
          drop policy if exists managers_can_manage_set_shift on public.set_shift;
          drop policy if exists managers_can_manage_leave_types on public.set_leave;
          drop policy if exists managers_can_manage_set_leave on public.set_leave;
          drop policy if exists managers_can_manage_overtime_types on public.set_overtime;
          drop policy if exists managers_can_manage_set_overtime on public.set_overtime;
          drop policy if exists managers_can_manage_holidays on public.holidays;
          drop policy if exists managers_can_manage_schedule_entries on public.schedule_entries;

          revoke select on public.scheduler_settings from anon;
          revoke select on public.set_departments from anon;
          revoke select on public.set_employee from anon;
          revoke select on public.set_shift from anon;
          revoke select on public.set_leave from anon;
          revoke select on public.set_overtime from anon;
          revoke select on public.holidays from anon;
          revoke select on public.schedule_entries from anon;

          revoke select on public.set_employee from authenticated;
          revoke select on public.set_departments from authenticated;
          grant select (id, employee_code) on public.set_employee to authenticated;
          grant select (id) on public.set_departments to authenticated;

          revoke all on function public.is_admin(uuid) from public, anon;
          revoke all on function public.is_manager(uuid) from public, anon;
          revoke all on function public.is_effective_user(uuid) from public, anon;
          grant execute on function public.is_admin(uuid) to authenticated, service_role;
          grant execute on function public.is_manager(uuid) to authenticated, service_role;
          grant execute on function public.is_effective_user(uuid) to authenticated, service_role;

          revoke all on function public.block_direct_employee_profile_delete_v2() from public, anon, authenticated;
          revoke all on function public.protect_admin_member() from public, anon, authenticated;
          revoke all on function public.protect_department_attendance_fields() from public, anon, authenticated;
          revoke all on function public.protect_employee_role_changes() from public, anon, authenticated;
          revoke all on function public.protect_last_effective_admin_v2() from public, anon, authenticated;
          revoke all on function public.rls_auto_enable() from public, anon, authenticated;
          revoke all on function public.set_updated_at() from public, anon, authenticated;
          revoke all on function public.set_schedule_documents_updated_at() from public, anon, authenticated;
          revoke all on function public.is_effective_admin_row(text, boolean, date, date) from public, anon, authenticated;

          alter function public.set_updated_at() set search_path = public, pg_catalog;
          alter function public.set_schedule_documents_updated_at() set search_path = public, pg_catalog;
          alter function public.is_effective_admin_row(text, boolean, date, date) set search_path = public, pg_catalog;

          drop index if exists public.idx_attendance_overtime_active_user_date;
          drop index if exists public.idx_profiles_home_department_id;
          drop index if exists public.idx_set_employee_home_department;
          drop index if exists public.idx_shift_types_applicable_department_id;
          drop index if exists public.idx_schedule_entries_member_date;

          create index if not exists idx_attendance_action_logs_operator_user_id on public.attendance_action_logs(operator_user_id);
          create index if not exists idx_attendance_overtime_created_by_user_id on public.attendance_overtime_requests(created_by_user_id);
          create index if not exists idx_attendance_overtime_deleted_by on public.attendance_overtime_requests(deleted_by);
          create index if not exists idx_attendance_overtime_reviewed_by on public.attendance_overtime_requests(reviewed_by);
          create index if not exists idx_attendance_records_clock_in_department_id on public.attendance_records(clock_in_department_id);
          create index if not exists idx_attendance_records_clock_out_department_id on public.attendance_records(clock_out_department_id);
          create index if not exists idx_meal_orders_clock_location_id on public.meal_orders(clock_location_id);
          create index if not exists idx_meal_orders_department_id on public.meal_orders(department_id);
          create index if not exists idx_meal_orders_product_id on public.meal_orders(product_id);
          create index if not exists idx_meal_settings_updated_by on public.meal_settings(updated_by);
          create index if not exists idx_overtime_review_logs_operator_user_id on public.overtime_review_logs(operator_user_id);
          create index if not exists idx_schedule_entries_shift_type_id on public.schedule_entries(shift_type_id);
          create index if not exists idx_schedule_entries_support_department_id on public.schedule_entries(support_department_id);
          create index if not exists idx_set_departments_attendance_settings_updated_by on public.set_departments(attendance_settings_updated_by);

          commit;
          '''
          Path('supabase/043_harden_private_data_access.sql').write_text(migration, encoding='utf-8')

          order_path = Path('supabase/V2_SQL_ORDER_FINAL.md')
          order = order_path.read_text(encoding='utf-8')
          if '043_harden_private_data_access.sql' not in order:
              order = order.replace('18. `042_fix_transactional_member_account_delete_order.sql`', '18. `042_fix_transactional_member_account_delete_order.sql`\n19. `043_harden_private_data_access.sql`')
              order = order.replace('- `042_fix_transactional_member_account_delete_order.sql` 修正無歷史人員的刪除順序，先刪除 Auth 帳號，再由外鍵連動刪除人員資料，避免觸發直接刪除保護。', '- `042_fix_transactional_member_account_delete_order.sql` 修正無歷史人員的刪除順序，先刪除 Auth 帳號，再由外鍵連動刪除人員資料，避免觸發直接刪除保護。\n- `043_harden_private_data_access.sql` 移除匿名與逾期帳號的資料讀取旁路，並以安全 RPC 提供人員及單位名錄。')
          order_path.write_text(order, encoding='utf-8')

          web_api_path = Path('src/renderer/web-api.js')
          web_api = web_api_path.read_text(encoding='utf-8-sig')
          rpc_tail = '''  async function restRpc(functionName, payload = {}, options = {}) {
            const { auth = false, prefer = "return=representation" } = options;
            return requestJson(
              `/rest/v1/rpc/${functionName}`,
              {
                method: "POST",
                auth,
                headers: {
                  Accept: "application/json",
                  Prefer: prefer
                },
                body: JSON.stringify(payload || {})
              }
            );
          }

          function ensureSignedIn() {'''
          rpc_replacement = '''  async function restRpc(functionName, payload = {}, options = {}) {
            const { auth = false, prefer = "return=representation" } = options;
            return requestJson(
              `/rest/v1/rpc/${functionName}`,
              {
                method: "POST",
                auth,
                headers: {
                  Accept: "application/json",
                  Prefer: prefer
                },
                body: JSON.stringify(payload || {})
              }
            );
          }

          async function getEmployeeDirectoryRows() {
            return await restRpc("get_employee_directory_v2", {}, { auth: true }) || [];
          }

          async function getDepartmentDirectoryRows() {
            return await restRpc("get_department_directory_v2", {}, { auth: true }) || [];
          }

          function ensureSignedIn() {'''
          web_api = replace_once(web_api, rpc_tail, rpc_replacement, 'directory RPC helpers')

          old_profile = '''  async function fetchProfile(userId) {
            const rows = await restSelect("set_employee", {
              select: "*",
              filters: {
                id: `eq.${userId}`
              },
              auth: true
            });
            return rows?.[0] || null;
          }'''
          new_profile = '''  async function fetchProfile(userId) {
            const rows = await getEmployeeDirectoryRows();
            return rows.find((row) => row.id === userId) || null;
          }'''
          web_api = replace_once(web_api, old_profile, new_profile, 'fetchProfile')

          old_fetch_rows = '''  async function fetchRowsById(table) {
            const rows = await restSelect(table, {
              select: "*",
              auth: Boolean(currentSession?.access_token)
            });
            return new Map((rows || [])
              .filter((row) => row.id)
              .map((row) => [row.id, row]));
          }

          async function fetchRowById(table, id) {
            const rowId = String(id || "").trim();
            if (!rowId) {
              return null;
            }
            const rows = await restSelect(table, {
              select: "*",
              filters: {
                id: `eq.${rowId}`
              },
              limit: "1",
              auth: true
            });
            return rows?.[0] || null;
          }'''
          new_fetch_rows = '''  async function fetchRowsById(table) {
            const rows = table === "set_employee"
              ? await getEmployeeDirectoryRows()
              : table === "set_departments"
                ? await getDepartmentDirectoryRows()
                : await restSelect(table, {
                  select: "*",
                  auth: Boolean(currentSession?.access_token)
                });
            return new Map((rows || [])
              .filter((row) => row.id)
              .map((row) => [row.id, row]));
          }

          async function fetchRowById(table, id) {
            const rowId = String(id || "").trim();
            if (!rowId) {
              return null;
            }
            if (table === "set_employee") {
              return (await getEmployeeDirectoryRows()).find((row) => row.id === rowId) || null;
            }
            if (table === "set_departments") {
              return (await getDepartmentDirectoryRows()).find((row) => row.id === rowId) || null;
            }
            const rows = await restSelect(table, {
              select: "*",
              filters: {
                id: `eq.${rowId}`
              },
              limit: "1",
              auth: true
            });
            return rows?.[0] || null;
          }'''
          web_api = replace_once(web_api, old_fetch_rows, new_fetch_rows, 'safe row readers')

          old_load_header = '''      const departmentSelect = hasAdminAccess(currentProfile?.role)
                ? "id,name,start_date,end_date,hidden_from_schedule,address,latitude,longitude,attendance_enabled,sort_order,created_at,updated_at"
                : "id,name,start_date,end_date,hidden_from_schedule,address,latitude,longitude,attendance_enabled,sort_order,created_at,updated_at";
              const ['''
          web_api = replace_once(web_api, old_load_header, '      const [', 'loadState department selector')
          web_api = replace_once(web_api, '        restSelect("set_departments", { select: departmentSelect, order: "sort_order.asc,name.asc", auth }),', '        getDepartmentDirectoryRows(),', 'loadState departments')
          web_api = replace_once(web_api, '        restSelect("set_employee", { select: "*", filters: { is_active: "eq.true" }, order: "employee_code.asc", auth }),', '        getEmployeeDirectoryRows(),', 'loadState employees')

          old_resolve = '''    const rows = await restSelect("set_employee", {
                select: "id,employee_code",
                filters: {
                  employee_code: `eq.${normalizedMemberCode}`
                },
                auth: true
              });
              if (!rows?.length || !rows[0]?.id) {
                throw new Error(`找不到對應的人員資料：${normalizedMemberCode}`);
              }
              return rows[0].id;'''
          new_resolve = '''    const profile = (await getEmployeeDirectoryRows())
                .find((row) => String(row.employee_code || "").trim() === normalizedMemberCode);
              if (!profile?.id) {
                throw new Error(`找不到對應的人員資料：${normalizedMemberCode}`);
              }
              return profile.id;'''
          web_api = replace_once(web_api, old_resolve, new_resolve, 'resolve manager member')

          old_ensure = '''    let rows = await restSelect("set_employee", {
                select: "id,employee_code",
                filters: {
                  employee_code: buildInFilter(members.map((member) => member.code))
                },
                auth: true
              });
              const existingCodes = new Set((rows || []).map((row) => row.employee_code));
              for (const member of members) {
                if (!existingCodes.has(member.code)) {
                  await syncMemberProfile(member, member.code);
                }
              }
              rows = await restSelect("set_employee", {
                select: "*",
                filters: {
                  employee_code: buildInFilter(members.map((member) => member.code))
                },
                auth: true
              });
              return new Map((rows || []).map((row) => [row.employee_code, row]));'''
          new_ensure = '''    let rows = await getEmployeeDirectoryRows();
              const requestedCodes = new Set(members.map((member) => member.code));
              const existingCodes = new Set((rows || []).map((row) => row.employee_code).filter(Boolean));
              for (const member of members) {
                if (!existingCodes.has(member.code)) {
                  await syncMemberProfile(member, member.code);
                }
              }
              rows = await getEmployeeDirectoryRows();
              return new Map((rows || [])
                .filter((row) => requestedCodes.has(row.employee_code))
                .map((row) => [row.employee_code, row]));'''
          web_api = replace_once(web_api, old_ensure, new_ensure, 'ensure member profiles')
          web_api_path.write_text('\ufeff' + web_api, encoding='utf-8')

          clock_path = Path('supabase/functions/attendance-clock/index.ts')
          clock = clock_path.read_text(encoding='utf-8')
          old_clock_error = '''  throw new Error(gpsFailure || (clientIp
              ? `目前 IP ${clientIp} 不在可打卡單位設定內，請改用手機 GPS 或請管理員確認固定 IP`
              : "目前無法取得可用的 GPS 或固定 IP 打卡位置"));'''
          new_clock_error = '''  console.warn("attendance-location-rejected", {
              reason: gpsFailure || "IP_NOT_ALLOWED",
              hasClientIp: Boolean(clientIp)
            });
            throw new Error("目前位置或網路不符合打卡條件，請確認定位權限或洽管理員");'''
          clock = replace_once(clock, old_clock_error, new_clock_error, 'attendance public error')
          clock_path.write_text(clock, encoding='utf-8')

          publish = r'''const fs = require("fs/promises");
          const path = require("path");

          const rootDir = path.resolve(__dirname, "..");
          const sourceDir = path.join(rootDir, "src", "renderer");
          const outputDir = path.join(rootDir, "docs");

          async function listFiles(dir, prefix = "") {
            const entries = await fs.readdir(dir, { withFileTypes: true });
            const files = [];
            for (const entry of entries) {
              const relative = path.join(prefix, entry.name);
              if (entry.isDirectory()) {
                files.push(...await listFiles(path.join(dir, entry.name), relative));
              } else if (entry.isFile()) {
                files.push(relative);
              }
            }
            return files;
          }

          function createVersionTag() {
            const now = new Date();
            return [
              now.getFullYear(),
              String(now.getMonth() + 1).padStart(2, "0"),
              String(now.getDate()).padStart(2, "0"),
              String(now.getHours()).padStart(2, "0"),
              String(now.getMinutes()).padStart(2, "0"),
              String(now.getSeconds()).padStart(2, "0")
            ].join("");
          }

          async function copyRendererFiles() {
            const files = await listFiles(sourceDir);
            await Promise.all(files.map(async (relative) => {
              const destination = path.join(outputDir, relative);
              await fs.mkdir(path.dirname(destination), { recursive: true });
              await fs.copyFile(path.join(sourceDir, relative), destination);
            }));
            return files;
          }

          async function rewriteIndexCacheBusters() {
            const version = createVersionTag();
            const indexPath = path.join(outputDir, "index.html");
            let html = await fs.readFile(indexPath, "utf8");
            html = html.replace(/(\.\/[A-Za-z0-9_./-]+\.(?:css|js))(?:\?v=[^"'\s>]+)?/g, `$1?v=${version}`);
            await fs.writeFile(indexPath, html, "utf8");
          }

          async function main() {
            await fs.mkdir(outputDir, { recursive: true });
            const files = await copyRendererFiles();
            await rewriteIndexCacheBusters();
            await fs.writeFile(path.join(outputDir, ".nojekyll"), "");
            await fs.writeFile(path.join(outputDir, "README.txt"), "Static deploy output for GitHub Pages or FTP.\n\nUpload all files in this folder to your web root.\n", "utf8");
            console.log(`static web published to ${outputDir} (${files.length} renderer files)`);
          }

          main().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          '''
          Path('scripts/publish-static-web.js').write_text(publish, encoding='utf-8')

          public_check = r'''const fs = require("fs");
          const path = require("path");
          const vm = require("vm");

          function loadPublicConfig() {
            const filePath = path.resolve(__dirname, "..", "src", "renderer", "app-config.js");
            const code = fs.readFileSync(filePath, "utf8");
            const sandbox = { window: {} };
            vm.runInNewContext(code, sandbox);
            return sandbox.window.SCHEDULER_CONFIG || {};
          }

          async function request(baseUrl, anonKey, pathname) {
            return fetch(`${baseUrl}${pathname}`, {
              headers: {
                apikey: anonKey,
                Authorization: `Bearer ${anonKey}`,
                Accept: "application/json"
              }
            });
          }

          async function assertNoAnonymousRows(baseUrl, anonKey, table) {
            const response = await request(baseUrl, anonKey, `/rest/v1/${table}?select=id&limit=1`);
            if (!response.ok) return;
            const rows = await response.json();
            if (Array.isArray(rows) && rows.length === 0) return;
            throw new Error(`匿名使用者仍可讀取 ${table}`);
          }

          async function main() {
            const config = loadPublicConfig();
            if (!config.supabaseUrl || !config.supabaseAnonKey) {
              throw new Error("app-config.js 缺少 supabaseUrl 或 supabaseAnonKey");
            }
            const baseUrl = String(config.supabaseUrl).replace(/\/+$/, "");
            const settings = await request(baseUrl, config.supabaseAnonKey, "/auth/v1/settings");
            if (!settings.ok) throw new Error(await settings.text() || `HTTP ${settings.status}`);
            for (const table of [
              "set_employee",
              "set_departments",
              "set_shift",
              "set_leave",
              "set_overtime",
              "holidays",
              "schedule_entries",
              "scheduler_settings"
            ]) {
              await assertNoAnonymousRows(baseUrl, config.supabaseAnonKey, table);
            }
            console.log("supabase auth config and anonymous access checks ok");
          }

          main().catch((error) => {
            console.error(error.message);
            process.exitCode = 1;
          });
          '''
          Path('scripts/check-public-supabase.js').write_text(public_check, encoding='utf-8')

