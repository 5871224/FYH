name: Apply audit fixes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-audit-findings.yml
      - scripts/apply-audit-fixes.py

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Apply code fixes
        run: python scripts/apply-audit-fixes.py
      - name: Publish source to docs
        run: npm run web:publish
      - name: Validate JavaScript and specifications
        run: |
          node --check src/renderer/web-api.js
          node --check src/renderer/renderer.js
          node --check scripts/publish-static-web.js
          node --check scripts/check-public-supabase.js
          node scripts/check-v2-alignment.js
          node scripts/check-v2-final.js
          npm run web:check
      - name: Commit fixes and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-audit-findings.yml scripts/apply-audit-fixes.py
          git add -A
          git commit -m "Harden data access and deployment checks"
          git push
