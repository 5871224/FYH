name: Finalize Desktop Week Scroll Distance

on:
  push:
    branches:
      - fix/desktop-week-scroll-distance-20260809

permissions:
  contents: write

concurrency:
  group: finalize-desktop-week-scroll-distance
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/desktop-week-scroll-distance-20260809
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Rebuild web artifacts
        run: npm run web:publish
      - name: Remove temporary workflow before validation
        run: rm -f .github/workflows/finalize-desktop-week-scroll-distance.yml
      - name: Run complete validation
        run: npm run ci:check
      - name: Commit finalized change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "完成電腦版班表週捲動距離修正"
          git push origin HEAD:fix/desktop-week-scroll-distance-20260809
