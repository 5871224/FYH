name: Temp verify member form order

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-verify-member-form-order.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Verify and remove temporary workflow
        shell: bash
        run: |
          npm run ci:check
          rm .github/workflows/temp-verify-member-form-order.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "完成修改人員欄位順序驗證"
          git push origin HEAD:main
