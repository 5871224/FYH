name: Update spec after removing legacy tables

on:
  push:
    paths:
      - '.github/workflows/update-spec-remove-legacy-tables.yml'

permissions:
  contents: write

jobs:
  update-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update specification and SQL order
        shell: python
        run: |
          from pathlib import Path

          spec_path = Path('規格書.txt')
          spec = spec_path.read_text(encoding='utf-8')

          old_common = "13. `attendance_logs` 與 `clock_locations` 為資料庫中仍存在的早期模型；目前正式頁面流程以 `attendance_records` 與 `set_departments` 打卡設定為準。"
          new_common = "13. 舊的 `attendance_logs` 與 `clock_locations` 已於 2026-07-08 移除；正式打卡流程只使用 `attendance_records` 與 `set_departments` 的打卡設定。"
          if old_common not in spec:
              raise SystemExit('common database paragraph not found')
          spec = spec.replace(old_common, new_common, 1)

          old_column = "- `clock_location_id`：早期打卡地點關聯，相容保留。"
          new_column = "- `clock_location_id`：訂餐所依據的上班打卡單位識別；欄名為相容命名，目前外鍵指向 `set_departments.id`。"
          if old_column not in spec:
              raise SystemExit('meal clock_location_id paragraph not found')
          spec = spec.replace(old_column, new_column, 1)

          legacy_start = "### 5.7.16 `attendance_logs`－早期單筆打卡模型"
          next_section = "## 5.8 稽核、驗收與發佈"
          start = spec.find(legacy_start)
          end = spec.find(next_section, start)
          if start < 0 or end < 0:
              raise SystemExit('legacy table sections not found')
          spec = spec[:start].rstrip() + "\n\n" + spec[end:]
          spec_path.write_text(spec, encoding='utf-8')

          final_path = Path('supabase/V2_SQL_ORDER_FINAL.md')
          final = final_path.read_text(encoding='utf-8')
          if '039_remove_legacy_attendance_tables.sql' not in final:
              final = final.replace(
                  '15. `038_v2_employee_sort_order.sql`',
                  '15. `038_v2_employee_sort_order.sql`\n16. `039_remove_legacy_attendance_tables.sql`'
              )
              final = final.replace(
                  '- `038_v2_employee_sort_order.sql` 新增人員排序欄位。',
                  '- `038_v2_employee_sort_order.sql` 新增人員排序欄位。\n- `039_remove_legacy_attendance_tables.sql` 移除未使用且無資料的 `attendance_logs`、`clock_locations`。'
              )
          final_path.write_text(final, encoding='utf-8')

          order_path = Path('supabase/V2_SQL_ORDER.md')
          order = order_path.read_text(encoding='utf-8')
          order = order.replace(
              'through `038_v2_employee_sort_order.sql`',
              'through `039_remove_legacy_attendance_tables.sql`'
          )
          order_path.write_text(order, encoding='utf-8')

          workflow = Path('.github/workflows/update-spec-remove-legacy-tables.yml')
          workflow.unlink()
      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '規格書.txt' 'supabase/V2_SQL_ORDER_FINAL.md' 'supabase/V2_SQL_ORDER.md' '.github/workflows/update-spec-remove-legacy-tables.yml'
          git commit -m 'Update specification after removing legacy attendance tables'
          git push
