name: Complete Professional Specification

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  update-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          show-progress: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Complete specification
        id: complete
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/complete-professional-spec-once.py")
          text = path.read_text(encoding="utf-8")
          old = 'spec = replace_once(spec, old_tree, new_tree, "文件樹狀目錄")'
          new = '''import re
          spec, tree_count = re.subn(
              r"└─ 第七章　後端架構與平台遷移.*?└─ 7\\.8 驗收與切換原則",
              new_tree,
              spec,
              count=1,
              flags=re.S,
          )
          if tree_count != 1:
              raise RuntimeError("找不到替換位置：文件樹狀目錄")'''
          if old not in text:
              raise RuntimeError("找不到規格目錄更新程式")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          set +e
          python3 scripts/complete-professional-spec-once.py > professional-spec-update.log 2>&1
          status=$?
          cat professional-spec-update.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload update report
        uses: actions/upload-artifact@v4
        with:
          name: professional-spec-update
          path: professional-spec-update.log

      - name: Stop on update failure
        if: steps.complete.outputs.status != '0'
        run: exit 1

      - name: Remove one-time files
        run: |
          rm -f scripts/complete-professional-spec-once.py
          rm -f .github/workflows/complete-professional-spec-once.yml

      - name: Validate documentation and repository
        run: |
          node scripts/check-normalized-storage.js
          node scripts/check-expansion-acceptance.js
          node scripts/check-settings-lists.js
          npm run v2:check

      - name: Commit completed specification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "補齊共通互動 API 維運與測試規格"
          git push origin HEAD:${{ github.head_ref }}
