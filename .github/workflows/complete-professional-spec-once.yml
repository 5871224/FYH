name: Complete Professional Specification

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  update-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          show-progress: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Complete specification
        id: complete
        shell: bash
        run: |
          set +e
          python3 scripts/complete-professional-spec-once.py > professional-spec-update.log 2>&1
          status=$?
          cat professional-spec-update.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload update report
        uses: actions/upload-artifact@v4
        with:
          name: professional-spec-update
          path: professional-spec-update.log

      - name: Stop on update failure
        if: steps.complete.outputs.status != '0'
        run: exit 1

      - name: Remove one-time files
        run: |
          rm -f scripts/complete-professional-spec-once.py
          rm -f .github/workflows/complete-professional-spec-once.yml

      - name: Validate documentation and repository
        run: |
          node scripts/check-normalized-storage.js
          node scripts/check-expansion-acceptance.js
          node scripts/check-settings-lists.js
          npm run v2:check

      - name: Commit completed specification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "補齊共通互動 API 維運與測試規格"
          git push origin HEAD:${{ github.head_ref }}
