name: One-shot restore overtime export format

on:
  push:
    branches:
      - main
    paths:
      - .github/restore-overtime-export-trigger.txt

permissions:
  contents: write

jobs:
  restore-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore overtime export format
        run: python .github/restore-overtime-export-format.py
      - name: Remove one-shot files
        run: |
          rm -f .github/workflows/one-shot-restore-overtime-export-format.yml
          rm -f .github/restore-overtime-export-trigger.txt
          rm -f .github/restore-overtime-export-format.py
      - name: Build and validate
        run: |
          npm run web:publish
          npm test
          npm run ci:check
      - name: Commit changes to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "還原簽到審核加班匯出格式"
          git push origin HEAD:main
