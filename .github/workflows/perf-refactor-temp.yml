name: Performance Refactor Temp

on:
  push:
    branches:
      - perf-optimization-pass-20260808

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Fix temporary script quoting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/perf-refactor-temp.cjs')
          text = path.read_text()
          text = text.replace('new RegExp(`create policy ${name} `)', 'new RegExp("create policy " + name + " ")')
          path.write_text(text)
          PY
      - name: Apply canonical performance refactor
        run: node scripts/perf-refactor-temp.cjs
      - name: Build static web
        run: npm run web:publish
      - name: Run complete CI and preserve diagnostics on failure
        shell: bash
        run: |
          set +e
          npm run ci:check 2>&1 | tee /tmp/perf-ci.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            cp /tmp/perf-ci.log PERF_CI_FAILURE.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add PERF_CI_FAILURE.log
            git commit -m "chore: preserve performance CI diagnostics" || true
            git push origin HEAD:perf-optimization-pass-20260808
            exit "$status"
          fi
      - name: Remove temporary refactor tooling and diagnostics
        shell: bash
        run: |
          rm -f PERF_CI_FAILURE.log
          git rm scripts/perf-refactor-temp.cjs .github/workflows/perf-refactor-temp.yml
      - name: Commit finalized source and generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "整體效能與班表存取優化"
          git push origin HEAD:perf-optimization-pass-20260808
