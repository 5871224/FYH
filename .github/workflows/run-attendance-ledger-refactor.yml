name: Run attendance ledger refactor

on:
  push:
    branches:
      - main
    paths:
      - .github/run-attendance-ledger-refactor-trigger.txt

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: attendance-ledger-refactor
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rewrite attendance system
        run: |
          python scripts/one-shot-attendance-ledger.py
          python - <<'PY'
          from pathlib import Path
          path = Path('src/renderer/web-api.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace('formatTaipeiDateTime(row.clock_in_at)', 'new Date(row.clock_in_at).toLocaleString("zh-TW", { timeZone: "Asia/Taipei", hour12: false })')
          text = text.replace('formatTaipeiDateTime(row.clock_out_at)', 'new Date(row.clock_out_at).toLocaleString("zh-TW", { timeZone: "Asia/Taipei", hour12: false })')
          text = text.replace('requestFunction("attendance-ledger", {\n      action: "review_export",', 'requestFunction("attendance-ledger-export", {')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Build web artifacts
        run: npm run web:publish
      - name: Commit refactor branch
        run: |
          rm -f scripts/one-shot-attendance-ledger.py
          rm -f .github/attendance-ledger-trigger.txt
          rm -f .github/workflows/one-shot-attendance-ledger.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "重構簽到簿與每日審核流程"
          git push origin HEAD:attendance-ledger-refactor
