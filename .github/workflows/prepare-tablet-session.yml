name: Prepare Tablet Session

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/canonical-tablet-session'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: agent/canonical-tablet-session

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Canonicalize tablet session
        run: |
          node scripts/canonicalize-tablet-session.js
          node scripts/update-v2-data-test-for-session.js

      - name: Build published web files
        run: npm run web:publish

      - name: Run complete checks without temporary workflow
        run: |
          set -o pipefail
          cp .github/workflows/prepare-tablet-session.yml /tmp/prepare-tablet-session.yml
          rm .github/workflows/prepare-tablet-session.yml
          npm run ci:check 2>&1 | tee tablet-session-ci.log
          cp /tmp/prepare-tablet-session.yml .github/workflows/prepare-tablet-session.yml

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: tablet-session-ci-log
          path: tablet-session-ci.log
          if-no-files-found: ignore

      - name: Commit canonical tablet session
        run: |
          rm -f scripts/canonicalize-tablet-session.js
          rm -f scripts/update-v2-data-test-for-session.js
          rm -f tablet-session-ci.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "正式化平板 Session 管理"
          git push origin HEAD:agent/canonical-tablet-session
