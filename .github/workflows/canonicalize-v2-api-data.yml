name: Canonicalize V2 API Data

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refactor:
    if: github.head_ref == 'agent/canonicalize-v2-api-data'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Merge V2 data APIs
        run: |
          set -o pipefail
          node scripts/fix-v2-api-data-boundary.js
          node scripts/canonicalize-v2-api-data.js 2>&1 | tee v2-api-data-refactor.log
          node scripts/fix-v2-api-data-test.js
          node scripts/fix-v2-tablet-check.js

      - name: Upload refactor diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: v2-api-data-refactor-log
          path: v2-api-data-refactor.log
          if-no-files-found: ignore

      - name: Build static web
        run: npm run web:publish

      - name: Run complete checks
        run: |
          set -o pipefail
          npm run ci:check 2>&1 | tee v2-api-data-ci.log

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: v2-api-data-ci-log
          path: v2-api-data-ci.log
          if-no-files-found: ignore

      - name: Commit canonical V2 data APIs
        run: |
          rm -f scripts/canonicalize-v2-api-data.js
          rm -f scripts/fix-v2-api-data-boundary.js
          rm -f scripts/fix-v2-api-data-test.js
          rm -f scripts/fix-v2-tablet-check.js
          rm -f .github/workflows/canonicalize-v2-api-data.yml
          rm -f v2-api-data-refactor.log v2-api-data-ci.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "整併 V2 資料與加班 API"
          git push origin HEAD:agent/canonicalize-v2-api-data
