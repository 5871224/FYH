name: Prepare Meal Consolidation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/optimize-meal-patch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: agent/optimize-meal-patch

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Repair preparation script insertion
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/optimize-meal-patch.js')
          text = p.read_text(encoding='utf-8')
          needle = ');\nlet saveMealOrder = extractFunction(patch, "async function saveV2MealOrder()")'
          replacement = ');\nwrite(mealPagePath, mealPage);\nlet saveMealOrder = extractFunction(patch, "async function saveV2MealOrder()")'
          if needle not in text:
              raise SystemExit('找不到訂餐模組寫入位置')
          p.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          PY

      - name: Consolidate meal patch
        run: node scripts/optimize-meal-patch.js

      - name: Update V2 checks for formal meal modules
        run: |
          python - <<'PY'
          from pathlib import Path

          alignment = Path('scripts/check-v2-alignment.js')
          text = alignment.read_text(encoding='utf-8')
          text = text.replace('  "src/renderer/v2-meal.js",\n', '')
          anchor = 'requiredFiles.forEach((file) => assert(exists(file), `Missing V2 file: ${file}`));'
          replacement = anchor + '\nassert(!exists("src/renderer/v2-meal.js"), "Meal UI still depends on a late-loaded patch module");'
          if anchor not in text:
              raise SystemExit('找不到 V2 alignment 檢查位置')
          alignment.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')

          final = Path('scripts/check-v2-final.js')
          text = final.read_text(encoding='utf-8')
          old = 'assert(sourceApp.includes("function isTabletDevice") && sourceApp.includes("installV2MealUi") && sourceApp.includes("installV2RecordsUi"), "JavaScript bundle 缺少必要正式模組");'
          new = 'assert(sourceApp.includes("function isTabletDevice") && sourceApp.includes("function renderMealPage") && sourceApp.includes("function validateMealOrderItems") && sourceApp.includes("installV2RecordsUi") && !sourceApp.includes("installV2MealUi"), "JavaScript bundle 缺少必要正式模組");'
          if old not in text:
              raise SystemExit('找不到 V2 final 訂餐模組檢查位置')
          final.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Build published web files
        run: npm run web:publish

      - name: Run complete checks without temporary workflow
        run: |
          set -o pipefail
          cp .github/workflows/prepare-meal-consolidation.yml /tmp/prepare-meal-consolidation.yml
          rm .github/workflows/prepare-meal-consolidation.yml
          npm run ci:check 2>&1 | tee meal-consolidation-ci.log
          cp /tmp/prepare-meal-consolidation.yml .github/workflows/prepare-meal-consolidation.yml

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: meal-consolidation-ci-log
          path: meal-consolidation-ci.log
          if-no-files-found: ignore

      - name: Commit verified consolidation
        run: |
          rm -f scripts/optimize-meal-patch.js
          rm -f meal-consolidation-ci.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "整合訂餐補丁至正式模組"
          git push origin HEAD:agent/optimize-meal-patch
