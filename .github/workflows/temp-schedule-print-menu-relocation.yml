name: Temporary schedule print menu relocation

on:
  push:
    branches:
      - fix/schedule-print-menu-relocation
    paths:
      - .github/workflows/temp-schedule-print-menu-relocation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/schedule-print-menu-relocation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Relocate schedule print action
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          config_path = Path('src/renderer/app-config.js')
          config = config_path.read_text(encoding='utf-8')
          start_marker = '  function ensureMenuButton() {'
          end_marker = '\n\n  function overlap(item, startDate, endDate) {'
          start = config.find(start_marker)
          end = config.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Rich print ensureMenuButton block not found')
          new = '\n'.join([
              '  function ensureMenuButton() {',
              '    const menu = document.getElementById("coreActionsMenu");',
              '    if (!menu) return;',
              '    let button = document.getElementById(BUTTON_ID);',
              '    if (!button) {',
              '      button = document.createElement("button");',
              '      button.id = BUTTON_ID;',
              '      button.type = "button";',
              '      button.className = "ghost-btn ops-btn";',
              '      button.textContent = "列印班表";',
              '    }',
              '    const exportSubmenu = menu.querySelector(\'.core-actions-submenu[aria-label="匯出"]\');',
              '    if (exportSubmenu && button.parentElement !== exportSubmenu) {',
              '      const overtimeButton = document.getElementById("exportOvertimeButton");',
              '      if (overtimeButton?.parentElement === exportSubmenu) {',
              '        overtimeButton.insertAdjacentElement("beforebegin", button);',
              '      } else {',
              '        exportSubmenu.appendChild(button);',
              '      }',
              '    } else if (!exportSubmenu && !button.isConnected) {',
              '      menu.prepend(button);',
              '    }',
              '    const visible = canPrint();',
              '    button.style.display = visible ? "" : "none";',
              '    button.disabled = !visible;',
              '  }',
          ])
          config_path.write_text(config[:start] + new + config[end:], encoding='utf-8')

          index_path = Path('src/renderer/index.html')
          html = index_path.read_text(encoding='utf-8')
          legacy_marker = 'id="printScheduleButton"'
          legacy_start = html.rfind('                  <button', 0, html.find(legacy_marker) + 1)
          legacy_end = html.find('\n', html.find(legacy_marker))
          if html.count(legacy_marker) != 1 or legacy_start < 0 or legacy_end < 0:
              raise SystemExit(f'Expected one legacy direct-print button, found {html.count(legacy_marker)}')
          html = html[:legacy_start] + html[legacy_end + 1:]

          print_start = html.find('    @media print {\n')
          next_block = '\n    @media (min-width: 981px) {\n      .attendance-review-filters'
          print_end = html.find(next_block, print_start)
          if print_start < 0 or print_end < 0:
              raise SystemExit('Legacy global schedule print CSS block not found')
          html = html[:print_start] + html[print_end + 1:]
          index_path.write_text(html, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Publish static web
        run: npm run web:publish

      - name: Remove temporary workflow before validation
        run: rm .github/workflows/temp-schedule-print-menu-relocation.yml

      - name: Validate
        run: npm run ci:check

      - name: Commit result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "移動班表列印到匯出選單"
          git push origin HEAD:fix/schedule-print-menu-relocation
