name: Refine meal page title and product column

on:
  push:
    paths:
      - '.github/workflows/refine-meal-title-and-product-column.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update meal page title and table layout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          for path in [Path('src/renderer/renderer.js'), Path('docs/renderer.js')]:
              text = path.read_text(encoding='utf-8-sig')
              old = '<p class="home-eyebrow">今日訂餐</p>'
              new = '<p class="home-eyebrow">訂餐</p>'
              if old not in text:
                  raise SystemExit(f'Meal page eyebrow not found in {path}')
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8-sig')

          css = r'''

          /* Meal order table: keep the product column compact and preserve left breathing room. */
          .meal-order-table th:first-child,
          .meal-order-table td:first-child {
            width: clamp(150px, 22%, 220px);
            padding-left: 14px;
          }

          .meal-order-table th:last-child,
          .meal-order-table td:last-child {
            width: auto;
          }

          @media (max-width: 640px) {
            .meal-order-table th:first-child,
            .meal-order-table td:first-child {
              width: 150px;
              padding-left: 10px;
            }
          }
          '''

          marker = '/* Meal order table: keep the product column compact and preserve left breathing room. */'
          for path in [Path('src/renderer/ui-system.css'), Path('docs/ui-system.css')]:
              text = path.read_text(encoding='utf-8-sig')
              if marker not in text:
                  text = text.rstrip() + css + '\n'
              path.write_text(text, encoding='utf-8-sig')

          for path in [Path('src/renderer/index.html'), Path('docs/index.html')]:
              text = path.read_text(encoding='utf-8-sig')
              text, renderer_count = re.subn(r'\./renderer\.js\?v=[^"\s]+', './renderer.js?v=20260709v4', text, count=1)
              text, css_count = re.subn(r'\./ui-system\.css\?v=[^"\s]+', './ui-system.css?v=20260709v10', text, count=1)
              if renderer_count != 1 or css_count != 1:
                  raise SystemExit(f'Could not update asset versions in {path}')
              path.write_text(text, encoding='utf-8-sig')

          Path('.github/workflows/refine-meal-title-and-product-column.yml').unlink()
          PY

      - name: Validate files
        shell: bash
        run: |
          set -euo pipefail
          node --check src/renderer/renderer.js
          node --check docs/renderer.js
          python3 - <<'PY'
          from pathlib import Path

          src_js = Path('src/renderer/renderer.js').read_text(encoding='utf-8-sig')
          docs_js = Path('docs/renderer.js').read_text(encoding='utf-8-sig')
          if src_js != docs_js:
              raise SystemExit('Renderer copies differ')
          if '<p class="home-eyebrow">今日訂餐</p>' in src_js:
              raise SystemExit('Old meal page title remains')
          if '<p class="home-eyebrow">訂餐</p>' not in src_js:
              raise SystemExit('New meal page title missing')

          src_css = Path('src/renderer/ui-system.css').read_text(encoding='utf-8-sig')
          docs_css = Path('docs/ui-system.css').read_text(encoding='utf-8-sig')
          if src_css != docs_css:
              raise SystemExit('UI CSS copies differ')
          if src_css.count('{') != src_css.count('}'):
              raise SystemExit('Unbalanced CSS braces')
          for required in ['width: clamp(150px, 22%, 220px);', 'padding-left: 14px;', 'width: 150px;', 'padding-left: 10px;']:
              if required not in src_css:
                  raise SystemExit(f'Missing CSS rule: {required}')
          PY

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refine meal page title and product column'
          git push
