name: Refine export dialogs and meal export

on:
  push:
    paths:
      - '.github/workflows/refine-export-dialogs-and-meal-format.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch dialogs, versions, and specification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          for name in ['src/renderer/v2-live-report-filters.js', 'docs/v2-live-report-filters.js']:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              old = '''    openEntityListModal({
                title: label.title,
                modalClass: "modal modal-wide",
                body: `<div class="form-grid two-col">
                  <div class="form-row"><label for="v2ExportPeriodStart">開始日期</label><input id="v2ExportPeriodStart" type="date" value="${defaults.startDate}"></div>
                  <div class="form-row"><label for="v2ExportPeriodEnd">結束日期</label><input id="v2ExportPeriodEnd" type="date" value="${defaults.endDate}"></div>
                </div>
                <div class="result-item">
                  <div class="result-title">預設期間</div>
                  <div class="result-detail">依週期設定的每月開始日 ${defaults.startDay} 日，預設為今天所在期間的上一期。</div>
                </div>`,
                footerButtons: `<button class="btn-cancel" type="button" data-close-button="true">取消</button><button class="btn-primary" type="button" data-v2-run-period-export="${type}">${label.action}</button>`,
                hideFooterClose: true
              });'''.replace('              ', '')
              new = '''    openEntityListModal({
                title: label.title,
                modalClass: "modal modal-member-form",
                body: `<div class="form-grid">
                  <div class="form-row"><label for="v2ExportPeriodStart">開始日期</label><input id="v2ExportPeriodStart" type="date" value="${defaults.startDate}"></div>
                  <div class="form-row"><label for="v2ExportPeriodEnd">結束日期</label><input id="v2ExportPeriodEnd" type="date" value="${defaults.endDate}"></div>
                </div>`,
                footerButtons: `<button class="btn-cancel" type="button" data-close-button="true">取消</button><button class="btn-primary" type="button" data-v2-run-period-export="${type}">${label.action}</button>`,
                hideFooterClose: true
              });'''.replace('              ', '')
              if old not in text:
                  raise SystemExit(f'export dialog block not found in {name}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          for name in ['src/renderer/index.html', 'docs/index.html']:
              path = Path(name)
              text = path.read_text(encoding='utf-8-sig')
              text = text.replace('./v2-meal-export.js?v=20260707v6', './v2-meal-export.js?v=20260708v1')
              text = text.replace('./v2-live-report-filters.js?v=20260708v2', './v2-live-report-filters.js?v=20260708v3')
              path.write_text(text, encoding='utf-8-sig')

          spec_path = Path('規格書.txt')
          spec = spec_path.read_text(encoding='utf-8')

          old_meal = '''4. 頁面顯示期間總數量與期間總金額。
          5. Excel 工作表：
             - 每日備餐統計：日期、單位、商品、數量、金額。
             - 員工訂餐明細：日期、單位、員工、商品、數量、單價、小計、品項備註。'''.replace('          ', '')
          new_meal = '''4. 頁面顯示期間總數量與期間總金額。
          5. Excel 匯出使用單一「訂餐統計」工作表，每位員工一列。
          6. 匯出欄位依序為：
             - 員工姓名：員工姓名。
             - 員工編號：員工工號。
             - 早餐金額：空白。
             - 午餐金額：依頁面相同公式計算的自付額。
             - 晚餐金額：空白。
             - 早餐份數：空白。
             - 午餐份數：訂餐日數，同一員工同一天不重複計算。
             - 晚餐份數：空白。
             - 總計：空白。
             - 日期：使用訂餐統計查詢條件的結束日期，格式為 `YYYYMMDD`。
          7. 匯出內容依目前日期、單位及員工篩選條件產生。'''.replace('          ', '')
          if old_meal not in spec:
              raise SystemExit('meal export specification block not found')
          spec = spec.replace(old_meal, new_meal, 1)

          old_dialog = '''6. 「匯出休例假」、「匯出請假」及「匯出加班」按下後，先顯示日期範圍選擇視窗，再依選定期間匯出。
          7. 日期範圍視窗包含開始日期、結束日期、取消與對應的匯出按鈕。
          8. 匯出前會重新載入選定期間的正式班表資料，不受目前班表畫面顯示的八週範圍限制。
          9. 匯出檔名包含選定的開始日期與結束日期。'''.replace('          ', '')
          new_dialog = '''6. 「匯出休例假」、「匯出請假」及「匯出加班」按下後，先顯示日期範圍選擇視窗，再依選定期間匯出。
          7. 日期範圍視窗包含開始日期、結束日期、取消與對應的匯出按鈕。
          8. 日期範圍視窗的左右寬度與「自動排班期間」視窗相同。
          9. 日期範圍視窗不顯示預設期間說明框。
          10. 匯出前會重新載入選定期間的正式班表資料，不受目前班表畫面顯示的八週範圍限制。
          11. 匯出檔名包含選定的開始日期與結束日期。'''.replace('          ', '')
          if old_dialog not in spec:
              raise SystemExit('schedule export dialog specification block not found')
          spec = spec.replace(old_dialog, new_dialog, 1)
          spec_path.write_text(spec, encoding='utf-8')

          Path('.github/workflows/refine-export-dialogs-and-meal-format.yml').unlink()
          PY
      - name: Validate JavaScript
        shell: bash
        run: |
          node --check src/renderer/v2-live-report-filters.js
          node --check src/renderer/v2-meal-export.js
          cmp src/renderer/v2-live-report-filters.js docs/v2-live-report-filters.js
          cmp src/renderer/v2-meal-export.js docs/v2-meal-export.js
      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/renderer docs '規格書.txt' '.github/workflows/refine-export-dialogs-and-meal-format.yml'
          git commit -m 'Refine export dialogs and meal statistics workbook'
          git push
