name: Validate specification Markdown once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-spec-md-once.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Confirm renamed specification
        run: |
          test -f 規格書.md
          test ! -e 規格書.txt
          ! grep -R --exclude-dir=.git --exclude='validate-spec-md-once.yml' -n '規格書.txt' .
      - name: Run project checks
        run: |
          node scripts/check-normalized-storage.js
          node scripts/check-expansion-acceptance.js
          npm run v2:check
      - name: Remove one-time workflow
        run: rm -f .github/workflows/validate-spec-md-once.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "驗證規格書 Markdown 改名"
          git push

# 第二次提交用來觸發已存在的工作流程。
