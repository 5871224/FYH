name: Audit Directory RPC Usage

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          show-progress: false
      - name: Build audit report
        shell: bash
        run: |
          {
            echo '=== get_employee_directory_v2 references ==='
            grep -RIn --exclude='app.js' --exclude-dir='docs' 'get_employee_directory_v2\|getEmployeeDirectoryRows' . || true
            echo '=== set_employee direct frontend reads ==='
            grep -RIn --exclude='app.js' --exclude-dir='docs' 'restSelect("set_employee"\|restRpc("get_employee' src/renderer || true
            echo '=== Edge Function employee reads ==='
            grep -RIn 'from("set_employee")\|\.from("set_employee")\|set_employee' supabase/functions | head -n 500 || true
            echo '=== role checks and pages ==='
            grep -RIn --exclude='app.js' --exclude-dir='docs' 'hasManagerAccess\|hasAdminAccess\|currentProfile.*role\|profile.*role\|isManager()\|isAdmin()' src/renderer | head -n 800 || true
            echo '=== schedule member field usage ==='
            grep -RIn --exclude='app.js' --exclude-dir='docs' 'hireDate\|leaveDate\|payByDay\|scheduleShiftIds\|fixedRestWeekday\|monthlyRestDays\|scheduleDepartmentIds\|isActive' src/renderer | head -n 1000 || true
          } | tee audit-directory-usage.txt
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: directory-usage-audit
          path: audit-directory-usage.txt
