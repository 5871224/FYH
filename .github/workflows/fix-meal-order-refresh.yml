name: Fix meal order refresh

on:
  push:
    paths:
      - '.github/workflows/fix-meal-order-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh today meal data when returning from settings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          old = '''    if (target.dataset.mealTab) {
                mealPageTab = ["settings", "stats"].includes(target.dataset.mealTab) ? target.dataset.mealTab : "order";
                if (mealPageTab === "settings") {
                  await loadMealAdminSettings(false);
                } else if (mealPageTab === "stats") {
                  await loadMealReport(false);
                }
                renderAll();
                return;
              }'''

          new = '''    if (target.dataset.mealTab) {
                mealPageTab = ["settings", "stats"].includes(target.dataset.mealTab) ? target.dataset.mealTab : "order";
                if (mealPageTab === "settings") {
                  await loadMealAdminSettings(false);
                } else if (mealPageTab === "stats") {
                  await loadMealReport(false);
                } else {
                  await loadTodayMealOrder();
                }
                renderAll();
                return;
              }'''

          for name in ['src/renderer/renderer.js', 'docs/renderer.js']:
              path = Path(name)
              text = path.read_text(encoding='utf-8-sig')
              if old not in text:
                  raise SystemExit(f'Expected meal tab handler not found in {name}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8-sig')

          for name in ['src/renderer/index.html', 'docs/index.html']:
              path = Path(name)
              text = path.read_text(encoding='utf-8-sig')
              old_version = './renderer.js?v=20260707v6'
              new_version = './renderer.js?v=20260708v1'
              if old_version not in text:
                  raise SystemExit(f'Expected renderer asset version not found in {name}')
              path.write_text(text.replace(old_version, new_version, 1), encoding='utf-8-sig')

          Path('.github/workflows/fix-meal-order-refresh.yml').unlink()
          PY

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check src/renderer/renderer.js
          node --check docs/renderer.js

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/renderer/renderer.js docs/renderer.js src/renderer/index.html docs/index.html '.github/workflows/fix-meal-order-refresh.yml'
          git commit -m 'Refresh today meal data after settings changes'
          git push
