name: Fix spec validation once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-spec-validation-once.yml'
      - 'scripts/fix_spec_validation_once.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Update validation target
        run: python scripts/fix_spec_validation_once.py
      - name: Run checks
        run: |
          node scripts/check-normalized-storage.js
          node scripts/check-expansion-acceptance.js
          npm run v2:check
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "更新正式規格驗證並清除暫存"
          git push
