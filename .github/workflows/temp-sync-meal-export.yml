name: Temporary Sync Meal Export Fix

on:
  push:
    branches:
      - agent/fix-meal-group-exports

permissions:
  contents: write

concurrency:
  group: temp-sync-meal-export-fix
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: agent/fix-meal-group-exports
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Build published web
        run: npm run web:publish

      - name: Run regression and architecture checks
        run: npm run ci:check

      - name: Commit generated web outputs
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/renderer/app.js src/renderer/index.html docs; then
            echo "Generated outputs already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/app.js src/renderer/index.html docs
          git commit -m "同步訂餐與匯出修正發布檔"
          git push origin HEAD:agent/fix-meal-group-exports
