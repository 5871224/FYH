name: Access architecture refactor
on:
  push:
    branches: [refactor/access-architecture-v3]
    paths:
      - .github/workflows/access-architecture-refactor.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply access cleanup
        run: python3 .github/refactor-access-cleanup7.py
      - run: npm ci
      - name: Build and syntax check
        run: |
          npm run web:publish
          node --check src/renderer/web-api.js
          node --check src/renderer/app.js
      - name: Commit access cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "收斂權限存取入口"
          git push origin refactor/access-architecture-v3
      - name: Unit tests
        run: |
          mv .github/workflows/access-architecture-refactor.yml /tmp/access-architecture-refactor.yml
          npm test
