name: Access architecture refactor
on:
  push:
    branches: [refactor/access-architecture-v3]
    paths:
      - .github/workflows/access-architecture-refactor.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect permission architecture
        run: |
          echo '--- Edge legacy role checks ---'
          grep -RInE 'role[^a-zA-Z0-9_].*(admin|manager)|(admin|manager).*role|\["manager", "admin"\]|\["admin", "manager"\]' supabase/functions || true
          echo '--- Edge direct employee profile role reads ---'
          grep -RInE 'select\("[^"]*role|\.select\(`[^`]*role' supabase/functions || true
          echo '--- browser transport guards ---'
          grep -nE 'ensureManager|hasManagerAccess|hasAdminAccess|getScheduleDirectoryRows|get_schedule_directory_v2|getDepartmentAttendanceSettings|member-order-v2' src/renderer/web-api.js || true
          echo '--- source generic access ---'
          grep -RInE 'restSelect\(|restInsert\(|restUpdate\(|restDelete\(|saveState\(|syncCatalogs\(' src/renderer || true
