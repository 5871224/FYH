name: Access architecture refactor
on:
  push:
    branches: [refactor/access-architecture-v3]
    paths:
      - .github/workflows/access-architecture-refactor.yml
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Finalize canonical architecture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/finalize-access-architecture.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace("start = t.index('## Edge Functions')", "start = t.index('## 正式 Edge Functions')")
          s = s.replace("end = t.index('## 測試資料', start)", "end = t.index('## 本機執行', start)")
          s = s.replace("start = t.index('## 9.2 Edge Functions')", "start = t.index('## 9.5 正式 Edge Functions')")
          s = s.replace("end = t.index('## 9.3 PC 桌面版部署', start)", "end = t.index('## 9.6 交易與冪等', start)")
          s = s.replace("replacement = '''## 9.2 權限與資料存取架構", "replacement = '''## 9.5 權限與資料存取架構")
          s = s.replace("needle = '11. `main` workflow 必須只有 `.github/workflows/deploy-pages.yml`。\\n'", "needle = '9. SQL Editor 發生錯誤時立即停止，不可略過後續區段。\\n'")
          s = s.replace('12. 瀏覽器不得直接 CRUD 核心資料表', '10. 瀏覽器不得直接 CRUD 核心資料表')
          s = s.replace('13. 不得新增通用 `restSelect/restInsert/restUpdate/restDelete`', '11. 不得新增通用 `restSelect/restInsert/restUpdate/restDelete`')
          s = s.replace('14. 權限判斷以 `access_role_id + access_roles.permissions + access_role_groups`', '12. 權限判斷以 `access_role_id + access_roles.permissions + access_role_groups`')
          s = s.replace('15. 需要受保護主檔的 mutation RPC', '13. 需要受保護主檔的 mutation RPC')
          s = s.replace('16. 資料存取架構不得以後載入 script', '14. 資料存取架構不得以後載入 script')
          p.write_text(s, encoding='utf-8')
          PY
          python3 .github/finalize-access-architecture.py
          rm -f .github/refactor-access-architecture.py
          rm -f .github/refactor-access-cleanup*.py
          rm -f .github/finalize-access-architecture.py
          rm -f .github/access-v3-canonical.sqlpart
          rm -f .github/workflows/access-architecture-refactor.yml
      - run: npm ci
      - name: Build
        run: npm run web:publish
      - name: Syntax checks
        run: |
          node --check src/renderer/web-api.js
          node --check src/renderer/renderer-page-data.js
          node --check src/renderer/renderer-groups-permissions-archive.js
          node --check src/renderer/app.js
      - name: Full CI
        run: npm run ci:check
      - name: Architecture scan
        run: |
          test "$(find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort)" = "deploy-pages.yml"
          ! grep -RInE 'restSelect\(|restInsert\(|restUpdate\(|restDelete\(|saveState\(|syncCatalogs\(' src/renderer
          ! grep -RInE '/rest/v1/(set_employee|set_departments|set_shift|set_leave|set_overtime|schedule_entries|scheduler_settings|holidays|schedule_groups|access_roles|access_role_groups|schedule_archives|schedule_archive_entries)' src/renderer
          ! grep -RInE 'catalog-admin|member-delete-v2|member-order-v2|department-attendance-v2' src scripts supabase/functions tests README.md AGENTS.md 規格書.md
          ! grep -RInE 'create( or replace)? function public\.(assign_department_group_v1|assign_member_access_v1|delete_department_general_v2|delete_member_account_v3|get_department_directory_v2|get_employee_admin_directory_v2|get_schedule_directory_v2|save_department_attendance_fields_bulk|save_departments_general_v2|save_schedule_entries_bulk)' supabase/001_current_schema.sql supabase/002_current_updates.sql
          ! grep -RInE 'role[^a-zA-Z0-9_].*(admin|manager)|(admin|manager).*role|\["manager", "admin"\]|\["admin", "manager"\]' supabase/functions
      - name: Commit final architecture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "完成權限存取架構重構"
          git push origin refactor/access-architecture-v3
