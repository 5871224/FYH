name: Renderer Phase 5 Refactor

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refactor:
    if: github.head_ref == 'agent/split-renderer-phase5'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Apply renderer phase 5 refactor
        run: |
          set -o pipefail
          node scripts/refactor-renderer-phase5.js 2>&1 | tee renderer-phase5-refactor.log

      - name: Upload refactor diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: renderer-phase5-refactor-log
          path: renderer-phase5-refactor.log
          if-no-files-found: ignore

      - name: Build static web
        run: npm run web:publish

      - name: Run complete checks
        run: |
          set -o pipefail
          npm run ci:check 2>&1 | tee renderer-phase5-ci.log

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: renderer-phase5-ci-log
          path: renderer-phase5-ci.log
          if-no-files-found: ignore

      - name: Commit renderer phase 5 refactor
        run: |
          rm -f scripts/refactor-renderer-phase5.js
          rm -f .github/workflows/refactor-renderer-phase5.yml
          rm -f renderer-phase5-refactor.log renderer-phase5-ci.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "拆分 renderer 班表渲染模組"
          git push origin HEAD:agent/split-renderer-phase5
