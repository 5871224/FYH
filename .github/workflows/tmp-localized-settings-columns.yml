name: Temporary Localized Settings Columns

on:
  push:
    branches:
      - fix/localized-settings-columns-20260901
    paths:
      - '.github/workflows/tmp-localized-settings-columns.yml'

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/localized-settings-columns-20260901
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Repair temporary migration matcher
        run: node scripts/tmp-repair-localized-migration.js

      - name: Apply source migration
        run: node scripts/tmp-localized-settings-columns.js

      - name: Publish static web
        run: npm run web:publish

      - name: Remove temporary tooling before validation
        run: rm -f scripts/tmp-localized-settings-columns.js scripts/tmp-repair-localized-migration.js .github/workflows/tmp-localized-settings-columns.yml

      - name: Validate
        run: |
          npm test
          node scripts/check-normalized-storage.js
          npm run renderer:check
          npm run css:architecture
          npm run js:architecture
          npm run static:publish:check

      - name: Commit formal changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '設定表格依語系顯示名稱並同步班表姓名'
          git push origin HEAD:fix/localized-settings-columns-20260901
