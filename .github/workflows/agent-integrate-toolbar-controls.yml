name: Apply integrated toolbar controls

on:
  push:
    branches:
      - agent/integrate-toolbar-controls-20260730

permissions:
  contents: write

jobs:
  apply-build-validate-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply requested changes
        run: python3 scripts/agent-integrate-toolbar-controls.py

      - name: Remove temporary automation files
        run: rm -f .github/workflows/agent-integrate-toolbar-controls.yml scripts/agent-integrate-toolbar-controls.py

      - name: Install dependencies
        run: npm install

      - name: Build and publish static files
        run: npm run web:publish

      - name: Validate project
        run: npm run ci:check

      - name: Publish one complete commit to main
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --soft origin/main
          git add -A
          git commit -m "整合浮動工具列操作按鈕"
          git push origin HEAD:main
