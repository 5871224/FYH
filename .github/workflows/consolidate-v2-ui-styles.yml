name: Consolidate v2 UI styles

on:
  push:
    paths:
      - '.github/workflows/consolidate-v2-ui-styles.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move module styles into ui-system.css
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def remove_style_block(path, style_id):
              text = path.read_text(encoding='utf-8-sig')
              start_marker = f'  if (!document.getElementById("{style_id}")) {{\n'
              end_marker = '    document.head.appendChild(style);\n  }\n'
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f'Style block {style_id} not found in {path}')
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f'Style block end for {style_id} not found in {path}')
              end += len(end_marker)
              path.write_text(text[:start] + text[end:], encoding='utf-8-sig')

          module_styles = {
              'v2-meal.js': 'v2MealLayoutStyle',
              'v2-personal-record-layout.js': 'v2PersonalRecordLayoutStyle',
              'v2-member-order.js': 'v2MemberOrderStyle',
              'v2-settings-drag-handles.js': 'v2SettingsDragHandleStyle',
              'v2-overtime-admin.js': 'v2OvertimeAdminStyle',
          }

          for root in [Path('src/renderer'), Path('docs')]:
              for filename, style_id in module_styles.items():
                  remove_style_block(root / filename, style_id)

              settings_path = root / 'v2-settings-drag-handles.js'
              text = settings_path.read_text(encoding='utf-8-sig')
              constant = '  const DRAG_COLUMN_WIDTH = "30px";\n\n'
              if constant not in text:
                  raise SystemExit(f'Drag width constant not found in {settings_path}')
              settings_path.write_text(text.replace(constant, '', 1), encoding='utf-8-sig')

          consolidated_css = r'''

          /* Consolidated styles formerly injected by v2 JavaScript modules. */
          .meal-card {
            width: min(1100px, 100%);
          }

          .meal-settings-table {
            width: 100%;
            table-layout: fixed;
          }

          .meal-settings-table th,
          .meal-settings-table td {
            min-width: 0;
          }

          .meal-settings-drag-col {
            width: 42px;
            text-align: center;
          }

          .meal-settings-name-col {
            width: auto;
          }

          .meal-settings-price-col {
            width: 104px;
          }

          .meal-settings-active-col {
            width: 70px;
            text-align: center;
          }

          .meal-settings-operation-col {
            width: 72px;
            white-space: nowrap;
            text-align: center;
          }

          .meal-settings-name-col input,
          .meal-settings-price-col input {
            width: 100%;
            min-width: 0;
          }

          .meal-settings-operation-col .ghost-btn {
            padding-left: 12px !important;
            padding-right: 12px !important;
          }

          .meal-drag-handle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: var(--ui-icon-radius);
            cursor: grab;
            user-select: none;
            touch-action: none;
          }

          .meal-drag-handle:active {
            cursor: grabbing;
          }

          .meal-settings-toolbar-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
          }

          .meal-settings-toolbar-label input[type="number"] {
            width: 92px;
          }

          .v2-personal-record-table .personal-schedule-icon-col {
            width: var(--day-col-width);
            min-width: var(--day-col-width);
            max-width: var(--day-col-width);
            padding: 2px;
            text-align: center;
            vertical-align: middle;
          }

          .v2-personal-record-table th.personal-schedule-icon-col {
            padding-left: 2px;
            padding-right: 2px;
          }

          .personal-record-schedule-cell {
            width: 100%;
            min-height: 36px;
          }

          .v2-personal-record-table .personal-record-schedule-cell .seg-label {
            color: inherit;
            font-size: inherit;
          }

          .personal-punch-stack {
            min-width: 118px;
            white-space: nowrap;
            line-height: 1.6;
          }

          .personal-punch-stack > div:empty::before {
            content: "-";
          }

          .member-settings-modal .member-table-row {
            grid-template-columns: 30px 104px minmax(86px, .9fr) minmax(170px, 1.45fr) 64px 108px 84px 78px 76px;
          }

          .catalog-settings-modal .settings-table-row-shift {
            grid-template-columns: 30px minmax(76px, .55fr) minmax(96px, .65fr) minmax(64px, .42fr) minmax(280px, 2.7fr) minmax(92px, .62fr) minmax(68px, .45fr) minmax(72px, .45fr);
          }

          .catalog-settings-modal .settings-table-row-leave,
          .catalog-settings-modal .settings-table-row-overtime {
            grid-template-columns: 30px repeat(7, minmax(0, 1fr));
          }

          .department-settings-table-department .department-settings-row {
            grid-template-columns: 30px minmax(76px, .55fr) minmax(220px, 2.1fr) minmax(74px, .45fr);
          }

          .member-order-drag-col,
          .settings-order-drag-col {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
            width: 100%;
          }

          .member-order-drag-handle,
          .settings-order-drag-handle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 26px;
            border-radius: 7px;
            color: var(--ui-muted);
            cursor: grab;
            user-select: none;
            touch-action: none;
            font-size: 17px;
            line-height: 1;
          }

          .member-order-drag-handle:hover,
          .settings-order-drag-handle:hover {
            background: var(--ui-surface-hover);
            color: var(--ui-accent-strong);
          }

          .member-order-drag-handle:active,
          .settings-order-drag-handle:active {
            cursor: grabbing;
          }

          .member-order-row.member-order-dragging {
            opacity: .62;
          }

          .member-order-row.member-order-drop-before {
            box-shadow: inset 0 2px 0 var(--ui-accent);
          }

          .member-order-row.member-order-drop-after {
            box-shadow: inset 0 -2px 0 var(--ui-accent);
          }

          .catalog-settings-modal .sortable-settings-item,
          .department-settings-modal .sortable-settings-item {
            cursor: default;
          }

          .v2-overtime-review-table .v2-overtime-check-col {
            width: 40px;
            min-width: 40px;
            max-width: 40px;
            padding-left: 9px;
            padding-right: 9px;
            text-align: center;
            white-space: nowrap;
          }

          .v2-overtime-review-table .v2-overtime-date-col {
            width: 112px;
            min-width: 112px;
            padding-left: 12px;
            padding-right: 12px;
            white-space: nowrap;
          }

          .v2-overtime-review-table .v2-overtime-status-col {
            width: 62px;
            min-width: 62px;
            max-width: 62px;
            padding-left: 6px;
            padding-right: 6px;
            text-align: center;
            white-space: nowrap;
          }

          .v2-overtime-review-table .v2-overtime-action-col {
            width: 116px;
            min-width: 116px;
          }

          .v2-overtime-review-table .v2-overtime-action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
          }

          .v2-overtime-review-table .v2-overtime-action-buttons .compact-btn {
            padding-left: 10px !important;
            padding-right: 10px !important;
          }

          @media (max-width: 900px) {
            .member-settings-modal .member-table-row {
              grid-template-columns: 30px 92px minmax(72px, .85fr) minmax(150px, 1.25fr) 54px 92px 72px 68px 70px;
            }
          }
          '''

          for path in [Path('src/renderer/ui-system.css'), Path('docs/ui-system.css')]:
              text = path.read_text(encoding='utf-8-sig')
              marker = '/* Consolidated styles formerly injected by v2 JavaScript modules. */'
              if marker in text:
                  raise SystemExit(f'Consolidated styles already present in {path}')
              path.write_text(text.rstrip() + consolidated_css + '\n', encoding='utf-8-sig')

          replacements = {
              './ui-system.css?v=20260709v1': './ui-system.css?v=20260709v2',
              './v2-member-order.js?v=20260707v1': './v2-member-order.js?v=20260709v1',
              './v2-settings-drag-handles.js?v=20260707v1': './v2-settings-drag-handles.js?v=20260709v1',
              './v2-meal.js?v=20260708v1': './v2-meal.js?v=20260709v2',
              './v2-personal-record-layout.js?v=20260707v3': './v2-personal-record-layout.js?v=20260709v1',
              './v2-overtime-admin.js?v=20260708v1': './v2-overtime-admin.js?v=20260709v1',
          }
          for path in [Path('src/renderer/index.html'), Path('docs/index.html')]:
              text = path.read_text(encoding='utf-8-sig')
              for old, new in replacements.items():
                  if old not in text:
                      raise SystemExit(f'Expected asset version {old} not found in {path}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8-sig')

          Path('.github/workflows/consolidate-v2-ui-styles.yml').unlink()
          PY

      - name: Validate JavaScript and CSS
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            src/renderer/v2-meal.js docs/v2-meal.js \
            src/renderer/v2-personal-record-layout.js docs/v2-personal-record-layout.js \
            src/renderer/v2-member-order.js docs/v2-member-order.js \
            src/renderer/v2-settings-drag-handles.js docs/v2-settings-drag-handles.js \
            src/renderer/v2-overtime-admin.js docs/v2-overtime-admin.js; do
            node --check "$file"
          done
          python3 - <<'PY'
          from pathlib import Path
          for name in ['src/renderer/ui-system.css', 'docs/ui-system.css']:
              text = Path(name).read_text(encoding='utf-8-sig')
              if text.count('{') != text.count('}'):
                  raise SystemExit(f'Unbalanced CSS braces: {name}')
          for root in [Path('src/renderer'), Path('docs')]:
              for name in ['v2-meal.js', 'v2-personal-record-layout.js', 'v2-member-order.js', 'v2-settings-drag-handles.js', 'v2-overtime-admin.js']:
                  text = (root / name).read_text(encoding='utf-8-sig')
                  if 'document.createElement("style")' in text:
                      raise SystemExit(f'Dynamic style injection remains in {root / name}')
          PY

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Consolidate v2 module styles into shared CSS'
          git push
