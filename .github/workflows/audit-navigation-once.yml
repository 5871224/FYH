name: Audit Navigation Entry Points

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
          show-progress: false
      - name: Find entry points
        shell: bash
        run: |
          {
            echo '=== appView assignments ==='
            grep -n 'appView[[:space:]]*=' src/renderer/renderer.js || true
            echo '=== schedule and settings open functions ==='
            grep -nE '^((async )?function )?(open|show|goTo|navigate|set).*(Schedule|Settings|View|Page)' src/renderer/renderer.js || true
            echo '=== data navigation handlers ==='
            grep -nE 'data-(open|view|page)|dataset\.(open|view|page)|schedulePage|memberSettings|deptSettings' src/renderer/renderer.js | head -n 500 || true
            echo '=== api loadState calls ==='
            grep -RIn --exclude=app.js --exclude-dir=docs 'loadState(' src/renderer || true
          } | tee navigation-audit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: navigation-audit
          path: navigation-audit.txt
