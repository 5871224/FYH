name: Finalize JavaScript Bundle

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          show-progress: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and validate
        run: |
          npm run web:publish
          npm run web:check
          node scripts/check-normalized-storage.js
          node scripts/check-expansion-acceptance.js
          node scripts/check-settings-lists.js
          npm run v2:check

      - name: Commit generated bundle
        shell: bash
        run: |
          rm -f .github/workflows/js-bundle-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "補齊 JavaScript 模組並重建 bundle"
          git push origin HEAD:${{ github.head_ref }}
