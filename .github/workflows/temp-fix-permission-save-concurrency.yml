name: Temp fix permission save concurrency

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-fix-permission-save-concurrency.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Patch permission save concurrency
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          edge_path = Path('supabase/functions/access-control/index.ts')
          edge = edge_path.read_text()
          old_edge = '''  const deleteResult = await ctx.supabaseAdmin.from("access_role_group_permissions").delete().eq("role_id", id);
            if (deleteResult.error) throw deleteResult.error;
            if (groupPermissions.length) {
              const insertResult = await ctx.supabaseAdmin.from("access_role_group_permissions").insert(
                groupPermissions.map((row) => ({ role_id: id, group_id: row.groupId, permissions: row.permissions }))
              );
              if (insertResult.error) throw insertResult.error;
            }
          '''
          new_edge = '''  const replaceResult = await ctx.supabaseAdmin.rpc("replace_access_role_group_permissions_v1", {
              p_role_id: id,
              p_rows: groupPermissions
            });
            if (replaceResult.error) throw replaceResult.error;
          '''
          if old_edge not in edge:
              raise SystemExit('access-control target block not found')
          edge_path.write_text(edge.replace(old_edge, new_edge, 1))

          renderer_path = Path('src/renderer/renderer-groups-permissions-archive.js')
          renderer = renderer_path.read_text()
          old_renderer = '    if (button.dataset.saveAccessRole !== undefined) { void saveAccessRoleFromForm().catch((error) => reportValidationError(error.message)); return; }'
          new_renderer = '''    if (button.dataset.saveAccessRole !== undefined) {
              if (button.disabled) return;
              button.disabled = true;
              void saveAccessRoleFromForm()
                .catch((error) => reportValidationError(error.message))
                .finally(() => { if (button.isConnected) button.disabled = false; });
              return;
            }'''
          if old_renderer not in renderer:
              raise SystemExit('renderer save role handler not found')
          renderer_path.write_text(renderer.replace(old_renderer, new_renderer, 1))

          test_path = Path('tests/permission-save-concurrency.test.js')
          test_path.write_text('''const fs = require("node:fs");\nconst path = require("node:path");\nconst test = require("node:test");\nconst assert = require("node:assert/strict");\n\nconst root = path.resolve(__dirname, "..");\nconst renderer = fs.readFileSync(path.join(root, "src/renderer/renderer-groups-permissions-archive.js"), "utf8");\nconst edge = fs.readFileSync(path.join(root, "supabase/functions/access-control/index.ts"), "utf8");\nconst migration = fs.readFileSync(path.join(root, "supabase/migrations/2026090204_access_role_group_permission_atomic_replace.sql"), "utf8");\n\ntest("權限儲存會阻止前端重複送出", () => {\n  assert.match(renderer, /if \(button\.disabled\) return;[\\s\\S]*button\.disabled = true;[\\s\\S]*saveAccessRoleFromForm\(\)/);\n});\n\ntest("權限群組寫入使用原子替換 RPC", () => {\n  assert.match(edge, /rpc\("replace_access_role_group_permissions_v1"/);\n  assert.doesNotMatch(edge, /from\("access_role_group_permissions"\)\.delete\(\)\.eq\("role_id", id\)/);\n  assert.match(migration, /pg_advisory_xact_lock/);\n  assert.match(migration, /delete from public\.access_role_group_permissions/);\n  assert.match(migration, /insert into public\.access_role_group_permissions/);\n});\n''')
          PY

          rm .github/workflows/temp-fix-permission-save-concurrency.yml
          npm run web:publish
          npm run ci:check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "修正權限設定重複儲存衝突"
          git push origin HEAD:main
