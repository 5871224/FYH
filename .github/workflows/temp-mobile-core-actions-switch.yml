name: Temporary mobile core actions switch fix

on:
  push:
    branches:
      - fix/mobile-core-actions-switch
    paths:
      - .github/workflows/temp-mobile-core-actions-switch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/mobile-core-actions-switch
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Fix mobile submenu switching
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/renderer/index.html')
          text = path.read_text(encoding='utf-8')

          old_css = "    .core-actions-menu-category:focus-within > .core-actions-submenu {\n      display: grid;\n    }\n\n    @media (hover: hover) and (pointer: fine) {\n      .core-actions-menu-category:hover > .core-actions-submenu {\n        display: grid;\n      }\n    }\n"
          new_css = "    .core-actions-menu-category.touch-open > .core-actions-submenu {\n      display: grid;\n    }\n\n    @media (hover: hover) and (pointer: fine) {\n      .core-actions-menu-category:hover > .core-actions-submenu,\n      .core-actions-menu-category:focus-within > .core-actions-submenu {\n        display: grid;\n      }\n    }\n"
          if text.count(old_css) != 1:
              raise SystemExit(f'Expected one submenu CSS block, found {text.count(old_css)}')
          text = text.replace(old_css, new_css)

          start_marker = '  <script>\n    (() => {\n      const menu = document.getElementById("coreActionsMenu");\n      if (!menu) return;\n      const touchLikePointer = window.matchMedia("(hover: none), (pointer: coarse)");\n'
          start = text.rfind(start_marker)
          end = text.find('  </script>\n</body>', start)
          if start < 0 or end < 0:
              raise SystemExit('Mobile menu script block not found')

          lines = [
              '  <script>',
              '    (() => {',
              '      const menu = document.getElementById("coreActionsMenu");',
              '      if (!menu) return;',
              '      const touchLikePointer = window.matchMedia("(hover: none), (pointer: coarse)");',
              '      const categories = [...menu.querySelectorAll(".core-actions-menu-category")];',
              '',
              '      const closeTouchSubmenus = (except = null) => {',
              '        categories.forEach((category) => {',
              '          if (category === except) return;',
              '          category.classList.remove("touch-open");',
              '          category.querySelector(":scope > .core-actions-menu-trigger")?.setAttribute("aria-expanded", "false");',
              '        });',
              '      };',
              '',
              '      categories.forEach((category) => {',
              '        const trigger = category.querySelector(":scope > .core-actions-menu-trigger");',
              '        trigger?.setAttribute("aria-expanded", "false");',
              '        trigger?.addEventListener("click", (event) => {',
              '          if (!touchLikePointer.matches) return;',
              '          event.preventDefault();',
              '          event.stopPropagation();',
              '          const opening = !category.classList.contains("touch-open");',
              '          closeTouchSubmenus(category);',
              '          category.classList.toggle("touch-open", opening);',
              '          trigger.setAttribute("aria-expanded", opening ? "true" : "false");',
              '          if (opening) trigger.focus({ preventScroll: true });',
              '        });',
              '        category.addEventListener("pointerenter", (event) => {',
              '          if (touchLikePointer.matches || (event.pointerType && event.pointerType !== "mouse")) return;',
              '          const active = document.activeElement;',
              '          const pinnedCategory = typeof active?.closest === "function"',
              '            ? active.closest(".core-actions-menu-category")',
              '            : null;',
              '          if (pinnedCategory && pinnedCategory !== category && menu.contains(pinnedCategory)) {',
              '            active.blur?.();',
              '          }',
              '        });',
              '      });',
              '',
              '      new MutationObserver(() => {',
              '        if (menu.getAttribute("aria-hidden") === "true") {',
              '          closeTouchSubmenus();',
              '        }',
              '      }).observe(menu, { attributes: true, attributeFilter: ["aria-hidden"] });',
              '    })();',
              '  </script>',
          ]
          replacement = '\n'.join(lines) + '\n'
          text = text[:start] + replacement + text[end + len('  </script>\n'):]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Publish static web
        run: npm run web:publish

      - name: Remove temporary workflow
        run: rm .github/workflows/temp-mobile-core-actions-switch.yml

      - name: Validate
        run: npm run ci:check

      - name: Commit result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "修正手機功能選單分類切換"
          git push origin HEAD:fix/mobile-core-actions-switch
