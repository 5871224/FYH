name: Temporary Attendance Review Pagination Rest Break Runner

on:
  push:
    branches:
      - agent/attendance-review-pagination-rest-break

permissions:
  contents: write

concurrency:
  group: temp-attendance-review-pagination-rest-break
  cancel-in-progress: true

jobs:
  update:
    if: github.event.head_commit.message != 'Fix attendance review paging and rest break export'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/attendance-review-pagination-rest-break
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Apply source changes
        run: python3 scripts/temp-attendance-review-pagination-rest-break.py
      - name: Install
        run: npm ci
      - name: Build static web
        run: npm run web:publish
      - name: Full validation
        shell: bash
        run: |
          mkdir -p .tmp-runner
          mv .github/workflows/temp-attendance-review-pagination-rest-break.yml .tmp-runner/temp-workflow.yml
          mv scripts/temp-attendance-review-pagination-rest-break.py .tmp-runner/temp-updater.py
          trap 'mv .tmp-runner/temp-workflow.yml .github/workflows/temp-attendance-review-pagination-rest-break.yml 2>/dev/null || true; mv .tmp-runner/temp-updater.py scripts/temp-attendance-review-pagination-rest-break.py 2>/dev/null || true' EXIT
          npm run ci:check
          mv .tmp-runner/temp-workflow.yml .github/workflows/temp-attendance-review-pagination-rest-break.yml
          mv .tmp-runner/temp-updater.py scripts/temp-attendance-review-pagination-rest-break.py
          rmdir .tmp-runner
          trap - EXIT
      - name: Commit source and generated files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer docs tests 規格書.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix attendance review paging and rest break export"
          git push origin HEAD:agent/attendance-review-pagination-rest-break
