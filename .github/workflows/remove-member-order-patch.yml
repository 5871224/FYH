name: Remove Member Order Patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refactor:
    if: github.head_ref == 'agent/remove-member-order-patch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Merge member order patch
        run: node scripts/remove-member-order-patch.js

      - name: Build static web
        run: npm run web:publish

      - name: Run complete checks
        run: |
          set -o pipefail
          npm run ci:check 2>&1 | tee member-order-ci.log

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: member-order-ci-log
          path: member-order-ci.log
          if-no-files-found: ignore

      - name: Commit canonical member ordering
        run: |
          rm -f scripts/remove-member-order-patch.js
          rm -f .github/workflows/remove-member-order-patch.yml
          rm -f member-order-ci.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "整併人員設定排序補丁"
          git push origin HEAD:agent/remove-member-order-patch
