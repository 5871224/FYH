name: JavaScript Architecture Migration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          show-progress: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare legacy dynamic modules
        run: node scripts/prepare-js-architecture-migration.js

      - name: Run JavaScript architecture migration
        id: migration
        shell: bash
        continue-on-error: true
        run: |
          set +e
          node scripts/migrate-js-architecture-once.js > js-migration.log 2>&1
          status=$?
          cat js-migration.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 0 ]; then
            rm -f scripts/prepare-js-architecture-migration.js
            rm -f scripts/migrate-js-architecture-once.js
            rm -f .github/workflows/js-architecture-migration.yml
            rm -f js-migration.log
          fi
          exit 0

      - name: Upload migration error log
        if: steps.migration.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: js-migration-error
          path: js-migration.log

      - name: Stop after migration failure
        if: steps.migration.outputs.status != '0'
        run: exit 1

      - name: Build and validate
        id: build
        shell: bash
        continue-on-error: true
        run: |
          set +e
          {
            npm run web:publish
            npm run web:check
            node scripts/check-normalized-storage.js
            node scripts/check-expansion-acceptance.js
            node scripts/check-settings-lists.js
            npm run v2:check
          } > js-build.log 2>&1
          status=$?
          cat js-build.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 0 ]; then
            rm -f js-build.log
          fi
          exit 0

      - name: Upload build error log
        if: steps.build.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: js-build-error
          path: js-build.log

      - name: Stop after build failure
        if: steps.build.outputs.status != '0'
        run: exit 1

      - name: Commit migration to PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "重整 JavaScript 建置與單一入口"
          git push origin HEAD:${{ github.head_ref }}
