name: Update Overtime Specification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-overtime-spec.yml"

permissions:
  contents: write

jobs:
  update-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch specification
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('福圓號排班系統擴充規格書.txt')
          text = path.read_text(encoding='utf-8')
          old = '''顯示：

          * 狀態。
          * 日期。
          * 姓名。
          * 班別。
          * 班表上下班時間。
          * 最新上班打卡時間。
          * 最新下班打卡時間。
          * 提早時數。
          * 延後時數。
          * 合計時數。
          * 加班備註。
          * 打卡異動警告。
          * 操作按鈕。'''
          new = '''顯示欄位及順序：

          1. 勾選：欄寬縮至只容納核取方塊，不保留多餘寬度。
          2. 日期：打卡異動警告顯示於日期下方。
          3. 員工：只顯示姓名，不顯示工號。
          4. 班別：顯示班別名稱及班表上下班時間。
          5. 打卡時間：欄名使用「打卡時間」，內容分別顯示上班及下班時間，只顯示時與分，不顯示年、月、日。
          6. 加班時數：將提早時數、延後時數及合計時數合併為一欄，格式為「提早＋延後=合計」，例如「2＋0.5=2.5」。
          7. 備註：顯示加班申請備註。
          8. 狀態：顯示於備註欄後面。
          9. 操作按鈕。'''
          if old not in text:
              if new in text:
                  raise SystemExit(0)
              raise SystemExit('Target specification block was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Document overtime review table layout
          file_pattern: "福圓號排班系統擴充規格書.txt"
