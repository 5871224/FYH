name: Temporary Department Member Drag Persistence
on:
  push:
    branches:
      - fix/department-member-drag-persist-20260901
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/department-member-drag-persist-20260901
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply persistence fix
        run: node scripts/tmp-fix-department-member-drag.js
      - name: Remove temporary tooling
        run: rm -f scripts/tmp-fix-department-member-drag.js .github/workflows/tmp-fix-department-member-drag.yml
      - name: Build published web files
        run: npm run web:publish
      - name: Run validation
        run: |
          npm test
          node scripts/check-normalized-storage.js
          npm run renderer:check
          npm run css:architecture
          npm run js:architecture
      - name: Commit formal changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "修正單位設定拖曳人員未存檔"
            git push origin HEAD:fix/department-member-drag-persist-20260901
          fi
