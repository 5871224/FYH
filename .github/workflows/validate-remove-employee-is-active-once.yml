name: Validate Remove Employee Is Active

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run and save validation
        shell: bash
        run: |
          set +e
          : > remove-employee-is-active-validation.txt
          run_check() {
            echo "===== $1 =====" >> remove-employee-is-active-validation.txt
            shift
            "$@" >> remove-employee-is-active-validation.txt 2>&1
            status=$?
            echo "status=$status" >> remove-employee-is-active-validation.txt
            echo >> remove-employee-is-active-validation.txt
          }
          run_check normalized node scripts/check-normalized-storage.js
          run_check expansion node scripts/check-expansion-acceptance.js
          run_check settings node scripts/check-settings-lists.js
          run_check v2 npm run v2:check
          run_check jscheck npm run js:check
          run_check webcheck npm run web:check
          cat remove-employee-is-active-validation.txt
          rm -f .github/workflows/validate-remove-employee-is-active-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "保存移除人員欄位驗證報告"
          git push origin HEAD:${{ github.head_ref }}
