name: Prepare Week Stripe Boundary Fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/fix-week-stripe-boundary'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: agent/fix-week-stripe-boundary

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Fix week stripe and boundary
        run: node scripts/fix-week-stripe-boundary.js

      - name: Build published web files
        run: npm run web:publish

      - name: Run complete checks without temporary workflow
        run: |
          set -o pipefail
          cp .github/workflows/prepare-week-stripe-boundary.yml /tmp/prepare-week-stripe-boundary.yml
          rm .github/workflows/prepare-week-stripe-boundary.yml
          npm run ci:check 2>&1 | tee week-stripe-boundary-ci.log
          cp /tmp/prepare-week-stripe-boundary.yml .github/workflows/prepare-week-stripe-boundary.yml

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: week-stripe-boundary-ci-log
          path: week-stripe-boundary-ci.log
          if-no-files-found: ignore

      - name: Commit verified fix
        run: |
          rm -f scripts/fix-week-stripe-boundary.js
          rm -f week-stripe-boundary-ci.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "修正週期斑馬紋與班表週界線"
          git push origin HEAD:agent/fix-week-stripe-boundary
