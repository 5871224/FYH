name: Bump restored toolbar layout CSS

on:
  push:
    paths:
      - '.github/workflows/bump-toolbar-layout-css.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump asset version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in ['src/renderer/index.html', 'docs/index.html']:
              path = Path(name)
              text = path.read_text(encoding='utf-8-sig')
              text = text.replace('./v2-schedule-nav.css?v=20260708v3', './v2-schedule-nav.css?v=20260708v4')
              path.write_text(text, encoding='utf-8-sig')
          Path('.github/workflows/bump-toolbar-layout-css.yml').unlink()
          PY
      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/renderer/index.html docs/index.html '.github/workflows/bump-toolbar-layout-css.yml'
          git commit -m 'Restore floating toolbar dimensions'
          git push
