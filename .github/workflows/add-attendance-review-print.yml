name: 新增簽到審核列印

on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-attendance-review-print.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 修改正式來源與規格
        shell: python
        run: |
          from pathlib import Path
          import base64, gzip
          p = Path("src/renderer/renderer-records-views.js")
          s = p.read_text(encoding="utf-8")
          old = '        <button class="ghost-btn compact-btn" type="button" data-export-attendance-review="true">匯出加班</button>'
          if 'data-print-attendance-review="true"' not in s:
              assert s.count(old) == 1
              s = s.replace(old, old + '\n        <button class="ghost-btn compact-btn" type="button" data-print-attendance-review="true">列印</button>', 1)
              p.write_text(s, encoding="utf-8")
          p = Path("src/renderer/renderer-records-events.js")
          s = p.read_text(encoding="utf-8")
          old = '    if (target.dataset.exportAttendanceReview !== undefined) { void exportAttendanceReview(); return; }'
          if 'dataset.printAttendanceReview' not in s:
              assert s.count(old) == 1
              s = s.replace(old, old + '\n    if (target.dataset.printAttendanceReview !== undefined) { void printAttendanceReview(target); return; }', 1)
              p.write_text(s, encoding="utf-8")
          p = Path("src/renderer/renderer-records-actions.js")
          s = p.read_text(encoding="utf-8").rstrip()
          if 'const ATTENDANCE_REVIEW_PRINT_PAGE_SIZE = 40;' not in s:
              block = gzip.decompress(base64.b64decode("")).decode("utf-8").rstrip()
              p.write_text(s + "\n\n" + block + "\n", encoding="utf-8")
          p = Path("規格書.md")
          s = p.read_text(encoding="utf-8")
          rule = '14. 簽到審核功能列提供「列印」。列印沿用目前篩選條件並載入全部符合資料，不受畫面分頁限制；固定使用 A4 橫式且不增加額外頁首頁尾。列印欄位依序為日期、員工、圖示、班別、打卡時間、上班時數、加班時數、備註、異常、狀態，不列印勾選框與操作欄；每頁重複表頭，每個完整列印頁固定 40 筆，最後一頁依剩餘筆數顯示。'
          anchor = '\n\n## 4.5 出勤資料模型'
          if rule not in s:
              assert s.count(anchor) == 1
              p.write_text(s.replace(anchor, '\n' + rule + anchor, 1), encoding="utf-8")
          Path("tests/attendance-review-print.test.js").write_bytes(gzip.decompress(base64.b64decode("")))
      - name: 先移除暫時工作流程
        run: git rm .github/workflows/add-attendance-review-print.yml
      - name: 建置與檢查
        run: |
          node --check src/renderer/renderer-records-actions.js
          node --check src/renderer/renderer-records-events.js
          node --check src/renderer/renderer-records-views.js
          node --test tests/attendance-review-print.test.js
          npm run web:publish
          npm run ci:check
      - name: 提交正式修正
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/renderer-records-views.js src/renderer/renderer-records-events.js src/renderer/renderer-records-actions.js tests/attendance-review-print.test.js 規格書.md src/renderer/app.js src/renderer/index.html src/renderer/app.css docs
          git commit -m "feat: add attendance review print"
          git push origin HEAD:main