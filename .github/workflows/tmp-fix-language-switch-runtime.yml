name: Temporary Language Switch Runtime Fix

on:
  push:
    branches:
      - fix/language-switch-runtime-20260901

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/language-switch-runtime-20260901
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Restore language runtime
        run: node scripts/tmp-fix-language-switch-runtime.js

      - name: Publish static web
        run: npm run web:publish

      - name: Validate
        run: |
          npm test
          node scripts/check-normalized-storage.js
          npm run renderer:check
          npm run css:architecture
          npm run js:architecture

      - name: Remove temporary tooling
        run: rm -f scripts/tmp-fix-language-switch-runtime.js .github/workflows/tmp-fix-language-switch-runtime.yml

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "修復繁中越文語系切換啟動"
          git push origin HEAD:fix/language-switch-runtime-20260901
