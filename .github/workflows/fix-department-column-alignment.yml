name: Fix department settings column alignment

on:
  push:
    paths:
      - '.github/workflows/fix-department-column-alignment.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix department grid item order
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          patch = r'''

          /* Department rows must keep the same four-column order as the header. */
          .department-settings-modal .department-settings-table-department .settings-order-drag-col {
            grid-column: 1;
            order: 0;
          }

          .department-settings-modal .department-settings-table-department .department-settings-title {
            grid-column: 2;
            order: 0;
          }

          .department-settings-modal .department-settings-table-department .member-inline-list {
            grid-column: 3;
            order: 0;
          }

          .department-settings-modal .department-settings-table-department .member-table-actions {
            grid-column: 4;
            order: 0;
          }
          '''

          marker = '/* Department rows must keep the same four-column order as the header. */'
          for css_path in [Path('src/renderer/ui-system.css'), Path('docs/ui-system.css')]:
              text = css_path.read_text(encoding='utf-8-sig')
              if marker not in text:
                  text = text.rstrip() + patch + '\n'
              css_path.write_text(text, encoding='utf-8-sig')

          for html_path in [Path('src/renderer/index.html'), Path('docs/index.html')]:
              text = html_path.read_text(encoding='utf-8-sig')
              text, count = re.subn(r'\./ui-system\.css\?v=[^"\s]+', './ui-system.css?v=20260709v7', text, count=1)
              if count != 1:
                  raise SystemExit(f'Could not update UI CSS asset version in {html_path}')
              html_path.write_text(text, encoding='utf-8-sig')

          Path('.github/workflows/fix-department-column-alignment.yml').unlink()
          PY

      - name: Validate styles
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in ['src/renderer/ui-system.css', 'docs/ui-system.css']:
              text = Path(name).read_text(encoding='utf-8-sig')
              if text.count('{') != text.count('}'):
                  raise SystemExit(f'Unbalanced CSS braces: {name}')
              required = [
                  '.department-settings-modal .department-settings-table-department .settings-order-drag-col',
                  '.department-settings-modal .department-settings-table-department .department-settings-title',
                  '.department-settings-modal .department-settings-table-department .member-inline-list',
                  '.department-settings-modal .department-settings-table-department .member-table-actions',
                  'grid-column: 3;',
                  'order: 0;',
              ]
              missing = [value for value in required if value not in text]
              if missing:
                  raise SystemExit(f'Missing department alignment rules in {name}: {missing}')
          PY

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix department settings column alignment'
          git push
