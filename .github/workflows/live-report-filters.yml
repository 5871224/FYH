name: Apply live report filters

on:
  push:
    paths:
      - '.github/workflows/live-report-filters.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch report filters and specification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def patch(path_text, changes):
              path = Path(path_text)
              text = path.read_text(encoding='utf-8-sig')
              original = text
              for old, new in changes:
                  text = text.replace(old, new)
              if text == original:
                  raise SystemExit(f'No changes applied to {path_text}')
              path.write_text(text, encoding='utf-8-sig' if path.suffix == '.html' else 'utf-8')

          meal_button = '<button class="primary-btn compact-btn" type="button" data-load-meal-report="true">查詢</button>'
          meal_old = '''    if ((target instanceof HTMLInputElement || target instanceof HTMLSelectElement) && target.dataset.mealReportFilter) {
              recordsState.mealPage = 1;
            }
            if (target instanceof HTMLSelectElement && target.dataset.mealReportView !== undefined) {
              recordsState.mealReportView = target.value || "detail";
              renderAll();
            }'''
          meal_new = '''    if ((target instanceof HTMLInputElement || target instanceof HTMLSelectElement) && target.dataset.mealReportFilter) {
              recordsState.mealPage = 1;
              void loadMealReport();
            }
            if (target instanceof HTMLSelectElement && target.dataset.mealReportView !== undefined) {
              recordsState.mealReportView = target.value || "detail";
              recordsState.mealPage = 1;
              renderAll();
            }'''
          for p in ['src/renderer/v2-records.js', 'docs/v2-records.js']:
              patch(p, [(meal_button, ''), (meal_old, meal_new)])

          overtime_button = '<button class="primary-btn compact-btn" type="button" data-load-overtime-review="true">查詢</button>'
          overtime_old = '''    if ((target instanceof HTMLInputElement || target instanceof HTMLSelectElement) && target.dataset.overtimeReviewFilter) {
              ensureReviewState().page = 1;
            }'''
          overtime_new = '''    if ((target instanceof HTMLInputElement || target instanceof HTMLSelectElement) && target.dataset.overtimeReviewFilter) {
              ensureReviewState().page = 1;
              void loadOvertimeReview();
            }'''
          for p in ['src/renderer/v2-overtime-admin.js', 'docs/v2-overtime-admin.js']:
              patch(p, [(overtime_button, ''), (overtime_old, overtime_new)])

          attendance_button = '<button class="primary-btn compact-btn" type="button" data-load-attendance-admin="true">查詢</button>'
          attendance_old = '''    if ((target instanceof HTMLInputElement || target instanceof HTMLSelectElement) && target.dataset.attendanceFilter) {
              recordsState.attendanceAdmin.page = 1;
            }'''
          attendance_new = '''    if ((target instanceof HTMLInputElement || target instanceof HTMLSelectElement) && target.dataset.attendanceFilter) {
              recordsState.attendanceAdmin.page = 1;
              void loadAttendanceAdmin();
            }'''
          for p in ['src/renderer/v2-attendance-admin.js', 'docs/v2-attendance-admin.js']:
              patch(p, [(attendance_button, ''), (attendance_old, attendance_new)])

          for p in ['src/renderer/v2-api.js', 'docs/v2-api.js']:
              path = Path(p)
              text = path.read_text(encoding='utf-8')
              text = text.replace('?v=20260707v8`;', '?v=20260708v1`;')
              path.write_text(text, encoding='utf-8')

          for p in ['src/renderer/index.html', 'docs/index.html']:
              path = Path(p)
              text = path.read_text(encoding='utf-8-sig')
              text = text.replace('./v2-api.js?v=20260707v8', './v2-api.js?v=20260708v1')
              text = text.replace('./v2-records.js?v=20260707v6', './v2-records.js?v=20260708v1')
              text = text.replace('./v2-overtime-admin.js?v=20260707v8', './v2-overtime-admin.js?v=20260708v1')
              path.write_text(text, encoding='utf-8-sig')

          spec_path = Path('規格書.txt')
          spec = spec_path.read_text(encoding='utf-8')
          spec = spec.replace('6. **查詢**：依目前條件重新載入。\n7. **匯出**：依目前篩選條件匯出 Excel。', '6. 日期、單位或員工條件變更後，立即重新查詢並更新統計結果。\n7. 報表類型變更後，立即切換顯示內容。\n8. **匯出**：依目前篩選條件匯出 Excel。')
          spec = spec.replace('8. 上一頁、下一頁與筆數資訊。\n9. 明細預設每頁 50 筆。\n10. 預設日期為今天。', '9. 上一頁、下一頁與筆數資訊。\n10. 明細預設每頁 50 筆。\n11. 預設日期為今天。\n12. 本分頁不顯示查詢按鈕。')
          spec = spec.replace('5. 查詢。\n6. 代為申請。\n7. 批次核准。\n8. 批次退回。\n9. 全選核取方塊與逐筆核取方塊。\n10. 上一頁、下一頁。\n11. 每頁 20 筆。', '5. 日期、人員或狀態變更後，立即重新查詢並更新審核清單。\n6. 本分頁不顯示查詢按鈕。\n7. 代為申請。\n8. 批次核准。\n9. 批次退回。\n10. 全選核取方塊與逐筆核取方塊。\n11. 上一頁、下一頁。\n12. 每頁 20 筆。')
          spec = spec.replace('6. 查詢。\n7. 上一頁、下一頁。\n8. 每頁 50 筆。\n9. 編輯。\n10. 歷程。', '6. 日期、人員、異常類型或「只顯示異常」變更後，立即重新查詢並更新清單。\n7. 本分頁不顯示查詢按鈕。\n8. 上一頁、下一頁。\n9. 每頁 50 筆。\n10. 編輯。\n11. 歷程。')
          spec_path.write_text(spec, encoding='utf-8')

          Path('.github/workflows/live-report-filters.yml').unlink()
          PY
      - name: Validate JavaScript
        shell: bash
        run: |
          node --check src/renderer/v2-records.js
          node --check src/renderer/v2-overtime-admin.js
          node --check src/renderer/v2-attendance-admin.js
      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/renderer docs '規格書.txt' '.github/workflows/live-report-filters.yml'
          git commit -m 'Update report filters immediately on change'
          git push
