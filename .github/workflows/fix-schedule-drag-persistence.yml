name: fix schedule drag persistence

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-schedule-drag-persistence.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Apply schedule drag persistence fix
        run: |
          git fetch origin fix/schedule-drag-persistence-temp:refs/remotes/origin/fix/schedule-drag-persistence-temp
          git checkout origin/fix/schedule-drag-persistence-temp -- \
            src/renderer/renderer-schedule-ordering.js \
            tests/renderer-schedule-order-persistence.test.js

      - name: Remove temporary workflow
        run: git rm .github/workflows/fix-schedule-drag-persistence.yml

      - name: Build and test
        run: |
          node --test tests/renderer-schedule-order-persistence.test.js
          npm run web:publish
          npm run ci:check

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: persist schedule drag ordering"
          git push origin HEAD:main
