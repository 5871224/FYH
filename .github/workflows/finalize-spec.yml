name: Finalize Canonical Spec

on:
  push:
    branches:
      - canonical-cleanup-20260808

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: canonical-cleanup-20260808
          fetch-depth: 0
      - name: Fix pre-launch group wording
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('規格書.md')
          text = path.read_text(encoding='utf-8')
          old = '''系統升級時建立預設群組：\n\n```text\n群組代碼：STORE\n群組名稱：門市\n可否訂餐：是\n狀態：啟用\n```\n\n既有單位、人員、班別、班表、簽到與訂餐資料全部歸入「門市」。'''
          new = '''全新建置時建立預設群組：\n\n```text\n群組代碼：STORE\n群組名稱：門市\n可否訂餐：是\n狀態：啟用\n```\n\n系統尚未正式上線，不保留舊版資料遷移規則；正式資料自建立時即直接歸屬其群組。'''
          if old not in text:
              raise SystemExit('規格書 2.1 舊版遷移文字不存在')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/finalize-spec.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "修正全新建置群組規格"
          git push origin HEAD:canonical-cleanup-20260808
