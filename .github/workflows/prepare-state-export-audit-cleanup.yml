name: Prepare State Export Audit Cleanup

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/state-export-audit-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: agent/state-export-audit-cleanup

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Apply cleanup
        run: node scripts/cleanup-state-export-audits.js

      - name: Build published web files
        run: npm run web:publish

      - name: Run complete checks without temporary workflow
        run: |
          set -o pipefail
          cp .github/workflows/prepare-state-export-audit-cleanup.yml /tmp/prepare-state-export-audit-cleanup.yml
          rm .github/workflows/prepare-state-export-audit-cleanup.yml
          npm run ci:check 2>&1 | tee state-export-audit-cleanup-ci.log
          cp /tmp/prepare-state-export-audit-cleanup.yml .github/workflows/prepare-state-export-audit-cleanup.yml

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: state-export-audit-cleanup-log
          path: state-export-audit-cleanup-ci.log
          if-no-files-found: ignore

      - name: Commit verified cleanup
        run: |
          rm -f scripts/cleanup-state-export-audits.js state-export-audit-cleanup-ci.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "清理重複狀態補值與稽核輸出"
          git push origin HEAD:agent/state-export-audit-cleanup
