name: Apply Schedule Conditions

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/schedule-conditions'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Apply implementation patch
        id: patch
        shell: bash
        run: |
          if [[ -f scripts/agent-ci-failure.txt ]]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! -f scripts/agent-schedule-conditions.js ]]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -f scripts/agent-schedule-conditions-v3.js ]]; then
            node scripts/agent-schedule-conditions-v3.js
          elif [[ -f scripts/agent-schedule-conditions-v2.js ]]; then
            node scripts/agent-schedule-conditions-v2.js
          else
            node scripts/agent-schedule-conditions.js
          fi
          echo "needed=true" >> "$GITHUB_OUTPUT"

      - name: Remove temporary agent files
        if: steps.patch.outputs.needed == 'true'
        run: |
          rm -f scripts/agent-schedule-conditions.js
          rm -f scripts/agent-schedule-conditions-v2.js
          rm -f scripts/agent-schedule-conditions-v3.js
          rm -f scripts/agent-schedule-conditions-fixed.js
          rm -f scripts/agent-schedule-conditions.sql
          rm -f scripts/agent-schedule-condition-assignment.txt
          rm -f scripts/agent-schedule-condition-spec.txt
          rm -f scripts/agent-schedule-conditions-trigger.txt
          rm -f .github/workflows/agent-schedule-conditions.yml

      - name: Build published web
        if: steps.patch.outputs.needed == 'true'
        run: npm run web:publish

      - name: Validate implementation
        id: validate
        if: steps.patch.outputs.needed == 'true'
        shell: bash
        run: |
          set +e
          npm run ci:check 2>&1 | tee /tmp/schedule-conditions-ci.log
          status=${PIPESTATUS[0]}
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if (( status != 0 )); then
            tail -n 240 /tmp/schedule-conditions-ci.log > /tmp/schedule-conditions-ci-tail.txt
          fi
          exit 0

      - name: Capture validation failure
        if: steps.patch.outputs.needed == 'true' && steps.validate.outputs.status != '0'
        shell: bash
        run: |
          mkdir -p scripts
          cp /tmp/schedule-conditions-ci-tail.txt scripts/agent-ci-failure.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/agent-ci-failure.txt
          git commit -m "chore: capture schedule conditions CI failure"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
          exit 1

      - name: Commit implementation to PR branch
        if: steps.patch.outputs.needed == 'true' && steps.validate.outputs.status == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add schedule conditions"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
