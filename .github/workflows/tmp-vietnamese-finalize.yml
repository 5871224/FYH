name: Temporary Vietnamese Finalization

on:
  push:
    branches:
      - fix/vietnamese-settings-fields-20260831

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/vietnamese-settings-fields-20260831
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Apply formal source transformation
        id: transform
        run: |
          set +e
          node scripts/tmp-vietnamese-finalize.js > /tmp/finalize.log 2>&1
          status=$?
          set -e
          cat /tmp/finalize.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then cp /tmp/finalize.log .tmp-vietnamese-finalize-error.txt; fi

      - name: Commit transformation diagnostics
        if: steps.transform.outputs.status != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp-vietnamese-finalize-error.txt
          git commit -m "Capture Vietnamese finalization diagnostics"
          git push origin HEAD:fix/vietnamese-settings-fields-20260831

      - name: Stop on transformation failure
        if: steps.transform.outputs.status != '0'
        run: exit 1

      - name: Remove temporary tooling
        run: rm -f scripts/tmp-vietnamese-finalize.js .github/workflows/tmp-vietnamese-finalize.yml .tmp-vietnamese-finalize-error.txt

      - name: Build published web files
        run: npm run web:publish

      - name: Run complete validation
        run: |
          npm test
          node scripts/check-normalized-storage.js
          npm run renderer:check
          npm run css:architecture
          npm run js:architecture

      - name: Commit finalized implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "完成群組與訂餐越文正式存檔流程"
          git push origin HEAD:fix/vietnamese-settings-fields-20260831
