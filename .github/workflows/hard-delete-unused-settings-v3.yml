name: Hard delete unused settings v3

on:
  push:
    branches:
      - agent/hard-delete-unused-settings-v3-20260810

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Apply canonical member delete guard cleanup
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          sql_path = Path('supabase/002_current_updates.sql')
          sql = sql_path.read_text(encoding='utf-8')

          member_sql = r'''drop trigger if exists trg_block_direct_employee_profile_delete_v2 on public.set_employee;
          drop function if exists public.block_direct_employee_profile_delete_v2();

          create or replace function public.delete_member_account_v4(p_target_id uuid)
          returns jsonb
          language plpgsql
          security definer
          set search_path=public,auth,pg_temp
          as $$
          declare
            v_profile public.set_employee%rowtype;
            v_schedule_count bigint := 0;
            v_unarchived_schedule_count bigint := 0;
            v_attendance_count bigint := 0;
            v_meal_count bigint := 0;
            v_today date := (timezone('Asia/Taipei',now()))::date;
          begin
            select * into v_profile
            from public.set_employee
            where id=p_target_id and deleted_at is null
            for update;

            if not found then
              return jsonb_build_object('ok',true,'deleted',false,'softDeleted',false,'hardDeleted',false,'blocked',false);
            end if;

            select
              count(*),
              count(*) filter (where not public.is_schedule_date_archived(entry.group_id,entry.work_date))
            into v_schedule_count,v_unarchived_schedule_count
            from public.schedule_entries entry
            where entry.member_id=p_target_id;

            if v_unarchived_schedule_count>0 then
              return jsonb_build_object(
                'ok',false,
                'deleted',false,
                'softDeleted',false,
                'hardDeleted',false,
                'blocked',true,
                'code','MEMBER_HAS_UNARCHIVED_SCHEDULE',
                'message','此人員仍有未封存班表，請先完成班表封存或清除相關排班。',
                'history',jsonb_build_object('unarchivedSchedule',v_unarchived_schedule_count)
              );
            end if;

            if exists(
              select 1
              from public.access_roles role
              where role.id=v_profile.access_role_id
                and 'permission_settings'=any(coalesce(role.permissions,'{}'::text[]))
            )
            and public.is_employee_account_effective(v_profile.hire_date,v_profile.leave_date,v_today)
            and not exists(
              select 1
              from public.set_employee other_employee
              join public.access_roles other_role on other_role.id=other_employee.access_role_id
              where other_employee.id<>p_target_id
                and other_employee.deleted_at is null
                and 'permission_settings'=any(coalesce(other_role.permissions,'{}'::text[]))
                and public.is_employee_account_effective(other_employee.hire_date,other_employee.leave_date,v_today)
            ) then
              raise exception '系統必須保留至少一個有效的權限管理帳號' using errcode='23514';
            end if;

            select count(*) into v_attendance_count from public.attendance_days where user_id=p_target_id;
            select count(*) into v_meal_count from public.meal_orders where user_id=p_target_id;

            if v_schedule_count=0 and v_attendance_count=0 and v_meal_count=0 then
              delete from public.set_employee where id=p_target_id;
              return jsonb_build_object(
                'ok',true,
                'deleted',true,
                'softDeleted',false,
                'hardDeleted',true,
                'blocked',false,
                'employeeCode',v_profile.employee_code
              );
            end if;

            update public.set_employee
            set deleted_at=now(), updated_at=now()
            where id=p_target_id;

            return jsonb_build_object(
              'ok',true,
              'deleted',true,
              'softDeleted',true,
              'hardDeleted',false,
              'blocked',false,
              'employeeCode',v_profile.employee_code,
              'history',jsonb_build_object(
                'schedule',v_schedule_count,
                'attendance',v_attendance_count,
                'mealOrders',v_meal_count
              )
            );
          end
          $$;

          revoke all on function public.delete_member_account_v4(uuid) from public,anon,authenticated;
          grant execute on function public.delete_member_account_v4(uuid) to service_role;'''.replace('\n          ', '\n')

          pattern = r'(?ms)^create or replace function public\.delete_member_account_v4\(p_target_id uuid\).*?^\$\$;'
          patched, count = re.subn(pattern, member_sql, sql)
          if count != 1:
              raise SystemExit(f'delete_member_account_v4 replacements={count}')
          sql_path.write_text(patched, encoding='utf-8')

          test_path = Path('tests/unused-master-hard-delete.test.js')
          test = test_path.read_text(encoding='utf-8')
          old = '''  assert.match(sql, /delete from public\\.set_employee where id=p_target_id/);\n  assert.match(sql, /'hardDeleted',true/);\n'''
          new = '''  assert.match(sql, /drop trigger if exists trg_block_direct_employee_profile_delete_v2 on public\\.set_employee/);\n  assert.match(sql, /drop function if exists public\\.block_direct_employee_profile_delete_v2\\(\\)/);\n  assert.match(sql, /系統必須保留至少一個有效的權限管理帳號/);\n  assert.match(sql, /delete from public\\.set_employee where id=p_target_id/);\n  assert.match(sql, /'hardDeleted',true/);\n  assert.match(sql, /revoke all on function public\\.delete_member_account_v4\\(uuid\\) from public,anon,authenticated/);\n  assert.match(sql, /grant execute on function public\\.delete_member_account_v4\\(uuid\\) to service_role/);\n'''
          if test.count(old) != 1:
              raise SystemExit('member test update point missing')
          test_path.write_text(test.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Build static web
        run: npm run web:publish

      - name: Remove temporary workflow before CI
        run: rm -f .github/workflows/hard-delete-unused-settings-v3.yml

      - name: Full CI
        run: npm run ci:check

      - name: Rebuild publish output
        run: npm run web:publish

      - name: Commit clean result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "補強未使用人員實體刪除安全規則"
          git push origin HEAD:agent/hard-delete-unused-settings-v3-20260810
          echo "FINAL_SHA=$(git rev-parse HEAD)"
