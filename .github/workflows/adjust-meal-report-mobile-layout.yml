name: Adjust meal report mobile layout

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/adjust-meal-report-mobile-layout.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Adjust meal report layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          records_path = Path('src/renderer/v2-records.js')
          records = records_path.read_text(encoding='utf-8-sig')
          old = '''          <label class="meal-toolbar-field meal-field-view">
            <span>報表內容</span>
            <select data-meal-report-view>
              <option value="detail" ${view === "detail" ? "selected" : ""}>明細</option>
              <option value="item" ${view === "item" ? "selected" : ""}>品項</option>
              <option value="member" ${view === "member" ? "selected" : ""}>人員</option>
            </select>
          </label>
        </div>
        <div class="meal-toolbar-actions">
          <button class="ghost-btn" type="button" data-export-meal-report="true">匯出 Excel</button>
        </div>'''
          new = '''          <label class="meal-toolbar-field meal-field-view">
            <span>報表內容</span>
            <select data-meal-report-view>
              <option value="detail" ${view === "detail" ? "selected" : ""}>明細</option>
              <option value="item" ${view === "item" ? "selected" : ""}>品項</option>
              <option value="member" ${view === "member" ? "selected" : ""}>人員</option>
            </select>
          </label>
          <div class="meal-toolbar-field meal-field-export">
            <span aria-hidden="true">操作</span>
            <button class="ghost-btn" type="button" data-export-meal-report="true">匯出 Excel</button>
          </div>
        </div>'''
          if old not in records:
              raise SystemExit('Meal report toolbar target not found')
          records = records.replace(old, new, 1)
          records = records.replace('<span>期間總數量</span>', '<span>總數量</span>', 1)
          records = records.replace('<span>期間總金額</span>', '<span>總金額</span>', 1)
          records_path.write_text(records, encoding='utf-8-sig')

          css_path = Path('src/renderer/ui-system.css')
          css = css_path.read_text(encoding='utf-8-sig')
          marker = '/* Meal report mobile rows: dates, department/member, report/export, and two summary cards. */'
          block = r'''

          /* Meal report mobile rows: dates, department/member, report/export, and two summary cards. */
          .meal-report-toolbar {
            grid-template-columns: minmax(0, 1fr);
          }

          .meal-report-fields {
            grid-template-columns:
              minmax(140px, 160px)
              minmax(140px, 160px)
              minmax(130px, 1fr)
              minmax(130px, 1fr)
              minmax(110px, 130px)
              minmax(130px, 150px);
          }

          .meal-field-export {
            display: grid;
            align-items: stretch;
            gap: 5px;
            min-width: 0;
          }

          .meal-field-export > span {
            visibility: hidden;
            color: var(--ui-muted);
            font-size: 12px;
            font-weight: 800;
            line-height: 1.2;
          }

          .meal-field-export > button {
            width: 100%;
            min-width: 0;
            min-height: var(--ui-control-height);
          }

          .meal-stats-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
          }

          @media (max-width: 900px) {
            .meal-report-fields {
              grid-template-columns: repeat(2, minmax(0, 1fr));
              grid-template-areas:
                "from to"
                "department member"
                "view export";
            }

            .meal-field-export {
              grid-area: export;
            }
          }

          @media (max-width: 640px) {
            .meal-report-fields {
              grid-template-columns: repeat(2, minmax(0, 1fr));
              grid-template-areas:
                "from to"
                "department member"
                "view export";
            }

            .meal-stats-grid {
              grid-template-columns: repeat(2, minmax(0, 1fr));
            }
          }
          '''
          if marker not in css:
              css = css.rstrip() + block + '\n'
          css_path.write_text(css, encoding='utf-8-sig')

          spec_path = Path('規格書.txt')
          spec = spec_path.read_text(encoding='utf-8-sig')
          old_spec = '8. 電腦版控制欄位靠左、操作按鈕靠右且與輸入控制項等高；手機版日期使用雙欄，其他篩選依可用寬度整齊分欄，新增、儲存與匯出按鈕使用完整可用寬度。'
          new_spec = '''8. 電腦版控制欄位靠左、操作按鈕與輸入控制項等高。
9. 訂餐統計手機版固定使用三列雙欄：開始日期／結束日期、單位／人員、報表內容／匯出 Excel。
10. 訂餐統計的總數量與總金額卡片固定顯示於同一列，標題使用「總數量」及「總金額」，不加「期間」字樣。
11. 訂餐設定手機版的新增商品與儲存設定按鈕平均分配可用寬度。'''
          if old_spec not in spec:
              raise SystemExit('Specification target not found')
          spec = spec.replace(old_spec, new_spec, 1)
          spec_path.write_text(spec, encoding='utf-8-sig')

          Path('.github/workflows/adjust-meal-report-mobile-layout.yml').unlink()
          PY
      - name: Publish and validate
        run: |
          npm run web:publish
          node --check src/renderer/v2-records.js
          node --check docs/v2-records.js
          node scripts/check-v2-alignment.js
          node scripts/check-v2-final.js
          npm run web:check
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine meal report mobile layout"
          git push
