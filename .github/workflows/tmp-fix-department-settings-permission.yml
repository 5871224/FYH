name: Temporary Department Settings Permission Fix

on:
  push:
    branches:
      - fix/department-settings-permission-20260904-exec

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ !contains(github.event.head_commit.message, '修正單位設定權限一致性') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Apply permission fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 exact match, got {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          renderer = Path('src/renderer/renderer-settings-department.js')
          text = renderer.read_text(encoding='utf-8')
          text = text.replace('  if (!canManagePermissions()) return;\n', '', 1)
          text = text.replace(
              '  const userId = currentProfile?.id || "";\n  if (userId && departmentAttendanceSettingsUserId === userId) return;\n',
              '  const userId = currentProfile?.id || "";\n  const scopeKey = `${userId}:${groupFeatureState.currentGroupId || ""}`;\n  if (scopeKey && departmentAttendanceSettingsUserId === scopeKey) return;\n',
              1,
          )
          text = text.replace('  departmentAttendanceSettingsUserId = userId;\n', '  departmentAttendanceSettingsUserId = scopeKey;\n', 1)
          text = text.replace('      ${canManagePermissions() ? "" : \'<p class="modal-description">打卡地址、座標、固定 IP 與是否啟用打卡只有管理員可以修改。</p>\'}\n', '', 1)
          text = text.replace('  const attendanceFieldsDisabled = canManagePermissions() ? "" : "disabled";\n', '  const attendanceFieldsDisabled = "";\n', 1)
          text = text.replace('  if (canManagePermissions() && latitude !== "" && (!Number.isFinite(latitude) || latitude < -90 || latitude > 90)) {\n', '  if (latitude !== "" && (!Number.isFinite(latitude) || latitude < -90 || latitude > 90)) {\n', 1)
          text = text.replace('  if (canManagePermissions() && longitude !== "" && (!Number.isFinite(longitude) || longitude < -180 || longitude > 180)) {\n', '  if (longitude !== "" && (!Number.isFinite(longitude) || longitude < -180 || longitude > 180)) {\n', 1)
          old_payload = '''  const attendancePayload = canManagePermissions()\n    ? {\n      address: document.getElementById("departmentAddress")?.value.trim() || "",\n      latitude,\n      longitude,\n      publicIp: document.getElementById("departmentPublicIp")?.value.trim() || "",\n      attendanceEnabled: Boolean(document.getElementById("departmentAttendanceEnabled")?.checked)\n    }\n    : {\n      address: previousDepartment?.address || "",\n      latitude: previousDepartment?.latitude ?? "",\n      longitude: previousDepartment?.longitude ?? "",\n      publicIp: previousDepartment?.publicIp || "",\n      attendanceEnabled: Boolean(previousDepartment?.attendanceEnabled)\n    };\n'''
          new_payload = '''  const attendancePayload = {\n    address: document.getElementById("departmentAddress")?.value.trim() || "",\n    latitude,\n    longitude,\n    publicIp: document.getElementById("departmentPublicIp")?.value.trim() || "",\n    attendanceEnabled: Boolean(document.getElementById("departmentAttendanceEnabled")?.checked)\n  };\n'''
          if old_payload not in text:
              raise SystemExit('renderer attendance payload block not found')
          text = text.replace(old_payload, new_payload, 1)
          if 'canManagePermissions()' in text:
              raise SystemExit('renderer-settings-department.js still depends on common settings permission')
          renderer.write_text(text, encoding='utf-8')

          sql_path = Path('supabase/002_current_updates.sql')
          sql = sql_path.read_text(encoding='utf-8')

          save_department = '''create or replace function public.save_department_v3(p_department jsonb)
          returns jsonb
          language plpgsql
          security definer
          set search_path=public,pg_catalog
          as $$
          declare
            v_id uuid; v_group_id uuid; v_old_group_id uuid; v_name text; v_existing public.set_departments%rowtype;
          begin
            begin v_id:=nullif(btrim(p_department->>'id'),'')::uuid; v_group_id:=nullif(btrim(p_department->>'groupId'),'')::uuid; exception when invalid_text_representation then raise exception '單位識別碼格式錯誤'; end;
            v_name:=btrim(coalesce(p_department->>'name',''));
            if v_id is null or v_group_id is null or v_name='' then raise exception '單位名稱與群組不可空白'; end if;
            if not exists(select 1 from public.schedule_groups g where g.id=v_group_id and g.deleted_at is null and g.status='active') then raise exception '找不到可使用的群組'; end if;
            if not public.has_group_permission(auth.uid(),v_group_id,'department_settings') then raise exception '沒有管理此群組單位的權限' using errcode='42501'; end if;
            select * into v_existing from public.set_departments where id=v_id for update;
            v_old_group_id:=v_existing.group_id;
            if found and v_existing.deleted_at is not null then raise exception '已刪除單位不可重新啟用'; end if;
            if v_old_group_id is not null and v_old_group_id is distinct from v_group_id then
              if not public.has_group_permission(auth.uid(),v_old_group_id,'department_settings') then raise exception '沒有管理原群組單位的權限' using errcode='42501'; end if;
              if exists(select 1 from public.set_employee m where m.home_department_id=v_id and m.deleted_at is null) then raise exception '此單位仍有人員，請先調整人員'; end if;
              if exists(select 1 from public.schedule_entries e left join public.set_employee m on m.id=e.member_id left join public.set_shift s on s.id=e.shift_type_id where (e.support_department_id=v_id or m.home_department_id=v_id or s.applicable_department_id=v_id) and not public.is_schedule_date_archived(e.group_id,e.work_date)) then raise exception '此單位仍有未封存班表，請先完成班表封存或清除相關排班'; end if;
            end if;
            insert into public.set_departments(id,name,group_id,start_date,end_date,hidden_from_schedule,sort_order,address,latitude,longitude,public_ip,attendance_enabled)
            values(v_id,v_name,v_group_id,nullif(p_department->>'startDate','')::date,nullif(p_department->>'endDate','')::date,coalesce((p_department->>'hiddenFromSchedule')::boolean,false),greatest(0,coalesce((p_department->>'sortOrder')::integer,0)),nullif(btrim(coalesce(p_department->>'address','')),''),case when nullif(p_department->>'latitude','') is not null then (p_department->>'latitude')::double precision else null end,case when nullif(p_department->>'longitude','') is not null then (p_department->>'longitude')::double precision else null end,nullif(btrim(coalesce(p_department->>'publicIp','')),''),coalesce((p_department->>'attendanceEnabled')::boolean,false))
            on conflict(id) do update set name=excluded.name,group_id=excluded.group_id,start_date=excluded.start_date,end_date=excluded.end_date,hidden_from_schedule=excluded.hidden_from_schedule,sort_order=excluded.sort_order,
              address=excluded.address,
              latitude=excluded.latitude,
              longitude=excluded.longitude,
              public_ip=excluded.public_ip,
              attendance_enabled=excluded.attendance_enabled,
              attendance_settings_updated_at=now(),
              attendance_settings_updated_by=auth.uid(),
              updated_at=now()
            where public.set_departments.deleted_at is null;
            if v_old_group_id is not null and v_old_group_id is distinct from v_group_id then update public.set_shift set group_id=v_group_id,updated_at=now() where applicable_department_id=v_id and deleted_at is null; end if;
            return jsonb_build_object('ok',true,'id',v_id,'groupId',v_group_id);
          end
          $$;
          '''
          save_department = '\n'.join(line[10:] if line.startswith('          ') else line for line in save_department.splitlines()) + '\n\n'

          sql, count = re.subn(
              r'create or replace function public\.save_department_v3\(p_department jsonb\)[\s\S]*?(?=create or replace function public\.delete_department_v3)',
              save_department,
              sql,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'save_department_v3 replacement count={count}')

          get_department = '''create or replace function public.get_department_attendance_settings_v3()
          returns table(
            department_id uuid,
            address text,
            latitude double precision,
            longitude double precision,
            attendance_enabled boolean,
            public_ip text
          )
          language sql
          stable
          security definer
          set search_path=public,pg_catalog
          as $$
            select d.id,d.address,d.latitude,d.longitude,d.attendance_enabled,d.public_ip
            from public.set_departments d
            where d.deleted_at is null
              and public.has_group_permission(auth.uid(),d.group_id,'department_settings')
            order by d.sort_order,d.name,d.id
          $$;
          '''
          get_department = '\n'.join(line[10:] if line.startswith('          ') else line for line in get_department.splitlines()) + '\n\n'
          sql, count = re.subn(
              r'create or replace function public\.get_department_attendance_settings_v3\(\)[\s\S]*?(?=create or replace function public\.get_employee_admin_directory_v3)',
              get_department,
              sql,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'get_department_attendance_settings_v3 replacement count={count}')

          protect_department = '''create or replace function public.protect_department_attendance_fields()
          returns trigger language plpgsql security definer set search_path=public,pg_catalog as $$
          declare v_group_id uuid; v_sensitive_changed boolean:=false;
          begin
            if (select auth.uid()) is null or (select auth.role())='service_role' then return new; end if;
            v_group_id:=coalesce(new.group_id,old.group_id);
            if tg_op='INSERT' then
              v_sensitive_changed:=new.address is not null or new.latitude is not null or new.longitude is not null
                or new.public_ip is not null or new.attendance_enabled is true
                or new.attendance_settings_updated_at is not null or new.attendance_settings_updated_by is not null;
            else
              v_sensitive_changed:=new.address is distinct from old.address or new.latitude is distinct from old.latitude
                or new.longitude is distinct from old.longitude or new.public_ip is distinct from old.public_ip
                or new.attendance_enabled is distinct from old.attendance_enabled
                or new.attendance_settings_updated_at is distinct from old.attendance_settings_updated_at
                or new.attendance_settings_updated_by is distinct from old.attendance_settings_updated_by;
            end if;
            if v_sensitive_changed and not public.has_group_permission((select auth.uid()),v_group_id,'department_settings') then
              raise exception '沒有修改單位設定的權限' using errcode='42501';
            end if;
            return new;
          end $$;
          '''
          protect_department = '\n'.join(line[10:] if line.startswith('          ') else line for line in protect_department.splitlines()) + '\n\n'
          sql, count = re.subn(
              r'create or replace function public\.protect_department_attendance_fields\(\)[\s\S]*?(?=drop trigger if exists trg_protect_employee_role_changes)',
              protect_department,
              sql,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'protect_department_attendance_fields replacement count={count}')

          sql_path.write_text(sql, encoding='utf-8')

          migration = '''-- 單位設定權限一致化：只要有該群組 department_settings，即可讀寫單位所有欄位。
          begin;

          ''' + save_department + get_department + protect_department + '''revoke all on function public.get_department_attendance_settings_v3() from public,anon;
          grant execute on function public.get_department_attendance_settings_v3() to authenticated,service_role;
          revoke all on function public.save_department_v3(jsonb) from public,anon;
          grant execute on function public.save_department_v3(jsonb) to authenticated,service_role;
          revoke all on function public.protect_department_attendance_fields() from public,anon,authenticated;
          grant execute on function public.protect_department_attendance_fields() to service_role;

          commit;
          '''
          migration = '\n'.join(line[10:] if line.startswith('          ') else line for line in migration.splitlines()) + '\n'
          Path('supabase/migrations/2026090401_department_settings_permission.sql').write_text(migration, encoding='utf-8')

          test_path = Path('tests/renderer-department-settings.test.js')
          test_text = test_path.read_text(encoding='utf-8')
          needle = '    departmentSettingsView: "",\n    modalContext: {},\n'
          replacement = '''    departmentSettingsView: "",
              modalContext: {},
              currentProfile: { id: "U1" },
              groupFeatureState: { currentGroupId: "G1" },
              window: { schedulerApi: { getDepartmentAttendanceSettings: async () => [{ departmentId: "D1", attendanceEnabled: true }] } },
          '''
          replacement = '\n'.join(line[6:] if line.startswith('      ') else line for line in replacement.splitlines()) + '\n'
          if needle not in test_text:
              raise SystemExit('renderer department test context insertion point not found')
          test_text = test_text.replace(needle, replacement, 1)
          test_path.write_text(test_text, encoding='utf-8')

          new_test = r'''const fs = require("node:fs");
          const test = require("node:test");
          const assert = require("node:assert/strict");

          const renderer = fs.readFileSync("src/renderer/renderer-settings-department.js", "utf8");
          const sql = fs.readFileSync("supabase/002_current_updates.sql", "utf8");
          const migration = fs.readFileSync("supabase/migrations/2026090401_department_settings_permission.sql", "utf8");

          function blockBetween(source, start, end) {
            const begin = source.indexOf(start);
            const finish = source.indexOf(end, begin + start.length);
            assert.notEqual(begin, -1, `找不到 ${start}`);
            assert.notEqual(finish, -1, `找不到 ${end}`);
            return source.slice(begin, finish);
          }

          test("單位設定前端不得再依賴共用 settings 權限", () => {
            assert.equal(renderer.includes("canManagePermissions()"), false);
            assert.match(renderer, /getDepartmentAttendanceSettings\(\)/);
            assert.match(renderer, /scopeKey = `\$\{userId\}:\$\{groupFeatureState\.currentGroupId \|\| ""\}`/);
            assert.match(renderer, /const attendanceFieldsDisabled = "";/);
            assert.match(renderer, /const attendancePayload = \{/);
            assert.doesNotMatch(renderer, /打卡地址、座標、固定 IP 與是否啟用打卡只有管理員可以修改/);
          });

          test("單位讀取、儲存與保護 Trigger 只看 department_settings", () => {
            const getBlock = blockBetween(sql, "create or replace function public.get_department_attendance_settings_v3()", "create or replace function public.get_employee_admin_directory_v3");
            assert.match(getBlock, /has_group_permission\(auth\.uid\(\),d\.group_id,'department_settings'\)/);
            assert.doesNotMatch(getBlock, /has_common_permission/);

            const saveBlock = blockBetween(sql, "create or replace function public.save_department_v3", "create or replace function public.delete_department_v3");
            assert.match(saveBlock, /has_group_permission\(auth\.uid\(\),v_group_id,'department_settings'\)/);
            assert.doesNotMatch(saveBlock, /v_can_admin|has_common_permission\(auth\.uid\(\),'settings'\)/);
            assert.match(saveBlock, /address=excluded\.address/);
            assert.match(saveBlock, /attendance_enabled=excluded\.attendance_enabled/);

            const triggerBlock = blockBetween(sql, "create or replace function public.protect_department_attendance_fields()", "drop trigger if exists trg_protect_employee_role_changes");
            assert.match(triggerBlock, /has_group_permission\(\(select auth\.uid\(\)\),v_group_id,'department_settings'\)/);
            assert.doesNotMatch(triggerBlock, /has_common_permission/);

            assert.match(migration, /department_settings/);
            assert.doesNotMatch(migration, /has_common_permission\([^\n]*'settings'/);
          });
          '''
          new_test = '\n'.join(line[10:] if line.startswith('          ') else line for line in new_test.splitlines()) + '\n'
          Path('tests/department-settings-permission.test.js').write_text(new_test, encoding='utf-8')
          PY

      - name: Rebuild published assets
        run: npm run web:publish

      - name: Run tests and architecture checks
        run: |
          npm test
          npm run renderer:check
          npm run web:check
          node scripts/check-normalized-storage.js
          node scripts/check-expansion-acceptance.js
          node scripts/check-settings-lists.js
          npm run css:architecture
          npm run js:architecture

      - name: Commit generated fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/renderer-settings-department.js src/renderer/app.js docs supabase/002_current_updates.sql supabase/migrations/2026090401_department_settings_permission.sql tests/renderer-department-settings.test.js tests/department-settings-permission.test.js
          git commit -m "修正單位設定權限一致性"
          git push
