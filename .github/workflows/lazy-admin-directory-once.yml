name: Lazy Admin Directory

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refactor-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply lazy loading refactor
        run: |
          python3 scripts/lazy_admin_directory_once.py
          rm -f scripts/lazy_admin_directory_once.py
          rm -f .github/workflows/audit-navigation-once.yml
          rm -f .github/workflows/lazy-admin-directory-once.yml
      - name: Build and validate
        run: |
          npm run web:publish
          npm run js:check
          node --check src/renderer/web-api.js
          node --check src/renderer/v2-api.js
          node --check src/renderer/renderer.js
          node scripts/check-normalized-storage.js
          node scripts/check-expansion-acceptance.js
          node scripts/check-settings-lists.js
          npm run v2:check
      - name: Commit final refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "依頁面延遲載入人員管理資料"
          git push origin HEAD:${{ github.head_ref }}
