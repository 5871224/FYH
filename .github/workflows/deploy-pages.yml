name: Apply Runtime Cleanup
run-name: "套用測試專用與舊版過渡清理"

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-runtime-cleanup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'agent/remove-runtime-compatibility' || github.ref_name == 'agent/remove-runtime-compatibility'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v5
        with:
          ref: agent/remove-runtime-compatibility
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Apply cleanup patch
        run: |
          cat .github/fyh-cleanup-source.patch.part-* > /tmp/fyh-cleanup.patch
          echo "c94146c0ed1039cfd4dd2ed2184ce4a4175061caabc1b39a26b6188caf48484d  /tmp/fyh-cleanup.patch" | sha256sum --check
          git apply --index /tmp/fyh-cleanup.patch

      - name: Build published files
        run: npm run web:publish

      - name: Restore permanent workflow and remove patch carriers
        run: |
          git show origin/main:.github/workflows/deploy-pages.yml > .github/workflows/deploy-pages.yml
          rm -f .github/fyh-cleanup-source.patch.part-* .github/fyh-cleanup-marker.txt .github/fyh-cleanup-trigger.txt
          cmp .github/workflows/deploy-pages.yml <(git show origin/main:.github/workflows/deploy-pages.yml)

      - name: Run complete validation
        run: npm run ci:check

      - name: Commit validated cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "移除測試專用與舊版過渡寫法"
          git push origin HEAD:agent/remove-runtime-compatibility
