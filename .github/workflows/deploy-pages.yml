name: Temporary Provider Neutral Auth Build

on:
  push:
    branches:
      - agent/provider-neutral-auth-ui

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Apply refactor
        run: node scripts/tmp-provider-neutral-auth-ui.js
      - name: Build
        run: npm run web:publish
      - name: Restore formal repository files
        run: |
          git show 0c36412ac668411dde6e43e4b361bc14896cda22:.github/workflows/deploy-pages.yml > .github/workflows/deploy-pages.yml
          rm scripts/tmp-provider-neutral-auth-ui.js
      - name: Test
        run: |
          npm test
          npm run renderer:check
          npm run js:architecture
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/deploy-pages.yml src/renderer tests docs scripts/tmp-provider-neutral-auth-ui.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refactor renderer auth state"
          git push origin HEAD:${GITHUB_REF_NAME}
