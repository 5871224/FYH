name: Validate and Deploy Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Check declared change scope
        if: github.event_name == 'pull_request'
        run: npm run scope:check

      - name: Apply renderer phase 1 refactor
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/split-renderer-phase1' && !contains(github.event.pull_request.head.label, '[renderer-refactor-applied]')
        run: node scripts/refactor-renderer-phase1.js

      - name: Build static web
        run: npm run web:publish

      - name: Run complete checks
        run: npm run ci:check

      - name: Commit renderer refactor
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/split-renderer-phase1'
        run: |
          git checkout origin/main -- .github/workflows/deploy-pages.yml
          rm -f scripts/refactor-renderer-phase1.js
          rm -f .github/workflows/refactor-renderer-phase1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "拆分 renderer 核心模組 [renderer-refactor-applied]"
            git push origin HEAD:agent/split-renderer-phase1
          fi

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
