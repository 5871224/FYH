name: Harden Login Account Boundary

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: harden-login-main
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Harden scheduler API login account handling
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'src/renderer/web-api.js';
          let source = fs.readFileSync(path, 'utf8');

          const strictEmailBlock = `  function buildLocalLoginEmail(employeeCode) {
            const exactCode = String(employeeCode ?? "");
            if (!exactCode || exactCode !== exactCode.trim() || !/^[A-Za-z0-9._-]+$/.test(exactCode)) {
              return "";
            }
            return \`\${exactCode.toLowerCase()}@local.invalid\`;
          }`;

          if (!source.includes('const exactCode = String(employeeCode ?? "")')) {
            const start = source.indexOf('  function buildLocalLoginEmail(employeeCode) {');
            const end = source.indexOf('  ["pointerdown", "keydown", "touchstart"]', start);
            if (start < 0 || end < 0) throw new Error('buildLocalLoginEmail section not found');
            source = source.slice(0, start) + strictEmailBlock + '\n\n' + source.slice(end);
          }

          const strictSignInPrefix = `  async function signIn(loginAccount, password) {
            const employeeCode = String(loginAccount ?? "");
            const email = buildLocalLoginEmail(employeeCode);
            if (!email) {
              throw new Error("工號格式錯誤");
            }
`;

          if (!source.includes('const employeeCode = String(loginAccount ?? "")')) {
            const start = source.indexOf('  async function signIn(loginAccount, password) {');
            const marker = '    const payload = await requestJson("/auth/v1/token?grant_type=password", {';
            const markerIndex = source.indexOf(marker, start);
            if (start < 0 || markerIndex < 0) throw new Error('signIn section not found');
            source = source.slice(0, start) + strictSignInPrefix + source.slice(markerIndex);
          }

          fs.writeFileSync(path, source);
          NODE

      - name: Run focused login tests
        run: node --test tests/login-fast-home.test.js

      - name: Build static web
        run: npm run web:publish

      - name: Commit hardened source and generated web
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/renderer/web-api.js docs; then
            echo "Login boundary is already hardened."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/web-api.js docs
          git commit -m "fix: enforce exact login employee code"
          git push origin HEAD:main
