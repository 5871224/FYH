name: Validate Web App
run-name: "${{ github.event_name == 'pull_request' && format('PR #{0} 驗證', github.event.pull_request.number) || github.event_name == 'push' && 'main 驗證' || '手動驗證' }}"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Determine change scope
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
          fi

          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi

          if [[ -z "$base_sha" ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t changed_files < <(git diff --name-only "$base_sha" "$GITHUB_SHA")
          printf 'Changed files:\n'
          printf '  %s\n' "${changed_files[@]}"

          docs_only=true
          if (( ${#changed_files[@]} == 0 )); then
            docs_only=false
          fi

          for file in "${changed_files[@]}"; do
            if [[ "$file" != *.md ]]; then
              docs_only=false
              break
            fi
          done

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

      - name: Check declared change scope
        if: github.event_name == 'pull_request'
        run: npm run scope:check

      - name: Run documentation guards
        if: steps.changes.outputs.docs_only == 'true'
        run: node --test tests/canonical-schema.test.js tests/github-actions-hygiene.test.js

      - name: Build static web
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run web:publish

      - name: Check reproducible static publish
        if: steps.changes.outputs.docs_only != 'true'
        run: git diff --exit-code -- docs

      - name: Run unit tests
        if: steps.changes.outputs.docs_only != 'true'
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee /tmp/npm-test.log
          test_status=${PIPESTATUS[0]}
          set -e

          if (( test_status != 0 )); then
            {
              echo "### Unit test failure"
              echo
              echo '```text'
              tail -n 120 /tmp/npm-test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            failure_tail="$(tail -n 80 /tmp/npm-test.log)"
            failure_tail="${failure_tail//'%'/'%25'}"
            failure_tail="${failure_tail//$'\r'/'%0D'}"
            failure_tail="${failure_tail//$'\n'/'%0A'}"
            echo "::error title=Unit tests failed::$failure_tail"
            exit "$test_status"
          fi

      - name: Check public Supabase settings
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run web:check

      - name: Check normalized storage
        if: steps.changes.outputs.docs_only != 'true'
        run: node scripts/check-normalized-storage.js

      - name: Check expansion acceptance
        if: steps.changes.outputs.docs_only != 'true'
        run: node scripts/check-expansion-acceptance.js

      - name: Check settings lists
        if: steps.changes.outputs.docs_only != 'true'
        run: node scripts/check-settings-lists.js

      - name: Check renderer bundles
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run renderer:check

      - name: Check CSS architecture
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run css:architecture

      - name: Check JavaScript architecture
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run js:architecture
