name: Canonical cleanup validation

on:
  push:
    branches:
      - canonical-export-cleanup

permissions:
  contents: write

concurrency:
  group: canonical-export-cleanup
  cancel-in-progress: true

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: canonical-export-cleanup
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Consolidate canonical implementation
        run: python .github/canonical-cleanup.py

      - name: Restore permanent workflow and remove task script
        run: |
          git fetch origin main
          git show origin/main:.github/workflows/deploy-pages.yml > .github/workflows/deploy-pages.yml
          rm -f .github/canonical-cleanup.py

      - name: Build static web
        run: npm run web:publish

      - name: Run full validation
        run: |
          npm test
          npm run web:check
          node scripts/check-normalized-storage.js
          node scripts/check-expansion-acceptance.js
          node scripts/check-settings-lists.js
          npm run renderer:check
          npm run css:architecture
          npm run js:architecture

      - name: Commit canonical sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "移除舊版相容與補丁式匯出流程"
          git push origin HEAD:canonical-export-cleanup
