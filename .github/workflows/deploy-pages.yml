name: Temporary Identity Boundary Build

on:
  push:
    branches:
      - agent/auth-provider-abstraction

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Apply identity boundary
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const file = "src/renderer/web-api.js";
          let source = fs.readFileSync(file, "utf8");
          const replaceOne = (before, after) => {
            if (!source.includes(before)) throw new Error("Expected text not found");
            source = source.replace(before, after);
          };
          const replaceRange = (startMarker, endMarker, replacement) => {
            const start = source.indexOf(startMarker);
            const end = source.indexOf(endMarker, start);
            if (start < 0 || end <= start) throw new Error(`Range not found: ${startMarker}`);
            source = source.slice(0, start) + replacement + source.slice(end);
          };

          replaceOne(
            "  async function refreshSessionIfNeeded() {",
            "  async function refreshSessionIfNeeded(force = false) {"
          );
          replaceOne(
            "    if (currentSession.expires_at && Date.now() < (currentSession.expires_at - 60) * 1000) {",
            "    if (!force && currentSession.expires_at && Date.now() < (currentSession.expires_at - 60) * 1000) {"
          );

          replaceOne(
            "  function nullableDate(value) {",
            `  const identityProvider = Object.freeze({
              getUser: () => currentSession?.user || null,
              ensureFresh: async (force = false) => {
                assertSessionActive();
                try {
                  return await refreshSessionIfNeeded(force);
                } catch (error) {
                  expireSession();
                  throw error;
                }
              },
              buildHeaders: (options = {}) => buildHeaders(options),
              touch: () => touchSession()
            });

            function nullableDate(value) {`
          );

          replaceRange(
            "  async function requestJson(pathname, options = {}) {",
            "  async function requestFunction(functionName, payload, { retryTransientOnce = false } = {}) {",
            `  async function requestJson(pathname, options = {}) {
              const { auth = false, contentType = true, headers: extraHeaders = {}, ...fetchOptions } = options;
              const execute = async (forceRefresh = false) => {
                if (auth) await identityProvider.ensureFresh(forceRefresh);
                return fetch(\`${baseUrl}\${pathname}\`, {
                  ...fetchOptions,
                  headers: identityProvider.buildHeaders({
                    auth,
                    contentType,
                    extra: extraHeaders
                  })
                });
              };
              let response = await execute(false);
              if (auth && response.status === 401) {
                response = await execute(true);
              }
              if (!response.ok) throw new Error(await readError(response));
              if (auth) identityProvider.touch();
              if (response.status === 204) return null;
              const text = await response.text();
              return text ? JSON.parse(text) : null;
            }

            `
          );

          replaceRange(
            "  async function requestFunction(functionName, payload, { retryTransientOnce = false } = {}) {",
            "  function isUuid(value) {",
            `  async function requestFunction(functionName, payload, { retryTransientOnce = false } = {}) {
              for (let attempt = 0; ; attempt += 1) {
                const execute = async (forceRefresh = false) => {
                  await identityProvider.ensureFresh(forceRefresh);
                  return fetch(\`${baseUrl}/functions/v1/\${functionName}\`, {
                    method: "POST",
                    cache: "no-store",
                    headers: identityProvider.buildHeaders({
                      auth: true,
                      extra: { Accept: "application/json" }
                    }),
                    body: JSON.stringify(payload || {})
                  });
                };
                let response;
                try {
                  response = await execute(false);
                  if (response.status === 401) response = await execute(true);
                } catch (error) {
                  if (retryTransientOnce && attempt === 0) {
                    await new Promise((resolve) => setTimeout(resolve, 300));
                    continue;
                  }
                  throw error;
                }
                if (!response.ok) {
                  if (response.status === 404) throw new Error(\`尚未部署 \${functionName} Edge Function\`);
                  const message = await readError(response);
                  if (retryTransientOnce && attempt === 0 && [502, 503, 504].includes(response.status)) {
                    await new Promise((resolve) => setTimeout(resolve, 300));
                    continue;
                  }
                  throw new Error(message);
                }
                identityProvider.touch();
                const text = await response.text();
                return text ? JSON.parse(text) : null;
              }
            }

            `
          );

          replaceOne(
            "    getAuthContext: () => ({ session: currentSession, profile: currentProfile }),",
            "    getAuthContext: () => ({ user: identityProvider.getUser(), profile: currentProfile }),"
          );

          fs.writeFileSync(file, source, "utf8");

          const testFile = "tests/provider-neutral-auth-boundary.test.js";
          let tests = fs.readFileSync(testFile, "utf8");
          if (!tests.includes("一般後端請求統一經過 identityProvider")) {
            tests += `\n\ntest("一般後端請求統一經過 identityProvider", () => {\n  const source = fs.readFileSync(path.join(root, "src", "renderer", "web-api.js"), "utf8");\n  assert.match(source, /const identityProvider = Object\\.freeze/);\n  assert.match(source, /identityProvider\\.ensureFresh\\(forceRefresh\\)/);\n  assert.match(source, /response\\.status === 401/);\n  assert.match(source, /getAuthContext: \\(\\) => \\(\\{ user: identityProvider\\.getUser\\(\\), profile: currentProfile \\}\\)/);\n});\n`;
            fs.writeFileSync(testFile, tests, "utf8");
          }
          NODE
      - name: Build static web
        run: npm run web:publish
      - name: Restore formal workflow
        run: git checkout origin/main -- .github/workflows/deploy-pages.yml
      - name: Test
        run: |
          npm test
          npm run renderer:check
          npm run css:architecture
          npm run js:architecture
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/web-api.js src/renderer/app.js tests/provider-neutral-auth-boundary.test.js docs .github/workflows/deploy-pages.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Introduce identity provider boundary"
          git push origin HEAD:${GITHUB_REF_NAME}
