name: Validate Web App
run-name: "${{ github.event_name == 'pull_request' && format('PR #{0} 驗證', github.event.pull_request.number) || github.event_name == 'push' && 'main 驗證' || '手動驗證' }}"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Apply meal order save fix
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/finalize-meal-order-inputs' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(file, before, after) {
            const source = fs.readFileSync(file, 'utf8');
            if (source.includes(after)) return;
            if (!source.includes(before)) throw new Error(`找不到預期區塊：${file}`);
            fs.writeFileSync(file, source.replace(before, after), 'utf8');
          }

          const mainPagesPath = 'src/renderer/renderer-main-pages.js';
          const mealPagePath = 'src/renderer/renderer-meal-page.js';
          const testPath = 'tests/renderer-meal-consolidation.test.js';
          const specPath = '福圓號排班系統擴充規格書.txt';

          replaceOnce(
            mainPagesPath,
            `  const orders = status?.orders || [];
  const orderQuantityMap = new Map(orders.map((item) => [item.product_id, Number(item.quantity || 0)]));
  const orderNoteMap = new Map(orders.map((item) => [item.product_id, item.note || ""]));`,
            `  const orders = status?.orders || [];
  const pendingItems = Array.isArray(mealOrderState.pendingItems) ? mealOrderState.pendingItems : null;
  const orderQuantityMap = pendingItems
    ? new Map(pendingItems.map((item) => [item.productId, Number(item.quantity || 0)]))
    : new Map(orders.map((item) => [item.product_id, Number(item.quantity || 0)]));
  const orderNoteMap = pendingItems
    ? new Map(pendingItems.map((item) => [item.productId, item.note || ""]))
    : new Map(orders.map((item) => [item.product_id, item.note || ""]));`
          );

          replaceOnce(
            mealPagePath,
            `    mealOrderState = { ...mealOrderState, loading: true, error: "" };
    renderAll();`,
            `    mealOrderState = { ...mealOrderState, loading: true, error: "", pendingItems: items };
    renderAll();`
          );

          replaceOnce(
            mealPagePath,
            `      mealOrderState = { loading: false, status, error: "" };`,
            `      mealOrderState = { loading: false, status, error: "", pendingItems: null };`
          );

          const testSource = fs.readFileSync(testPath, 'utf8');
          if (!testSource.includes('儲存訂餐重新渲染時應保留剛輸入的數量與備註')) {
            fs.writeFileSync(testPath, testSource.trimEnd() + `\n\ntest("儲存訂餐重新渲染時應保留剛輸入的數量與備註", () => {\n  const mainPages = read("src/renderer/renderer-main-pages.js");\n  const mealPage = read("src/renderer/renderer-meal-page.js");\n  assert.match(mainPages, /Array\\.isArray\\(mealOrderState\\.pendingItems\\)/);\n  assert.match(mainPages, /pendingItems\\.map\\(\\(item\\) => \\[item\\.productId, Number\\(item\\.quantity \\|\\| 0\\)\\]\\)/);\n  assert.match(mainPages, /pendingItems\\.map\\(\\(item\\) => \\[item\\.productId, item\\.note \\|\\| ""\\]\\)/);\n  assert.match(mealPage, /pendingItems:\\s*items/);\n  assert.match(mealPage, /pendingItems:\\s*null/);\n});\n`, 'utf8');
          }

          const specRule = '- 今日訂餐按下「儲存訂餐」後，儲存中與成功提示顯示期間必須保留本次輸入的數量及備註，不得先跳回未儲存前的值。';
          const specSource = fs.readFileSync(specPath, 'utf8');
          if (!specSource.includes(specRule)) {
            fs.writeFileSync(specPath, specSource.trimEnd() + `\n\n${specRule}\n`, 'utf8');
          }

          if (fs.existsSync('.github/workflows/preserve-meal-order-inputs.yml')) {
            fs.rmSync('.github/workflows/preserve-meal-order-inputs.yml');
          }

          const officialWorkflow = [
            'name: Validate Web App',
            'run-name: "${{ github.event_name == \'pull_request\' && format(\'PR #{0} 驗證\', github.event.pull_request.number) || github.event_name == \'push\' && \'main 驗證\' || \'手動驗證\' }}"',
            '',
            'on:',
            '  push:',
            '    branches:',
            '      - main',
            '  pull_request:',
            '    branches:',
            '      - main',
            '  workflow_dispatch:',
            '',
            'permissions:',
            '  contents: read',
            '',
            'concurrency:',
            '  group: web-validate-${{ github.event.pull_request.number || github.ref }}',
            '  cancel-in-progress: true',
            '',
            'jobs:',
            '  validate:',
            '    name: Validate',
            '    runs-on: ubuntu-latest',
            '    timeout-minutes: 10',
            '    steps:',
            '      - name: Checkout',
            '        uses: actions/checkout@v5',
            '        with:',
            '          fetch-depth: 0',
            '',
            '      - name: Setup Node.js',
            '        uses: actions/setup-node@v5',
            '        with:',
            '          node-version: "22"',
            '',
            '      - name: Check declared change scope',
            '        if: github.event_name == \'pull_request\'',
            '        run: npm run scope:check',
            '',
            '      - name: Build static web',
            '        run: npm run web:publish',
            '',
            '      - name: Check reproducible static publish',
            '        run: git diff --exit-code -- docs',
            '',
            '      - name: Check workflow hygiene',
            '        run: node --test tests/github-actions-hygiene.test.js',
            '',
            '      - name: Run unit tests',
            '        run: npm test',
            '',
            '      - name: Check public Supabase settings',
            '        run: npm run web:check',
            '',
            '      - name: Check normalized storage',
            '        run: node scripts/check-normalized-storage.js',
            '',
            '      - name: Check expansion acceptance',
            '        run: node scripts/check-expansion-acceptance.js',
            '',
            '      - name: Check settings lists',
            '        run: node scripts/check-settings-lists.js',
            '',
            '      - name: Check renderer bundles',
            '        run: npm run renderer:check',
            '',
            '      - name: Check CSS architecture',
            '        run: npm run css:architecture',
            '',
            '      - name: Check JavaScript architecture',
            '        run: npm run js:architecture'
          ].join('\n') + '\n';
          fs.writeFileSync('.github/workflows/deploy-pages.yml', officialWorkflow, 'utf8');
          NODE

      - name: Check declared change scope
        if: github.event_name == 'pull_request'
        run: npm run scope:check

      - name: Build static web
        run: npm run web:publish

      - name: Commit synchronized meal order fix
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/finalize-meal-order-inputs' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .github/workflows/deploy-pages.yml .github/workflows/preserve-meal-order-inputs.yml src/renderer/renderer-main-pages.js src/renderer/renderer-meal-page.js src/renderer/app.js src/renderer/index.html docs/app.js docs/index.html tests/renderer-meal-consolidation.test.js '福圓號排班系統擴充規格書.txt'
          git commit -m "完成訂餐儲存欄位保留修正"
          git push origin HEAD:${{ github.head_ref }}

      - name: Check reproducible static publish
        run: git diff --exit-code -- docs

      - name: Check workflow hygiene
        run: node --test tests/github-actions-hygiene.test.js

      - name: Run unit tests
        run: npm test

      - name: Check public Supabase settings
        run: npm run web:check

      - name: Check normalized storage
        run: node scripts/check-normalized-storage.js

      - name: Check expansion acceptance
        run: node scripts/check-expansion-acceptance.js

      - name: Check settings lists
        run: node scripts/check-settings-lists.js

      - name: Check renderer bundles
        run: npm run renderer:check

      - name: Check CSS architecture
        run: npm run css:architecture

      - name: Check JavaScript architecture
        run: npm run js:architecture
