name: Harden Login Account Boundary

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: harden-login-main
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Harden scheduler API login account handling
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'src/renderer/web-api.js';
          let source = fs.readFileSync(path, 'utf8');
          const oldEmail = `  function buildLocalLoginEmail(employeeCode) {
            const normalized = String(employeeCode || "")
              .trim()
              .toLowerCase()
              .replace(/[^a-z0-9._-]+/g, "-")
              .replace(/^-+|-+$/g, "");
            return normalized ? \`\${normalized}@local.invalid\` : "";
          }`;
          const newEmail = `  function buildLocalLoginEmail(employeeCode) {
            const exactCode = String(employeeCode ?? "");
            if (!exactCode || exactCode !== exactCode.trim() || !/^[A-Za-z0-9._-]+$/.test(exactCode)) {
              return "";
            }
            return \`\${exactCode.toLowerCase()}@local.invalid\`;
          }`;
          const oldSignIn = `  async function signIn(loginAccount, password) {
            const employeeCode = String(loginAccount || "").trim();
            const email = buildLocalLoginEmail(employeeCode);
            if (!email) {
              throw new Error("找不到這個工號，或尚未設定登入帳號");
            }`;
          const newSignIn = `  async function signIn(loginAccount, password) {
            const employeeCode = String(loginAccount ?? "");
            const email = buildLocalLoginEmail(employeeCode);
            if (!email) {
              throw new Error("工號格式錯誤");
            }`;

          if (source.includes(oldEmail)) {
            source = source.replace(oldEmail, newEmail);
          } else if (!source.includes(newEmail)) {
            throw new Error('buildLocalLoginEmail target block not found');
          }
          if (source.includes(oldSignIn)) {
            source = source.replace(oldSignIn, newSignIn);
          } else if (!source.includes(newSignIn)) {
            throw new Error('signIn target block not found');
          }
          fs.writeFileSync(path, source);
          NODE

      - name: Run focused login tests
        run: node --test tests/login-fast-home.test.js

      - name: Build static web
        run: npm run web:publish

      - name: Commit hardened source and generated web
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/renderer/web-api.js docs; then
            echo "Login boundary is already hardened."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/web-api.js docs
          git commit -m "fix: enforce exact login employee code"
          git push origin HEAD:main
