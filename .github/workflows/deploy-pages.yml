name: Apply Strict Login Account Fix

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: strict-login-fix-main
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Apply source fix
        run: node scripts/temp-harden-login-account.js

      - name: Run focused login tests
        run: node --test tests/login-fast-home.test.js

      - name: Build static web
        run: npm run web:publish

      - name: Commit source and generated web
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/web-api.js docs
          if git diff --cached --quiet; then
            echo "No source or generated changes to commit."
            exit 0
          fi
          git commit -m "fix: enforce exact login employee code"
          git push origin HEAD:main
