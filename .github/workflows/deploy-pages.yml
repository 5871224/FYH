name: Validate Web App
run-name: "${{ github.event_name == 'pull_request' && format('PR #{0} 驗證', github.event.pull_request.number) || github.event_name == 'push' && 'main 驗證' || '手動驗證' }}"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Check declared change scope
        if: github.event_name == 'pull_request'
        run: npm run scope:check

      - name: Update specification review date
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/formalize-project-metadata'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('規格書.md')
          text = path.read_text(encoding='utf-8-sig')
          text = text.replace('**文件版本：** 2026-07-11', '**文件版本：** 2026-07-13', 1)
          text = text.replace('**最後全面檢查：** 2026-07-11', '**最後全面檢查：** 2026-07-13', 1)
          path.write_text(text, encoding='utf-8')
          PY
          if ! git diff --quiet -- 規格書.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add 規格書.md
            git commit -m "更新規格書檢查日期"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Build static web
        run: npm run web:publish

      - name: Check reproducible static publish
        run: git diff --exit-code -- docs

      - name: Check workflow hygiene
        run: node --test tests/github-actions-hygiene.test.js

      - name: Run unit tests
        run: npm test

      - name: Check public Supabase settings
        run: npm run web:check

      - name: Check normalized storage
        run: node scripts/check-normalized-storage.js

      - name: Check expansion acceptance
        run: node scripts/check-expansion-acceptance.js

      - name: Check settings lists
        run: node scripts/check-settings-lists.js

      - name: Check renderer bundles
        run: npm run renderer:check

      - name: Check CSS architecture
        run: npm run css:architecture

      - name: Check JavaScript architecture
        run: npm run js:architecture
