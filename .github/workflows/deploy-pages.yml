name: Apply Mobile Settings Header Fix
run-name: "套用手機設定表頭修正"

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: mobile-settings-header-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'agent/fix-mobile-settings-header'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v5
        with:
          ref: agent/fix-mobile-settings-header
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Apply source and regression-test patch
        run: git apply --index .github/mobile-settings-header.patch

      - name: Rebuild published files
        run: npm run web:publish

      - name: Restore permanent workflow and remove patch carrier
        run: |
          git show origin/main:.github/workflows/deploy-pages.yml > .github/workflows/deploy-pages.yml
          rm -f .github/mobile-settings-header.patch
          cmp .github/workflows/deploy-pages.yml <(git show origin/main:.github/workflows/deploy-pages.yml)

      - name: Run regression validation
        run: |
          npm test
          npm run renderer:check
          npm run css:architecture

      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/mobile-settings-header.patch .github/workflows/deploy-pages.yml docs/app.css docs/index.html src/renderer/app.css src/renderer/css/components.css src/renderer/index.html tests/settings-width-and-catalog-delete.test.js "
          git commit -m "修正手機設定表格水平捲動表頭"
          git push origin HEAD:agent/fix-mobile-settings-header
