name: Apply Cleanup Patch
run-name: "套用舊申請流程清理"

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-cleanup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'agent/repo-snapshot-20260717' || github.ref_name == 'agent/repo-snapshot-20260717'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v5
        with:
          ref: agent/repo-snapshot-20260717
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Apply cleanup patch
        run: |
          base64 --decode .github/fyh-cleanup.patch.gz.b64 | gzip --decompress > /tmp/fyh-cleanup.patch
          git apply --index /tmp/fyh-cleanup.patch

      - name: Build published files
        run: npm run web:publish

      - name: Restore permanent workflow and remove patch carrier
        run: |
          git show origin/main:.github/workflows/deploy-pages.yml > .github/workflows/deploy-pages.yml
          rm -f .github/fyh-cleanup.patch.gz.b64
          cmp .github/workflows/deploy-pages.yml <(git show origin/main:.github/workflows/deploy-pages.yml)

      - name: Run complete validation
        run: npm run ci:check

      - name: Commit validated cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "清除班表舊申請流程殘留"
          git push origin HEAD:agent/repo-snapshot-20260717
