name: Inventory Final Renderer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inventory:
    if: github.head_ref == 'agent/final-renderer-decomposition'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Inventory renderer functions
        run: node scripts/inventory-renderer-functions.js
      - name: Upload inventory and source
        uses: actions/upload-artifact@v5
        with:
          name: renderer-final-analysis
          path: |
            renderer-function-inventory.json
            src/renderer/renderer.js
            scripts/build-js.js
            scripts/renderer-core-source.js
            package.json
