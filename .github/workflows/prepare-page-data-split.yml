name: Prepare Page Data Split

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/split-page-data-loaders'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: agent/split-page-data-loaders

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Split page data controllers
        run: node scripts/split-page-data-loaders.js

      - name: Build published web files
        run: npm run web:publish

      - name: Run complete checks without temporary workflow
        run: |
          set -o pipefail
          cp .github/workflows/prepare-page-data-split.yml /tmp/prepare-page-data-split.yml
          rm .github/workflows/prepare-page-data-split.yml
          npm run ci:check 2>&1 | tee page-data-split-ci.log
          cp /tmp/prepare-page-data-split.yml .github/workflows/prepare-page-data-split.yml

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: page-data-split-ci-log
          path: page-data-split-ci.log
          if-no-files-found: ignore

      - name: Commit split modules
        run: |
          rm -f scripts/split-page-data-loaders.js
          rm -f page-data-split-ci.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "拆分打卡訂餐與記錄頁資料控制"
          git push origin HEAD:agent/split-page-data-loaders
