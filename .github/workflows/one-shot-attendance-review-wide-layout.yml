name: One-shot attendance review wide layout

on:
  push:
    branches:
      - main
    paths:
      - .github/attendance-review-wide-layout-trigger.txt

permissions:
  contents: write

jobs:
  apply-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Update attendance review layout
        run: python .github/one-shot-attendance-review-wide-layout.py
      - name: Remove one-shot files
        run: |
          rm -f .github/workflows/one-shot-attendance-review-wide-layout.yml
          rm -f .github/attendance-review-wide-layout-trigger.txt
          rm -f .github/one-shot-attendance-review-wide-layout.py
      - name: Build and validate
        run: |
          npm run web:publish
          npm test
          npm run ci:check
      - name: Commit changes to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "加寬簽到審核版面並調整欄位配置"
          git push origin HEAD:main
