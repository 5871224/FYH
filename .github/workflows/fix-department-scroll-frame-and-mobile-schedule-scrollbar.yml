name: Fix department scroll frame and mobile schedule scrollbar

on:
  push:
    paths:
      - '.github/workflows/fix-department-scroll-frame-and-mobile-schedule-scrollbar.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply scroll frame fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          patch = r'''

          /* The department table wrapper itself is the scroll frame; do not scroll a duplicate border overlay. */
          .department-settings-modal .department-settings-table-wrap::after {
            content: none;
            display: none;
          }

          /* Phones scroll the schedule table directly, so the duplicate scrollbar above the date header is hidden. */
          @media (max-width: 640px) {
            .table-top-scrollbar {
              display: none;
            }

            .table-sticky-header {
              top: 0;
            }
          }
          '''

          marker = '/* The department table wrapper itself is the scroll frame; do not scroll a duplicate border overlay. */'
          for css_path in [Path('src/renderer/ui-system.css'), Path('docs/ui-system.css')]:
              text = css_path.read_text(encoding='utf-8-sig')
              if marker not in text:
                  text = text.rstrip() + patch + '\n'
              css_path.write_text(text, encoding='utf-8-sig')

          for html_path in [Path('src/renderer/index.html'), Path('docs/index.html')]:
              text = html_path.read_text(encoding='utf-8-sig')
              text, count = re.subn(r'\./ui-system\.css\?v=[^"\s]+', './ui-system.css?v=20260709v8', text, count=1)
              if count != 1:
                  raise SystemExit(f'Could not update UI CSS asset version in {html_path}')
              html_path.write_text(text, encoding='utf-8-sig')

          Path('.github/workflows/fix-department-scroll-frame-and-mobile-schedule-scrollbar.yml').unlink()
          PY

      - name: Validate styles
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in ['src/renderer/ui-system.css', 'docs/ui-system.css']:
              text = Path(name).read_text(encoding='utf-8-sig')
              if text.count('{') != text.count('}'):
                  raise SystemExit(f'Unbalanced CSS braces: {name}')
              required = [
                  '.department-settings-modal .department-settings-table-wrap::after',
                  'content: none;',
                  '.table-top-scrollbar',
                  'display: none;',
                  '.table-sticky-header',
                  'top: 0;',
              ]
              missing = [value for value in required if value not in text]
              if missing:
                  raise SystemExit(f'Missing scroll fixes in {name}: {missing}')
          PY

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix department scroll frame and mobile schedule scrollbar'
          git push
