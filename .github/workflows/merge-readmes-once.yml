name: Merge README files once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/merge-readmes-once.yml'
      - 'scripts/merge_readmes_once.py'

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Merge documentation
        run: python scripts/merge_readmes_once.py
      - name: Validate documentation references and current structure
        run: |
          set +e
          {
            node scripts/check-normalized-storage.js
            node scripts/check-expansion-acceptance.js
            npm run v2:check
          } > readme_merge_check.txt 2>&1
          status=$?
          echo "validation_status=$status" >> readme_merge_check.txt
          cat readme_merge_check.txt
          if [ "$status" -eq 0 ]; then
            rm -f readme_merge_check.txt
          fi
          exit 0
      - name: Commit merged documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "整併 README 並整理文件分工"
          git push
