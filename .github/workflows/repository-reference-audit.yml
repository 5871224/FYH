name: Repository Reference Audit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Find exact endpoint references
        shell: python
        run: |
          import re
          from pathlib import Path

          exts = {'.js','.ts','.md','.txt','.json','.yml','.yaml','.ps1','.py','.html','.css','.sql','.bat'}
          rows = []
          patterns = {
            'attendance-overtime': re.compile(r'(["\'])attendance-overtime\1'),
            'member-auth-admin-v2': re.compile(r'(["\'])member-auth-admin-v2\1'),
          }
          for name, pattern in patterns.items():
              rows.append(f'## {name}')
              matches = []
              for path in Path('.').rglob('*'):
                  if not path.is_file() or '.git' in path.parts or 'node_modules' in path.parts or path.suffix.lower() not in exts:
                      continue
                  if str(path).startswith(f'supabase/functions/{name}/') or path.as_posix() == '.github/workflows/repository-reference-audit.yml':
                      continue
                  try:
                      text = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  for number, line in enumerate(text.splitlines(), 1):
                      if pattern.search(line):
                          matches.append(f'{path.as_posix()}:{number}: {line.strip()}')
              rows.extend(matches or ['NONE'])
              rows.append('')
          Path('exact-endpoint-references.txt').write_text('\n'.join(rows), encoding='utf-8')
      - uses: actions/upload-artifact@v4
        with:
          name: exact-endpoint-references
          path: exact-endpoint-references.txt
