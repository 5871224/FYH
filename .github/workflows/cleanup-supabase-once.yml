name: Cleanup Supabase SQL and docs once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-supabase-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Consolidate and validate
        shell: bash
        run: |
          set +e
          log_file=/tmp/supabase-cleanup.log
          : > "$log_file"

          python scripts/cleanup_supabase_once.py >> "$log_file" 2>&1
          cleanup_status=$?

          if [ "$cleanup_status" -eq 0 ]; then
            python - <<'PY' >> "$log_file" 2>&1
          from pathlib import Path

          path = Path('scripts/check-normalized-storage.js')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  'assert(webApi.includes(\'restSelect("set_departments"\'), "loadState should read set_departments table");',
                  'assert(webApi.includes(\'restRpc("get_department_directory_v2"\'), "loadState should use the safe department directory RPC");'
              ),
              (
                  'assert(webApi.includes(\'restSelect("set_employee"\'), "loadState should read set_employee table");',
                  'assert(webApi.includes(\'restRpc("get_employee_directory_v2"\'), "loadState should use the safe employee directory RPC");'
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise RuntimeError(f'missing stale assertion: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
            patch_status=$?
            if [ "$patch_status" -ne 0 ]; then
              cleanup_status=$patch_status
            fi
          fi

          checks_status=0
          if [ "$cleanup_status" -eq 0 ]; then
            rm -f supabase/_cleanup_debug.txt
            node scripts/check-normalized-storage.js >> "$log_file" 2>&1 || checks_status=$?
            if [ "$checks_status" -eq 0 ]; then
              node scripts/check-expansion-acceptance.js >> "$log_file" 2>&1 || checks_status=$?
            fi
            if [ "$checks_status" -eq 0 ]; then
              npm run v2:check >> "$log_file" 2>&1 || checks_status=$?
            fi
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [ "$cleanup_status" -eq 0 ] && [ "$checks_status" -eq 0 ]; then
            git add -A
            git commit -m '整併 Supabase SQL 與部署文件'
            git push
            exit 0
          fi

          git reset --hard HEAD
          cp "$log_file" supabase/_cleanup_debug.txt
          {
            echo ""
            echo "cleanup_status=$cleanup_status"
            echo "checks_status=$checks_status"
          } >> supabase/_cleanup_debug.txt
          git add supabase/_cleanup_debug.txt
          git commit -m '更新 Supabase 清理失敗原因'
          git push
          exit 1
