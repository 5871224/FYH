name: Finalize Edge Runtime

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Canonicalize Edge shared runtime usage
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          targets = {
              "supabase/functions/attendance-ledger/index.ts": ["taipeiDate", "effective"],
              "supabase/functions/attendance-review-groups/index.ts": ["taipeiDate", "effective"],
              "supabase/functions/attendance-ledger-export/index.ts": ["taipeiDate"],
              "supabase/functions/meal-order/index.ts": ["taipeiDateString", "isProfileEffective", "taipeiTimeString"],
              "supabase/functions/meal-report-v2/index.ts": ["taipeiDate", "effective"],
              "supabase/functions/member-auth-admin/index.ts": ["taipeiDateString", "isProfileEffective"],
          }
          for filename, names in targets.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for name in names:
                  pattern = re.compile(rf"\nfunction {re.escape(name)}\([^\n]*\) \{{[\s\S]*?\n\}}\n", re.M)
                  text, count = pattern.subn("\n", text, count=1)
                  if count != 1:
                      raise SystemExit(f"duplicate helper not found: {filename}::{name}")
              path.write_text(text, encoding="utf-8")

          path = Path("supabase/functions/member-auth-admin/index.ts")
          text = path.read_text(encoding="utf-8")
          text = text.replace("actorIdOf, addDaysToDateString, canAccessGroup", "actorIdOf, canAccessGroup")
          text = text.replace("canAccessGroup(ctx, actor.actorId, profile.group_id)", "canAccessGroup(ctx, actor.actorId, profile.group_id, MEMBER_PERMISSION)")
          text = text.replace("canAccessGroup(ctx, actor.actorId, member.groupId)", "canAccessGroup(ctx, actor.actorId, member.groupId, MEMBER_PERMISSION)")
          text = text.replace('    role: accessRole.legacy_role || "employee",\n', "")
          path.write_text(text, encoding="utf-8")

          path = Path("supabase/functions/meal-order/index.ts")
          text = path.read_text(encoding="utf-8")
          text = text.replace("const products = new Map((context.products || []).map", "const products = new Map<string, any>((context.products || []).map")
          text = text.replace("const oldOrders = new Map((context.orders || []).map", "const oldOrders = new Map<string, any>((context.orders || []).map")
          text = text.replace("const effective = new Map(incoming.map", "const effective = new Map<string, NormalizedMealItem>(incoming.map")
          path.write_text(text, encoding="utf-8")

          path = Path("supabase/functions/meal-report-v2/index.ts")
          text = path.read_text(encoding="utf-8")
          text = text.replace("const attendance = new Map((attendanceResult.data || []).map", "const attendance = new Map<string, any>((attendanceResult.data || []).map")
          path.write_text(text, encoding="utf-8")

          path = Path("supabase/functions/attendance-ledger-export/index.ts")
          text = path.read_text(encoding="utf-8")
          text = text.replace("const groupIds = [...new Set((data || []).map", "const groupIds = [...new Set<string>((data || []).map")
          text = text.replace("const rows = (attendanceRows || []).map", "const rows = ((attendanceRows || []) as any[]).map")
          path.write_text(text, encoding="utf-8")

          path = Path("supabase/functions/meal-cancel-v2/index.ts")
          text = path.read_text(encoding="utf-8")
          text = text.replace("settings.data?.daily_cutoff_time", "(settings.data as any)?.daily_cutoff_time")
          path.write_text(text, encoding="utf-8")
          PY
      - name: Edge TypeScript check
        run: |
          failed=0
          for file in \
            supabase/functions/attendance-clock/index.ts \
            supabase/functions/attendance-ledger/index.ts \
            supabase/functions/attendance-review-groups/index.ts \
            supabase/functions/attendance-ledger-export/index.ts \
            supabase/functions/meal-order/index.ts \
            supabase/functions/meal-report-v2/index.ts \
            supabase/functions/meal-cancel-v2/index.ts \
            supabase/functions/member-auth-admin/index.ts; do
            if ! deno check --node-modules-dir=auto "$file" > /tmp/deno.txt 2>&1; then
              msg=$(tail -n 35 /tmp/deno.txt | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
              echo "::error file=$file,title=Deno check failed::$msg"
              failed=1
            fi
          done
          exit "$failed"
      - name: Remove temporary workflow
        run: rm -f .github/workflows/finalize-edge-runtime.yml
      - name: Install dependencies
        run: npm ci
      - name: Validate
        run: npm run ci:check
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "收斂 Edge 共用 Runtime"
          git push origin HEAD:main
