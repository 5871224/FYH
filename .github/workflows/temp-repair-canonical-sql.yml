name: Temporary Repair Canonical SQL

on:
  push:
    branches:
      - feat/access-control-v2-20260901

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Repair SQL
        shell: bash
        run: |
          set -euo pipefail
          python scripts/repair-canonical-sql-20260902.py
          rm scripts/repair-canonical-sql-20260902.py
          rm .github/workflows/temp-repair-canonical-sql.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/002_current_updates.sql scripts/repair-canonical-sql-20260902.py .github/workflows/temp-repair-canonical-sql.yml
          git diff --cached --check
          git commit -m "修復 canonical SQL 語法與權限定義"
          git push
