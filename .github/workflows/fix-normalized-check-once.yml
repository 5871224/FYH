name: Fix Normalized Check Once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          show-progress: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fix check
        run: |
          python3 scripts/fix-normalized-check-once.py
          rm -f scripts/fix-normalized-check-once.py
          rm -f .github/workflows/fix-normalized-check-once.yml

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "更新正規化資料檢查"
          git push origin HEAD:${{ github.head_ref }}

      - name: Check normalized storage
        run: node scripts/check-normalized-storage.js

      - name: Check expansion acceptance
        run: node scripts/check-expansion-acceptance.js

      - name: Check settings lists
        run: node scripts/check-settings-lists.js

      - name: Run V2 checks
        run: npm run v2:check
