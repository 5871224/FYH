name: Apply Connected Page Tabs

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/connect-page-tabs-panel' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Connect tabs and content panels
        run: |
          node scripts/apply-connected-page-tabs.js
          rm scripts/apply-connected-page-tabs.js

      - name: Build static web
        run: npm run web:publish

      - name: Run validation
        shell: bash
        run: |
          npm test
          npm run web:check
          node scripts/check-normalized-storage.js
          node scripts/check-expansion-acceptance.js
          node scripts/check-settings-lists.js
          npm run renderer:check
          npm run css:architecture
          npm run js:architecture

      - name: Commit synchronized changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- scripts/apply-connected-page-tabs.js src/renderer/css/foundation.css src/renderer/css/components.css src/renderer/app.css src/renderer/index.html docs/app.css docs/index.html tests/css-consolidation.test.js '規格書.md'
          git commit -m "讓頁籤列與內容區連在一起"
          git push origin HEAD:${{ github.head_ref }}
