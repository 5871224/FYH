name: Add backend architecture specification once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-backend-architecture-spec-once.yml

permissions:
  contents: write

jobs:
  update-spec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Update specification
        run: python3 scripts/add_backend_architecture_spec_once.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "新增後端架構與平台遷移規格"
          git push origin main
