name: Fix Meal Admin API

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/fix-meal-admin-api'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Align meal admin API actions
        run: node scripts/fix-meal-admin-api-actions.js

      - name: Validate targeted hotfix
        run: |
          node --check src/renderer/web-api.js
          node --check src/renderer/app.js
          node --check docs/app.js
          node --test tests/renderer-phase7-small-api-overrides.test.js tests/meal-admin-api-alignment.test.js
          cmp src/renderer/app.js docs/app.js
          git diff --check

      - name: Commit verified fix
        run: |
          rm -f scripts/fix-meal-admin-api-actions.js
          rm -f .github/workflows/fix-meal-admin-api.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "修正訂餐管理 API 操作名稱"
          git push origin HEAD:agent/fix-meal-admin-api
