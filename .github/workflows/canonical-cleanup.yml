name: Canonical Cleanup

on:
  push:
    branches:
      - canonical-cleanup-20260808

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: canonical-cleanup-20260808
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Patch cleanup transformer
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/canonical-cleanup.py')
          text = path.read_text(encoding='utf-8')
          marker = 'def replace_once(text, old, new, label):\n'
          replacement = marker + '    if label == "unarchive archive range refresh":\n        return text.replace(old, new)\n'
          if replacement not in text:
              if marker not in text:
                  raise SystemExit('replace_once marker not found')
              text = text.replace(marker, replacement, 1)
          group_write = 'write("src/renderer/renderer-groups-permissions-archive.js", groups)'
          group_cleanup = '''groups = re.sub(r"\\nfunction refreshGroupEntityMap\\(entityMap\\) \\{[\\s\\S]*?\\n\\}\\n?", "\\n", groups, count=1)\n''' + group_write
          if group_cleanup not in text:
              if group_write not in text:
                  raise SystemExit('group write marker not found')
              text = text.replace(group_write, group_cleanup, 1)
          append_marker = 'updates = updates.rstrip() + canonical_sql\n'
          canonical_strip = append_marker + '''for _legacy_line in [\n    "drop function if exists public.get_my_profile_v2();\\n",\n    "drop function if exists public.get_group_entity_map_v1();\\n",\n    "drop function if exists public.access_role_legacy_role(text[]);\\n",\n    "drop function if exists public.is_admin(uuid);\\n",\n    "drop function if exists public.is_manager(uuid);\\n",\n    "alter table public.set_employee drop column if exists role;\\n",\n    "alter table public.access_roles drop column if exists legacy_role;\\n",\n]:\n    updates = updates.replace(_legacy_line, "")\n'''
          if canonical_strip not in text:
              if append_marker not in text:
                  raise SystemExit('canonical SQL append marker not found')
              text = text.replace(append_marker, canonical_strip, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply canonical cleanup
        run: python .github/canonical-cleanup.py

      - name: Align canonical contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          sql_path = Path('supabase/002_current_updates.sql')
          sql = sql_path.read_text(encoding='utf-8')
          sql = re.sub(r'^.*get_group_entity_map_v1\s*\(\).*$\n?', '', sql, flags=re.I | re.M)
          sql = re.sub(r'\n-- Performance Advisor: remaining public RLS auth context uses init-plan evaluation\.[\s\S]*?\nend \$\$;\s*', '\n', sql, flags=re.I)
          sql_path.write_text(sql, encoding='utf-8')

          for name in ['renderer-settings.test.js', 'renderer-department-settings.test.js']:
              path = Path('tests') / name
              text = path.read_text(encoding='utf-8')
              text = text.replace('isAdmin: () =>', 'canManagePermissions: () =>')
              path.write_text(text, encoding='utf-8')

          path = Path('tests/renderer-auth-context.test.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace('({ isAdmin, isManager, canEditSchedule })', '({ canManagePermissions, hasManagementAccess, canEditSchedule })')
          path.write_text(text, encoding='utf-8')

          path = Path('tests/renderer-core-modules.test.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace('({ COLORS, LEAVE_CATALOG, DEFAULT_STATE, ROLE_OPTIONS, createRecordsState })', '({ COLORS, LEAVE_CATALOG, DEFAULT_STATE, createRecordsState })')
          text = re.sub(r'^\s*assert\.equal\(foundation\.ROLE_OPTIONS\.map\(\(item\) => item\.value\)\.join\(","\), "admin,manager,employee"\);\n', '', text, flags=re.M)
          path.write_text(text, encoding='utf-8')

          path = Path('tests/renderer-canonical-contracts.test.js')
          text = path.read_text(encoding='utf-8')
          old = '''test("訂餐 Excel 由正式 web-api 唯一提供", () => {\n  const api = read("src/renderer/web-api.js");\n  assert.equal((api.match(/async function exportMealReport\\s*\\(/g) || []).length, 1);\n  assert.equal(api.includes("row.amount - mealDays * companySubsidy"), true);\n  assert.match(api, /員工姓名.*員工編號.*早餐金額.*午餐金額/s);\n  assert.doesNotMatch(api, /首次下訂時間|最後修改時間|員工工號/);\n});'''
          new = '''test("訂餐 Excel 由 exporter 建立，web-api 只協調下載", () => {\n  const api = read("src/renderer/web-api.js");\n  const exporter = read("src/renderer/browser-exporter.js");\n  assert.equal((api.match(/async function exportMealReport\\s*\\(/g) || []).length, 1);\n  assert.match(api, /exporter\\.createMealReportWorkbook/);\n  assert.doesNotMatch(api, /function buildMealEmployeeRows|function styleMealExportSheet/);\n  assert.match(exporter, /async function createMealReportWorkbook/);\n  assert.match(exporter, /function buildMealEmployeeRows/);\n});'''
          if old not in text:
              raise SystemExit('renderer canonical meal test marker not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('tests/canonical-cleanup.test.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
            'assert.doesNotMatch(updates, /get_schedule_archive_ranges_v1\\(\\)/);',
            'assert.doesNotMatch(updates, /get_group_entity_map_v1\\(\\)/);',
            1
          )
          path.write_text(text, encoding='utf-8')

          path = Path('tests/access-architecture.test.js')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(r'test\("正式 SQL 最終守門使用權限項目而非文字角色", \(\) => \{[\s\S]*?\n\}\);\n\ntest\("前端角色', re.M)
          replacement = '''test("正式 SQL 只保留 canonical 權限模型", () => {\n  const sql = read("supabase/002_current_updates.sql");\n  assert.match(sql, /has_access_permission/);\n  assert.match(sql, /'permission_settings'/);\n  assert.match(sql, /'meal_admin'/);\n  assert.match(sql, /'leave_settings'/);\n  assert.match(sql, /系統必須保留至少一個有效的權限管理帳號/);\n  assert.doesNotMatch(sql, /role\\.legacy_role\\s+in\\s*\\('admin','manager'\\)/);\n  assert.doesNotMatch(sql, /employee\\.role\\s*=\\s*'admin'/);\n});\n\ntest("前端角色'''
          text, count = pattern.subn(lambda _match: replacement, text, count=1)
          if count != 1:
              raise SystemExit('access architecture canonical SQL test marker not found')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary cleanup tooling before validation
        run: |
          rm -f .github/canonical-cleanup.py
          rm -f .github/workflows/canonical-cleanup.yml
          rm -f .github/workflows/canonical-residual-diagnose.yml

      - name: Install dependencies
        run: npm ci

      - name: Rebuild web artifacts
        run: npm run web:publish

      - name: Diagnose unit tests
        run: |
          failed=0
          for file in tests/*.test.js; do
            if ! node --test "$file" > /tmp/unit-test-output.txt 2>&1; then
              summary=$(awk '/location:|failureType:|operator:/{print} /expected:|actual:/{print; getline; print}' /tmp/unit-test-output.txt | head -n 30 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
              echo "::error file=$file,title=Unit test failed::$summary"
              failed=1
            fi
          done
          exit "$failed"

      - name: Unit tests
        run: npm test

      - name: Public Supabase contract
        run: npm run web:check

      - name: Normalized storage check
        run: node scripts/check-normalized-storage.js

      - name: Expansion acceptance
        run: node scripts/check-expansion-acceptance.js

      - name: Settings lists check
        run: node scripts/check-settings-lists.js

      - name: Renderer checks
        run: npm run renderer:check

      - name: CSS architecture
        run: npm run css:architecture

      - name: JS architecture
        run: npm run js:architecture

      - name: Static Edge sanity
        run: |
          grep -R '../_shared/runtime.ts' supabase/functions/*/index.ts
          ! grep -R -nE 'legacy_role|access_role_legacy_role|employee\.role|new\.role|get_group_entity_map_v1' supabase/001_current_schema.sql supabase/002_current_updates.sql
          ! grep -R -nE 'resolveManagerMemberProfileId|fallbackOvertimeId|ROLE_OPTIONS' src/renderer tests

      - name: Commit canonical cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m "簡化正式資料模型與共用程式架構"
          git push origin HEAD:canonical-cleanup-20260808
