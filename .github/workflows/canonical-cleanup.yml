name: Canonical Cleanup

on:
  push:
    branches:
      - canonical-cleanup-20260808

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canonical-cleanup-20260808
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply canonical cleanup
        run: python .github/canonical-cleanup.py

      - name: Install dependencies
        run: npm ci

      - name: Rebuild web artifacts
        run: npm run web:publish

      - name: Full CI
        run: npm run ci:check

      - name: Static Edge sanity
        run: |
          grep -R '../_shared/runtime.ts' supabase/functions/*/index.ts
          ! grep -R -nE 'legacy_role|access_role_legacy_role|employee\.role|new\.role' supabase/001_current_schema.sql supabase/002_current_updates.sql
          ! grep -R -nE 'resolveManagerMemberProfileId|fallbackOvertimeId|ROLE_OPTIONS' src/renderer tests

      - name: Remove temporary cleanup tooling
        run: |
          rm -f .github/canonical-cleanup.py
          rm -f .github/workflows/canonical-cleanup.yml

      - name: Commit canonical cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m "簡化正式資料模型與共用程式架構"
          git push origin HEAD:canonical-cleanup-20260808
