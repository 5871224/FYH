name: Apply schedule UI update

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply requested changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/agent-schedule-ui-20260730.yml').read_text(encoding='utf-8')
          marker = "python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          script = dedent(workflow[start:end])
          exec(compile(script, 'schedule-ui-update.py', 'exec'), {'__name__': '__main__'})
          PY

      - name: Install dependencies
        run: npm install

      - name: Build and publish static files
        run: npm run web:publish

      - name: Validate project
        run: npm run ci:check

      - name: Publish one complete commit to main
        shell: bash
        run: |
          rm -f .github/workflows/agent-schedule-ui-20260730.yml .github/workflows/agent-schedule-ui-pr.yml
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --soft origin/main
          git add -A
          git commit -m "調整班表週期導覽與例假排班顯示"
          git push origin HEAD:main
