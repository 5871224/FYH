name: 同步簽到審核列印版面

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-attendance-review-print-layout.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 調整正式來源與規格
        run: node scripts/temp-sync-attendance-review-print-layout.js
      - name: 移除暫時檔案
        run: |
          git rm .github/workflows/sync-attendance-review-print-layout.yml
          git rm scripts/temp-sync-attendance-review-print-layout.js
      - name: 建置與測試
        run: |
          node --check src/renderer/renderer-records-actions.js
          node --test tests/attendance-review-print.test.js
          npm run web:publish
          npm run ci:check
      - name: 提交正式修改
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/renderer-records-actions.js tests/attendance-review-print.test.js 規格書.md src/renderer/app.js src/renderer/index.html src/renderer/app.css docs
          git commit -m "feat: align attendance review print layout"
          git push origin HEAD:main
