name: Fix Scheduler Bootstrap SQL

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Fix canonical scheduler bootstrap SQL
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/002_current_updates.sql')
          text = path.read_text(encoding='utf-8')
          old = "  'accessBundle',public.get_group_access_bundle_v1(),\n) else null end"
          new = "  'accessBundle',public.get_group_access_bundle_v1()\n) else null end"
          if old not in text:
              raise SystemExit('scheduler bootstrap trailing comma marker missing')
          text = text.replace(old, new, 1)
          if 'member.role' in text or 'get_group_entity_map_v1()' in text:
              raise SystemExit('legacy scheduler bootstrap reference still present')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Remove temporary workflow
        run: rm -f .github/workflows/fix-scheduler-bootstrap-sql.yml
      - name: Install dependencies
        run: npm ci
      - name: Validate
        run: npm run ci:check
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "修正班表 Bootstrap SQL 與舊角色欄位脫鉤"
          git push origin HEAD:main
