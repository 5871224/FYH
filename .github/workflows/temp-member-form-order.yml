name: Temp member form order update

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-member-form-order.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Reorder member form fields
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/renderer/renderer-groups-permissions-archive.js')
          text = path.read_text(encoding='utf-8')
          markers = {
              'name_vi': '<div class="form-row"><label for="memberNameVi">',
              'role': '<div class="form-row"><label for="memberRole">',
              'salary': '<div class="form-row"><label for="memberSalaryType">',
              'hire': '<div class="form-row"><label for="memberHireDate">',
              'leave': '<div class="form-row"><label for="memberLeaveDate">',
              'rest': '<div class="form-row"><label for="memberFixedRestWeekday">',
              'group': '<div class="form-row"><label for="memberGroup">',
          }
          positions = {key: text.find(marker) for key, marker in markers.items()}
          if any(pos < 0 for pos in positions.values()):
              raise SystemExit(f'Missing member form marker: {positions}')
          order = [positions[key] for key in ('name_vi', 'role', 'salary', 'hire', 'leave', 'rest', 'group')]
          if order != sorted(order):
              raise SystemExit(f'Unexpected member form order: {positions}')

          i_name_vi = positions['name_vi']
          i_role = positions['role']
          i_salary = positions['salary']
          i_hire = positions['hire']
          i_leave = positions['leave']
          i_rest = positions['rest']
          i_group = positions['group']

          name_vi = text[i_name_vi:i_role]
          role = text[i_role:i_salary]
          salary = text[i_salary:i_hire]
          hire = text[i_hire:i_leave]
          leave = text[i_leave:i_rest]
          rest = text[i_rest:i_group]
          text = text[:i_name_vi] + role + name_vi + hire + leave + salary + rest + text[i_group:]
          path.write_text(text, encoding='utf-8')
          PY
          npm run web:publish
          rm .github/workflows/temp-member-form-order.yml
      - name: Commit generated output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "調整班表修改人員欄位順序"
          git push origin HEAD:main
