name: Temp member form order update

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-member-form-order.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Reorder member form fields
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/renderer/renderer-settings-member.js')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'(<div class="form-row"><label for="memberNameVi">.*?</div>)'
              r'(<div class="form-row"><label for="memberRole">.*?</div>)'
              r'(<div class="form-row"><label for="memberSalaryType">.*?</div>)'
              r'(<div class="form-row"><label for="memberHireDate">.*?</div>)'
              r'(<div class="form-row"><label for="memberLeaveDate">.*?</div>)'
              r'(<div class="form-row"><label for="memberFixedRestWeekday">.*?</div>)'
          )
          text, count = pattern.subn(r'\2\1\4\5\3\6', text, count=1)
          if count != 1:
              raise SystemExit(f'Expected exactly one member form field sequence, got {count}')
          path.write_text(text, encoding='utf-8')
          PY
          npm run web:publish
          rm .github/workflows/temp-member-form-order.yml
      - name: Commit generated output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "調整班表修改人員欄位順序"
          git push origin HEAD:main
