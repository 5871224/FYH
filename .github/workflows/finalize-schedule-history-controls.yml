name: Finalize schedule history controls

on:
  push:
    paths:
      - '.github/workflows/finalize-schedule-history-controls.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and bump asset version
        shell: bash
        run: |
          set -euo pipefail
          node --check src/renderer/v2-schedule-history-controls.js
          cmp src/renderer/v2-schedule-history-controls.js docs/v2-schedule-history-controls.js
          python3 - <<'PY'
          from pathlib import Path
          for name in ['src/renderer/index.html', 'docs/index.html']:
              path = Path(name)
              text = path.read_text(encoding='utf-8-sig')
              text = text.replace('./v2-schedule-history-controls.js?v=20260708v1', './v2-schedule-history-controls.js?v=20260708v2')
              path.write_text(text, encoding='utf-8-sig')
          Path('.github/workflows/finalize-schedule-history-controls.yml').unlink()
          PY
      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/renderer/index.html docs/index.html '.github/workflows/finalize-schedule-history-controls.yml'
          git commit -m 'Finalize schedule history controls'
          git push
