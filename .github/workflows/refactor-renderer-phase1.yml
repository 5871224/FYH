name: Refactor Renderer Phase 1

on:
  push:
    branches:
      - agent/split-renderer-phase1

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[renderer-refactor-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: agent/split-renderer-phase1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Split renderer modules
        run: node scripts/refactor-renderer-phase1.js

      - name: Build published web
        run: npm run web:publish

      - name: Run complete checks
        run: npm run ci:check

      - name: Remove temporary migration files
        run: |
          rm scripts/refactor-renderer-phase1.js
          rm .github/workflows/refactor-renderer-phase1.yml

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "拆分 renderer 核心模組 [renderer-refactor-applied]"
          git push origin HEAD:agent/split-renderer-phase1
