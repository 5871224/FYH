name: Cleanup Obsolete Migration Artifacts

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/final-codebase-optimization'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: agent/final-codebase-optimization

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Remove obsolete migration artifacts
        run: node scripts/remove-obsolete-migration-artifacts.js

      - name: Build published web files
        run: npm run web:publish

      - name: Run complete checks without temporary workflow
        run: |
          set -o pipefail
          cp .github/workflows/cleanup-obsolete-migration-artifacts.yml /tmp/cleanup-obsolete-migration-artifacts.yml
          rm .github/workflows/cleanup-obsolete-migration-artifacts.yml
          npm run ci:check 2>&1 | tee obsolete-artifacts-ci.log
          cp /tmp/cleanup-obsolete-migration-artifacts.yml .github/workflows/cleanup-obsolete-migration-artifacts.yml

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: obsolete-artifacts-cleanup-log
          path: obsolete-artifacts-ci.log
          if-no-files-found: ignore

      - name: Commit verified cleanup
        run: |
          rm -f scripts/remove-obsolete-migration-artifacts.js obsolete-artifacts-ci.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ':!.github/workflows/cleanup-obsolete-migration-artifacts.yml'
          git commit -m "移除過時遷移腳本與修補命名"
          git push origin HEAD:agent/final-codebase-optimization
