name: Fix Eight Week Schedule Load

on:
  push:
    branches:
      - fix/schedule-eight-week-unlimited-load-20260809

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/schedule-eight-week-unlimited-load-20260809
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply fix
        run: python scripts/tmp-fix-eight-week-schedule-load.py
      - name: Rebuild generated web
        run: npm run web:publish
      - name: Remove temporary tools
        run: |
          rm .github/workflows/fix-eight-week-schedule-load-temp.yml
          rm scripts/tmp-fix-eight-week-schedule-load.py
      - name: Run complete validation
        run: npm run ci:check
      - name: Check diff
        run: git diff --check
      - name: Commit finalized fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "修正班表八週完整載入不受單次回傳上限截斷"
          git push origin HEAD:fix/schedule-eight-week-unlimited-load-20260809
