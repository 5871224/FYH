name: Temporary Vietnamese Function UI Labels

on:
  push:
    branches:
      - fix/vietnamese-function-ui-labels-20260901

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/vietnamese-function-ui-labels-20260901
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Apply localization changes
        run: node scripts/tmp-vietnamese-function-ui-labels.js

      - name: Remove temporary tooling
        run: rm -f scripts/tmp-vietnamese-function-ui-labels.js .github/workflows/tmp-vietnamese-function-ui-labels.yml

      - name: Build published web files
        run: npm run web:publish

      - name: Run validation
        run: |
          npm test
          node scripts/check-normalized-storage.js
          npm run renderer:check
          npm run css:architecture
          npm run js:architecture

      - name: Commit formal changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "補齊功能頁表格與按鈕越文"
          git push origin HEAD:fix/vietnamese-function-ui-labels-20260901
