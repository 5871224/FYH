name: Temporary audit follow-up fix

on:
  push:
    branches:
      - fix/audit-followup-20260903

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Apply canonical frontend fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/renderer/renderer-events-click.js",
              '''function openToolbarChipEditor(type, id) {
            if (!id || (type !== "shift" && type !== "leave")) return false;
            if (!canEditSchedule()) {
              requireCurrentGroupUiPermission("schedule_manage", `修改${type === "shift" ? "班別" : "假別"}`);
              return true;
            }
            toolbarRapidEditOpenedAt = Date.now();''',
              '''function openToolbarChipEditor(type, id) {
            if (!id || (type !== "shift" && type !== "leave")) return false;
            if (type === "shift" && !canEditSchedule()) {
              requireCurrentGroupUiPermission("schedule_manage", "修改班別");
              return true;
            }
            if (type === "leave" && !hasCommonPermission("leave_settings")) {
              requireCommonUiPermission("leave_settings", "修改假別");
              return true;
            }
            toolbarRapidEditOpenedAt = Date.now();'''
          )

          replace_once(
              "src/renderer/renderer-groups-permissions-archive.js",
              '''  const dates = typeof getVisibleDates === "function" ? getVisibleDates() : [];
            const archivedVisible = dates.some((date) => isArchivedDate(date));
            const card = document.getElementById("scheduleCard");
            let banner = document.getElementById("scheduleArchiveBanner");
            if (!archivedVisible) { banner?.remove(); return; }
            if (!banner && card) {
              banner = document.createElement("div");
              banner.id = "scheduleArchiveBanner";
              banner.className = "schedule-archive-banner";
              const nav = card.querySelector(".calendar-nav");
              nav?.insertAdjacentElement("afterend", banner);
            }
            if (banner) banner.textContent = "顯示範圍包含已封存班表；封存日期不可變動。";
          }

          function ensureGroupSelector() {
            const tableViewSelect = document.getElementById("tableViewSelect");
            if (!tableViewSelect) return;
            let selector = document.getElementById("scheduleGroupSelect");
            if (!selector) {
              selector = document.createElement("select");
              selector.id = "scheduleGroupSelect";
              selector.setAttribute("aria-label", "群組");
              tableViewSelect.insertAdjacentElement("beforebegin", selector);
            }
            const options = getSelectableGroups();
            selector.innerHTML = options.map((group) => `<option value="${escapeHtml(group.id)}" ${group.id === groupFeatureState.currentGroupId ? "selected" : ""}>${escapeHtml(group.name)}</option>`).join("");
            selector.hidden = options.length === 0;
            selector.disabled = options.length <= 1;
          }''',
              '''  const dates = typeof getVisibleDates === "function" ? getVisibleDates() : [];
            const archivedVisible = dates.some((date) => isArchivedDate(date));
            const banner = document.getElementById("scheduleArchiveBanner");
            if (!banner) return;
            banner.hidden = !archivedVisible;
            banner.textContent = archivedVisible
              ? "顯示範圍包含已封存班表；封存日期不可變動。"
              : "";
          }

          function renderGroupSelector() {
            const selector = document.getElementById("scheduleGroupSelect");
            if (!selector) return;
            const options = getSelectableGroups();
            selector.innerHTML = options.map((group) => `<option value="${escapeHtml(group.id)}" ${group.id === groupFeatureState.currentGroupId ? "selected" : ""}>${escapeHtml(group.name)}</option>`).join("");
            selector.hidden = options.length === 0;
            selector.disabled = options.length <= 1;
          }'''
          )

          replace_once(
              "src/renderer/renderer-groups-permissions-archive.js",
              '''function syncPermissionUi() {
            ensureGroupSelector();
            markArchivedScheduleCells();''',
              '''function syncPermissionUi() {
            renderGroupSelector();
            markArchivedScheduleCells();'''
          )

          replace_once(
              "src/renderer/index.html",
              '''        <div class="calendar-nav-left">
                    <select id="tableViewSelect" aria-label="班表檢視">''',
              '''        <div class="calendar-nav-left">
                    <select id="scheduleGroupSelect" aria-label="群組" hidden></select>
                    <select id="tableViewSelect" aria-label="班表檢視">'''
          )

          replace_once(
              "src/renderer/index.html",
              '''        </div>
                </div>

                <div class="table-top-scrollbar" id="tableTopScrollbar"''',
              '''        </div>
                </div>
                <div class="schedule-archive-banner" id="scheduleArchiveBanner" role="status" hidden></div>

                <div class="table-top-scrollbar" id="tableTopScrollbar"'''
          )

          Path("tests/audit-followup-frontend-regression.test.js").write_text(r'''const test = require("node:test");
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const path = require("node:path");

          const root = path.resolve(__dirname, "..");
          const read = (file) => fs.readFileSync(path.join(root, file), "utf8");

          test("toolbar quick edit keeps shift and leave permissions separate", () => {
            const source = read("src/renderer/renderer-events-click.js");
            assert.match(source, /type === "shift" && !canEditSchedule\(\)/);
            assert.match(source, /requireCurrentGroupUiPermission\("schedule_manage", "修改班別"\)/);
            assert.match(source, /type === "leave" && !hasCommonPermission\("leave_settings"\)/);
            assert.match(source, /requireCommonUiPermission\("leave_settings", "修改假別"\)/);
            assert.doesNotMatch(source, /修改\$\{type === "shift" \? "班別" : "假別"\}/);
          });

          test("schedule group selector and archive banner are canonical static markup", () => {
            const html = read("src/renderer/index.html");
            const source = read("src/renderer/renderer-groups-permissions-archive.js");
            assert.match(html, /<select id="scheduleGroupSelect" aria-label="群組" hidden><\/select>/);
            assert.match(html, /<div class="schedule-archive-banner" id="scheduleArchiveBanner" role="status" hidden><\/div>/);
            assert.match(source, /function renderGroupSelector\(\)/);
            assert.match(source, /banner\.hidden = !archivedVisible/);
            assert.doesNotMatch(source, /ensureGroupSelector/);
            assert.doesNotMatch(source, /insertAdjacentElement/);
            assert.doesNotMatch(source, /document\.createElement\("select"\)/);
            assert.doesNotMatch(source, /scheduleArchiveBanner"\);\s*banner\?\.remove/);
          });
          ''', encoding="utf-8")
          PY

      - name: Build generated web
        run: npm run web:publish

      - name: Remove temporary workflow before checks
        run: rm .github/workflows/temp-fix-audit-followup.yml

      - name: Run full checks
        run: npm run ci:check

      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "修正假別權限與班表靜態介面"
          git push origin HEAD:fix/audit-followup-20260903
