name: Update personal records and export periods

on:
  push:
    paths:
      - '.github/workflows/update-personal-and-export-period.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          personal_loader = '''  async function loadPersonalRecordsLive() {
            if (!api?.getPersonalRecords) return;
            recordsState = { ...recordsState, loading: true, error: "" };
            if (typeof renderAll === "function") renderAll();
            try {
              const result = await api.getPersonalRecords({
                ...(recordsState.personalFilters || {}),
                page: Number(recordsState.personalPage || 1)
              });
              recordsState = {
                ...recordsState,
                loading: false,
                personal: result.records || [],
                personalTotal: Number(result.total || 0),
                personalPage: Number(result.page || 1),
                personalPageSize: Number(result.pageSize || 50),
                error: ""
              };
            } catch (error) {
              recordsState = {
                ...recordsState,
                loading: false,
                personal: [],
                error: error.message || "讀取記錄失敗"
              };
            }
            if (typeof renderAll === "function") renderAll();
          }

          '''

          for name in ['src/renderer/v2-live-report-filters.js', 'docs/v2-live-report-filters.js']:
            path = Path(name)
            text = path.read_text(encoding='utf-8')
            if 'async function loadPersonalRecordsLive()' not in text:
              text = text.replace('  installRangeExporters();\n\n', personal_loader + '  installRangeExporters();\n\n', 1)
            text = text.replace('scheduleReload("personal", typeof loadRecordsPage === "function" ? loadRecordsPage : null);', 'scheduleReload("personal", loadPersonalRecordsLive);')
            text = text.replace('  document.addEventListener("click", (event) => {\n    const button = event.target.closest("button");', '  document.addEventListener("click", (event) => {\n    if (!(event.target instanceof Element)) return;\n    const button = event.target.closest("button");')
            path.write_text(text, encoding='utf-8')

          for name in ['src/renderer/index.html', 'docs/index.html']:
            path = Path(name)
            text = path.read_text(encoding='utf-8-sig')
            text = text.replace('./v2-live-report-filters.js?v=20260708v1', './v2-live-report-filters.js?v=20260708v2')
            path.write_text(text, encoding='utf-8-sig')

          spec_path = Path('規格書.txt')
          spec = spec_path.read_text(encoding='utf-8')
          old_personal = '''1. 日期起日。
          2. 日期迄日。
          3. 查詢。
          4. 上一頁。
          5. 下一頁。
          6. 每頁 50 筆。
          7. 可查詢全部歷史，不限最近 30 天。
          8. 不顯示操作欄。'''.replace('          ', '')
          new_personal = '''1. 日期起日。
          2. 日期迄日。
          3. 使用者變更開始日期或結束日期後，立即重新查詢並更新表格。
          4. 本分頁不顯示查詢按鈕。
          5. 上一頁。
          6. 下一頁。
          7. 每頁 50 筆。
          8. 可查詢全部歷史，不限最近 30 天。
          9. 不顯示操作欄。'''.replace('          ', '')
          if old_personal not in spec:
            raise SystemExit('personal records specification target not found')
          spec = spec.replace(old_personal, new_personal, 1)

          old_toolbar = '''1. 班別、假別、加班項目以彩色按鈕顯示。
          2. 可依單位篩選班別。
          3. 工具列可收合。
          4. 隱藏於工具列的設定項目仍保留歷史班表顯示。
          5. 按 `Esc` 可取消目前選取的排班工具。'''.replace('          ', '')
          new_toolbar = '''1. 班別、假別、加班項目以彩色按鈕顯示。
          2. 可依單位篩選班別。
          3. 工具列可收合。
          4. 隱藏於工具列的設定項目仍保留歷史班表顯示。
          5. 按 `Esc` 可取消目前選取的排班工具。
          6. 「匯出休例假」、「匯出請假」及「匯出加班」按下後，先顯示日期範圍選擇視窗，再依選定期間匯出。
          7. 日期範圍視窗包含開始日期、結束日期、取消與對應的匯出按鈕。
          8. 匯出前會重新載入選定期間的正式班表資料，不受目前班表畫面顯示的八週範圍限制。
          9. 匯出檔名包含選定的開始日期與結束日期。'''.replace('          ', '')
          if old_toolbar not in spec:
            raise SystemExit('toolbar specification target not found')
          spec = spec.replace(old_toolbar, new_toolbar, 1)

          period_anchor = '''### 3.3.7 國定假日與週期設定

          1. 國定假日保存日期、名稱與排序。
          2. 週期設定包括：'''.replace('          ', '')
          period_replacement = '''### 3.3.7 國定假日與週期設定

          1. 國定假日保存日期、名稱與排序。
          2. 週期設定包括：'''.replace('          ', '')
          if period_anchor not in spec:
            raise SystemExit('period settings anchor not found')
          spec = spec.replace(period_anchor, period_replacement, 1)

          marker = '4. 主管與管理員可維護週期與國定假日。'
          period_rules = '''4. 主管與管理員可維護週期與國定假日。
          5. 匯出期間依「每月起算日」切分；例如每月起算日為 26 日，每期為上月 26 日至本月 25 日。
          6. 三種班表匯出視窗的預設值一律使用「今天所在期間的上一期」。
          7. 例如每月起算日為 26 日：
             - 今天是 7 月 28 日時，預設為 6 月 26 日至 7 月 25 日。
             - 今天是 7 月 25 日時，預設為 5 月 26 日至 6 月 25 日。
          8. 使用者可在匯出前自行修改開始日期與結束日期，開始日期不得晚於結束日期。
          9. 每月起算日為 29、30 或 31，而月份沒有該日期時，該月以最後一日作為起算日。'''.replace('          ', '')
          if marker not in spec:
            raise SystemExit('period rule marker not found')
          spec = spec.replace(marker, period_rules, 1)
          spec_path.write_text(spec, encoding='utf-8')

          Path('.github/workflows/update-personal-and-export-period.yml').unlink()
          PY
      - name: Validate JavaScript
        shell: bash
        run: |
          node --check src/renderer/v2-live-report-filters.js
          cmp src/renderer/v2-live-report-filters.js docs/v2-live-report-filters.js
      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/renderer/v2-live-report-filters.js docs/v2-live-report-filters.js src/renderer/index.html docs/index.html '規格書.txt' '.github/workflows/update-personal-and-export-period.yml'
          git commit -m 'Add previous-period export date selection'
          git push
