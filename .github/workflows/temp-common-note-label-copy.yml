name: Temporary Common Note Label Runner

on:
  push:
    branches:
      - agent/common-note-label-copy

permissions:
  contents: write

concurrency:
  group: temp-common-note-label-copy
  cancel-in-progress: true

jobs:
  update:
    if: github.event.head_commit.message != 'Update common note helper label'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/common-note-label-copy
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Apply source change
        run: python3 scripts/temp-common-note-label-copy.py
      - name: Install
        run: npm ci
      - name: Build static web
        run: npm run web:publish
      - name: Full validation
        shell: bash
        run: |
          mkdir -p .tmp-runner
          mv .github/workflows/temp-common-note-label-copy.yml .tmp-runner/temp-workflow.yml
          mv scripts/temp-common-note-label-copy.py .tmp-runner/temp-updater.py
          trap 'mv .tmp-runner/temp-workflow.yml .github/workflows/temp-common-note-label-copy.yml 2>/dev/null || true; mv .tmp-runner/temp-updater.py scripts/temp-common-note-label-copy.py 2>/dev/null || true' EXIT
          npm run ci:check
          mv .tmp-runner/temp-workflow.yml .github/workflows/temp-common-note-label-copy.yml
          mv .tmp-runner/temp-updater.py scripts/temp-common-note-label-copy.py
          rmdir .tmp-runner
          trap - EXIT
      - name: Commit source and generated files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer docs
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update common note helper label"
          git push origin HEAD:agent/common-note-label-copy
