name: Finalize Week Scroll Sync Loop

on:
  push:
    branches:
      - fix/week-scroll-sync-loop-20260809

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/week-scroll-sync-loop-20260809
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Rebuild and publish static artifacts
        run: npm run web:publish
      - name: Remove temporary workflow before validation
        run: rm .github/workflows/finalize-week-scroll-sync-loop.yml
      - name: Run complete validation
        id: validation
        continue-on-error: true
        run: npm run ci:check > ci-output.txt 2>&1
      - name: Upload validation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week-scroll-validation-output
          path: ci-output.txt
      - name: Stop when validation failed
        if: steps.validation.outcome != 'success'
        run: exit 1
      - name: Commit finalized change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/app.js src/renderer/app.css docs .github/workflows/finalize-week-scroll-sync-loop.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "完成班表捲軸同步修正"
          git push origin HEAD:fix/week-scroll-sync-loop-20260809
