name: Finalize Group Delete Guard

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Fix missing custom GUC guard
        run: python -c "from pathlib import Path; p=Path('supabase/002_current_updates.sql'); s=p.read_text(encoding='utf-8'); old=\"current_setting('fyh.group_delete',true)<>'on'\"; new=\"coalesce(current_setting('fyh.group_delete',true),'')<>'on'\"; n=s.count(old); assert n>=1, 'group delete guard marker missing'; p.write_text(s.replace(old,new),encoding='utf-8')"
      - name: Remove temporary workflow
        run: rm -f .github/workflows/finalize-group-delete-guard.yml
      - name: Install dependencies
        run: npm ci
      - name: Validate
        run: npm run ci:check
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "修正人員群組刪除守門條件"
          git push origin HEAD:main
