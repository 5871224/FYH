name: Temporary schedule drag build

on:
  push:
    branches:
      - fix/schedule-drag-persistence-temp

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Build static web
        run: npm run web:publish

      - name: Run tests
        run: npm test

      - name: Check web settings
        run: npm run web:check

      - name: Check renderer bundles
        run: npm run renderer:check

      - name: Commit generated bundles and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temp-build-schedule-order.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/renderer/app.js docs/app.js docs/styles.css docs/index.html .github/workflows/temp-build-schedule-order.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: publish schedule drag persistence"
          git push origin HEAD:fix/schedule-drag-persistence-temp
