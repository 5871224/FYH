name: Sync RLS Performance Temp

on:
  push:
    branches:
      - perf-optimization-pass-20260808

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Sync advisor-verified RLS init-plan normalization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/002_current_updates.sql')
          text = path.read_text()
          marker = '-- Performance Advisor: remaining public RLS auth context uses init-plan evaluation.'
          if marker not in text:
              text = text.rstrip() + '''\n\n\n-- Performance Advisor: remaining public RLS auth context uses init-plan evaluation.\n-- Browser writes remain RPC-only; this keeps the RLS second line of defense efficient.\ndo $$\ndeclare\n  p record;\n  q text;\n  c text;\n  stmt text;\nbegin\n  for p in\n    select schemaname,tablename,policyname,qual,with_check\n    from pg_policies\n    where schemaname='public'\n  loop\n    q:=p.qual;\n    c:=p.with_check;\n    if q is not null then\n      q:=replace(replace(q,'auth.uid()','(select auth.uid())'),'auth.role()','(select auth.role())');\n    end if;\n    if c is not null then\n      c:=replace(replace(c,'auth.uid()','(select auth.uid())'),'auth.role()','(select auth.role())');\n    end if;\n    if q is distinct from p.qual or c is distinct from p.with_check then\n      stmt:=format('alter policy %I on %I.%I',p.policyname,p.schemaname,p.tablename);\n      if q is not null then stmt:=stmt||' using ('||q||')'; end if;\n      if c is not null then stmt:=stmt||' with check ('||c||')'; end if;\n      execute stmt;\n    end if;\n  end loop;\nend $$;\n'''
              path.write_text(text)
          PY
      - name: Run complete CI
        run: npm run ci:check
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          git rm -f .github/workflows/sync-rls-perf-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "同步 RLS 效能守門"
          git push origin HEAD:perf-optimization-pass-20260808
