name: Normalize consolidated specification once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-consolidated-spec-once.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Normalize specification structure
        run: python scripts/normalize_spec_once.py

      - name: Commit normalized specification
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '整理規格章節並修正加班規則'
          git push
