name: Temp refactor permission UI

on:
  push:
    paths:
      - '.github/workflows/temp-refactor-permission-ui.yml'
      - '.github/tmp_refactor_permission_ui.py'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Apply canonical permission UI refactor
        run: python .github/tmp_refactor_permission_ui.py
      - name: Remove temporary orchestration files
        run: rm -f .github/tmp_refactor_permission_ui.py .github/workflows/temp-refactor-permission-ui.yml
      - name: Build and verify
        run: |
          npm run web:publish
          npm run ci:check
      - name: Commit refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '重構權限驅動介面並禁止補丁式權限顯示'
          git push origin HEAD:main
